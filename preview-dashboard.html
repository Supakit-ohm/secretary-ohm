function useCountUp(target,ms=800){
  const [v,setV]=useState(0);
  useEffect(()=>{
    let raf,start=null;
    const from=0,to=Number(target)||0;
    const tick=(ts)=>{
      if(start===null) start=ts;
      const t=Math.min(1,(ts-start)/ms);
      const e=1-Math.pow(1-t,3);
      setV(from+(to-from)*e);
      if(t<1) raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[target,ms]);
  return v;
}
/* ═══════════════════════════════════════════════════════════════════
   ข้อ 56 ขั้นที่ 4: XP / Level 3 ด้าน (Wealth · Health · Growth)
   หลัก: XP "คำนวณจากข้อมูลจริงทุกครั้ง" ไม่มีสมุดบัญชี XP แยก → ลบ/ยกเลิกรายการ = XP หายเองอัตโนมัติ (หักคืน)
         ไม่ลดตามเวลา · นับเฉพาะของที่เกิดตั้งแต่ xp.start (วันเปิดระบบ) — ไม่ backfill ข้อมูลเก่า
   เก็บเพิ่มแค่: data.xp = {start, savingRateTarget, snapshots:{"YYYY-MM":{nw,debt}}} + project.xpDoneAt (วันที่ครบ 100%)
   ด้าน: หมวด target การเงิน→Wealth · สุขภาพ→Health · ที่เหลือ/ไม่มี target→Growth
   ยังไม่มีแหล่งแต้ม: ออกกำลังกาย/นอน/น้ำ/ทดสอบสมรรถนะ/ตรวจสุขภาพ (ขั้นที่ 7 Health) — ค่าแต้มกำหนดไว้แล้วใน XP_PTS
   ═══════════════════════════════════════════════════════════════════ */
const XP_SIDES=[
  {key:"wealth",label:"Wealth",th:"การเงิน",emoji:"💰",color:"var(--gold)"},
  {key:"health",label:"Health",th:"สุขภาพ",emoji:"❤️",color:"#f2777a"},
  {key:"growth",label:"Growth",th:"การเติบโต",emoji:"🌱",color:"var(--accent)"},
];
const XP_PTS={routine:5,task:10,milestone:50,project:150,bookDone:30,bookSummary:120,media:10,journal:5,exercise:15,sleep:10,water:5,wealthMonth:75,fitnessUp:30,checkup:100,streak7:20};
const XP_MEDIA_PER_DAY=2;
const XP_DEFAULT_SAVING_TARGET=20;
const XP_TITLES={
  wealth:[[1,"ผู้เริ่มเก็บ"],[3,"นักออม"],[5,"นักวางแผนการเงิน"],[8,"ผู้สร้างความมั่งคั่ง"],[12,"นายทุนตัวจริง"],[20,"เจ้าแห่งความมั่งคั่ง"]],
  health:[[1,"เริ่มขยับ"],[3,"คนแข็งแรง"],[5,"นักกีฬาในบ้าน"],[8,"ร่างกายแกร่ง"],[12,"เครื่องจักรพลังสูง"],[20,"ตำนานสุขภาพ"]],
  growth:[[1,"นักเรียนรู้หน้าใหม่"],[3,"นักสะสมความรู้"],[5,"ผู้พัฒนาตัวเอง"],[8,"นักปราชญ์รุ่นใหม่"],[12,"ปรมาจารย์"],[20,"ตำนานแห่งการเติบโต"]],
};
const XP_BADGES=[
  {key:"first",emoji:"✨",name:"ก้าวแรก",desc:"ได้ XP ครั้งแรก",test:(ev)=>ev.length>0},
  {key:"streak",emoji:"🔥",name:"ติดกัน 7 วัน",desc:"ทำงานประจำรายวันครบ 7 วันติด",test:(ev)=>ev.some(e=>e.src==="streak")},
  {key:"project",emoji:"🏁",name:"ปิดจ๊อบ",desc:"ปิดโปรเจกต์ (ครบ 100%) ครั้งแรก",test:(ev)=>ev.some(e=>e.src==="project")},
  {key:"book",emoji:"📚",name:"นักสรุป",desc:"สรุปหนังสือเล่มแรก",test:(ev)=>ev.some(e=>e.src==="bookSummary")},
  {key:"journal30",emoji:"📝",name:"นักบันทึก",desc:"เขียน Journal ครบ 30 วัน",test:(ev)=>ev.filter(e=>e.src==="journal").length>=30},
  {key:"wealth4",emoji:"💎",name:"เดือนทอง",desc:"ได้ XP การเงินรายเดือนครบ 4 เรื่องในเดือนเดียว",test:(ev)=>{ const c={}; ev.forEach(e=>{ if(e.src==="wealth") c[e.m]=(c[e.m]||0)+1; }); return Object.values(c).some(n=>n>=4); }},
  {key:"lv5",emoji:"⭐",name:"เลเวล 5",desc:"ด้านใดด้านหนึ่งถึง Lv5",test:(ev,s)=>s.some(x=>x.level>=5)},
  {key:"lv10",emoji:"🌟",name:"เลเวล 10",desc:"ด้านใดด้านหนึ่งถึง Lv10",test:(ev,s)=>s.some(x=>x.level>=10)},
  {key:"balance",emoji:"⚖️",name:"สมดุล",desc:"ทั้ง 3 ด้านถึง Lv3",test:(ev,s)=>s.every(x=>x.level>=3)},
];
function xpSideOfCategory(cat){ return cat==="finance"?"wealth":cat==="health"?"health":"growth"; }
function xpLocalDate(v){ if(!v) return null; const s=String(v); return /T/.test(s)?isoDate(new Date(s)):s.slice(0,10); }
function xpMonthEnd(m){ return shiftISO(shiftISO(m+"-01",{m:1}),{d:-1}); }
function xpPrevMonth(m){ return shiftISO(m+"-01",{m:-1}).slice(0,7); }
/* สรุปหนังสือ = มีดาว + (รีวิว ≥3 บรรทัด หรือ มีคำคม/บทเรียน ≥1) */
function bookHasSummary(b){
  const lines=String((b&&b.reviewText)||"").split(/\n/).filter(l=>l.trim()).length;
  return Number(b&&b.rating)>0&&(lines>=3||((b&&b.quotes)||[]).length>=1);
}
/* XP ไปเลเวลถัดไป = 100 × เลเวลปัจจุบัน */
function xpLevel(total){ let level=1,need=100,into=total; while(into>=need){ into-=need; level++; need=100*level; } return {level,into,need,total}; }
function xpTitle(side,lv){ let t=XP_TITLES[side][0][1]; XP_TITLES[side].forEach(([l,n])=>{ if(lv>=l) t=n; }); return t; }
function xpNetWorthNow(data){ return Math.round(totalCash(data)+portfolioValue(data)-totalDebtBalance(data)); }
function computeXP(data,today=todayISO()){
  const xp=(data&&data.xp)||{}, start=xp.start||null;
  const ev=[];
  const add=(date,side,pts,label,src,extra)=>{ if(start&&date&&date>=start&&date<=today) ev.push({date,side,pts,label,src,...(extra||{})}); };
  if(start){
    const projById={}; (data.projects||[]).forEach(p=>{ if(p&&p.id) projById[p.id]=p; });
    (data.tasks||[]).forEach(t=>{
      if(!t||!t.id) return;
      const p=t.projectId&&projById[t.projectId];
      const side=p?xpSideOfCategory(p.category):"growth";
      if(isRecurring(t)){
        const startKey=periodKey(t.recurrence,start);
        const comp=t.completions||{};
        const keys=Object.keys(comp).filter(k=>comp[k]&&k>=startKey).sort();
        keys.forEach(k=>{ const d=t.recurrence==="monthly"?k+"-01":k; add(d<start?start:d,side,XP_PTS.routine,`งานประจำ · ${t.title}`,"routine"); });
        if(t.recurrence==="daily"){                     // โบนัสติดกันครบ 7 วัน: ครั้งเดียวต่อ 1 ช่วงที่ติดกัน (ไม่ทบที่ 14/21)
          let run=0,prev=null;
          keys.forEach(k=>{ run=(prev&&shiftISO(prev,{d:1})===k)?run+1:1; prev=k; if(run===7) add(k,side,XP_PTS.streak7,`ติดกัน 7 วัน · ${t.title}`,"streak"); });
        }
      } else if(t.status==="done"){
        add(xpLocalDate(t.completedAt),side,XP_PTS.task,`งานเสร็จ · ${t.title}`,"task");
      }
    });
    (data.projects||[]).forEach(p=>{
      if(!p) return;
      const side=xpSideOfCategory(p.category);
      (p.milestones||[]).forEach(m=>{ if(m&&m.reachedAt) add(String(m.reachedAt).slice(0,10),side,XP_PTS.milestone,`ถึงหมุด ${milestoneLabel(m)} · ${p.title}`,"milestone"); });
      if(p.xpDoneAt&&/^\d{4}-\d{2}-\d{2}$/.test(p.xpDoneAt)) add(p.xpDoneAt,side,XP_PTS.project,`ปิดโปรเจกต์ · ${p.title}`,"project");
    });
    (data.bookQueue||[]).forEach(b=>{
      if(!b||b.status!=="done"||!b.finishedDate) return;
      const fd=String(b.finishedDate).slice(0,10);
      if(fd<start) return;                              // จบก่อนเปิดระบบ = ไม่นับทั้งจบและสรุป
      add(fd,"growth",XP_PTS.bookDone,`อ่านจบ · ${b.title}`,"book");
      if(bookHasSummary(b)) add(fd,"growth",XP_PTS.bookSummary,`สรุปหนังสือ · ${b.title}`,"bookSummary");
    });
    const perDay={};
    (data.mediaReviews||[]).filter(r=>r&&r.date&&String(r.reviewText||"").trim())
      .slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id)))
      .forEach(r=>{ const d=String(r.date).slice(0,10); if(d<start||d>today) return; perDay[d]=(perDay[d]||0)+1; if(perDay[d]<=XP_MEDIA_PER_DAY) add(d,"growth",XP_PTS.media,`รีวิว${r.type==="podcast"?"พอดแคสต์":"วิดีโอ"} · ${r.title}`,"media"); });
    const jd=new Set();
    (data.journal||[]).forEach(j=>{ if(j&&j.date&&journalWritten(j)) jd.add(String(j.date).slice(0,10)); });   // ขั้นที่ 6: กรอกแค่หัวข้อก็นับ
    jd.forEach(d=>add(d,"growth",XP_PTS.journal,"เขียน Journal","journal"));
    /* Health (ขั้นที่ 7A): ออกกำลังกาย 15/ครั้ง · นอนถึงเป้า 10/คืน · ดื่มน้ำถึงเป้า 5/วัน · ทดสอบสมรรถนะดีขึ้นจากครั้งก่อน 30/ค่า */
    const HS=healthSettings(data);
    (data.healthDaily||[]).forEach(hd=>{
      if(!hd||!hd.date) return; const d=String(hd.date).slice(0,10);
      (hd.exercise||[]).forEach(ex=>{ if(ex) add(d,"health",XP_PTS.exercise,`ออกกำลังกาย · ${ex.type||"อื่นๆ"}${ex.min?` ${ex.min} นาที`:""}`,"exercise"); });
      if(Number(hd.sleepMin)>=HS.sleepGoalMin) add(d,"health",XP_PTS.sleep,`นอนถึงเป้า ${fmtSleep(hd.sleepMin)} ชม.`,"sleep");
      if(Number(hd.waterL)>=HS.waterGoalL) add(d,"health",XP_PTS.water,`ดื่มน้ำถึงเป้า ${hd.waterL} ลิตร`,"water");
    });
    (data.checkups||[]).forEach(c=>{ if(c&&c.date) add(String(c.date).slice(0,10),"health",XP_PTS.checkup,"ตรวจสุขภาพประจำปี + นำเข้าผลแล้ว","checkup"); });   // ขั้นที่ 7B
    const fts=sortedTests(data);
    fts.forEach((t,i)=>{ if(i>0) fitnessImprovements(fts[i-1],t).forEach(fl=>add(t.date,"health",XP_PTS.fitnessUp,`ทดสอบสมรรถนะดีขึ้น · ${fl.l}`,"fitness")); });
    /* Wealth รายเดือน (75/เรื่อง): เดือนที่ปิดแล้วเท่านั้น (ข้อมูล import เดือนละครั้ง) ยกเว้นทำรีวิวเดือน */
    const cur=today.slice(0,7), sm=start.slice(0,7), snaps=xp.snapshots||{};
    const target=Number(xp.savingRateTarget)||XP_DEFAULT_SAVING_TARGET;
    const fin=data.finance||{};
    const months=new Set();
    (fin.income||[]).forEach(i=>months.add(String(i.month||i.date||"").slice(0,7)));
    Object.keys(snaps).forEach(m=>months.add(m));
    Object.keys(data.reviews||{}).forEach(m=>months.add(m));
    [...months].filter(m=>/^\d{4}-\d{2}$/.test(m)&&m>=sm&&m<=cur).sort().forEach(m=>{
      const end=xpMonthEnd(m), W=(label,date)=>add(date||end,"wealth",XP_PTS.wealthMonth,label,"wealth",{m});
      if(m<cur){
        const R=buildMonthReview(data,m);
        if(R.totalIncome>0&&R.savingRate>=target) W(`อัตราออม ${m} ถึงเป้า (${R.savingRate.toFixed(0)}% ≥ ${target}%)`);
        const a=snaps[m], b=snaps[xpPrevMonth(m)];
        if(a&&b&&a.nw>b.nw) W(`Net worth ${m} เพิ่มขึ้น`);
        if(a&&b&&b.debt>0&&a.debt<b.debt) W(`หนี้ ${m} ลดลง`);
      }
      const rv=(data.reviews||{})[m];
      if(rv) W(`ทำรีวิวเดือน ${m}`,xpLocalDate(rv.updatedAt)||end);
    });
  }
  const sums={wealth:0,health:0,growth:0}, week={wealth:0,health:0,growth:0}, mon=mondayISO(today);
  ev.forEach(e=>{ sums[e.side]+=e.pts; if(e.date>=mon) week[e.side]+=e.pts; });
  ev.sort((a,b)=>b.date.localeCompare(a.date));
  const sides=XP_SIDES.map(s=>{ const L=xpLevel(sums[s.key]); return {...s,...L,week:week[s.key],title:xpTitle(s.key,L.level)}; });
  const badges=XP_BADGES.map(b=>({key:b.key,emoji:b.emoji,name:b.name,desc:b.desc,got:!!b.test(ev,sides)}));
  return {start,events:ev,sides,badges,weekTotal:week.wealth+week.health+week.growth,savingRateTarget:Number(xp.savingRateTarget)||XP_DEFAULT_SAVING_TARGET};
}
/* ข้อมูลเสริมที่ XP ต้องการ (เรียกใน effect เดียวกับ syncMilestones): ตั้ง xp.start ครั้งแรก · ประทับวันครบ 100% ของโปรเจกต์
   (ครบอยู่แล้วตอนเปิดระบบ = "before" ไม่ได้แต้ม · ลดต่ำกว่า 100% = ลบวัน → แต้มหาย) · จด net worth/หนี้ ของเดือนนี้ (ใช้เทียบเดือนก่อน) */
function syncXpMeta(data,today=todayISO()){
  let changed=false;
  const init=!(data.xp&&data.xp.start);
  const xp={...(data.xp||{})};
  if(init){ xp.start=today; changed=true; }
  let projects=data.projects;
  if(Array.isArray(projects)){
    let touched=false;
    const np=projects.map(p=>{
      if(!p) return p;
      const done=projectProgress(p,data)>=100;
      if(done&&!p.xpDoneAt){ touched=true; return {...p,xpDoneAt:init?"before":today}; }
      if(!done&&p.xpDoneAt){ touched=true; const {xpDoneAt,...rest}=p; return rest; }
      return p;
    });
    if(touched){ projects=np; changed=true; }
  }
  if(data.finance){
    const m=today.slice(0,7), nw=xpNetWorthNow(data), debt=Math.round(totalDebtBalance(data));
    const snaps=xp.snapshots||{}, s=snaps[m];
    if(!s||s.nw!==nw||s.debt!==debt){ xp.snapshots={...snaps,[m]:{nw,debt}}; changed=true; }
  }
  return changed?{xp,projects}:null;
}
/* แต้มของงานตอนติ๊ก (ใช้โชว์ "+5"/"+10" ในการ์ดวันนี้) */
function xpForTask(t){ return isRecurring(t)?XP_PTS.routine:XP_PTS.task; }

function DashLevelCard({data,onOpen}){
  const XP=useMemo(()=>computeXP(data),[data]);
  return (
    <div className="db-card xp-card">
      <div className="db-head">
        <div><div className="db-title">Level</div><div className="db-note">สัปดาห์นี้ <b className="db-mono" style={{color:"var(--accent-soft)"}}>+{XP.weekTotal}</b> XP</div></div>
        <button className="db-chip" onClick={onOpen}>ประวัติ XP</button>
      </div>
      <div className="xp-rows">
        {XP.sides.map(s=>(
          <button type="button" className="xp-row" key={s.key} onClick={onOpen} style={{"--xp-color":s.color}}>
            <div className="xp-row-top">
              <span className="xp-emoji" aria-hidden="true">{s.emoji}</span>
              <span className="xp-side">{s.label}</span>
              <span className="xp-lv db-mono">Lv {s.level}</span>
              <span className="xp-title">{s.title}</span>
              {s.week>0&&<span className="xp-week db-mono">+{s.week}</span>}
            </div>
            <div className="xp-bar"><div className="xp-fill" style={{width:`${Math.min(100,s.into/s.need*100)}%`}}/></div>
            <div className="xp-sub db-mono">{s.into.toLocaleString()} / {s.need.toLocaleString()} XP</div>
          </button>
        ))}
      </div>
    </div>
  );
}
function XpModal({data,persist,onClose}){
  const XP=useMemo(()=>computeXP(data),[data]);
  const [target,setTarget]=useState(String(XP.savingRateTarget));
  const [limit,setLimit]=useState(40);
  const [tab,setTab]=useState("xp");   // ข้อ 67: แท็บ "กิจกรรม" = History ที่ย้ายมาจาก Home
  const saveTarget=()=>{ const v=Math.max(1,Math.min(90,Number(target)||XP_DEFAULT_SAVING_TARGET)); setTarget(String(v)); persist({...data,xp:{...(data.xp||{}),savingRateTarget:v}}); };
  const sideOf=(k)=>XP_SIDES.find(s=>s.key===k);
  const shown=XP.events.slice(0,limit);
  let lastDate=null;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal xp-modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>Level · ประวัติ XP</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="xp-tabs"><button type="button" className={`xp-tab${tab==="xp"?" on":""}`} onClick={()=>setTab("xp")}>XP</button><button type="button" className={`xp-tab${tab==="log"?" on":""}`} onClick={()=>setTab("log")}>กิจกรรม ({(data.activity||[]).length})</button></div>
        <div className="modal-body">{tab==="log"?<HistoryPanel activity={data.activity}/>:<>
          <div className="xp-mside">
            {XP.sides.map(s=>(
              <div className="xp-mside-item" key={s.key} style={{"--xp-color":s.color}}>
                <div className="xp-mside-lv">{s.emoji} Lv {s.level}</div>
                <div className="xp-mside-title">{s.title}</div>
                <div className="xp-mside-sub db-mono">รวม {s.total.toLocaleString()} XP</div>
              </div>
            ))}
          </div>
          <div className="field-label" style={{marginTop:4}}>เหรียญความสำเร็จ</div>
          <div className="xp-badges">
            {XP.badges.map(b=>(
              <div key={b.key} className={`xp-badge${b.got?" got":""}`} title={b.desc}>
                <div className="xp-badge-emoji">{b.emoji}</div>
                <div className="xp-badge-name">{b.name}</div>
                <div className="xp-badge-desc">{b.desc}</div>
              </div>
            ))}
          </div>
          <div className="field-label" style={{marginTop:6}}>ประวัติ XP {XP.start&&<span style={{fontWeight:400,color:"var(--ink-5)"}}>· เริ่มนับ {thaiDate(XP.start)}</span>}</div>
          {XP.events.length===0&&<div className="db-empty">ยังไม่มี XP — ติ๊กงานในการ์ด "วันนี้" เพื่อเริ่มสะสม</div>}
          <div className="xp-hist">
            {shown.map((e,i)=>{
              const head=e.date!==lastDate; lastDate=e.date; const s=sideOf(e.side);
              return (
                <React.Fragment key={i}>
                  {head&&<div className="xp-hist-date">{thaiDate(e.date)}</div>}
                  <div className="xp-hist-row">
                    <span className="xp-hist-pts db-mono" style={{color:s.color}}>+{e.pts}</span>
                    <span className="xp-hist-side">{s.emoji}</span>
                    <span className="xp-hist-label">{e.label}</span>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
          {XP.events.length>limit&&<button className="db-chip" style={{width:"100%",borderRadius:12}} onClick={()=>setLimit(l=>l+60)}>ดูเพิ่ม ({XP.events.length-limit})</button>}
          <div className="xp-set">
            <label className="field-label">เป้าอัตราออมรายเดือน (ใช้ให้ XP Wealth)</label>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="number" className="modal-input" style={{maxWidth:100}} value={target} onChange={e=>setTarget(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveTarget()}/>
              <span style={{color:"var(--ink-3)",fontSize:13}}>%</span>
              <button className="db-chip" onClick={saveTarget}>บันทึก</button>
            </div>
          </div>
          <details className="xp-rules">
            <summary>กติกาแต้ม</summary>
            <div>งานประจำตรงรอบ +5 · งานครั้งเดียว +10 · ถึงหมุด +50 · ปิดโปรเจกต์ +150 → ด้านตามหมวด target (การเงิน=Wealth · สุขภาพ=Health · อื่นๆ/ไม่มี target=Growth)</div>
            <div>งานประจำรายวันติดกันครบ 7 วัน +20 (ครั้งเดียวต่อช่วง) · หนังสือจบ +30 + สรุป +120 (ดาว + รีวิว ≥3 บรรทัด หรือมีคำคม) · รีวิววิดีโอ/พอดแคสต์ +10 (≤2/วัน) · Journal +5/วัน → Growth</div>

/* ═══ ข้อ 56 ขั้นที่ 5: แฟ้มตัวโอม (data.ohmProfile → Firestore k.ohmProfile) ═══
   {who, goals, values, focus, pending:[{id,section,text,at,by}], updatedAt} — Jack (LINE) อ่านทุกข้อความ (cache 5 นาที)
   Jack เสนอเพิ่มได้ → pending · ลงแฟ้มจริงเมื่อโอมกดยืนยัน (ในแอปหรือปุ่มใน LINE) — ชื่อหัวข้อตรงกับ PROFILE_SECTIONS ใน line-bot/Bot.gs */
const PROFILE_SECTIONS=[
  {key:"who",label:"ฉันคือใคร",ph:"เช่น เจ้าของร้านเสื้อผ้าแบรนด์เนม ชอบวางแผนการเงิน…"},
  {key:"goals",label:"เป้าหมายปีนี้",ph:"• วิ่งมินิมาราธอน\n• เก็บเงินดาวน์บ้าน…"},
  {key:"values",label:"ค่านิยม / หลักที่ยึด",ph:"เช่น ครอบครัวมาก่อน · ไม่เป็นหนี้บัตรเครดิต…"},
  {key:"focus",label:"โปรเจกต์ / เรื่องที่โฟกัส",ph:"เรื่องที่อยากให้ Jack ช่วยดูเป็นพิเศษช่วงนี้…"},
];
const PROFILE_MAX_CHARS=1500;
function profilePending(data){ const p=data&&data.ohmProfile; return (p&&Array.isArray(p.pending))?p.pending:[]; }
function profileAccept(data,id,accept){
  const pf={...(data.ohmProfile||{})}, list=profilePending(data), it=list.find(x=>x.id===id);
  if(!it) return data;
  pf.pending=list.filter(x=>x.id!==id);
  if(accept){ const cur=String(pf[it.section]||"").replace(/\s+$/,""); pf[it.section]=(cur?cur+"\n":"")+"• "+it.text; pf.updatedAt=new Date().toISOString(); }
  return {...data,ohmProfile:pf};
}
function ProfileModal({data,persist,onClose}){
  const pf=data.ohmProfile||{};
  const [form,setForm]=useState(()=>{ const f={}; PROFILE_SECTIONS.forEach(s=>f[s.key]=String(pf[s.key]||"")); return f; });
  const [saved,setSaved]=useState(false);
  const pending=profilePending(data);
  const secLabel=(k)=>(PROFILE_SECTIONS.find(s=>s.key===k)||{}).label||k;
  const dirty=PROFILE_SECTIONS.some(s=>form[s.key]!==String(pf[s.key]||""));
  const save=()=>{
    const next={...pf}; PROFILE_SECTIONS.forEach(s=>{ next[s.key]=form[s.key].slice(0,PROFILE_MAX_CHARS); });
    next.updatedAt=new Date().toISOString();
    persist({...data,ohmProfile:next}); setSaved(true);
  };
  const decide=(id,ok)=>{
    const it=pending.find(x=>x.id===id);
    const next=profileAccept(data,id,ok);
    persist(next);
    if(ok&&it) setForm(f=>({...f,[it.section]:String(next.ohmProfile[it.section]||"")}));   // ช่องที่กำลังแก้อยู่เห็นบรรทัดใหม่ทันที
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal pf-modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>แฟ้มตัวโอม</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="modal-body">
          <div className="pf-note">Jack อ่านแฟ้มนี้ทุกข้อความใน LINE เพื่อเข้าใจโอม (แก้แล้ว Jack เห็นภายใน ~5 นาที) · Jack เสนอเพิ่มได้ แต่ลงแฟ้มเมื่อโอมกดยืนยันเท่านั้น</div>
          {pending.length>0&&(
            <div className="pf-pending">
              <div className="pf-pending-lab">Jack เสนอเพิ่ม · {pending.length}</div>
              {pending.map(x=>(
                <div className="pf-prow" key={x.id}>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="pf-psec">{secLabel(x.section)}{x.at?` · ${thaiDate(x.at)}`:""}</div>
                    <div className="pf-ptext">{x.text}</div>
                  </div>
                  <button className="db-chip pf-ok" onClick={()=>decide(x.id,true)}>ลงแฟ้ม</button>
                  <button className="db-chip" onClick={()=>decide(x.id,false)}>ไม่ต้อง</button>
                </div>
              ))}
            </div>
          )}
          {PROFILE_SECTIONS.map(s=>(
            <div key={s.key}>
              <label className="field-label">{s.label} <span className="pf-count">{form[s.key].length}/{PROFILE_MAX_CHARS}</span></label>
              <textarea className="modal-input pf-text" rows={s.key==="who"?3:4} maxLength={PROFILE_MAX_CHARS} placeholder={s.ph} value={form[s.key]}
                onChange={e=>{ const v=e.target.value; setForm(f=>({...f,[s.key]:v})); setSaved(false); }}/>
            </div>
          ))}
          {pf.updatedAt&&<div className="pf-note">แก้ล่าสุด {thaiDate(xpLocalDate(pf.updatedAt))}</div>}
        </div>
        <div className="modal-foot">
          <button className="modal-btn-cancel" onClick={onClose}>ปิด</button>
          <button className="modal-btn-save" onClick={save} disabled={!dirty}>{saved&&!dirty?"บันทึกแล้ว ✓":"บันทึก"}</button>
        </div>
      </div>
    </div>
  );
}

  if(a>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(a>=1e4) return Math.round(n/1e3)+"k";

/* การ์ด Target = ความคืบหน้ารวม (Momentum) + แท่ง 7 วัน (Daily Movement) + หมุดถัดไป (Next Goal) */
function DashTargetCard({data,setPage,wide}){
  const m=useMemo(()=>{
    const today=todayISO();
    const now=overallProgressNow(data);
    const w=progressOn(data,shiftISO(today,{d:-7}));
    const days=[]; for(let i=6;i>=0;i--) days.push(shiftISO(today,{d:-i}));
    const vals=days.map((d,i)=>{
      const cur=progressOn(data,d);
      const before=progressOn(data,i===0?shiftISO(d,{d:-1}):days[i-1]);
      return (cur&&before)?Math.max(0,cur.value-before.value):0;
    });
    const max=Math.max.apply(null,vals);
    return {now,delta7:w?now-w.value:null,streak:momentumStreak(data),days,vals,max:max>0?max:1,best:max>0?vals.indexOf(max):-1,total:vals.reduce((a,b)=>a+b,0)};
  },[data]);
  const pick=useMemo(()=>{
    const act=(data.projects||[]).filter(p=>p.status!=="archived");
    let best=null;
    act.forEach(p=>{
      const prog=projectProgress(p,data);
      const nm=nextMilestone(p,prog);
      const gap=nm?Number(nm.pct)-prog:999;
      if(!best||gap<best.gap) best={p,prog,gap};
    });
    return best;
  },[data]);
  if(!pick) return (
    <div className={`db-card db-span2 tgt-card${wide?" tgt-wide":""}`}>
      <div className="db-head"><div className="db-title">Target</div></div>
      <div className="db-empty">ยังไม่มีโปรเจกต์ — กดเพื่อสร้างเป้าหมายแรก</div>
      <button className="db-btn primary" style={{marginTop:12}} onClick={()=>setPage(2)}>สร้างเป้าหมาย</button>
    </div>
  );
  const {p,prog}=pick;
  const ms=sortedMilestones(p);
  const nm=nextMilestone(p,prog);
  return (
    <div className={`db-card db-span2 tgt-card${wide?" tgt-wide":""}`}>
      <div className="db-head">
        <div style={{minWidth:0}}>
          <div className="db-title">Target</div>
          <div className="db-note">ความคืบหน้ารวมทุกโปรเจกต์</div>
        </div>
        <button className="db-chip" onClick={()=>setPage(2)}><ArrowRight size={13}/></button>
      </div>

/* อารมณ์ 7 วัน (จาก Journal) — กดวันไหนเปิด Journal วันนั้น */

        <div><div className="db-title">อารมณ์ 7 วัน</div><div className="db-note">{avg!=null?`เฉลี่ย ${avg.toFixed(1)}/5 · บันทึก ${got.length}/7 วัน`:"ยังไม่ได้บันทึกอารมณ์"}</div></div>

function DashWeekCard({events,onAdd,onEdit,onOpenCal}){
  const [off,setOff]=useState(0);
  const today=todayISO();
  const start=useMemo(()=>{
    const d=new Date(today+"T00:00:00");
    d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);
    return d;
  },[today,off]);
  const days=useMemo(()=>{
    const out=[];
    for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); out.push(isoDate(d)); }
    return out;
  },[start]);
  const onDay=(iso)=>(events||[]).filter(e=>e.startDate<=iso&&(e.endDate||e.startDate)>=iso)
    .sort((a,b)=>(a.startTime||"99").localeCompare(b.startTime||"99"));
  const slots=useMemo(()=>{
    const set=new Set(); let allDay=false;
    days.forEach(d=>onDay(d).forEach(e=>{ if(e.startTime) set.add(e.startTime.slice(0,2)+":00"); else allDay=true; }));
    const hrs=Array.from(set).sort();
    return allDay?["ทั้งวัน"].concat(hrs):hrs;
  },[days,events]);
  const mobileStart=off===0?Math.min(4,(new Date(today+"T00:00:00").getDay()+6)%7):0;
  const dayCls=(i)=>(i>=mobileStart&&i<mobileStart+3)?"":" db-hide-sm";
  const inSlot=(e,slot)=>slot==="ทั้งวัน"?!e.startTime:(e.startTime&&e.startTime.slice(0,2)+":00"===slot);
  return (
    <div className="db-card db-span4">
      <div className="db-head">
        <div><div className="db-title">This Week</div><div className="db-note">{thaiDate(days[0])} – {thaiDate(days[6])}</div></div>
        <div className="db-head-actions">
          <button className="db-chip" onClick={()=>setOff(v=>v-1)}><ChevronLeft size={13}/></button>
          {off!==0&&<button className="db-chip" onClick={()=>setOff(0)} style={{fontSize:11}}>วันนี้</button>}
          <button className="db-chip" onClick={()=>setOff(v=>v+1)}><ChevronRightIcon size={13}/></button>
          <button className="db-chip" onClick={onOpenCal}><CalendarDays size={13}/></button>
          <button className="db-chip" onClick={onAdd}><Plus size={13}/></button>
        </div>
      </div>
      {slots.length===0
        ? <div className="db-empty">ไม่มีนัดหมายในสัปดาห์นี้ — กด + เพื่อเพิ่ม</div>
        : (
          <div className="db-tl">
            <div/>
            {days.map((d,i)=>{
              const dt=new Date(d+"T00:00:00");
              return <div className={`d${d===today?" today":""}${dayCls(i)}`} key={d}>{DB_DAY_TH[dt.getDay()]}<b>{dt.getDate()}</b></div>;
            })}
            {slots.map(slot=>(
              <React.Fragment key={slot}>
                <div className="h db-mono">{slot}</div>
                {days.map((d,i)=>(
                  <div className={`db-tl-cell${dayCls(i)}`} key={d+slot}>
                    {onDay(d).filter(e=>inSlot(e,slot)).map(e=>(
                      <div className={`db-ev${e.endDate&&e.endDate!==e.startDate?" g":""}`} key={e.id} onClick={()=>onEdit(e)} role="button">
                        {e.title}
                        {(e.startTime||e.note)&&<small>{e.startTime||""}{e.startTime&&e.note?" · ":""}{e.note||""}</small>}
                      </div>
                    ))}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
        )}
    </div>
  );
}

function SecretaryDashboard() {
  const {data,loading,persist}=useSecretaryData();
  const [now,setNow]=useState(new Date());
  const [page,setPage]=useState(0);
  const [expanded,setExpanded]=useState({daily:false,weekly:false,monthly:false});
  const [notesExpanded,setNotesExpanded]=useState(false);
  const [showTodoModal,setShowTodoModal]=useState(false);
  const [showNoteModal,setShowNoteModal]=useState(false);
  const [editNote,setEditNote]=useState(null);
  const [showEventModal,setShowEventModal]=useState(false);
  const [editEvent,setEditEvent]=useState(null);
  const [showCal,setShowCal]=useState(false);
  const [showQuick,setShowQuick]=useState(false);
  const [search,setSearch]=useState("");
  const [showDashTask,setShowDashTask]=useState(false);
  const [editDashTask,setEditDashTask]=useState(null);
  const [toasts,setToasts]=useState([]);
  const [showXp,setShowXp]=useState(false);
  const [journalDate,setJournalDate]=useState(null);
  useEffect(()=>{ if(page!==6) setJournalDate(null); },[page]);   // ข้อ 67: แตะวันในการ์ดอารมณ์ → เปิด Journal วันนั้น

  const [showProfile,setShowProfile]=useState(false);
  /* ข้อ 56 ขั้นที่ 4: XP เพิ่ม → toast "+N XP" (เทียบกับรอบก่อน · รอบแรกหลังโหลดไม่เด้ง) */
  const xpNow=useMemo(()=>data?computeXP(data):null,[data]);
  const xpPrev=useRef(null);
  useEffect(()=>{
    if(!xpNow) return;
    const prev=xpPrev.current; xpPrev.current=xpNow;
    if(!prev||prev.start!==xpNow.start) return;
    const gains=xpNow.sides.map((s,i)=>({s,d:s.total-prev.sides[i].total,up:s.level>prev.sides[i].level})).filter(x=>x.d>0);
    if(gains.length) setToasts(t=>[...t,...gains.map(g=>({id:uid(),kind:"xp",pts:g.d,label:g.s.label,emoji:g.s.emoji,color:g.s.color,levelUp:g.up?g.s.level:null,title:g.s.title}))].slice(-3));
  },[xpNow]);
  useEffect(()=>{ const t=setInterval(()=>setNow(new Date()),30000); return()=>clearInterval(t); },[]);
  useEffect(()=>{
    const onKey=(e)=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); setShowQuick(true); } };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  },[]);
  useEffect(()=>{ if(!data) return; const {data:r,changed}=applyResets(data); if(changed) persist(r); },[now]);
  // snapshot ความคืบหน้ารวม + ตรวจหมุดที่เพิ่งข้าม — รวมไว้ effect เดียวกัน persist ครั้งเดียว
  // (ถ้าแยกสอง effect จะ spread จาก data ก้อนเดียวกันแล้วเขียนทับกันเอง)
  useEffect(()=>{
    if(!data) return;
    const nextLog=recordProgressSnapshot(data);
    const ms=syncMilestones(data);
    const xm=syncXpMeta(ms?{...data,projects:ms.projects}:data);   // ข้อ 56 ขั้นที่ 4
    if(!nextLog&&!ms&&!xm) return;
    const next={...data};
    if(nextLog) next.progressLog=nextLog;
    if(xm){ next.xp=xm.xp; if(xm.projects) next.projects=xm.projects; }
    if(ms){
      next.projects=xm&&xm.projects?xm.projects:ms.projects;
      next.activity=ms.reached.reduce((acc,r)=>logActivity({activity:acc},{source:"goal",text:`ถึงหมุด ${r.label} ของ "${r.title}"`,status:"completed"}),data.activity||[]);
    }
    persist(next);
    if(ms&&ms.reached.length) setToasts(prev=>[...prev,...ms.reached].slice(-3));
  },[data&&data.projects,data&&data.tasks,data&&data.checkins,data&&data.finance,data&&data.xp]);
  const expiringDocs=useMemo(()=>data?dashExpiringDocs(data):[],[data]);
  const dateStr=now.toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric",calendar:"buddhist"});
  const timeStr=now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  const {text:greetText,en:greetEn,Icon:GreetIcon}=greetingFor(now.getHours());
  const rings=useMemo(()=>{
    if(!data) return {todo:0,budget:0,goals:0};
    const todayTasks=(data.tasks||[]).filter(taskIsDueToday);
    const projects=data.projects||[];
    return {
      todo:todayTasks.length?(todayTasks.filter(t=>taskDoneOn(t)).length/todayTasks.length)*100:0,
      budget:0,
      goals:projects.length?projects.reduce((a,p)=>a+projectProgress(p,data),0)/projects.length:0,
    };
  },[data]);
  if (loading||!data) return <div className="loading-screen"><style>{FONTS}</style><div className="loading-text">กำลังเปิดสมุดบันทึก...</div></div>;
  const addTodo=(section,text,extra={})=>{ if(!text.trim()) return; persist({...data,todos:{...data.todos,[section]:[...data.todos[section],{id:uid(),text:text.trim(),status:"pending",...extra}]},activity:logActivity(data,{source:"task",text:`เพิ่มงาน "${text.trim()}"`})}); };
  const cycleTodo=(section,id)=>{
    const item=data.todos[section].find(t=>t.id===id);
    const nextStatus=item?NEXT_STATUS[item.status]:null;
    const next={...data,todos:{...data.todos,[section]:data.todos[section].map(t=>t.id===id?{...t,status:NEXT_STATUS[t.status]}:t)}};
    if(nextStatus==="done"&&item) next.activity=logActivity(data,{source:"task",text:`ทำงานสำเร็จ "${item.text}"`,status:"completed"});
    persist(next);
  };
  const removeTodo=(section,id)=>persist({...data,todos:{...data.todos,[section]:data.todos[section].filter(t=>t.id!==id)}});
  const toggleExpand=(s)=>setExpanded(e=>({...e,[s]:!e[s]}));
  const events=data.events||[];
  const today=todayISO();
  const todayEvents=events.filter(e=>e.startDate===today||(e.endDate&&e.endDate>=today&&e.startDate<=today)).sort((a,b)=>(a.startTime||"").localeCompare(b.startTime||""));
  const upcomingEvents=events.filter(e=>e.startDate>today).sort((a,b)=>a.startDate.localeCompare(b.startDate)||((a.startTime||"").localeCompare(b.startTime||"")));
  const saveEvent=(ev)=>{ const existing=events.find(e=>e.id===ev.id); persist({...data,events:existing?events.map(e=>e.id===ev.id?ev:e):[...events,ev],activity:logActivity(data,{source:"event",text:`${existing?"แก้ไข":"เพิ่ม"}ตารางงาน "${ev.title}"`})}); setShowEventModal(false); setEditEvent(null); };
  const deleteEvent=(id)=>persist({...data,events:events.filter(e=>e.id!==id)});
  const openEditEvent=(ev)=>{ setEditEvent(ev); setShowEventModal(true); };
  const notes=data.notes||[];
  const bookStats=(()=>{ const bs=data.bookQueue||[]; return {total:bs.length,reading:bs.filter(b=>b.status==="reading").length,done:bs.filter(b=>b.status==="done").length}; })();
  const visibleNotes=notesExpanded?notes:notes.slice(0,NOTE_VISIBLE);
  const hiddenNotes=notes.length-NOTE_VISIBLE;
  const saveNote=(note)=>{ const existing=notes.find(n=>n.id===note.id); persist({...data,notes:existing?notes.map(n=>n.id===note.id?note:n):[...notes,note],activity:logActivity(data,{source:"note",text:`${existing?"แก้ไข":"เพิ่ม"}โน้ต "${note.text.slice(0,32)}${note.text.length>32?"…":""}"`})}); setShowNoteModal(false); setEditNote(null); };
  const removeNote=(id)=>persist({...data,notes:notes.filter(n=>n.id!==id)});
  const openEditNote=(note)=>{ setEditNote(note); setShowNoteModal(true); };
  const handleQuickCapture=({type,text,amount,category,section})=>{
    if(type==="note"){
      persist({...data,notes:[...notes,{id:uid(),text,color:NOTE_COLORS[notes.length%NOTE_COLORS.length]}],activity:logActivity(data,{source:"note",text:`เพิ่มโน้ต "${text.slice(0,32)}${text.length>32?"…":""}"`})});
    } else if(type==="task"){
      const rec=section==="daily"?"none":section;
      persist({...data,tasks:[...(data.tasks||[]),{id:uid(),projectId:null,title:text,note:"",status:"pending",dueDate:rec==="none"?smartDailyDate():null,recurrence:rec,weight:1,completions:{},createdAt:todayISO()}],activity:logActivity(data,{source:"task",text:`เพิ่มงาน "${text}"`})});
    } else if(type==="expense"){
      persist({...data,finance:{...data.finance,expenses:[...data.finance.expenses,{id:uid(),date:todayISO(),amount:-Math.abs(amount),category,memo:text,source:"manual"}]},activity:logActivity(data,{source:"expense",text:`บันทึกรายจ่าย ${category} -฿${Math.abs(amount).toLocaleString()}`})});
    } else if(type==="journal"){
      const journal=data.journal||[];
      const today=journal.find(j=>j.date===todayISO());
      const nextJournal=today?journal.map(j=>j.date===todayISO()?{...j,entry:(j.entry?j.entry+"\n":"")+text}:j):[...journal,{id:uid(),date:todayISO(),entry:text}];
      persist({...data,journal:nextJournal,activity:logActivity(data,{source:"journal",text:`บันทึก Journal "${text.slice(0,32)}${text.length>32?"…":""}"`})});
    }
    setShowQuick(false);
  };
  const todayTasks=(data.tasks||[]).filter(taskIsDueToday);
  const totalTodoCount=todayTasks.length;
  const doneTodayCount=todayTasks.filter(t=>taskDoneOn(t)).length;
  const pendingCount=totalTodoCount-doneTodayCount;
  const assistantMessage=(()=>{
    if(todayEvents.length>0) return `วันนี้มี ${todayEvents.length} นัดหมาย อย่าลืมนะ ✨`;
    if(pendingCount>0) return `เหลืออีก ${pendingCount} งานที่ยังไม่เสร็จ สู้ๆ!`;
    if(totalTodoCount>0&&pendingCount===0) return "เคลียร์งานหมดแล้ว เก่งมาก! 🎉";
    return "วันนี้ยังว่าง ลองตั้งเป้าหมายใหม่ดูไหม?";
  })();
  const searchResults=(()=>{
    const q=search.trim().toLowerCase();
    if(!q) return [];
    const out=[];
    notes.forEach(n=>{ if(n.text.toLowerCase().includes(q)) out.push({id:n.id,kind:"note",label:"โน้ต",text:n.text,page:0}); });
    (data.tasks||[]).forEach(t=>{ if((t.title||"").toLowerCase().includes(q)) out.push({id:t.id,kind:"task",label:"งาน",text:t.title,page:2}); });
    events.forEach(e=>{ if((e.title||"").toLowerCase().includes(q)) out.push({id:e.id,kind:"event",label:"ตารางงาน",text:e.title,page:0}); });
    (data.projects||[]).forEach(p=>{ if((p.title||"").toLowerCase().includes(q)) out.push({id:p.id,kind:"project",label:"โปรเจกต์",text:p.title,page:2}); });
    (data.documents||[]).forEach(d=>{ if((d.title||"").toLowerCase().includes(q)) out.push({id:d.id,kind:"doc",label:"เอกสาร",text:d.title,page:4}); });
    (data.bookQueue||[]).forEach(b=>{ if((b.title||"").toLowerCase().includes(q)) out.push({id:b.id,kind:"book",label:"หนังสือ",text:b.title,page:5}); });
    (data.mediaReviews||[]).forEach(r=>{ if((r.title||"").toLowerCase().includes(q)) out.push({id:r.id,kind:"review",label:"รีวิว",text:r.title,page:5}); });
    (data.finance.expenses||[]).forEach(e=>{ if(`${e.category} ${e.memo||""}`.toLowerCase().includes(q)) out.push({id:e.id,kind:"expense",label:"รายจ่าย",text:`${e.category} · ${e.memo||e.date}`,page:1}); });
    return out.slice(0,8);
  })();
  return (
    <div className="app">
      {showXp&&data&&<XpModal data={data} persist={persist} onClose={()=>setShowXp(false)}/>}
      {showProfile&&data&&<ProfileModal data={data} persist={persist} onClose={()=>setShowProfile(false)}/>}
      {toasts.length>0&&(
        <div className="ms-toast-wrap">
          {toasts.map(t=><MilestoneToast key={t.id} toast={t} onClose={()=>setToasts(prev=>prev.filter(x=>x.id!==t.id))}/>)}
        </div>
      )}
      {showDashTask&&<TaskModal initial={editDashTask} projects={data.projects||[]} onClose={()=>{setShowDashTask(false);setEditDashTask(null);}} onSave={(t)=>{
        const ex=(data.tasks||[]).find(x=>x.id===t.id);
        persist({...data,tasks:ex?(data.tasks||[]).map(x=>x.id===t.id?t:x):[...(data.tasks||[]),t],activity:ex?data.activity:logActivity(data,{source:"task",text:`เพิ่มงาน "${t.title}"`})});
        setShowDashTask(false); setEditDashTask(null);
      }}/>}
      {showNoteModal&&<NoteModal onClose={()=>{setShowNoteModal(false);setEditNote(null);}} onSave={saveNote} initial={editNote}/>}
      {showEventModal&&<EventModal onClose={()=>{setShowEventModal(false);setEditEvent(null);}} onSave={saveEvent} initial={editEvent}/>}
      {showCal&&<CalendarModal events={events} onClose={()=>setShowCal(false)} onEditEvent={openEditEvent} onDeleteEvent={deleteEvent}/>}
      {showQuick&&<QuickCaptureModal onClose={()=>setShowQuick(false)} onSave={handleQuickCapture}/>}
      <div className="main-wrap">
        <TopNav page={page} setPage={setPage} search={search} setSearch={setSearch} searchResults={searchResults} onQuickCapture={()=>setShowQuick(true)} onProfile={()=>setShowProfile(true)} profilePendingCount={profilePending(data).length}/>
        <div className="content-grid">
          <div className="content-main">
            {page===0&&(
              <>
                <DashHero data={data} greetEn={greetEn} dateStr={dateStr} timeStr={timeStr} message={assistantMessage} setPage={setPage}/>
                {profilePending(data).length>0&&(
                  <button type="button" className="pf-banner" onClick={()=>setShowProfile(true)}>
                    <span>🗂️ Jack เสนอเพิ่มแฟ้มตัวโอม {profilePending(data).length} ข้อ</span><span className="pf-banner-go">ดู/ยืนยัน ›</span>
                  </button>
                )}
                <DashLevelCard data={data} onOpen={()=>setShowXp(true)}/>
                <div className="db-bento">
                  <DashTasksCard data={data} persist={persist} setPage={setPage}
                    onEditTask={t=>{setEditDashTask(t);setShowDashTask(true);}}
                    onQuick={()=>setShowQuick(true)}/>
                  <DashHealthCard data={data} setPage={setPage}/>
                  <DashMoodCard data={data} onOpenJournal={d=>{setJournalDate(d);setPage(6);}}/>
                  <DashTargetCard data={data} setPage={setPage} wide={expiringDocs.length===0}/>
                  {expiringDocs.length>0&&<DashExpiringCard list={expiringDocs} setPage={setPage}/>}
                  <DashWeekCard events={events} onAdd={()=>{setEditEvent(null);setShowEventModal(true);}} onEdit={openEditEvent} onOpenCal={()=>setShowCal(true)}/>
                  <DashCollapse span="db-span4" title="Notes" note={`${notes.length} รายการ`}
                    actions={<button className="db-chip" onClick={()=>{setEditNote(null);setShowNoteModal(true);}}><Plus size={13}/></button>}>
                    {notes.length===0&&<div className="db-empty">ยังไม่มีโน้ต กด + เพื่อเพิ่ม</div>}
                    <div className="db-notes-grid">
                      {visibleNotes.map(n=>(
                        <div key={n.id} className={`note-card ${n.color}`}>
                          <div className="note-actions">
                            <button className="note-action-btn" onClick={()=>openEditNote(n)}><Edit3 size={12}/></button>
                            <button className="note-action-btn" onClick={()=>removeNote(n.id)}><Trash2 size={12}/></button>
                          </div>
                          {n.text}
                        </div>
                      ))}
                    </div>
                    {hiddenNotes>0&&(
                      <button className="db-chip" style={{width:"100%",marginTop:10,borderRadius:14}} onClick={()=>setNotesExpanded(e=>!e)}>
                        {notesExpanded?<>แสดงน้อยลง <ChevronUp size={13}/></>:<>แสดงอีก {hiddenNotes} โน้ต <ChevronDown size={13}/></>}
                      </button>
                    )}
                  </DashCollapse>
                </div>
              </>
            )}
            {page===1&&<FinancePage data={data} persist={persist}/>}
            {page===2&&<TrackerPage data={data} persist={persist}/>}
            {page===3&&<HealthPage data={data} persist={persist}/>}
            {page===4&&<DocumentPage data={data} persist={persist}/>}
            {page===5&&<BooksPage data={data} persist={persist}/>}
            {page===6&&<JournalPage data={data} persist={persist} initialDate={journalDate}/>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SecretaryDashboard/>);
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW register failed", err));
  });
}
</script>
</body>
</html>
