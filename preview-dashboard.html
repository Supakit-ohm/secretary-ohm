          {monthOptions.map(m=>(
            <option key={m} value={m}>{new Date(`${m}-01`).toLocaleDateString("en-US",{month:"long",year:"numeric"})}</option>
          ))}
        </select>
      </div>
      <FinDonutCard
        title="Income by Source" note={monthLabel} data={sourceData} accent="var(--accent-soft)" sign="+"
        emptyText="No income recorded for this month"
        getItems={(name)=>(finance.finance.income||[]).filter(i=>i.source===name&&(i.month||monthYearKey(i.date))===selectedMonth).map(i=>({id:i.id,date:i.date,memo:i.note,amount:i.amount}))}/>
      {showSlip&&<SlipImportModal data={finance} persist={persist} onClose={()=>setShowSlip(false)}/>}
      <div className="db-card">
        <div className="db-head">
          <div className="db-title">Add Income</div>
          <button className="quick-capture-btn slip-btn" onClick={()=>setShowSlip(true)}><Upload size={12}/> Import Payslip</button>
        </div>
        <div className="fin-add-income">
          <div className="fin-row-2">
            <div>
              <label className="field-label">Date</label>
              <input type="date" value={incDate} onChange={e=>setIncDate(e.target.value)} className="modal-input"/>
            </div>
            <div>
              <label className="field-label">Amount</label>
              <input type="number" placeholder="0" value={incAmount} onChange={e=>setIncAmount(e.target.value)} className="modal-input"/>
            </div>
          </div>
          <div>
            <label className="field-label">Source</label>
            <input placeholder="เช่น เงินเดือน, ค่าสอน..." value={incSource} onChange={e=>setIncSource(e.target.value)} className="modal-input"/>
          </div>
          <div>
            <label className="field-label">Note</label>
            <input placeholder="เพิ่มเติม..." value={incNote} onChange={e=>setIncNote(e.target.value)} className="modal-input"/>
          </div>
          <button className="icon-btn" onClick={addIncome} style={{alignSelf:"flex-end",marginTop:8}}><Plus size={14}/></button>
        </div>
      </div>
      <div className="db-card">
        <div className="db-head"><div className="db-title">Income by Source (all time)</div></div>
        {sortedSourcesAll.length===0&&<div className="db-empty">ยังไม่มีรายรับ</div>}
        {sortedSourcesAll.map(([src,total],i)=>(
          <div key={src} className="fin-agg-row">
            <div className="fin-agg-row-top">
              <span className="fin-agg-name">{src}</span>
              <span className="fin-agg-amt db-mono" style={{color:"var(--accent-soft)"}}>+฿{total.toLocaleString()}</span>
            </div>
            <div className="fin-agg-bar">
              <div className="fin-agg-bar-fill" style={{background:COLORS[i%COLORS.length],width:`${(total/(Math.max(...sortedSourcesAll.map(x=>x[1]))||1))*100}%`}}/>
            </div>
          </div>
        ))}
      </div>
      <div className="db-card">
        <div className="db-head">
          <div className="db-title">All Income</div>
          {selectedIds.size>0&&(
            <button className="del-selected-btn" onClick={removeSelectedIncome}>
              <Trash2 size={13}/> ลบที่เลือก ({selectedIds.size})
            </button>
          )}
        </div>
        <TxnFilterBar months={listMonths} cats={listCats} catLabel="sources" fMonth={fMonth} setFMonth={setFMonth} fCat={fCat} setFCat={setFCat}
          origins={listOrigins} fSrc={fSrc} setFSrc={setFSrc}
          shown={sortedIncome.length} total={allIncome.length} onReset={()=>{setFMonth("all");setFCat("all");setFSrc("all");}}/>
        {allIncome.length===0&&<div className="db-empty">ยังไม่มีรายการ</div>}
        {allIncome.length>0&&sortedIncome.length===0&&<div className="db-empty">ไม่พบรายการตามตัวกรองนี้</div>}
        {sortedIncome.length>0&&(
          <>
          <div className="txn-filter-total">รวม <b style={{color:"var(--accent-soft)"}}>+฿{sortedIncome.reduce((a,i)=>a+i.amount,0).toLocaleString()}</b></div>
          <div className="exp-table-wrap">
            <table className="exp-table">
              <thead>
                <tr>
                  <th className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={allSelected} ref={el=>{if(el) el.indeterminate=someSelected;}} onChange={toggleSelectAll}/></th>
                  <th>Date</th>
                  <th>Source</th>
                  <th className="exp-col-amount">Amount</th>
                  <th>Note</th>
                  <th className="exp-col-actions"></th>
                </tr>
              </thead>
              <tbody>
                {visibleIncome.map(inc=>(
                  <tr key={inc.id} className={selectedIds.has(inc.id)?"row-selected":""}>
                    <td className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={selectedIds.has(inc.id)} onChange={()=>toggleSelectId(inc.id)}/></td>
                    <td className="exp-col-date">{inc.date}</td>
                    <td>{inc.source}</td>
                    <td className="exp-col-amount exp-amount-value" style={{color:"var(--accent-soft)"}}>+฿{inc.amount.toLocaleString()}</td>
                    <td className="exp-col-memo">{inc.note||"—"}{attCounts[inc.id]>0&&<button className="att-badge" title="ไฟล์แนบ" onClick={()=>setEditRow(inc)}><Paperclip size={10}/> {attCounts[inc.id]}</button>}</td>
                    <td className="exp-col-actions">
                      <div className="txn-row-actions">
                        <button className="del-btn" title="แก้ไข" onClick={()=>setEditRow(inc)}><Edit3 size={13}/></button>
                        <button className="del-btn" title="ลบ" onClick={()=>removeIncome(inc.id)}><Trash2 size={13}/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <ShowMoreRow rl={rl} total={sortedIncome.length}/>
          </>
        )}
        {editRow&&<TxnEditModal kind="income" initial={editRow} options={listCats} onClose={()=>setEditRow(null)} onSave={saveEdit}/>}
      </div>
    </div>
  );
}
/* ── รีวิวแถว Deposit จาก CSV ก่อนบันทึก ──
   CSV ของธนาคารมีแถว Type=Deposit ปนกัน 3 แบบ: โอนย้ายบัญชีตัวเอง (ข้าม),
   เพื่อนโอนคืนเงิน (หักออกจากหมวดรายจ่าย), และรายรับจริง (ลง income) */
const REFUND_MAP_KEY="secretary-refund-cat-map";
function loadRefundMap(){ try{ return JSON.parse(localStorage.getItem(REFUND_MAP_KEY)||"{}"); }catch(err){ return {}; } }
function rememberRefundCat(rows,cat){
  try{
    const m=loadRefundMap();
    rows.forEach(r=>{ const k=(r.note||"").trim(); if(k) m[k]=cat; });
    localStorage.setItem(REFUND_MAP_KEY,JSON.stringify(m));
  }catch(err){}
}
function DepositReviewModal({rows,catOptions,srcOptions,onClose,onApply}){
  const [remaining,setRemaining]=useState(()=>rows.slice().sort((a,b)=>b.amount-a.amount));
  const [picked,setPicked]=useState(()=>new Set());
  const [mode,setMode]=useState("skip");
  const [cat,setCat]=useState(catOptions[0]||"อื่นๆ");
  const [src,setSrc]=useState(srcOptions[0]||"อื่นๆ");
  const [doneCount,setDoneCount]=useState(0);
  const allSelected=remaining.length>0&&remaining.every(r=>picked.has(r.id));
  const someSelected=remaining.some(r=>picked.has(r.id))&&!allSelected;
  const toggleId=(id)=>setPicked(prev=>{
    const next=new Set(prev);
    if(next.has(id)) next.delete(id);
    else{
      next.add(id);
      // bonus: จำหมวดที่เคยเลือกไว้ตามชื่อผู้โอน แล้ว pre-select ให้ (ยังต้องกดยืนยันเอง)
      const row=remaining.find(r=>r.id===id);
      const remembered=row&&loadRefundMap()[(row.note||"").trim()];
      if(remembered&&catOptions.includes(remembered)) setCat(remembered);
    }
    return next;
  });
  const toggleAll=()=>setPicked(allSelected?new Set():new Set(remaining.map(r=>r.id)));
  const pickedRows=remaining.filter(r=>picked.has(r.id));
  const pickedTotal=pickedRows.reduce((a,r)=>a+r.amount,0);
  const apply=()=>{
    if(pickedRows.length===0) return;
    if(mode!=="skip") onApply(pickedRows,mode,mode==="refund"?cat:src);
    if(mode==="refund") rememberRefundCat(pickedRows,cat);
    setRemaining(remaining.filter(r=>!picked.has(r.id)));
    setDoneCount(d=>d+pickedRows.length);
    setPicked(new Set());
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:720}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <span>รีวิวรายการเงินเข้า (Deposit) {rows.length} รายการ</span>
          <button className="modal-close" onClick={onClose}><X size={15}/></button>
        </div>
        <div className="modal-body">
          <div style={{fontSize:12.5,color:"var(--ink-2)",marginBottom:10}}>
            เลือกแถวที่ต้องการ แล้วเลือกวิธีจัดการด้านล่าง — แถวที่ไม่ทำอะไรจะถูก<b>ข้าม</b>ทั้งหมด (ปลอดภัยสุด)
            {doneCount>0&&<span style={{color:"#34d399"}}> · บันทึกแล้ว {doneCount} รายการ</span>}
          </div>
          {remaining.length===0&&<div className="empty">จัดการครบทุกรายการแล้ว</div>}
          {remaining.length>0&&(
            <div className="exp-table-wrap" style={{maxHeight:320,overflowY:"auto"}}>
              <table className="exp-table">
                <thead>
                  <tr>
                    <th className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={allSelected} ref={el=>{if(el) el.indeterminate=someSelected;}} onChange={toggleAll}/></th>
                    <th>Date</th>
                    <th className="exp-col-amount">Amount</th>
                    <th>Note</th>
                  </tr>
                </thead>
                <tbody>
                  {remaining.map(r=>(
                    <tr key={r.id} className={picked.has(r.id)?"row-selected":""}>
                      <td className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={picked.has(r.id)} onChange={()=>toggleId(r.id)}/></td>
                      <td className="exp-col-date">{r.date}</td>
                      <td className="exp-col-amount exp-amount-value" style={{color:"#34d399"}}>+฿{r.amount.toLocaleString()}</td>
                      <td className="exp-col-memo">{r.note||"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {remaining.length>0&&(
            <div style={{marginTop:14,padding:12,background:"var(--surface-sunken)",borderRadius:10,display:"flex",flexDirection:"column",gap:10}}>
              <div style={{fontSize:12.5,color:"var(--ink-2)"}}>
                เลือกอยู่ {pickedRows.length} รายการ · รวม <b style={{color:"#34d399"}}>+฿{pickedTotal.toLocaleString()}</b>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button className={"fin-tab-btn"+(mode==="skip"?" active":"")} onClick={()=>setMode("skip")}>ข้าม (โอนย้ายบัญชี)</button>
                <button className={"fin-tab-btn"+(mode==="refund"?" active":"")} onClick={()=>setMode("refund")}>เงินคืน → หักจากหมวด</button>
                <button className={"fin-tab-btn"+(mode==="income"?" active":"")} onClick={()=>setMode("income")}>รายรับจริง → income</button>
              </div>
              {mode==="refund"&&(
                <select className="modal-input" value={cat} onChange={e=>setCat(e.target.value)}>
                  {catOptions.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              )}
              {mode==="income"&&(
                <select className="modal-input" value={src} onChange={e=>setSrc(e.target.value)}>
                  {srcOptions.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              )}
              <button className="del-selected-btn" style={{alignSelf:"flex-start"}} disabled={pickedRows.length===0} onClick={apply}>
                ใช้กับ {pickedRows.length} รายการที่เลือก
              </button>
            </div>
          )}
          <button className="text-btn" style={{marginTop:12}} onClick={onClose}>ปิด (ข้ามรายการที่เหลือ)</button>
        </div>
      </div>
    </div>
  );
}
/* ── ประเภทสินทรัพย์ของ finance.investments (เฟส 1 ของแผนยกเครื่องหน้า Investments) ── */
const INVEST_TYPES=[
  {key:"retirement",label:"กบข./กสจ. (เกษียณ)"},
  {key:"insurance",label:"ประกันสะสมทรัพย์"},
  {key:"gold",label:"ทอง"},
  {key:"crypto",label:"คริปโต"},
  {key:"stock",label:"หุ้น"},
  {key:"fund",label:"กองทุน"},
  {key:"other",label:"อื่นๆ"},
];
const INVEST_TYPE_LABELS=INVEST_TYPES.reduce((m,t)=>{m[t.key]=t.label;return m;},{});
/* เฟส 4: สีประจำประเภทสินทรัพย์ ใช้ในแถบสัดส่วน/โดนัทภาพรวม
   ข้อ 24/3 (2026-08-26): เปลี่ยนจากชุดม่วง/ชมพูเดิมเป็น Dark Emerald ตามข้อ 23
   ชุดนี้เป็นแหล่งเดียวของทั้งแอปแล้ว — DB_ALLOC_COLORS (การ์ด Portfolio ในหน้า Home) อ้างอิงตัวนี้ อย่านิยามซ้ำที่อื่น */
const INVEST_TYPE_COLORS={retirement:"#10b981",insurance:"#6f9e8d",gold:"#d9b26a",crypto:"#eccf94",stock:"#34d399",fund:"#4d7f6c",other:"#365749"};
/* ชุดสีหมวดหมู่ทั่วไปของธีม (สลับเขียว-ทอง เข้ม/อ่อน ให้ชิ้นที่ติดกันแยกออกจากกัน)
   ใช้กับโดนัทที่หมวดไม่ตายตัว: รายเหรียญคริปโต (ข้อ 24/3) · Income by Source / Expenses by Category (ข้อ 24/4)
   หมวดที่ตายตัวใช้ INVEST_TYPE_COLORS แทน · `COLORS` ชุดม่วงเดิมยังใช้อยู่ในหน้าที่ยังไม่ถึงคิว อย่าเพิ่งลบ */
const DB_CAT_COLORS=COLORS;
const INVEST_CSV_CATEGORY="ออม ลงทุน"; // category ใน CSV ของ Make by KBank ที่หมายถึงการโอนไปลงทุน (สะกดแบบนี้เป๊ะ)
const INVEST_MAP_KEY="secretary-invest-type-map";
function loadInvestMap(){ try{ return JSON.parse(localStorage.getItem(INVEST_MAP_KEY)||"{}"); }catch(err){ return {}; } }
function rememberInvestType(rows,type){
  try{
    const m=loadInvestMap();
    rows.forEach(r=>{ const k=(r.note||"").trim(); if(k) m[k]=type; });
    localStorage.setItem(INVEST_MAP_KEY,JSON.stringify(m));
  }catch(err){}
}
/* รีวิวแถว "ออม ลงทุน" จาก CSV — ให้ผู้ใช้เลือกประเภทสินทรัพย์เองเสมอ (ห้าม auto 100%)
   แถวที่ไม่ได้จัดการจะถูกบันทึกเป็นรายจ่ายปกติตามเดิม (ไม่หายไปไหน) */
function InvestmentReviewModal({rows,onClose,onApply}){
  const [remaining,setRemaining]=useState(()=>rows.slice().sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount)));
  const [picked,setPicked]=useState(()=>new Set());
  const [type,setType]=useState("other");
  const [doneCount,setDoneCount]=useState(0);
  const allSelected=remaining.length>0&&remaining.every(r=>picked.has(r.id));
  const someSelected=remaining.some(r=>picked.has(r.id))&&!allSelected;
  const toggleId=(id)=>setPicked(prev=>{
    const next=new Set(prev);
    if(next.has(id)) next.delete(id);
    else{
      next.add(id);
      // bonus: จำประเภทที่เคยเลือกไว้ตาม memo/Note แล้ว pre-select ให้ (ยังต้องกดยืนยันเอง)
      const row=remaining.find(r=>r.id===id);
      const remembered=row&&loadInvestMap()[(row.note||"").trim()];
      if(remembered&&INVEST_TYPE_LABELS[remembered]) setType(remembered);
    }
    return next;
  });
  const toggleAll=()=>setPicked(allSelected?new Set():new Set(remaining.map(r=>r.id)));
  const pickedRows=remaining.filter(r=>picked.has(r.id));
  const pickedTotal=pickedRows.reduce((a,r)=>a+Math.abs(r.amount),0);
  const apply=()=>{
    if(pickedRows.length===0) return;
    onApply(pickedRows,type);
    rememberInvestType(pickedRows,type);
    setRemaining(remaining.filter(r=>!picked.has(r.id)));
    setDoneCount(d=>d+pickedRows.length);
    setPicked(new Set());
  };
  return (
    <div className="modal-backdrop" onClick={()=>onClose(remaining)}>
      <div className="modal" style={{maxWidth:720}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <span>รีวิวรายการ "{INVEST_CSV_CATEGORY}" {rows.length} รายการ</span>
          <button className="modal-close" onClick={()=>onClose(remaining)}><X size={15}/></button>
        </div>
        <div className="modal-body">
          <div style={{fontSize:12.5,color:"var(--ink-2)",marginBottom:10}}>
            เลือกแถว แล้วเลือกประเภทสินทรัพย์ที่ต้องการบันทึกเป็น<b>เงินลงทุน</b> — แถวที่ไม่จัดการจะถูกบันทึกเป็น<b>รายจ่ายปกติ</b>ตามเดิม
            {doneCount>0&&<span style={{color:"#34d399"}}> · บันทึกแล้ว {doneCount} รายการ</span>}
          </div>
          {remaining.length===0&&<div className="empty">จัดการครบทุกรายการแล้ว</div>}
          {remaining.length>0&&(
            <div className="exp-table-wrap" style={{maxHeight:320,overflowY:"auto"}}>
              <table className="exp-table">
                <thead>
                  <tr>
                    <th className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={allSelected} ref={el=>{if(el) el.indeterminate=someSelected;}} onChange={toggleAll}/></th>
                    <th>Date</th>
                    <th className="exp-col-amount">Amount</th>
                    <th>Note</th>
                  </tr>
                </thead>
                <tbody>
                  {remaining.map(r=>(
                    <tr key={r.id} className={picked.has(r.id)?"row-selected":""}>
                      <td className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={picked.has(r.id)} onChange={()=>toggleId(r.id)}/></td>
                      <td className="exp-col-date">{r.date}</td>
                      <td className="exp-col-amount exp-amount-value" style={{color:"var(--accent-soft)"}}>฿{Math.abs(r.amount).toLocaleString()}</td>
                      <td className="exp-col-memo">{r.note||"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {remaining.length>0&&(
            <div style={{marginTop:14,padding:12,background:"var(--surface-sunken)",borderRadius:10,display:"flex",flexDirection:"column",gap:10}}>
              <div style={{fontSize:12.5,color:"var(--ink-2)"}}>
                เลือกอยู่ {pickedRows.length} รายการ · รวม <b style={{color:"var(--accent-soft)"}}>฿{pickedTotal.toLocaleString()}</b>
              </div>
              <select className="modal-input" value={type} onChange={e=>setType(e.target.value)}>
                {INVEST_TYPES.map(t=><option key={t.key} value={t.key}>{t.label}</option>)}
              </select>
              <button className="del-selected-btn" style={{alignSelf:"flex-start"}} disabled={pickedRows.length===0} onClick={apply}>
                บันทึกเป็นเงินลงทุน {pickedRows.length} รายการ
              </button>
            </div>
          )}
          <button className="text-btn" style={{marginTop:12}} onClick={()=>onClose(remaining)}>ปิด (รายการที่เหลือ = รายจ่ายปกติ)</button>
        </div>
      </div>
    </div>
  );
}
/* ═══ แยกรายจ่าย 1 รายการออกเป็นหลายหมวด (split transaction) ═══
   วิธีเก็บ: แตกเป็นรายการจริงหลายแถวใน finance.expenses แล้วลบแถวเดิมทิ้ง (ไม่ใช่ nested object)
   เพื่อให้ทุกจุดที่รวมยอด/กราฟ/งบ ใช้งานได้ทันทีโดยไม่ต้องแก้ตรรกะที่ไหนเลย
   trace ย้อนกลับได้ด้วย splitFrom (id เดิม) + splitGroup (จับกลุ่มแถวที่มาจากรายการเดียวกัน)
   กฎเดิมยังอยู่: ทุกแถวที่แตกออกมา amount ติดลบเสมอ และผลรวมต้องเท่ายอดเดิมเป๊ะ */
function SplitExpenseModal({row,catOptions,onClose,onApply}) {
  const orig=Math.abs(Number(row.amount)||0);
  const [parts,setParts]=useState(()=>[
    {k:uid(),cat:row.category||"",amount:""},
    {k:uid(),cat:"",amount:""},
  ]);
  const [newCatFor,setNewCatFor]=useState({});
  const n=(v)=>{ const x=Number(v); return isFinite(x)?x:0; };
  const catOf=(p)=>(newCatFor[p.k]!=null?newCatFor[p.k]:p.cat).trim();
  const sum=parts.reduce((a,p)=>a+n(p.amount),0);
  const left=Math.round((orig-sum)*100)/100;
  const setPart=(k,patch)=>setParts(ps=>ps.map(p=>p.k===k?{...p,...patch}:p));
  const addPart=()=>setParts(ps=>[...ps,{k:uid(),cat:"",amount:""}]);
  const removePart=(k)=>setParts(ps=>ps.length<=2?ps:ps.filter(p=>p.k!==k));
  // เติมส่วนต่างให้แถวนี้ — clamp ไม่ให้ติดลบ (กรณีแถวอื่นกรอกเกินยอดเดิมไปแล้ว)
  const fillRest=(k)=>setPart(k,{amount:String(Math.max(0,Math.round((n(parts.find(p=>p.k===k).amount)+left)*100)/100))});
  const ready=Math.abs(left)<0.01&&parts.every(p=>catOf(p)&&n(p.amount)>0);
  const apply=()=>{
    if(!ready) return;
    const group=uid();
    onApply(parts.map((p,i)=>({
      id:uid(),date:row.date,
      amount:-Math.abs(n(p.amount)),          // กฎเดิม: expenses ติดลบเสมอ
      category:catOf(p),
      memo:`${row.memo||"แยกรายการ"} (แยก ${i+1}/${parts.length})`,
      source:row.source||"manual",importSource:row.importSource,
      // ถ้ารายการเดิมเคยยืนยันจับคู่หนี้ไปแล้ว ให้แถวย่อยสืบทอดไปด้วย ไม่งั้นจะกลับมาโผล่ในรายการรอยืนยันอีก
      ...(row.linkedDebtId?{linkedDebtId:row.linkedDebtId}:{}),
      splitFrom:row.id,splitGroup:group,
    })));
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>✂️ แยกรายการเป็นหลายหมวด</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="modal-body">
          <div className="recat-hint">
            {row.date} · {row.memo||"(ไม่มีโน้ต)"} · ยอดเดิม <b style={{color:"#fb923c"}}>฿{orig.toLocaleString()}</b> (หมวด {row.category||"—"})
            <br/>รายการเดิมจะถูกแทนที่ด้วยแถวย่อยด้านล่าง — ผลรวมต้องเท่ายอดเดิมพอดี
          </div>
          {parts.map((p,i)=>(
            <div key={p.k} style={{display:"flex",gap:8,alignItems:"flex-end",marginTop:10,flexWrap:"wrap"}}>
              <div style={{flex:2,minWidth:150}}>
                <label className="field-label">หมวดที่ {i+1}</label>
                {newCatFor[p.k]!=null?(
                  <input className="modal-input" autoFocus placeholder="พิมพ์หมวดใหม่" value={newCatFor[p.k]}
                    onChange={e=>setNewCatFor(m=>({...m,[p.k]:e.target.value}))}/>
                ):(
                  <select className="modal-input" value={p.cat} onChange={e=>{
                    if(e.target.value==="__new__"){ setNewCatFor(m=>({...m,[p.k]:""})); return; }
                    setPart(p.k,{cat:e.target.value});
                  }}>
                    <option value="">— เลือกหมวด —</option>
                    {catOptions.map(c=><option key={c} value={c}>{c}</option>)}
                    <option value="__new__">+ หมวดใหม่…</option>
                  </select>
                )}
              </div>
              <div style={{flex:1,minWidth:110}}>
                <label className="field-label">จำนวนเงิน</label>
                <input type="number" className="modal-input" inputMode="decimal" placeholder="0" style={{textAlign:"right"}}
                  value={p.amount} onChange={e=>setPart(p.k,{amount:e.target.value})}/>
              </div>
              <button className="del-btn" title="ใส่ยอดที่เหลือทั้งหมด" disabled={Math.abs(left)<0.01} onClick={()=>fillRest(p.k)}><ArrowLeft size={12}/></button>
              <button className="del-btn" title="ลบแถว" disabled={parts.length<=2} onClick={()=>removePart(p.k)}><Trash2 size={13}/></button>
            </div>
          ))}
          <button className="text-btn" style={{marginTop:10}} onClick={addPart}><Plus size={12}/> เพิ่มหมวด</button>
          <div className="recat-action" style={{marginTop:12}}>
            <div style={{fontSize:12.5,color:Math.abs(left)<0.01?"#34d399":"#fbbf24"}}>
              รวม ฿{Math.round(sum).toLocaleString()} / ฿{orig.toLocaleString()} · {Math.abs(left)<0.01?"ครบพอดี":(left>0?`ยังเหลือ ฿${left.toLocaleString()}`:`เกินมา ฿${Math.abs(left).toLocaleString()}`)}
            </div>
            <button className="modal-btn-save" style={{marginTop:10,width:"100%"}} disabled={!ready} onClick={apply}>
              แยกเป็น {parts.length} รายการ
            </button>
          </div>
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ยกเลิก</button></div>
      </div>
    </div>
  );
}
function FinanceExpensesTab({finance,persist}) {
  const expensesMonths={};
  (finance.finance.expenses||[]).forEach(exp=>{
    const m=monthYearKey(exp.date);
    expensesMonths[m]=true;
  });
  const validMonths=Object.keys(expensesMonths).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort().reverse();
  const defaultMonth=validMonths.length>0?validMonths[0]:currentMonthKey();
  const [showCSVImport,setShowCSVImport]=useState(false);
  const [depositRows,setDepositRows]=useState(null);
  const [investRows,setInvestRows]=useState(null);
  const [expAmount,setExpAmount]=useState("");
  const [expCategory,setExpCategory]=useState("อาหาร");
  const [expMemo,setExpMemo]=useState("");
  const [expDate,setExpDate]=useState(todayISO());
  const [selectedMonth,setSelectedMonth]=useState(defaultMonth);
  const [selectedIds,setSelectedIds]=useState(()=>new Set());
  const addExpense=()=>{
    const amt=Number(expAmount);
    if(!expCategory.trim()||!amt||amt<=0) return;
    persist({
      ...finance,
      finance:{
        ...finance.finance,
        expenses:[...finance.finance.expenses,{id:uid(),date:expDate,amount:-Math.abs(amt),category:expCategory.trim(),memo:expMemo.trim(),source:"manual"}]
      }
    });
    setExpAmount("");setExpMemo("");
  };
  const removeExpense=(id)=>{ persist({
    ...finance,
    finance:{...finance.finance,expenses:finance.finance.expenses.filter(e=>e.id!==id)}
  }); trashAttachments("expense",[id]); };
  const removeSelectedExpenses=()=>{
    if(selectedIds.size===0) return;
    trashAttachments("expense",[...selectedIds]);
    persist({
      ...finance,
      finance:{...finance.finance,expenses:finance.finance.expenses.filter(e=>!selectedIds.has(e.id))}
    });
    setSelectedIds(new Set());
  };
  const toggleSelectId=(id)=>setSelectedIds(prev=>{
    const next=new Set(prev);
    if(next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const handleCSVUpload=async(e)=>{
    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const text=await file.text();
      const lines=text.split("\n").map(l=>l.trim()).filter(l=>l);
      const header=lines[0].split(",").map(h=>h.trim().toLowerCase());
      const txnIdx=header.findIndex(h=>h.includes("txn")||h.includes("amount"));
      const dateIdx=header.findIndex(h=>h.includes("date"));
      const categoryIdx=header.findIndex(h=>h.includes("category"));
      const memoIdx=header.findIndex(h=>h.includes("memo")||h.includes("note"));
      const typeIdxFound=header.findIndex(h=>h.includes("type"));
      const typeIdx=typeIdxFound>=0?typeIdxFound:1; // คอลัมน์ B = "Type" ถ้าหาชื่อคอลัมน์ไม่เจอ
      const EXCLUDED_TYPES=["move money"]; // deposit ไม่ทิ้งแล้ว — ส่งไปหน้ารีวิวแทน
      if(txnIdx<0||dateIdx<0) {alert("ไม่พบ Txn หรือ Date column");return;}
      const newExpenses=[];
      const deposits=[];
      const invests=[];
      let skippedByType=0;
      /* เดาหมวดให้แถวที่ CSV ไม่ได้ระบุหมวด (หรือระบุเป็น "อื่นๆ") — ใช้ map ที่เรียนรู้จากการจัดหมวดเองเป็นหลัก
         ไม่แตะแถวที่ CSV มีหมวดชัดเจนอยู่แล้ว และติด guessedCategory:true ไว้ให้ตรวจย้อนหลังได้ */
      const impMap=loadMemoCatMap();
      const VAGUE=["อื่นๆ","อื่น ๆ","ไม่ระบุ",""];
      let guessedCount=0;
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(",").map(c=>c.trim());
        const amt=parseFloat(cols[txnIdx]);
        const date=normalizeExpenseDate(cols[dateIdx]);
        const cat=cols[categoryIdx]||"อื่นๆ";
        const catNorm=cat.replace(/\s+/g," ").trim(); // KBank export บางไฟล์มีเว้นวรรคซ้อน เช่น "ออม  ลงทุน" (2 ช่อง) ต้อง normalize ก่อนเทียบ
        const memo=cols[memoIdx]||"";
        const type=(cols[typeIdx]||"").trim().toLowerCase();
        const isExcludedType=EXCLUDED_TYPES.some(t=>type.includes(t));
        if(isExcludedType){ skippedByType++; continue; }
        if(type.includes("deposit")){
          if(date&&amt>0) deposits.push({id:uid(),date,amount:amt,note:memo});
          continue;
        }
        if(amt<0&&date){
          // แถวหมวด "ออม ลงทุน" ไม่เข้ารายจ่ายทันที — ส่งไปหน้ารีวิวให้เลือกประเภทสินทรัพย์ก่อน
          if(catNorm===INVEST_CSV_CATEGORY){ invests.push({id:uid(),date,amount:amt,note:memo,category:INVEST_CSV_CATEGORY}); continue; }
          let useCat=cat, guessed=false;
          if(VAGUE.includes(catNorm)){
            const g=guessCategory(memo,impMap);
            if(g){ useCat=g.cat; guessed=true; guessedCount++; }
          }
          newExpenses.push({id:uid(),date,amount:amt,category:useCat,memo:memo,source:"kbank-csv",...(guessed?{guessedCategory:true}:{})});
        }
      }
      persist({
        ...finance,
        finance:{
          ...finance.finance,
          expenses:[...finance.finance.expenses,...newExpenses]
        }
      });
      setShowCSVImport(false);
      alert(`นำเข้า ${newExpenses.length} รายการสำเร็จ${guessedCount>0?` (เดาหมวดให้ ${guessedCount} รายการ — ตรวจได้ที่ปุ่มจัดหมวด)`:""}${skippedByType>0?` (ข้าม ${skippedByType} รายการที่เป็น move money)`:""}${deposits.length>0?` · พบเงินเข้า (Deposit) ${deposits.length} รายการ ให้รีวิวต่อ`:""}${invests.length>0?` · พบรายการ "${INVEST_CSV_CATEGORY}" ${invests.length} รายการ ให้รีวิวต่อ`:""}`);
      if(deposits.length>0) setDepositRows(deposits);
      if(invests.length>0) setInvestRows(invests);
    }catch(err){
      alert("ขอโทษ เกิดข้อผิดพลาดในการอ่านไฟล์");
    }
  };
  // บันทึกผลรีวิวแถว Deposit: "เงินคืน" ลง expenses แบบ amount บวก (ข้อยกเว้นเดียวของกฎติดลบ — ดู expOut())
  const applyDeposits=(rows,mode,target)=>{
    if(mode==="refund"){
      const add=rows.map(r=>({id:uid(),date:r.date,amount:Math.abs(r.amount),category:target,
        memo:("คืนเงิน "+(r.note||"")).trim(),source:"csv-refund"}));
      persist({...finance,finance:{...finance.finance,expenses:[...finance.finance.expenses,...add]}});
    }else if(mode==="income"){
      const add=rows.map(r=>({id:uid(),date:r.date,month:monthYearKey(r.date),amount:Math.abs(r.amount),
        source:target,note:r.note||"",importSource:"kbank-csv"}));
      persist({...finance,finance:{...finance.finance,income:[...(finance.finance.income||[]),...add]}});
    }
  };
  // บันทึกผลรีวิวแถว "ออม ลงทุน": ลง finance.investments (amount เป็นบวกตามกฎของ investments)
  // rows ที่มี _fromExpenseId คือแถวที่ดึงมาจากรายจ่ายเดิม (ผ่านปุ่มแก้ไขรายการที่นำเข้าผิด) ต้องลบออกจาก expenses ด้วย
  const applyInvestments=(rows,type)=>{
    const add=rows.map(r=>({id:uid(),date:r.date,amount:Math.abs(r.amount),
      name:(r.note||"").trim()||INVEST_TYPE_LABELS[type],type,source:"kbank-csv"}));
    const fixIds=new Set(rows.filter(r=>r._fromExpenseId).map(r=>r._fromExpenseId));
    persist({...finance,finance:{...finance.finance,
      investments:[...(finance.finance.investments||[]),...add],
      expenses:fixIds.size?finance.finance.expenses.filter(e=>!fixIds.has(e.id)):finance.finance.expenses}});
  };
  // แถวที่ผู้ใช้ไม่ได้จัดการ = รายจ่ายปกติตามเดิม (ไม่ปล่อยให้ข้อมูลหาย)
  // ถ้าเป็นแถวที่ดึงมาจากรายจ่ายเดิม (_fromExpenseId) แถวนั้นอยู่ใน expenses อยู่แล้ว ไม่ต้องเพิ่มซ้ำ
  const closeInvestReview=(leftover)=>{
    setInvestRows(null);
    if(!leftover||leftover.length===0) return;
    const add=leftover.filter(r=>!r._fromExpenseId).map(r=>({id:uid(),date:r.date,amount:-Math.abs(r.amount),
      category:r.category||INVEST_CSV_CATEGORY,memo:r.note||"",source:"kbank-csv"}));
    if(add.length) persist({...finance,finance:{...finance.finance,expenses:[...finance.finance.expenses,...add]}});
  };
  // ── แก้ไขย้อนหลัง: รายจ่ายเดิมที่หมวดตรงกับ "ออม ลงทุน" (นับรวมกรณีเว้นวรรคเพี้ยนจากบั๊กเดิม) ที่หลุดเข้ามาเป็นรายจ่าย ──
  const strayInvestExpenses=(finance.finance.expenses||[]).filter(e=>(e.category||"").replace(/\s+/g," ").trim()===INVEST_CSV_CATEGORY);
  const fixStrayInvestments=()=>setInvestRows(strayInvestExpenses.map(e=>({id:uid(),date:e.date,amount:e.amount,note:e.memo,category:INVEST_CSV_CATEGORY,_fromExpenseId:e.id})));
  const expensesByCategory={};
  (finance.finance.expenses||[]).forEach(exp=>{
    expensesByCategory[exp.category]=(expensesByCategory[exp.category]||0)+expOut(exp);
  });
  const sortedCategories=Object.entries(expensesByCategory).sort((a,b)=>b[1]-a[1]);
  const expensesThisMonth={};
  (finance.finance.expenses||[]).forEach(exp=>{
    const m=monthYearKey(exp.date);
    if(m===selectedMonth){
      expensesThisMonth[exp.category]=(expensesThisMonth[exp.category]||0)+expOut(exp);
    }
  });
  const categoryData=Object.entries(expensesThisMonth).map(([cat,amt])=>({name:cat,value:amt})).sort((a,b)=>b.value-a.value);
  const monthOptions=validMonths;
  const monthLabel=monthOptions.includes(selectedMonth)?new Date(`${selectedMonth}-01`).toLocaleDateString("en-US",{month:"long",year:"numeric"}):"Select month";
  const allExpenses=(finance.finance.expenses||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const [fMonth,setFMonth]=useState("all");
  const [fCat,setFCat]=useState("all");
  const [fSrc,setFSrc]=useState("all");
  const [editRow,setEditRow]=useState(null);
  const attCounts=useAttachCounts("expense");
  const listMonths=[...new Set(allExpenses.map(e=>monthYearKey(e.date)).filter(m=>/^\d{4}-\d{2}$/.test(m)))].sort().reverse();
  const listCats=[...new Set(allExpenses.map(e=>e.category).filter(Boolean))].sort();
  const listOrigins=[...new Set(allExpenses.map(originOf))].sort();
  const sortedExpenses=allExpenses.filter(e=>
    (fMonth==="all"||monthYearKey(e.date)===fMonth)&&(fCat==="all"||e.category===fCat)&&(fSrc==="all"||originOf(e)===fSrc));
  /* ข้อ 32/3: ตัดแถวที่แสดงจริง แต่ "เลือกทั้งหมด"/ยอดรวมยังคิดจาก sortedExpenses เต็มตามตัวกรองเหมือนเดิม */
  const rl=useRowLimit();
  const visibleExpenses=sortedExpenses.slice(0,rl.limit);
  const allSelected=sortedExpenses.length>0&&sortedExpenses.every(e=>selectedIds.has(e.id));
  const someSelected=sortedExpenses.some(e=>selectedIds.has(e.id))&&!allSelected;
  const toggleSelectAll=()=>{
    const next=new Set(selectedIds);
    if(allSelected) sortedExpenses.forEach(e=>next.delete(e.id));
    else sortedExpenses.forEach(e=>next.add(e.id));
    setSelectedIds(next);
  };
  const saveEdit=(row)=>{
    persist({...finance,finance:{...finance.finance,expenses:(finance.finance.expenses||[]).map(e=>e.id===row.id?row:e)}});
    setEditRow(null);
  };
  /* แยกรายจ่าย 1 รายการเป็นหลายหมวด */
  const [splitRow,setSplitRow]=useState(null);
  const applySplit=(newRows)=>{
    const cur=finance.finance.expenses||[];
    persist({...finance,finance:{...finance.finance,
      expenses:[...cur.filter(e=>e.id!==splitRow.id),...newRows]}});
    if(window.FireFiles&&newRows[0]) window.FireFiles.relink("expense",splitRow.id,newRows[0].id).catch(()=>{});   // ไฟล์แนบตามไปอยู่ที่ส่วนแรก
    setSplitRow(null);
  };
  /* แบนเนอร์ + ทางลัดเปิดหน้าจัดหมวด สำหรับหมวดก้อนใหญ่ที่ยังไม่ได้แยก */
  const [showRecatExp,setShowRecatExp]=useState(false);
  const vagueCats=["อื่นๆ","อื่น ๆ","ไม่ระบุ",""];
  const vagueRows=(finance.finance.expenses||[]).filter(e=>vagueCats.includes(String(e.category||"").trim()));
  const vagueTotal=vagueRows.reduce((a,e)=>a+expOut(e),0);
  /* ohm จัดหมวดครบแล้ว ที่เหลือคือ "อื่นๆ" จริงๆ — ปิดแบนเนอร์ได้ แต่จะกลับมาเตือนเองถ้ามีรายการอื่นๆ เพิ่มขึ้นจากตอนที่กดปิด
     (เก็บจำนวนตอนกดปิดไว้ ไม่ใช่ปิดถาวร เพื่อให้ import รอบหน้าที่เดาหมวดไม่ได้ยังเตือนอยู่) */
  const VAGUE_DISMISS_KEY="secretary-vague-dismiss";
  const [vagueDismissed,setVagueDismissed]=useState(()=>{ try{ return Number(localStorage.getItem(VAGUE_DISMISS_KEY))||0; }catch(e){ return 0; } });
  const dismissVague=()=>{ try{ localStorage.setItem(VAGUE_DISMISS_KEY,String(vagueRows.length)); }catch(e){} setVagueDismissed(vagueRows.length); };
  const showVague=vagueRows.length>vagueDismissed;
  return (
    <div className="fin-section fin-page fin-list-page">
      {showRecatExp&&<RecategorizeModal finance={finance} persist={persist} startCat="อื่นๆ" onClose={()=>setShowRecatExp(false)}/>}
      {showVague&&(
        <div className="fin-banner info">
          <span>รายจ่ายหมวด "อื่นๆ" {vagueRows.length} รายการ · ฿{Math.round(vagueTotal).toLocaleString()}{vagueDismissed>0?` (เพิ่มขึ้น ${vagueRows.length-vagueDismissed} รายการจากครั้งก่อน)`:""}</span>

/* ═══ บันทึกการซื้อเพิ่ม (รองรับ DCA ที่ซื้อทุกวัน — กรอกเป็นยอดรวมรายงวด ไม่ต้องลงทีละครั้ง) ═══
   กรอก 2 ตัวเลข: งวดนี้ได้เหรียญมากี่หน่วย + จ่ายเงินรวมเท่าไร → ระบบคิดต้นทุนเฉลี่ยถ่วงน้ำหนักใหม่ให้
   ต้นทุนเฉลี่ยหลัง merge เก็บเป็น THB เสมอ (ถ้างวดจ่าย USD จะแปลงด้วยเรตของงวดนั้น ไม่ใช่เรตวันนี้)
   เก็บทุกงวดไว้ใน h.buys[] เพื่อดูประวัติ DCA และไว้คำนวณ XIRR ในอนาคต */
function AddBuyModal({holding,fx,onClose,onSave}) {
  const [date,setDate]=useState(todayISO());
  const [qty,setQty]=useState("");
  const [total,setTotal]=useState("");
  const [cur,setCur]=useState("THB");
  const [rate,setRate]=useState(fx?String(fx):"");
  const n=(v)=>{ const x=Number(v); return isFinite(x)?x:0; };
  const usedRate=cur==="USD"?(n(rate)||fx):1;
  const totalTHB=n(total)*usedRate;
  const unit=n(qty)>0?totalTHB/n(qty):0;
  const prevQty=n(holding.quantity);
  const prevCostTHB=holdingCostTHB(holding,fx);
  const newQty=prevQty+n(qty);
  const newAvg=newQty>0?(prevCostTHB+totalTHB)/newQty:0;
  const ready=n(qty)>0&&n(total)>0&&(cur==="THB"||usedRate>0);
  const apply=()=>{
    if(!ready) return;
    onSave({
      buy:{id:uid(),date,qty:n(qty),total:n(total),currency:cur,fxRate:cur==="USD"?usedRate:1,totalTHB},
      quantity:String(newQty),
      avgCost:String(Math.round(newAvg*100)/100),
      costCurrency:"THB",     // หลัง merge ต้นทุนเป็นบาทเสมอ — งวดที่จ่าย USD ถูกล็อกด้วยเรตของงวดไปแล้ว
      costFxRate:"",
      firstHeldDate:holding.firstHeldDate||date,
    });
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>➕ ซื้อเพิ่ม {holding.coin||"เหรียญ"}</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="modal-body">
          <div className="recat-hint">
            ตั้ง DCA รายวันก็กรอกรวมเป็นเดือนได้ — ใส่ยอดรวมของงวด (เช่น "เดือน ส.ค. ได้ 0.0042 BTC จ่ายไป ฿9,300")
            <br/>ตอนนี้ถืออยู่ {prevQty.toLocaleString()} หน่วย · ต้นทุนรวม ฿{Math.round(prevCostTHB).toLocaleString()}
          </div>
          <div className="fin-row-2">
            <div>
              <label className="field-label">วันที่ (สิ้นงวด)</label>
              <input type="date" className="modal-input" value={date} onChange={e=>setDate(e.target.value)}/>
            </div>
            <div>
              <label className="field-label">งวดนี้ได้เหรียญมากี่หน่วย</label>
              <input className="modal-input" inputMode="decimal" placeholder="0.0042" value={qty} onChange={e=>setQty(e.target.value)}/>
            </div>
          </div>
          <div className="fin-row-2">
            <div>
              <label className="field-label">จ่ายเงินรวมเท่าไร</label>
              <input className="modal-input" inputMode="decimal" placeholder="9300" value={total} onChange={e=>setTotal(e.target.value)}/>
            </div>
            <div>
              <label className="field-label">สกุลเงินที่จ่าย</label>
              <select className="modal-input" value={cur} onChange={e=>setCur(e.target.value)}>
                <option value="THB">THB</option><option value="USD">USD</option>
              </select>
            </div>
          </div>
          {cur==="USD"&&(
            <div>
              <label className="field-label">เรต USD → THB ของงวดนี้</label>
              <input className="modal-input" inputMode="decimal" placeholder={fx?String(fx):"36.50"} value={rate} onChange={e=>setRate(e.target.value)}/>
            </div>
          )}
          {ready&&(
            <div className="recat-action" style={{marginTop:12,fontSize:11.5,color:"var(--ink-3)"}}>
              ราคาเฉลี่ยงวดนี้ <b>฿{unit.toLocaleString(undefined,{maximumFractionDigits:2})}</b> /หน่วย
              <div style={{marginTop:6,color:"var(--ink-2)"}}>
                หลังบันทึก: ถือ <b style={{color:"var(--ink)"}}>{newQty.toLocaleString()}</b> หน่วย ·
                ต้นทุนเฉลี่ยใหม่ <b style={{color:"var(--ink)"}}>฿{newAvg.toLocaleString(undefined,{maximumFractionDigits:2})}</b> /หน่วย
                {holding.costCurrency==="USD"&&<div style={{color:"#fbbf24",marginTop:4}}>ต้นทุนเดิมที่กรอกเป็น USD จะถูกแปลงเป็นบาทถาวรหลังบันทึก</div>}
              </div>
            </div>
          )}
          <button className="modal-btn-save" style={{marginTop:12,width:"100%"}} disabled={!ready} onClick={apply}>บันทึกการซื้อ</button>
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ยกเลิก</button></div>
      </div>
    </div>
  );
}
/* ═══ ประวัติ DCA ต่อเหรียญ — แสดงรายการซื้อทั้งหมดใน buys[] ย้อนหลัง (ข้อ 51.2 ต่อยอดข้อ 16) ═══
   ลบได้ทีละงวด — คำนวณย้อนกลับ "ก้อนแรก" (ต้นทุนก่อนมีบันทึกซื้อเพิ่มใดๆ แบบเดียวกับที่ใช้ทำ XIRR)
   แล้วรวมกับงวดที่เหลือใหม่ ได้ quantity/avgCost ที่ถูกต้องเสมอ (ดู deleteBuy ใน FinanceInvestmentsTab) */

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span><Clock size={14}/> ประวัติการซื้อ {holding.coin||"เหรียญ"}</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="modal-body">
          {buys.length===0&&<div className="db-empty">ยังไม่มีบันทึกซื้อเพิ่ม — ยอดตอนนี้มาจากตอนเพิ่มเหรียญครั้งแรกทั้งหมด</div>}
          {buys.length>0&&(
            <>
              <div className="db-note" style={{marginBottom:10}}>รวม {buys.length} งวด · {totalQty.toLocaleString()} หน่วย · ฿{dbNum(totalTHB)}</div>

                {buys.map(b=>(
                  <div key={b.id} className="db-row" style={{alignItems:"flex-start"}}>
                    <span className="lab">
                      <span className="db-mono" style={{color:"var(--ink)"}}>{thaiDate(b.date)}</span>
                      <div className="db-note" style={{marginTop:2}}>
                        {nv(b.qty).toLocaleString()} หน่วย · {b.currency==="USD"?`$${nv(b.total).toLocaleString()} (เรต ${nv(b.fxRate).toFixed(2)})`:`฿${nv(b.total).toLocaleString()}`}
                        {nv(b.qty)>0&&` · เฉลี่ย ฿${(nv(b.totalTHB)/nv(b.qty)).toLocaleString(undefined,{maximumFractionDigits:2})}/หน่วย`}
                      </div>
                    </span>
                    <button className="db-chip" title="ลบงวดนี้" onClick={()=>onDelete(b.id)}><Trash2 size={12}/></button>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ปิด</button></div>
      </div>
    </div>
  );
}

/* ═══ Debts (เฟส 1: CRUD หนี้พื้นฐาน) ═══ */
/* หนี้มี 2 ชนิด: external = หนี้กับเจ้าหนี้ภายนอก, self = หนี้ตัวเอง (ดึงเงินเก็บ/เงินลงทุนมาใช้แล้วตั้งใจคืนตัวเอง)
   ยอดคงเหลือของ self กรอกเองล้วนๆ ไม่ผูก/ไม่หักกับ investments อัตโนมัติเด็ดขาด */
const DEBT_KINDS=[{key:"external",label:"หนี้ภายนอก"},{key:"self",label:"หนี้ตัวเอง"}];
const DEBT_TYPES_EXTERNAL=[
  {key:"car-loan",label:"ผ่อนรถ"},
  {key:"mortgage",label:"ผ่อนบ้าน"},
  {key:"coop-loan",label:"กู้สหกรณ์"},
  {key:"credit-card",label:"บัตรเครดิต"},
  {key:"personal-loan",label:"สินเชื่อส่วนบุคคล"},
  {key:"other",label:"อื่นๆ"},
];
const DEBT_TYPE_LABELS=DEBT_TYPES_EXTERNAL.reduce((a,t)=>{a[t.key]=t.label;return a;},{});
/* ป้ายชนิดหนี้ — ธีม Dark Emerald: ภายนอก = ส้ม (เงินคนอื่น) · ตัวเอง = ทอง (เงินตัวเอง)
   เดิม self เป็นฟ้า #38bdf8 ที่ตกค้างจากธีมม่วง (ข้อ 35 ล้างสีนอกธีมทั้งแอป) */
const DEBT_KIND_STYLE={
  external:{color:"var(--orange-soft)",borderColor:"var(--orange)",background:"rgba(251,146,60,.13)"},
  self:{color:"var(--gold-soft)",borderColor:"var(--gold)",background:"var(--gold-dim)"},
};
/* ═══ Net Worth: เงินสด + มูลค่าพอร์ตลงทุน − หนี้คงเหลือ ═══
   แหล่งคำนวณเดียวของทั้งแอป — FinanceInvestmentsTab ก็เรียก 2 ตัวนี้ด้วย อย่าคำนวณซ้ำที่อื่น */
const nv=(v)=>{ const x=Number(v); return isFinite(x)?x:0; };
/* อัตราแลกเปลี่ยน USD→THB กรอกเองเป็นระยะ (ไม่ต่อ API ตามแนวทางเดิมของแอป)
   เก็บที่ finance.fxRate = { USDTHB: {value, updatedAt} } */
function usdThb(f){ const r=f.finance.fxRate&&f.finance.fxRate.USDTHB; return nv(r&&r.value); }
/* แปลงเป็นบาทเสมอ — ภาพรวมทั้งแอปเป็น THB สกุลเดียว
   ต้นทุนที่จ่ายเป็น USD ใช้ "เรตตอนซื้อ" (costFxRate) ถ้ากรอกไว้ ไม่ใช่เรตวันนี้
   เพราะเงินบาทที่จ่ายไปจริงล็อกไปแล้ว ถ้าใช้เรตวันนี้ ต้นทุนในอดีตจะขยับตามค่าเงิน = กำไร/ขาดทุนเพี้ยน */
function holdingCostTHB(h,fx){
  const rate=(h.costCurrency==="USD")?(nv(h.costFxRate)||fx):1;
  return nv(h.quantity)*nv(h.avgCost)*rate;
}
function holdingValueTHB(h,fx){
  const rate=(h.priceCurrency==="USD")?fx:1;   // มูลค่าปัจจุบันใช้เรตวันนี้เสมอ
  return nv(h.quantity)*nv(h.currentPrice)*rate;
}
/* ═══ XIRR ต่อเหรียญ/ต่อพอร์ต (ผลตอบแทนเฉลี่ยต่อปี) — งานค้างข้อ 4.4 ═══
   กระแสเงินสด = "ก้อนแรก" (ต้นทุนตอนเริ่มถือ ก่อนมีบันทึกซื้อเพิ่มใดๆ) + ทุกงวดใน buys[] + มูลค่าปัจจุบันวันนี้
   ก้อนแรกหาได้จากผลต่าง: ต้นทุนรวมตอนนี้ (holdingCostTHB) ลบผลรวม buys[].totalTHB ทั้งหมด
   เพราะ avgCost ปัจจุบันคือค่าเฉลี่ยถ่วงน้ำหนักของก้อนแรก+ทุกงวดซื้อเพิ่มเสมอ (คำนวณไว้ตั้งแต่ AddBuyModal ตามข้อ 16) */
function holdingCashflows(h,fx){
  const buys=h.buys||[];
  const totalCostTHB=holdingCostTHB(h,fx);
  const boughtTHB=buys.reduce((a,b)=>a+nv(b.totalTHB),0);
  const initialCostTHB=totalCostTHB-boughtTHB;
  const firstDate=h.firstHeldDate||(buys[0]&&buys[0].date);
  const cfs=[];
  if(initialCostTHB>0&&firstDate) cfs.push({date:firstDate,amount:-initialCostTHB});
  buys.forEach(b=>{ if(nv(b.totalTHB)>0&&b.date) cfs.push({date:b.date,amount:-nv(b.totalTHB)}); });
  const value=holdingValueTHB(h,fx);
  if(value>0&&cfs.length>0) cfs.push({date:todayISO(),amount:value});
  return cfs;
}
/* หาอัตรา r ที่ NPV=0 ด้วย bisection — เครื่องหมายกระแสเงินสดสลับครั้งเดียว (ลบ...ลบ...บวก) NPV(r) จึงลดหน่วยเดียว ลู่เข้าเสมอถ้ามีคำตอบ */
function xirr(cashflows){
  if(!cashflows||cashflows.length<2) return null;
  const sorted=cashflows.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const t0=new Date(sorted[0].date).getTime();
  const spanDays=(new Date(sorted[sorted.length-1].date).getTime()-t0)/86400000;
  if(spanDays<1) return null;   // ถือมาไม่ถึง 1 วัน คิดต่อปีไม่มีความหมาย
  if(!sorted.some(c=>c.amount<0)||!sorted.some(c=>c.amount>0)) return null;
  const yrs=d=>(new Date(d).getTime()-t0)/(365*86400000);
  const npv=r=>sorted.reduce((s,cf)=>s+cf.amount/Math.pow(1+r,yrs(cf.date)),0);
  let lo=-0.9999,hi=10,fLo=npv(lo),fHi=npv(hi),tries=0;
  while(fLo*fHi>0&&tries<40){ hi*=2; fHi=npv(hi); tries++; }
  if(fLo*fHi>0) return null;
  let mid=0;
  for(let i=0;i<200;i++){
    mid=(lo+hi)/2; const fMid=npv(mid);
    if(Math.abs(fMid)<1e-6) return mid;
    if(fLo*fMid<0){ hi=mid; fHi=fMid; } else { lo=mid; fLo=fMid; }
  }
  return mid;
}
function holdingXirrPct(h,fx){
  const r=xirr(holdingCashflows(h,fx));
  return r==null?null:r*100;
}
function cryptoPortfolioValue(f){
  const fx=usdThb(f);
  return (f.finance.cryptoHoldings||[]).reduce((a,h)=>a+holdingValueTHB(h,fx),0);
}
function portfolioValue(f){
  const iv=f.finance.investmentValues||{};
  return INVEST_TYPES.reduce((a,t)=>a+(t.key==="crypto"?cryptoPortfolioValue(f):nv(iv[t.key]&&iv[t.key].value)),0);
}
function totalDebtBalance(f){ return (f.finance.debts||[]).reduce((a,d)=>a+nv(d.currentBalance),0); }
function totalCash(f){ return (f.finance.cashAccounts||[]).reduce((a,c)=>a+nv(c.balance),0); }
/* เงินสดกรอกยอดคงเหลือเองเป็นระยะ (โครงเดียวกับ investmentValues / debts.currentBalance)
   ไม่คำนวณสะสมจาก income−expenses เพราะข้อมูลไม่ได้ครอบคลุมทุกบัญชี จะเพี้ยนแบบเงียบๆ */
/* ═══ ข้อ 24/4: Net Worth เป็นการ์ด bento — สรุปอย่างเดียว
   บัญชีเงินสดแยกไปอยู่ CashAccountsCard ด้านล่าง (ข้อ 32/1: การ์ดละเรื่อง ไม่ยัดตารางเข้าการ์ดสรุป) ═══ */
const NW_COLORS={cash:"var(--accent)",invest:"var(--gold)",debt:"var(--orange)"};
function NetWorthCard({finance,setTab}) {
  const cash=totalCash(finance);
  const invest=portfolioValue(finance);
  const debt=totalDebtBalance(finance);
  const net=cash+invest-debt;
  const accounts=finance.finance.cashAccounts||[];
  const staleAcc=accounts.filter(a=>a.updatedAt&&(-daysUntil(a.updatedAt))>=30);
  /* แถบบน = สินทรัพย์ (เงินสด+ลงทุน) · แถบล่าง = หนี้ · สเกลเดียวกันทั้งคู่ถึงเทียบกันด้วยตาได้ */
  const barMax=Math.max(cash+invest,debt,1);
  const rows=[
    {key:"cash",label:"เงินสด",v:cash,color:NW_COLORS.cash,to:null},
    {key:"invest",label:"ลงทุน",v:invest,color:NW_COLORS.invest,to:"investments"},
    {key:"debt",label:"หนี้",v:debt,color:NW_COLORS.debt,to:"debts",neg:true},
  ];
  return (
    <div className="db-card db-span2">
      <div className="db-head">
        <div><div className="db-title">Net Worth</div><div className="db-note">เงินสด + พอร์ตลงทุน − หนี้คงเหลือ</div></div>
        <div className={`db-bignum-inline db-mono ${net>=0?"":"neg"}`} style={{color:net>=0?"var(--accent-soft)":"var(--orange)"}}>
          {net<0?"-":""}฿{dbShort(Math.abs(net))}
        </div>
      </div>
      <div className="nw-bar"><i style={{width:`${(cash/barMax)*100}%`,background:NW_COLORS.cash}} title={`เงินสด ฿${dbNum(cash)}`}/><i style={{width:`${(invest/barMax)*100}%`,background:NW_COLORS.invest}} title={`ลงทุน ฿${dbNum(invest)}`}/></div>
      <div className="nw-bar"><i style={{width:`${(debt/barMax)*100}%`,background:NW_COLORS.debt}} title={`หนี้ ฿${dbNum(debt)}`}/></div>
      {rows.map(r=>(
        <div key={r.key} className={`db-row ${r.to?"nw-row-link":""}`} onClick={r.to?()=>setTab(r.to):undefined}>
          <span className="lab"><i className="db-dot" style={{background:r.color}}/> {r.label}</span>
          <span className="val db-mono" style={{color:r.color}}>{r.neg&&r.v>0?"-":""}฿{dbNum(r.v)}</span>
        </div>
      ))}
      {cash===0&&invest===0&&debt===0&&(
        <div className="db-empty">ยังไม่มีข้อมูล — กรอกบัญชีเงินสดในการ์ดถัดไป, มูลค่าพอร์ตที่แท็บ Investments, หนี้ที่แท็บ Debts</div>
      )}
      {staleAcc.length>0&&(
        <div className="inv-warn">ยอดบัญชี {staleAcc.map(a=>a.name||"(ไม่มีชื่อ)").join(", ")} ไม่ได้อัปเดตเกิน 30 วันแล้ว</div>
      )}
    </div>
  );
}
/* บัญชีเงินสด/เงินฝาก — แก้ไข/ลบในการ์ด, เพิ่มใหม่ผ่านปุ่มเดียวของหน้า (ข้อ 32/2) */
function CashAccountsCard({finance,persist}) {
  const accounts=finance.finance.cashAccounts||[];
  const setAccounts=(next)=>persist({...finance,finance:{...finance.finance,cashAccounts:next}});

  return (
    <DashCollapse

        กรอกยอดคงเหลือเองเป็นระยะ — ไม่ได้คำนวณจากรายรับ-รายจ่ายอัตโนมัติ เพราะข้อมูลไม่ครอบคลุมทุกบัญชี
      </div>
      {accounts.length===0&&<div className="db-empty">ยังไม่มีบัญชี — กด “เพิ่มข้อมูล” ด้านบนแล้วเลือก “บัญชีเงินสด”</div>}
      {accounts.map(a=>(
        <div key={a.id} className="db-row fin-acc-row">
          <span className="lab">
            <input className="modal-input fin-acc-name" placeholder="เช่น KBank ออมทรัพย์" value={a.name} onChange={e=>editAccount(a.id,"name",e.target.value)}/>

          </span>
        </div>
      ))}

  );
}
/* โมดัลเพิ่มบัญชีเงินสด — ปุ่มเดียวของหน้า Overview เรียกตัวนี้ */
function AddCashAccountModal({onClose,onSave}) {
  const [name,setName]=useState("");
  const [balance,setBalance]=useState("");
  const ready=name.trim().length>0;

          <div style={{marginTop:10}}><label className="field-label">ยอดคงเหลือ</label><input className="modal-input" inputMode="decimal" placeholder="0" value={balance} onChange={e=>setBalance(e.target.value)}/></div>
          <button className="modal-btn-save" style={{marginTop:12,width:"100%"}} disabled={!ready} onClick={()=>ready&&onSave({name:name.trim(),balance})}>บันทึกบัญชี</button>

}
/* ═══ ข้อ 24/5: โมดัลเพิ่ม/แก้ไขหนี้ — ตัวเดียวใช้ทั้งสองงาน ═══
   เดิมเป็น "การ์ดฟอร์มเพิ่มหนี้" ใหญ่ค้างหน้าจอ + แก้ไข inline ในตาราง

   initial = undefined → โหมดเพิ่ม · initial = ค่าเดิม → โหมดแก้ไข */

}
function FinanceDebtsTab({finance,persist}) {
  const list=(finance.finance.debts||[]).slice().sort((a,b)=>(Number(b.currentBalance)||0)-(Number(a.currentBalance)||0));
  const n=(v)=>{ const x=Number(v); return isFinite(x)?x:0; };
  const setDebts=(next)=>persist({...finance,finance:{...finance.finance,debts:next}});
  const remove=(id)=>setDebts((finance.finance.debts||[]).filter(x=>x.id!==id));
  /* ── เฟส 2: จับคู่กับ Expenses (ยืนยันเอง ห้ามหักอัตโนมัติ) ── */
  const expenses=finance.finance.expenses||[];
  const catKey=(c)=>String(c||"").replace(/\s+/g," ").trim();
  const expCategories=Array.from(new Set(expenses.map(e=>catKey(e.category)).filter(Boolean))).sort();
  // หมวดที่ถูกหนี้ตัวอื่นจองไปแล้ว — 1 รายจ่าย map ได้แค่ 1 หนี้ (linkedDebtId เป็นค่าเดียว)
  const takenCat={};
  (finance.finance.debts||[]).forEach(d=>{ if(d.linkedExpenseCategory) takenCat[catKey(d.linkedExpenseCategory)]=d.id; });
  const catDisabled=(c,selfId)=>takenCat[c]&&takenCat[c]!==selfId;
  const pendingFor=(d)=>{
    if(!d.linkedExpenseCategory) return null;
    const k=catKey(d.linkedExpenseCategory);
    const rows=expenses.filter(e=>catKey(e.category)===k&&!e.linkedDebtId);
    if(!rows.length) return {rows:[],sum:0};
    const dates=rows.map(e=>e.date).filter(Boolean).sort();
    return {rows,sum:rows.reduce((a,e)=>a+expOut(e),0),from:dates[0],to:dates[dates.length-1]};
  };
  const confirmMatch=(d)=>{
    const p=pendingFor(d);
    if(!p||!p.rows.length) return;
    const ids=new Set(p.rows.map(e=>e.id));
    persist({...finance,finance:{...finance.finance,
      debts:(finance.finance.debts||[]).map(x=>x.id===d.id?{...x,currentBalance:n(x.currentBalance)-p.sum,updatedAt:todayISO()}:x),
      expenses:expenses.map(e=>ids.has(e.id)?{...e,linkedDebtId:d.id}:e),
    }});
  };
  const totExternal=list.filter(d=>d.kind!=="self").reduce((a,d)=>a+n(d.currentBalance),0);
  const totSelf=list.filter(d=>d.kind==="self").reduce((a,d)=>a+n(d.currentBalance),0);
  const totMin=list.reduce((a,d)=>a+n(d.minPayment),0);
  const totAll=totExternal+totSelf;

  /* ── ข้อ 24/5: เพิ่ม/แก้ไขผ่าน DebtFormModal ตัวเดียว (ข้อ 32/2 ปุ่มเดียวต่อหน้า)
       เดิม = การ์ดฟอร์มใหญ่ค้างหน้าจอ + แก้ไข inline ในตาราง ── */
  const [modal,setModal]=useState(null);   // null | {mode:"add"} | {mode:"edit",id,initial}
  const openAdd=()=>setModal({mode:"add"});
  const openEdit=(d)=>setModal({mode:"edit",id:d.id,initial:{
    kind:d.kind||"external",name:d.name||"",type:d.type||"other",
    principal:d.principal==null?"":d.principal,currentBalance:d.currentBalance==null?"":d.currentBalance,
    interestRate:d.interestRate==null?"":d.interestRate,minPayment:d.minPayment==null?"":d.minPayment,
    dueDay:d.dueDay==null?"":d.dueDay,note:d.note||"",startDate:d.startDate||todayISO(),
    linkedExpenseCategory:d.linkedExpenseCategory||"",
  }});
  /* แปลงค่าจากฟอร์มเป็นรูปแบบที่เก็บจริง — ใช้ร่วมกันทั้งเพิ่มและแก้ไข ไม่ให้กฎ null/0 หลุดกัน */
  const normalizeDebt=(f)=>({
    kind:f.kind,name:String(f.name||"").trim(),type:f.kind==="self"?"other":f.type,
    principal:f.principal===""||f.principal==null?null:n(f.principal),
    currentBalance:n(f.currentBalance),
    interestRate:f.kind==="self"||f.interestRate===""||f.interestRate==null?null:n(f.interestRate),
    minPayment:f.minPayment===""||f.minPayment==null?null:n(f.minPayment),
    dueDay:f.kind==="self"||f.dueDay===""||f.dueDay==null?null:n(f.dueDay),
    linkedExpenseCategory:f.linkedExpenseCategory||null,
    note:String(f.note||"").trim(),startDate:f.startDate||null,
  });
  const saveDebt=(f)=>{
    const row=normalizeDebt(f);
    if(!row.name) return;
    if(modal&&modal.mode==="edit"){
      setDebts((finance.finance.debts||[]).map(d=>d.id!==modal.id?d:{...d,...row,
        updatedAt:n(row.currentBalance)!==n(d.currentBalance)?todayISO():(d.updatedAt||todayISO())}));
    } else {
      setDebts([...(finance.finance.debts||[]),{id:uid(),...row,updatedAt:todayISO(),source:"manual"}]);
    }
    setModal(null);
  };

  /* ── ตัวเลขสรุปสำหรับการ์ด bento ── */
  /* ยอดตั้งต้น: ก้อนไหนไม่ได้กรอกให้ถือว่าเท่ากับยอดคงเหลือ (= ยังไม่ได้ชำระ) ไม่งั้น % ชำระแล้วจะเวอร์ */
  const totPrincipal=list.reduce((a,d)=>a+(n(d.principal)>0?n(d.principal):n(d.currentBalance)),0);
  const paid=Math.max(0,totPrincipal-totAll);
  const paidPct=totPrincipal>0?Math.min(100,(paid/totPrincipal)*100):0;
  /* รายรับเฉลี่ยต่อเดือน (ไม่เกิน 6 เดือนล่าสุด) — ใช้บอกว่าผ่อนรวมกินรายรับกี่ % */
  const incByMonth={};
  (finance.finance.income||[]).forEach(i=>{
    const m=i.month||monthYearKey(i.date);
    if(/^\d{4}-\d{2}$/.test(m)) incByMonth[m]=(incByMonth[m]||0)+n(i.amount);
  });
  const incMonths=Object.keys(incByMonth).sort().slice(-6);
  const avgIncome=incMonths.length?incMonths.reduce((a,m)=>a+incByMonth[m],0)/incMonths.length:0;
  const dsr=avgIncome>0?(totMin/avgIncome)*100:null;
  /* ครบกำหนดถัดไป — dueDay คือวันในเดือน ถ้าเลยไปแล้วนับเป็นเดือนหน้า (clamp วันสิ้นเดือน เช่น 31 ก.พ.) */
  const today0=new Date(); today0.setHours(0,0,0,0);
  const lastOfMonth=(yy,mm)=>new Date(yy,mm+1,0).getDate();
  const nextDueDate=(d)=>{
    const day=n(d.dueDay); if(!day) return null;
    let y=today0.getFullYear(),mo=today0.getMonth();
    if(today0.getDate()>Math.min(day,lastOfMonth(y,mo))){ mo+=1; if(mo>11){ mo=0; y+=1; } }
    return new Date(y,mo,Math.min(day,lastOfMonth(y,mo)));
  };
  /* แถวในการ์ด "ภาระต่อเดือน" = หนี้ทุกก้อน ไม่ใช่เฉพาะก้อนที่ตั้งวันครบกำหนด
     (ก้อนที่ยังไม่ตั้งยอดผ่อน/วันครบกำหนดก็ต้องเห็น จะได้รู้ว่ายังกรอกไม่ครบ)
     เรียงตามวันครบกำหนดที่ใกล้ที่สุดก่อน · ก้อนที่ไม่มีวันครบกำหนดไปท้ายสุด */
  const dueRows=list.map(d=>{
    const dt=n(d.dueDay)>0?nextDueDate(d):null;
    return {d,dt,days:dt?Math.round((dt-today0)/86400000):null};
  }).sort((a,b)=>(a.days==null?9999:a.days)-(b.days==null?9999:b.days));
  /* ประมาณการปลดหนี้ — หารยอดคงเหลือด้วยผ่อนขั้นต่ำตรงๆ ไม่คิดดอกเบี้ย (เขียนกำกับไว้ในการ์ด) */
  const payoff=list.map(d=>{
    const bal=n(d.currentBalance),mp=n(d.minPayment);
    return {d,bal,mp,months:mp>0&&bal>0?Math.ceil(bal/mp):null};
  });
  const payoffMax=payoff.reduce((a,x)=>Math.max(a,x.months||0),0);
  const freeDate=payoffMax>0?new Date(today0.getFullYear(),today0.getMonth()+payoffMax,1):null;
  /* หนี้ที่ผูกหมวดรายจ่ายไว้ — p.rows คือรายจ่ายที่ยังไม่ได้หัก (ต้องกดยืนยันเอง ห้ามหักอัตโนมัติ) */
  const matchRows=list.map(d=>({d,p:pendingFor(d)})).filter(x=>x.p);
  const matchReady=matchRows.filter(x=>x.p.rows.length>0);
  const segs=list.filter(d=>n(d.currentBalance)>0)
    .map((d,i)=>({key:d.id,label:d.name||"(ไม่มีชื่อ)",value:n(d.currentBalance),color:DB_CAT_COLORS[i%DB_CAT_COLORS.length]}));

  return (
    <div className="fin-section fin-page">
      {/* ── ฮีโร่: สเกลเดียวกับหน้า Home ตามธรรมนูญข้อ 32 (38px + margin:0) ── */}
      <div className="db-hero">
        <div>
          <h1 className="db-hero-title">Debts <span>· หนี้สิน</span></h1>
          <div className="db-hero-line">
            {list.length} ก้อน · ภายนอก ฿{dbNum(totExternal)} · ตัวเอง ฿{dbNum(totSelf)}
            {paid>0&&<> · ชำระไปแล้ว {paidPct.toFixed(0)}% ของยอดตั้งต้น</>}
          </div>
          {/* ข้อ 32/2: ปุ่มเพิ่มข้อมูลของทั้งหน้าเหลือปุ่มนี้ปุ่มเดียว */}
          <button className="db-btn primary inv-add-btn" onClick={openAdd}><Plus size={14}/> เพิ่มข้อมูล</button>
        </div>
        <div className="db-bignums">
          <div className="db-bignum">
            <div className="n db-mono" style={{color:"var(--orange-soft)"}}>฿{dbShort(totAll)}</div>
            <div className="l"><span className="db-dot" style={{background:"var(--orange)"}}/> หนี้คงเหลือ</div>
          </div>
          <div className="db-bignum">
            <div className="n gld db-mono">฿{dbShort(totMin)}</div>
            <div className="l"><span className="db-dot g"/> ผ่อนขั้นต่ำ/เดือน</div>
          </div>
          <div className="db-bignum">
            <div className="n acc db-mono">฿{dbShort(paid)}</div>
            <div className="l"><span className="db-dot a"/> ชำระไปแล้ว</div>
          </div>
        </div>
      </div>

      <div className="db-bento">
        {/* ── การ์ด 1: สัดส่วนหนี้ (โดนัท SVG ชุดเดียวกับหน้า Home ไม่ใช้ Recharts) ── */}
        <div className="db-card db-span2">
          <div className="db-head">
            <div><div className="db-title">สัดส่วนหนี้</div><div className="db-note">แยกตามก้อน · เรียงจากมากไปน้อย</div></div>
            <div className="db-bignum-inline db-mono" style={{color:"var(--orange-soft)"}}>฿{dbShort(totAll)}</div>
          </div>
          {segs.length===0?(
            <div className="db-empty">ยังไม่มีหนี้คงเหลือ — กด “เพิ่มข้อมูล” ด้านบนเพื่อบันทึกก้อนแรก</div>
          ):(
            <div className="db-donut-wrap">
              <DashDonut segs={segs} total={totAll}/>
              <div className="db-legend">
                {segs.slice(0,6).map(s=>(
                  <div key={s.key} className="db-lg">
                    <i style={{background:s.color}}/>
                    <span className="debt-lg-name">{s.label}</span>
                    <b className="db-mono">{Math.round((s.value/totAll)*100)}%</b>
                  </div>
                ))}
                {segs.length>6&&(
                  <div className="db-lg"><i style={{background:"var(--ink-6)"}}/><span className="debt-lg-name">อีก {segs.length-6} ก้อน</span></div>
                )}
              </div>
            </div>
          )}
          {totPrincipal>0&&(
            <>
              <div className="db-track"><div className="db-fill" style={{width:`${paidPct}%`}}/></div>
              <div className="db-row">
                <span className="lab">ชำระแล้ว {paidPct.toFixed(0)}% จากยอดตั้งต้นรวม ฿{dbNum(totPrincipal)}</span>
                <span className="val db-mono up">฿{dbNum(paid)}</span>
              </div>
            </>
          )}
        </div>

        {/* ── การ์ด 2: ภาระต่อเดือน + ครบกำหนดถัดไป ── */}
        <div className="db-card db-span2">
          <div className="db-head">
            <div>
              <div className="db-title">ภาระต่อเดือน</div>
              <div className="db-note">{dsr!=null?`คิดเป็น ${dsr.toFixed(0)}% ของรายรับเฉลี่ย ฿${dbNum(avgIncome)}/เดือน`:"ยังไม่มีข้อมูลรายรับให้เทียบ"}</div>
            </div>
            <div className="db-bignum-inline db-mono">฿{dbShort(totMin)}</div>
          </div>
          {dsr!=null&&(
            <div className="db-track">
              <div className="db-fill" style={{width:`${Math.min(100,dsr)}%`,background:dsr>40?"linear-gradient(90deg,var(--orange-deep),var(--orange))":undefined}}/>
            </div>
          )}
          {dueRows.length===0&&<div className="db-empty">ยังไม่มีหนี้ในระบบ</div>}
          {dueRows.map(({d,days})=>(
            <div key={d.id} className="db-row">
              <span className="lab">
                <i className="db-dot" style={{background:days!=null&&days<=7?"var(--orange)":"var(--ink-5)"}}/>
                <span className="db-tname">{d.name||"(ไม่มีชื่อ)"}</span>
              </span>
              {n(d.minPayment)>0?(
                <span className="val db-mono">
                  ฿{dbNum(n(d.minPayment))}
                  <span className="debt-due-when">{days==null?"ไม่ได้ตั้งวันครบกำหนด":(days===0?"วันนี้":`อีก ${days} วัน`)}</span>
                </span>
              ):(

/* ═══ Payslip import ═══ */
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESSERACT_URL="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";
const SLIP_AMOUNT_RE=/\d{1,3}(?:,\d{3})*\.\d{2}/g;
const UTILITY_KEYWORDS=["ค่าน้ำ","ค่าไฟ","ค่าอ่านหน่วย","ค่าขยะ","cable tv"];
const SAVINGS_KEYWORDS=["กบข","กสจ"];
// หัวข้อที่บอกว่าจบส่วน "รายการเงินหัก" แล้ว — ห้ามอ่านเลยไป (กันนับ กบข. ซ้ำจากตาราง 2 รอบ)
const DED_END_MARKERS=["รายการจ่ายเงินเดือน","ระบบสารสนเทศ","รายการเงินเพิ่ม","รวมเงินหัก"];
const CAT_TAX="ภาษี ณ ที่จ่าย";
const CAT_UTILITY="ค่าสาธารณูปโภค";
const CAT_OTHER="รายการหักประจำเดือน";
function loadExternalScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[data-ext="${src}"]`)) return res();
    const s=document.createElement("script");
    s.src=src; s.dataset.ext=src; s.onload=()=>res(); s.onerror=()=>rej(new Error("โหลดไลบรารีไม่สำเร็จ: "+src));
    document.head.appendChild(s);
  });
}
function slipNum(s){ return Number(String(s).replace(/,/g,"")); }
function classifyDeduction(name){
  const low=name.toLowerCase();
  if(UTILITY_KEYWORDS.some(k=>low.includes(k.toLowerCase()))) return "utility";
  if(SAVINGS_KEYWORDS.some(k=>name.includes(k))) return "savings";
  return "other";
}
function parsePayslip(rawText){
  const text=String(rawText||"").replace(/ /g," ");
  const warnings=[];
  const iAdd=text.indexOf("รายการเงินเพิ่ม");
  const iDed=text.indexOf("รายการเงินหัก");
  const headEnd=iAdd>=0?iAdd:(iDed>=0?iDed:text.length);
  const summary=(text.slice(0,headEnd).match(SLIP_AMOUNT_RE)||[]).map(slipNum);
  let base=null,allowance=null,gross=null,tax=null,deductTotal=null,grandDeduct=null,net=null;
  if(summary.length>=7){ [base,allowance,gross,tax,deductTotal,grandDeduct,net]=summary.slice(-7); }
  else warnings.push(`อ่านแถวสรุปด้านบนไม่ครบ (พบ ${summary.length} ตัวเลข ต้องการ 7)`);
  // ตัดเฉพาะช่วง "รายการเงินหัก" เท่านั้น ไม่ให้เลยไปอ่านตารางท้ายสลิป (เช่น "รายการจ่ายเงินเดือน 2 รอบ")
  let dedText="";
  if(iDed>=0){
    dedText=text.slice(iDed);
    let cut=dedText.length;
    DED_END_MARKERS.forEach(mk=>{ const p=dedText.indexOf(mk,1); if(p>0&&p<cut) cut=p; });
    dedText=dedText.slice(0,cut);
  } else warnings.push('ไม่พบหัวข้อ "รายการเงินหัก" — อาจอ่านไฟล์ไม่ครบ');
  const items=[]; const re=/(\d{8})\s*([\s\S]*?)\s((?:\d{1,3}(?:,\d{3})*)?\.\d{2})(?=\s|$)/g; let m;
  while((m=re.exec(dedText))!==null){
    const name=m[2].replace(/\s+/g," ").trim();
    if(!name) continue;
    if(name.length>60){ warnings.push(`รายการ ${m[1]} อ่านได้ชื่อยาวผิดปกติ อาจอ่านคร่อมส่วนอื่น — โปรดตรวจสอบ`); continue; }
    items.push({id:uid(),code:m[1],name,amount:slipNum(m[3]),bucket:classifyDeduction(name)});
  }
  const r2=n=>Math.round(n*100)/100;
  const sumOf=b=>r2(items.filter(i=>i.bucket===b).reduce((a,i)=>a+i.amount,0));
  const utilities=sumOf("utility"), savings=sumOf("savings"), other=sumOf("other");
  const itemsSum=r2(utilities+savings+other);
  const near=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<0.05;
  const checks=[];
  if(deductTotal!=null) checks.push({label:"ผลรวมรายการหัก = ช่องเงินหัก",ok:near(itemsSum,deductTotal),got:itemsSum,want:deductTotal});
  if(deductTotal!=null&&tax!=null&&grandDeduct!=null) checks.push({label:"เงินหัก + ภาษี = รวมหัก",ok:near(deductTotal+tax,grandDeduct),got:r2(deductTotal+tax),want:grandDeduct});
  if(gross!=null&&grandDeduct!=null&&net!=null) checks.push({label:"รวมรับ − รวมหัก = คงรับ",ok:near(gross-grandDeduct,net),got:r2(gross-grandDeduct),want:net});
  if(base!=null&&allowance!=null&&gross!=null) checks.push({label:"อัตราเงินเดือน + เงินเพิ่ม = รวมรับ",ok:near(base+allowance,gross),got:r2(base+allowance),want:gross});
  return {base,allowance,gross,tax,deductTotal,grandDeduct,net,items,utilities,savings,other,itemsSum,checks,allOk:checks.length>0&&checks.every(c=>c.ok),warnings};
}
async function extractPdfText(file){
  await loadExternalScript(PDFJS_URL);
  const lib=window.pdfjsLib;
  if(!lib) throw new Error("โหลด pdf.js ไม่สำเร็จ");
  lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    let lastY=null,line="";
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      if(lastY!==null&&Math.abs(y-lastY)>3){ out+=line.trim()+"\n"; line=""; }
      line+=it.str+" "; lastY=y;
    });
    out+=line.trim()+"\n";
  }
  return out;
}
async function extractImageText(file,onProgress){
  await loadExternalScript(TESSERACT_URL);
  const T=window.Tesseract;
  if(!T) throw new Error("โหลด Tesseract.js ไม่สำเร็จ");
  const url=URL.createObjectURL(file);
  try{
    const res=await T.recognize(url,"tha+eng",{logger:msg=>{ if(msg.status==="recognizing text"&&onProgress) onProgress(Math.round(msg.progress*100)); }});
    return res.data.text;
  } finally { URL.revokeObjectURL(url); }
}
function SlipImportModal({data,persist,onClose}) {

        text=await extractPdfText(file);
        if(text.replace(/\s/g,"").length<40){
          setBusyMsg("PDF นี้เป็นภาพสแกน กำลังใช้ OCR (โหลดครั้งแรกอาจนาน)...");
          throw new Error("PDF นี้ไม่มีข้อความให้อ่าน (เป็นภาพสแกน) — กรุณาบันทึกเป็นรูปภาพแล้วอัปโหลดใหม่ หรือใช้โหมดวางข้อความ");

      } else {

    const newExp=[];

    pushExp(form.tax,CAT_TAX,"ภาษีหัก ณ ที่จ่ายจากสลิปเงินเดือน");
    pushExp(form.utilities,CAT_UTILITY,(parsed?parsed.items.filter(i=>i.bucket==="utility").map(i=>i.name).join(", "):""));
    pushExp(form.other,CAT_OTHER,(parsed?parsed.items.filter(i=>i.bucket==="other").map(i=>i.name).join(", "):""));

  return (

            </button>
            {showItems&&(
              <div className="slip-items">
                {parsed.items.map(it=>(
                  <div key={it.id} className="slip-item">
                    <span className={`slip-bucket slip-bucket-${it.bucket}`}>{it.bucket==="utility"?"สาธารณูปโภค":it.bucket==="savings"?"ออม":"หักอื่นๆ"}</span>
                    <span className="slip-item-name">{it.name}</span>

                <div className="type-tabs" style={{marginTop:8}}>

                  <button className={`type-btn ${dupChoice==="add"?"active":""}`} onClick={()=>setDupChoice("add")}>เพิ่มเข้าไป</button>
                </div>
