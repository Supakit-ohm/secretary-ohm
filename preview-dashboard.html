<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เลขา Ohm</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0817" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="เลขา Ohm" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="styles.css" />
<script src="config.js"></script>

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>
<script src="https://unpkg.com/recharts@2.15.0/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<div id="driveBar" style="position:fixed;left:0;bottom:96px;width:96px;z-index:45;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Noto Sans Thai',sans-serif;">
  <button id="driveConnectBtn" title="เชื่อมต่อ Google Drive" style="width:44px;height:44px;border-radius:12px;background:#221b38;border:1px solid #3a3155;color:#c9b8f0;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-cloud"></i></button>
  <button id="exportJsonBtn" title="Export JSON (สำรองข้อมูล)" style="width:44px;height:44px;border-radius:12px;background:#221b38;border:1px solid #3a3155;color:#34d399;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-file-export"></i></button>
  <button id="importJsonBtn" title="Import JSON (กู้คืนข้อมูล)" style="width:44px;height:44px;border-radius:12px;background:#221b38;border:1px solid #3a3155;color:#fb923c;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-file-import"></i></button>
  <input id="importJsonFile" type="file" accept="application/json" style="display:none;" />
  <span id="driveStatus" style="font-size:10px;color:#8a82a8;text-align:center;max-width:90px;line-height:1.3;"></span>
</div>
<style>@media(max-width:900px){#driveBar{display:none;}}</style>

<script>
// ================== Export/Import JSON สำรองข้อมูล (plain JS, ทำงานนอก React) ==================
(function () {
  var STORAGE_KEY = "secretary-dashboard-v1";

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function exportJson() {
    var raw = window.localStorage.getItem(STORAGE_KEY) || "{}";
    var blob = new Blob([raw], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "secretary-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- ตรวจโครงสร้างไฟล์ ----------
  function isArr(v) { return Array.isArray(v); }

  function validateShape(obj) {
    var problems = [];
    if (!obj.finance || typeof obj.finance !== "object" || isArr(obj.finance)) {
      problems.push('ไม่พบ key "finance"');
    } else {
      if (!isArr(obj.finance.income)) problems.push('finance.income ไม่ใช่ array');
      if (!isArr(obj.finance.expenses)) problems.push('finance.expenses ไม่ใช่ array');
    }
    if (!isArr(obj.projects)) problems.push('ไม่พบ key "projects" (หรือไม่ใช่ array)');
    if (!isArr(obj.tasks)) problems.push('ไม่พบ key "tasks" (หรือไม่ใช่ array)');
    return problems;
  }

  // ---------- สรุปข้อมูลเพื่อเทียบก่อนเขียนทับ ----------
  var DATE_FIELDS = ["date", "createdAt", "created", "startDate", "dueDate", "due", "month"];

  function pickDate(r) {
    for (var i = 0; i < DATE_FIELDS.length; i++) {
      var v = r && r[DATE_FIELDS[i]];
      if (typeof v === "string" && /^\d{4}-\d{2}/.test(v)) return v.slice(0, 10);
    }
    return null;
  }

  function dateRange(rows) {
    var min = null, max = null;
    (rows || []).forEach(function (r) {
      var d = pickDate(r);
      if (!d) return;
      if (min === null || d < min) min = d;
      if (max === null || d > max) max = d;
    });
    if (!min) return "—";
    return min === max ? min : min + " → " + max;
  }

  function sumAmount(rows) {
    return (rows || []).reduce(function (s, r) { return s + (Number(r && r.amount) || 0); }, 0);
  }

  function fmtBaht(n) {
    return Math.round(n).toLocaleString("en-US") + " ฿";
  }

  function statOf(rows, withSum) {
    var arr = isArr(rows) ? rows : [];
    return { n: arr.length, range: dateRange(arr), sum: withSum ? fmtBaht(sumAmount(arr)) : "" };
  }

  function summarize(obj) {
    var f = (obj && obj.finance) || {};
    return {
      income: statOf(f.income, true),
      expenses: statOf(f.expenses, true),
      investments: statOf(f.investments, true),
      projects: statOf(obj && obj.projects, false),
      tasks: statOf(obj && obj.tasks, false)
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // ---------- หน้ายืนยันก่อนเขียนทับ ----------
  var CMP_ROWS = [
    ["income", "รายรับ", "#34d399"],
    ["expenses", "รายจ่าย", "#fb923c"],
    ["investments", "เงินออม/ลงทุน", "#8b5cf6"],
    ["projects", "โปรเจกต์", "#c9b8f0"],
    ["tasks", "งาน (tasks)", "#c9b8f0"]
  ];

  function cellHtml(st, color) {
    var sub = st.range;
    if (st.sum) sub += "<br>" + st.sum;
    return '<div style="font:600 17px/1.2 \'IBM Plex Mono\',monospace;color:' + color + ';">' + st.n +
      '<span style="font-size:11px;color:#8a82a8;font-weight:400;"> รายการ</span></div>' +
      '<div style="font-size:11px;color:#8a82a8;margin-top:3px;line-height:1.45;">' + sub + "</div>";
  }

  function showImportConfirm(fileName, fileSum, curSum) {
    return new Promise(function (resolve) {
      var rowsHtml = CMP_ROWS.map(function (r) {
        var key = r[0], label = r[1], color = r[2];
        var fSt = fileSum[key], cSt = curSum[key];
        var delta = fSt.n - cSt.n;
        var deltaTxt = delta === 0 ? "เท่าเดิม" : (delta > 0 ? "+" + delta : String(delta));
        var deltaColor = delta === 0 ? "#8a82a8" : (delta > 0 ? "#34d399" : "#f87171");
        return '<tr style="border-top:1px solid #2a2342;">' +
          '<td style="padding:10px 8px;font-size:13px;color:#ece8f8;vertical-align:top;white-space:nowrap;">' + label + "</td>" +
          '<td style="padding:10px 8px;vertical-align:top;">' + cellHtml(fSt, color) + "</td>" +
          '<td style="padding:10px 8px;vertical-align:top;">' + cellHtml(cSt, "#8a82a8") + "</td>" +
          '<td style="padding:10px 8px;vertical-align:top;font:600 13px/1.2 \'IBM Plex Mono\',monospace;color:' + deltaColor + ';white-space:nowrap;">' + deltaTxt + "</td>" +
          "</tr>";
      }).join("");

      var ov = document.createElement("div");
      ov.id = "importConfirmOverlay";
      ov.setAttribute("style", "position:fixed;inset:0;z-index:9999;background:rgba(6,4,14,.82);display:flex;align-items:center;justify-content:center;padding:16px;font-family:'Noto Sans Thai',sans-serif;");
      ov.innerHTML =
        '<div style="background:#140f24;border:1px solid #3a3155;border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:22px;color:#ece8f8;box-shadow:0 24px 70px rgba(0,0,0,.65);">' +
          '<div style="font-size:18px;font-weight:700;margin-bottom:4px;">ยืนยันการนำเข้าข้อมูล</div>' +
          '<div style="font-size:12px;color:#8a82a8;word-break:break-all;margin-bottom:14px;">ไฟล์: ' + esc(fileName) + "</div>" +
          '<div style="background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#fca5a5;margin-bottom:14px;">' +
            "การนำเข้าจะ<b>เขียนทับข้อมูลปัจจุบันทั้งหมด</b> และซิงก์ทับ Google Drive ถ้าเชื่อมต่ออยู่ — <b>กู้คืนไม่ได้</b> แนะนำกดปุ่ม &quot;สำรองก่อน&quot; เก็บไฟล์ของข้อมูลปัจจุบันไว้ก่อน" +
          "</div>" +
          '<table style="width:100%;border-collapse:collapse;">' +
            '<thead><tr style="font-size:11px;color:#8a82a8;text-align:left;">' +
              '<th style="padding:0 8px 6px;font-weight:600;"></th>' +
              '<th style="padding:0 8px 6px;font-weight:600;">ไฟล์ที่จะนำเข้า</th>' +
              '<th style="padding:0 8px 6px;font-weight:600;">ข้อมูลปัจจุบัน</th>' +
              '<th style="padding:0 8px 6px;font-weight:600;">ต่าง</th>' +
            "</tr></thead><tbody>" + rowsHtml + "</tbody></table>" +
          '<div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px;">' +
            '<button id="icBackup" style="padding:10px 16px;border-radius:10px;background:#221b38;border:1px solid #3a3155;color:#34d399;cursor:pointer;font-size:13px;font-family:inherit;">สำรองก่อน</button>' +
            '<button id="icCancel" style="padding:10px 18px;border-radius:10px;background:#221b38;border:1px solid #3a3155;color:#ece8f8;cursor:pointer;font-size:13px;font-family:inherit;">ยกเลิก</button>' +
            '<button id="icOk" style="padding:10px 18px;border-radius:10px;background:#dc2626;border:1px solid #ef4444;color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;">เขียนทับข้อมูลเดิม</button>' +
          "</div>" +
        "</div>";
      document.body.appendChild(ov);

      function close(result) {
        document.removeEventListener("keydown", onKey);
        if (ov.parentNode) ov.parentNode.removeChild(ov);
        resolve(result);
      }
      function onKey(e) { if (e.key === "Escape") close(false); }
      document.addEventListener("keydown", onKey);
      ov.addEventListener("click", function (e) { if (e.target === ov) close(false); });
      ov.querySelector("#icBackup").addEventListener("click", function () { exportJson(); });
      ov.querySelector("#icCancel").addEventListener("click", function () { close(false); });
      ov.querySelector("#icOk").addEventListener("click", function () { close(true); });
    });
  }

  async function importJsonFile(file) {
    var text;
    try {
      text = await file.text();
    } catch (e) {
      alert("อ่านไฟล์ไม่สำเร็จ: " + e.message);
      return;
    }
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      alert("ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง: " + e.message);
      return;
    }
    if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
      alert("โครงสร้างข้อมูลในไฟล์ไม่ถูกต้อง");
      return;
    }
    var problems = validateShape(parsed);
    if (problems.length) {
      alert(
        "ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอปเลขา Ohm — ยกเลิกการนำเข้า\n\nสิ่งที่ตรวจไม่ผ่าน:\n• " +
        problems.join("\n• ") +
        "\n\nไฟล์ที่ถูกต้องต้องมี key finance (income/expenses), projects และ tasks ครบ"
      );
      return;
    }
    var current = {};
    try { current = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "{}") || {}; } catch (e) { current = {}; }
    var ok = await showImportConfirm(file.name || "(ไม่ทราบชื่อไฟล์)", summarize(parsed), summarize(current));
    if (!ok) return;
    var normalized = JSON.stringify(parsed);
    if (window.storage && window.storage.set) {
      try { await window.storage.set(STORAGE_KEY, normalized); }
      catch (e) { window.localStorage.setItem(STORAGE_KEY, normalized); }
    } else {
      window.localStorage.setItem(STORAGE_KEY, normalized);
    }
    alert("นำเข้าข้อมูลสำเร็จ กำลังโหลดหน้าใหม่");
    location.reload();
  }

  document.addEventListener("DOMContentLoaded", function () {
    var exportBtn = document.getElementById("exportJsonBtn");
    var importBtn = document.getElementById("importJsonBtn");
    var fileInput = document.getElementById("importJsonFile");
    if (exportBtn) exportBtn.addEventListener("click", exportJson);
    if (importBtn && fileInput) {
      importBtn.addEventListener("click", function () { fileInput.click(); });
      fileInput.addEventListener("change", function () {
        if (fileInput.files && fileInput.files[0]) importJsonFile(fileInput.files[0]);
        fileInput.value = "";
      });
    }
  });
})();
</script>

<script>
// ================== Google Drive sync (plain JS, ทำงานนอก React) ==================
(function () {
  var STORAGE_KEY = "secretary-dashboard-v1";
  var CACHE_FOLDER_KEY = "secretary-drive-folder-id";
  var CACHE_FILE_KEY = "secretary-drive-file-id";
  var tokenClient = null, accessToken = null;
  var folderId = localStorage.getItem(CACHE_FOLDER_KEY) || null;
  var fileId = localStorage.getItem(CACHE_FILE_KEY) || null;
  var pushTimer = null;

  function setStatus(text, kind) {
    var el = document.getElementById("driveStatus");
    if (el) { el.textContent = text; el.style.color = kind === "err" ? "#fb923c" : "#34d399"; }
  }

  function driveFetch(url, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers, { Authorization: "Bearer " + accessToken });
    return fetch(url, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (!res.ok) return res.text().then(function (body) { throw new Error("Drive API " + res.status + ": " + body.slice(0, 200)); });
      return res;
    });
  }

  function ensureFolder() {
    if (folderId) return Promise.resolve(folderId);
    var name = window.APP_CONFIG.DRIVE_FOLDER_NAME;
    var query = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='" + name + "' and trashed=false");
    return driveFetch("https://www.googleapis.com/drive/v3/files?q=" + query + "&fields=files(id,name)&spaces=drive")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.files && data.files.length) { folderId = data.files[0].id; return folderId; }
        return driveFetch("https://www.googleapis.com/drive/v3/files", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, mimeType: "application/vnd.google-apps.folder" })
        }).then(function (r) { return r.json(); }).then(function (data2) { folderId = data2.id; return folderId; });
      })
      .then(function (id) { localStorage.setItem(CACHE_FOLDER_KEY, id); return id; });
  }

  function ensureFile() {
    if (fileId) return Promise.resolve(fileId);
    var name = window.APP_CONFIG.DATA_FILE_NAME;
    var query = encodeURIComponent("name='" + name + "' and '" + folderId + "' in parents and trashed=false");
    return driveFetch("https://www.googleapis.com/drive/v3/files?q=" + query + "&fields=files(id,name)&spaces=drive")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.files && data.files.length) { fileId = data.files[0].id; return { id: fileId, isNew: false }; }
        var boundary = "secretaryohmboundary";
        var metadata = { name: name, parents: [folderId], mimeType: "application/json" };
        var initialContent = localStorage.getItem(STORAGE_KEY) || "{}";
        var body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) +
          "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + initialContent + "\r\n--" + boundary + "--";
        return driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
          method: "POST",
          headers: { "Content-Type": "multipart/related; boundary=" + boundary },
          body: body
        }).then(function (r) { return r.json(); }).then(function (data2) { fileId = data2.id; return { id: fileId, isNew: true }; });
      })
      .then(function (result) { localStorage.setItem(CACHE_FILE_KEY, result.id); return result; });
  }

  function pullFromDrive() {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media")
      .then(function (r) { return r.text(); });
  }

  function pushToDrive(jsonText) {
    return driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: jsonText
    });
  }

  function schedulePush(jsonText) {
    setStatus("กำลังบันทึกขึ้น Drive…");
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      pushToDrive(jsonText).then(function () { setStatus("ซิงก์กับ Drive แล้ว ✓"); })
        .catch(function (e) { console.error(e); setStatus("บันทึก Drive ไม่สำเร็จ", "err"); });
    }, 1200);
  }

  function afterSignedIn() {
    var connectBtn = document.getElementById("driveConnectBtn");
    connectBtn.title = "เชื่อมต่อ Drive แล้ว ✓";
    connectBtn.style.color = "#34d399";
    connectBtn.style.borderColor = "#34d399";
    connectBtn.disabled = true;
    setStatus("กำลังตรวจสอบข้อมูล…");
    ensureFolder().then(ensureFile).then(function (result) {
      if (result.isNew) {
        // ไฟล์ใหม่ ยังไม่มีข้อมูลบน Drive -> อัปโหลดข้อมูลในเครื่องนี้ขึ้นไปตั้งต้น
        setStatus("ซิงก์กับ Drive แล้ว ✓");
        return;
      }
      return pullFromDrive().then(function (remoteText) {
        var localText = localStorage.getItem(STORAGE_KEY) || "{}";
        if (remoteText && remoteText.trim() && remoteText !== localText) {
          var useRemote = window.confirm(
            "พบข้อมูลอยู่บน Google Drive แล้ว (อาจมาจากเครื่องอื่น)\n\nกด OK เพื่อดึงข้อมูลจาก Drive มาใช้ในเครื่องนี้ (ข้อมูลในเครื่องนี้จะถูกแทนที่)\nกด Cancel เพื่อเก็บข้อมูลในเครื่องนี้ไว้ และอัปโหลดทับขึ้น Drive แทน"
          );
          if (useRemote) {
            localStorage.setItem(STORAGE_KEY, remoteText);
            setStatus("ดึงข้อมูลจาก Drive แล้ว — กำลังโหลดหน้าใหม่…");
            location.reload();
          } else {
            pushToDrive(localText).then(function () { setStatus("อัปโหลดทับ Drive แล้ว ✓"); });
          }
        } else {
          setStatus("ซิงก์กับ Drive แล้ว ✓");
        }
      });
    }).catch(function (e) {
      console.error(e);
      setStatus("เชื่อมต่อ Drive ไม่สำเร็จ", "err");
    });
  }

  function initGoogleIdentity() {
    var config = window.APP_CONFIG;
    if (!config || !config.CLIENT_ID || config.CLIENT_ID.indexOf("YOUR_") === 0) {
      document.getElementById("driveConnectBtn").style.display = "none";
      return;
    }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setTimeout(initGoogleIdentity, 300);
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: config.CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function (response) {
        if (response.error) { setStatus("เชื่อมต่อไม่สำเร็จ", "err"); return; }
        accessToken = response.access_token;
        afterSignedIn();
      }
    });
  }

  document.getElementById("driveConnectBtn").addEventListener("click", function () {
    if (!tokenClient) { alert("ยังไม่พร้อมเชื่อมต่อ Google — รอสักครู่แล้วลองใหม่"); return; }
    tokenClient.requestAccessToken({ prompt: "consent" });
  });

  window.DriveSync = {
    isSignedIn: function () { return !!accessToken; },
    schedulePush: schedulePush
  };

  initGoogleIdentity();
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell, LineChart, Line, AreaChart, Area, ReferenceLine } = Recharts;

// ---- placeholder icons (Font Awesome) ใช้แทน lucide-react เฉพาะไฟล์พรีวิวนี้ ----
function makeIcon(cls) {
  return function Icon({ size = 24, style, ...rest }) {
    return <i className={`fa-solid ${cls}`} style={{ fontSize: size, lineHeight: 1, ...style }} {...rest} />;

const FIXED_HINTS=["ผ่อน","ภาษี","สาธารณูปโภค","ประกัน","ค่าเช่า","รายการหักประจำเดือน","ค่าน้ำ","ค่าไฟ","อินเทอร์เน็ต","ค่าเน็ต","ค่าโทร","ค่าเทอม"];
function guessCategoryType(cat){ return FIXED_HINTS.some(k=>String(cat).includes(k))?"fixed":"variable"; }
function getBudget(data,cat){
  const b=(data.budgets||{})[cat];

}
// 0 = เกินงบ, 1 = ยังอยู่ในงบ, 2 = ยังไม่ตั้งงบ
function budgetRank(r){
  if(r.budget>0&&r.total>r.budget) return 0;
  if(r.budget>0) return 1;
  return 2;
}
const BUDGET_GROUP_LABEL=["🔴 เกินงบ — เรียงจากเกินมากสุด","🟢 ยังอยู่ในงบ — เรียงจากใกล้เต็มงบสุด","⚪ ยังไม่ตั้งงบ"];
function compareByBudgetStatus(a,b){
  const ra=budgetRank(a), rb=budgetRank(b);
  if(ra!==rb) return ra-rb;
  if(ra===0) return (b.total-b.budget)-(a.total-a.budget); // เกินเป็นจำนวนเงินมากสุดก่อน
  if(ra===1) return (b.total/b.budget)-(a.total/a.budget); // ใช้ไปคิดเป็น % สูงสุดก่อน (ใกล้เต็มงบ)
  return b.total-a.total;                                   // ไม่มีงบ: ใช้มากสุดก่อน
}
function monthsBefore(monthKey,n){
  const out=[]; const [y,m]=monthKey.split("-").map(Number);
  for(let i=1;i<=n;i++){ const d=new Date(y,m-1-i,1); out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); }

}
function buildMonthReview(data,monthKey){
  const expAll=data.finance.expenses||[];
  const exp=expAll.filter(e=>monthYearKey(e.date)===monthKey);
  const inc=(data.finance.income||[]).filter(i=>(i.month||monthYearKey(i.date))===monthKey);
  const inv=(data.finance.investments||[]).filter(v=>monthYearKey(v.date)===monthKey);
  const totalIncome=inc.reduce((a,i)=>a+i.amount,0);
  const totalExpense=exp.reduce((a,e)=>a+expOut(e),0);
  const totalSaved=inv.reduce((a,v)=>a+v.amount,0);
  const leftover=totalIncome-totalExpense-totalSaved;
  const savingRate=totalIncome>0?((totalSaved+Math.max(0,leftover))/totalIncome)*100:0;
  const byCat={};
  exp.forEach(e=>{
    if(!byCat[e.category]) byCat[e.category]={cat:e.category,total:0,items:[]};
    byCat[e.category].total+=expOut(e);
    byCat[e.category].items.push(e);
  });
  const prev3=monthsBefore(monthKey,3);
  const rows=Object.values(byCat).map(r=>{
    const b=getBudget(data,r.cat);
    const hist=prev3.map(m=>expAll.filter(e=>e.category===r.cat&&monthYearKey(e.date)===m).reduce((a,e)=>a+expOut(e),0));
    const seen=hist.filter((v,i)=>expAll.some(e=>e.category===r.cat&&monthYearKey(e.date)===prev3[i]));
    const avg=seen.length?seen.reduce((a,v)=>a+v,0)/seen.length:null;
    return {...r,budget:b.amount,type:b.type,avg,
      diff:b.amount>0?r.total-b.amount:null,
      pct:b.amount>0?(r.total/b.amount)*100:null};
  }).sort((a,b)=>b.total-a.total);
  const variable=rows.filter(r=>r.type==="variable").sort(compareByBudgetStatus);
  const fixed=rows.filter(r=>r.type==="fixed").sort(compareByBudgetStatus);
  const sum=a=>a.reduce((x,r)=>x+r.total,0);
  const budgeted=rows.filter(r=>r.budget>0);
  const totalBudget=budgeted.reduce((a,r)=>a+r.budget,0);
  const totalVsBudget=budgeted.reduce((a,r)=>a+r.total,0);

function detectAnomalies(data,monthKey,review){
  const out=[];
  const expAll=data.finance.expenses||[];
  const prior=expAll.filter(e=>monthYearKey(e.date)<monthKey);
  const priorCats=new Set(prior.map(e=>e.category));
  const median=(arr)=>{ if(!arr.length) return null; const s=arr.slice().sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  review.rows.forEach(r=>{
    const overBudget=r.budget>0&&r.total>r.budget*1.2;
    if(overBudget)
      out.push({key:"over-"+r.cat,level:"bad",icon:"⚠️",title:`${r.cat} เกินงบ ${Math.round(((r.total-r.budget)/r.budget)*100)}%`,
        detail:`ใช้ ฿${Math.round(r.total).toLocaleString()} จากงบ ฿${r.budget.toLocaleString()} (เกิน ฿${Math.round(r.total-r.budget).toLocaleString()})`,cat:r.cat});
    if(prior.length>0&&!priorCats.has(r.cat))
      out.push({key:"new-"+r.cat,level:"info",icon:"🆕",title:`หมวดใหม่: ${r.cat}`,
        detail:`เพิ่งเริ่มมีค่าใช้จ่ายหมวดนี้เดือนนี้ รวม ฿${Math.round(r.total).toLocaleString()}`,cat:r.cat});
    // ไม่เตือนซ้ำ: ถ้าเกินงบอยู่แล้วก็ไม่ต้องบอกว่าพุ่งขึ้นอีก เพราะสื่อความหมายเดียวกัน
    else if(!overBudget&&r.avg!=null&&r.avg>0&&r.total>=r.avg*1.6&&r.total-r.avg>=800)
      out.push({key:"spike-"+r.cat,level:"warn",icon:"📈",title:`${r.cat} พุ่งขึ้น ${Math.round(((r.total-r.avg)/r.avg)*100)}%`,
        detail:`เดือนนี้ ฿${Math.round(r.total).toLocaleString()} เทียบค่าเฉลี่ย 3 เดือนก่อน ฿${Math.round(r.avg).toLocaleString()}`,cat:r.cat});
    // ก้อนใหญ่ผิดปกติ = ใหญ่กว่ารายการอื่นในหมวดเดียวกันอย่างน้อย 3 เท่า (ไม่ใช่แค่สัดส่วนสูง)
    if(r.items.length>1){
      r.items.forEach(e=>{
        const amt=expOut(e);
        if(amt<1000) return;
        const others=r.items.filter(x=>x.id!==e.id).map(x=>expOut(x)).filter(v=>v>0);
        const med=median(others);
        if(med!=null&&med>0&&amt>=med*3)
          out.push({key:"big-"+e.id,level:"warn",icon:"💥",title:`รายการก้อนใหญ่ผิดปกติใน ${r.cat}`,
            detail:`${e.date} · ${e.memo||"ไม่มีโน้ต"} · ฿${amt.toLocaleString()} — ใหญ่กว่ารายการอื่นในหมวดนี้ราว ${Math.round(amt/med)} เท่า`,cat:r.cat});
      });
    }
  });
  const order={bad:0,warn:1,info:2};
  return out.sort((a,b)=>order[a.level]-order[b.level]);
}

function relativeTime(iso) {
  if(!iso) return "";
  const then=new Date(iso), now=new Date();
  const diffMin=Math.round((now-then)/60000);
  const hhmm=then.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  if(diffMin<1) return "เมื่อสักครู่";
  if(diffMin<60) return `${diffMin} นาทีที่แล้ว`;
  if(isoDate(then)===todayISO()) return `วันนี้ ${hhmm}`;
  const y=new Date(); y.setDate(y.getDate()-1);
  if(isoDate(then)===isoDate(y)) return `เมื่อวาน ${hhmm}`;
  return `${then.toLocaleDateString("th-TH",{day:"numeric",month:"short"})} ${hhmm}`;
}

function applyResets(data) {
  let changed=false; const next={...data};
  const cleanedDaily=next.todos.daily.filter(t=>!t.date||t.date>=todayISO());
  if (cleanedDaily.length!==next.todos.daily.length){next.todos={...next.todos,daily:cleanedDaily};changed=true;}
  const markers=next.resetMarkers||{weekStart:mondayISO(new Date()),month:currentMonthKey()};
  const thisWeek=mondayISO(new Date()); const thisMonth=currentMonthKey();
  let nm=markers;
  if (markers.weekStart!==thisWeek){next.todos={...next.todos,weekly:[]};nm={...nm,weekStart:thisWeek};changed=true;}
  if (markers.month!==thisMonth){next.todos={...next.todos,monthly:[]};nm={...nm,month:thisMonth};changed=true;}
  if (nm!==markers) next.resetMarkers=nm;
  return {data:next,changed};
}

function CalendarModal({events,onClose,onEditEvent,onDeleteEvent}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [detail,setDetail]=useState(null);
  const prevMonth=()=>{ if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth=()=>{ if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  const startOffset=firstDay===0?6:firstDay-1;
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  const monthStr=`${year}-${pad(month+1)}`;
  const eventsThisMonth=events.filter(e=>e.startDate&&e.startDate.startsWith(monthStr));
  function eventsOnDay(d){const iso=`${year}-${pad(month+1)}-${pad(d)}`;return eventsThisMonth.filter(e=>e.startDate===iso||(e.endDate&&e.endDate>=iso&&e.startDate<=iso));}
  const monthLabel=new Date(year,month,1).toLocaleDateString("th-TH",{month:"long",year:"numeric",calendar:"buddhist"});
  const dayNames=["จ","อ","พ","พฤ","ศ","ส","อา"];
  const today=todayISO();
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal cal-modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="cal-nav"><button className="cal-nav-btn" onClick={prevMonth}><ChevronLeft size={27}/></button><span className="cal-month-label">{monthLabel}</span><button className="cal-nav-btn" onClick={nextMonth}><ChevronRightIcon size={27}/></button></div>
          <button className="modal-close" onClick={onClose}><X size={27}/></button>
        </div>
        {!detail?(
          <>
            <div className="cal-grid-head">{dayNames.map(d=><div key={d} className="cal-day-name">{d}</div>)}</div>
            <div className="cal-grid">
              {cells.map((d,i)=>{
                if(!d) return <div key={`blank-${i}`} className="cal-cell empty-cell"/>;
                const iso=`${year}-${pad(month+1)}-${pad(d)}`;
                const evs=eventsOnDay(d);
                return (
                  <div key={iso} className={`cal-cell ${iso===today?"cal-today":""}`} onClick={()=>evs.length&&setDetail({date:iso,evs})}>
                    <span className="cal-d">{d}</span>
                    {evs.slice(0,2).map(e=><div key={e.id} className="cal-dot-label">{e.title}</div>)}
                    {evs.length>2&&<div className="cal-more">+{evs.length-2}</div>}
                  </div>
                );
              })}
            </div>
            <div className="cal-upcoming-list">
              <div className="cal-sec-title">งานที่กำลังจะมาถึง</div>
              {events.filter(e=>e.startDate>=todayISO()).sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,6).map(e=>(
                <div key={e.id} className="cal-ev-row">
                  <span className="cal-ev-date">{thaiDate(e.startDate)}{e.startTime?` ${e.startTime}`:""}</span>
                  <span className="cal-ev-title">{e.title}</span>
                  <button className="del-btn" onClick={()=>onDeleteEvent(e.id)}><Trash2 size={20}/></button>
                </div>
              ))}
              {events.filter(e=>e.startDate>=todayISO()).length===0&&<div className="empty">ไม่มีงานในอนาคต</div>}
            </div>
          </>
        ):(
          <div className="cal-detail">
            <button className="back-btn" onClick={()=>setDetail(null)}><ChevronLeft size={24}/> กลับ</button>
            <div className="cal-detail-date">{thaiDate(detail.date)}</div>
            {detail.evs.map(e=>(
              <div key={e.id} className="cal-detail-card">
                <div className="cal-detail-title">{e.title}</div>
                <div className="cal-detail-meta">{e.startTime&&<span>⏰ {e.startTime}{e.endTime?` – ${e.endTime}`:""}</span>}{e.endDate&&e.endDate!==e.startDate&&<span> ถึง {thaiDate(e.endDate)}</span>}</div>
                {e.note&&<div className="cal-detail-note">{e.note}</div>}
                <div className="cal-detail-actions">
                  <button className="modal-btn-cancel" onClick={()=>{onEditEvent(e);setDetail(null);}}>แก้ไข</button>
                  <button className="del-txt-btn" onClick={()=>{onDeleteEvent(e.id);setDetail(d=>({...d,evs:d.evs.filter(x=>x.id!==e.id)}));}}>ลบ</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

  return (
    <text x={x} y={y} fill={fill} textAnchor={anchor} dominantBaseline="central" style={{fontSize:14,fontFamily:"'Noto Sans Thai',sans-serif",fontWeight:600}}>
      {name} {(percent*100).toFixed(1)}%
    </text>
  );

}
function FinanceOverviewTab({finance,persist}) {

  const incomeByMonth={};
  income.forEach(inc=>{ const m=inc.month||monthYearKey(inc.date); incomeByMonth[m]=(incomeByMonth[m]||0)+inc.amount; });
  const expensesByMonth={};
  expenses.forEach(exp=>{ const m=monthYearKey(exp.date); expensesByMonth[m]=(expensesByMonth[m]||0)+expOut(exp); });
  const validMonthSet=new Set([...Object.keys(incomeByMonth),...Object.keys(expensesByMonth)].filter(m=>/^\d{4}-\d{2}$/.test(m)));
  const monthOptions=[...validMonthSet].sort().reverse();
  const yearOptions=[...new Set(monthOptions.map(m=>m.slice(0,4)))].sort().reverse();
  const defaultMonth=monthOptions.length>0?monthOptions[0]:currentMonthKey();
  const defaultYear=yearOptions.length>0?Number(yearOptions[0]):new Date().getFullYear();
  const [selectedMonth,setSelectedMonth]=useState(defaultMonth);
  const [selectedYear,setSelectedYear]=useState(defaultYear);
  const inRange=(dateStr)=>{
    const m=monthYearKey(dateStr);
    return viewMode==="month" ? m===selectedMonth : m.startsWith(String(selectedYear));
  };
  const incomeInRange=income.filter(i=>inRange(i.month?`${i.month}-01`:i.date));
  const expensesInRange=expenses.filter(e=>inRange(e.date));
  const totalIncome=incomeInRange.reduce((a,i)=>a+i.amount,0);
  const totalExpense=expensesInRange.reduce((a,e)=>a+expOut(e),0);
  const netIncome=totalIncome-totalExpense;
  const bySource={};
  incomeInRange.forEach(i=>{ bySource[i.source]=(bySource[i.source]||0)+i.amount; });
  const incomePie=Object.entries(bySource).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
  const byCategory={};
  expensesInRange.forEach(e=>{ byCategory[e.category]=(byCategory[e.category]||0)+expOut(e); });
  const expensePie=Object.entries(byCategory).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
  const rangeLabel=viewMode==="month"
    ? (monthOptions.includes(selectedMonth)?new Date(`${selectedMonth}-01`).toLocaleDateString("en-US",{month:"long",year:"numeric"}):"Select month")

  return (

            <button className={`fin-filter-btn ${viewMode==="month"?"active":""}`} onClick={()=>setViewMode("month")}>Month</button>
            <button className={`fin-filter-btn ${viewMode==="year"?"active":""}`} onClick={()=>setViewMode("year")}>Year</button>
          </div>
        </div>
        {viewMode==="month"&&(
          <div className="fin-filter-group">
            <label style={{fontSize:17,color:"#a29bc4",marginBottom:4,display:"block"}}>Month</label>
            <select value={selectedMonth} onChange={(e)=>setSelectedMonth(e.target.value)} style={{background:"#191330",border:"1px solid #3a3155",borderRadius:8,color:"#f2eefc",padding:"6px 10px",fontFamily:"'Noto Sans Thai',sans-serif",fontSize:20,cursor:"pointer"}}>
              {monthOptions.map(m=>(<option key={m} value={m}>{new Date(`${m}-01`).toLocaleDateString("en-US",{month:"long",year:"numeric"})}</option>))}
            </select>
          </div>
        )}
        {viewMode==="year"&&(
          <div className="fin-filter-group">
            <label style={{fontSize:17,color:"#a29bc4",marginBottom:4,display:"block"}}>Year</label>
            <select value={selectedYear} onChange={(e)=>setSelectedYear(Number(e.target.value))} style={{background:"#191330",border:"1px solid #3a3155",borderRadius:8,color:"#f2eefc",padding:"6px 10px",fontFamily:"'Noto Sans Thai',sans-serif",fontSize:20,cursor:"pointer"}}>
              {yearOptions.map(y=>(<option key={y} value={y}>{y}</option>))}

      <div className="fin-stat-row">

          <div className="fin-stat-icon income"><TrendingUp size={24}/></div>

}
function FinanceIncomeTab({finance,persist}) {
  const incomeByMonth={};

  const [showSlip,setShowSlip]=useState(false);

  const addIncome=()=>{
    const amt=Number(incAmount);
    if(!incSource.trim()||!amt||amt<=0||!incDate) return;
    persist({
      ...finance,
      finance:{
        ...finance.finance,
        income:[...finance.finance.income,{id:uid(),date:incDate,month:monthYearKey(incDate),amount:amt,source:incSource.trim(),note:incNote.trim()}]
      }
    });
    setIncAmount("");setIncNote("");setIncSource("เงินเดือน");

  const removeSelectedIncome=()=>{
    if(selectedIds.size===0) return;
    persist({

  (finance.finance.income||[]).forEach(inc=>{

  const allSelected=sortedIncome.length>0&&sortedIncome.every(i=>selectedIds.has(i.id));

            <div style={{background:"#191330",height:4,borderRadius:2,overflow:"hidden"}}>
              <div style={{height:"100%",background:COLORS[i%COLORS.length],width:`${(total/(Math.max(...sortedSourcesAll.map(x=>x[1]))||1))*100}%`}}/>
            </div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-head" style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <span>All Income</span>
          {selectedIds.size>0&&(
            <button className="del-selected-btn" onClick={removeSelectedIncome}>

        <TxnFilterBar months={listMonths} cats={listCats} catLabel="sources" fMonth={fMonth} setFMonth={setFMonth} fCat={fCat} setFCat={setFCat}

          shown={sortedIncome.length} total={allIncome.length} onReset={()=>{setFMonth("all");setFCat("all");setFSrc("all");}}/>
        {allIncome.length===0&&<div className="empty">ยังไม่มีรายการ</div>}
        {allIncome.length>0&&sortedIncome.length===0&&<div className="empty">ไม่พบรายการตามตัวกรองนี้</div>}
        {sortedIncome.length>0&&(
          <>
          <div className="txn-filter-total">รวม <b style={{color:"#34d399"}}>+฿{sortedIncome.reduce((a,i)=>a+i.amount,0).toLocaleString()}</b></div>
          <div className="exp-table-wrap">
            <table className="exp-table">
              <thead>
                <tr>
                  <th className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={allSelected} ref={el=>{if(el) el.indeterminate=someSelected;}} onChange={toggleSelectAll}/></th>
                  <th>Date</th>

                  <th className="exp-col-amount">Amount</th>
                  <th>Note</th>
                  <th className="exp-col-actions"></th>
                </tr>
              </thead>
              <tbody>
                {sortedIncome.map(inc=>(
                  <tr key={inc.id} className={selectedIds.has(inc.id)?"row-selected":""}>
                    <td className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={selectedIds.has(inc.id)} onChange={()=>toggleSelectId(inc.id)}/></td>
                    <td className="exp-col-date">{inc.date}</td>

        )}
        {editRow&&<TxnEditModal kind="income" initial={editRow} options={listCats} onClose={()=>setEditRow(null)} onSave={saveEdit}/>}
      </div>
    </div>
  );

/* ── รีวิวแถว Deposit จาก CSV ก่อนบันทึก ──
   CSV ของธนาคารมีแถว Type=Deposit ปนกัน 3 แบบ: โอนย้ายบัญชีตัวเอง (ข้าม),
   เพื่อนโอนคืนเงิน (หักออกจากหมวดรายจ่าย), และรายรับจริง (ลง income) */
const REFUND_MAP_KEY="secretary-refund-cat-map";
function loadRefundMap(){ try{ return JSON.parse(localStorage.getItem(REFUND_MAP_KEY)||"{}"); }catch(err){ return {}; } }
function rememberRefundCat(rows,cat){
  try{
    const m=loadRefundMap();
    rows.forEach(r=>{ const k=(r.note||"").trim(); if(k) m[k]=cat; });
    localStorage.setItem(REFUND_MAP_KEY,JSON.stringify(m));
  }catch(err){}
}
function DepositReviewModal({rows,catOptions,srcOptions,onClose,onApply}){
  const [remaining,setRemaining]=useState(()=>rows.slice().sort((a,b)=>b.amount-a.amount));
  const [picked,setPicked]=useState(()=>new Set());
  const [mode,setMode]=useState("skip");
  const [cat,setCat]=useState(catOptions[0]||"อื่นๆ");
  const [src,setSrc]=useState(srcOptions[0]||"อื่นๆ");
  const [doneCount,setDoneCount]=useState(0);
  const allSelected=remaining.length>0&&remaining.every(r=>picked.has(r.id));
  const someSelected=remaining.some(r=>picked.has(r.id))&&!allSelected;
  const toggleId=(id)=>setPicked(prev=>{
    const next=new Set(prev);
    if(next.has(id)) next.delete(id);
    else{
      next.add(id);
      // bonus: จำหมวดที่เคยเลือกไว้ตามชื่อผู้โอน แล้ว pre-select ให้ (ยังต้องกดยืนยันเอง)
      const row=remaining.find(r=>r.id===id);
      const remembered=row&&loadRefundMap()[(row.note||"").trim()];
      if(remembered&&catOptions.includes(remembered)) setCat(remembered);
    }
    return next;
  });
  const toggleAll=()=>setPicked(allSelected?new Set():new Set(remaining.map(r=>r.id)));
  const pickedRows=remaining.filter(r=>picked.has(r.id));
  const pickedTotal=pickedRows.reduce((a,r)=>a+r.amount,0);
  const apply=()=>{
    if(pickedRows.length===0) return;
    if(mode!=="skip") onApply(pickedRows,mode,mode==="refund"?cat:src);
    if(mode==="refund") rememberRefundCat(pickedRows,cat);
    setRemaining(remaining.filter(r=>!picked.has(r.id)));
    setDoneCount(d=>d+pickedRows.length);
    setPicked(new Set());
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:720}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <span>รีวิวรายการเงินเข้า (Deposit) {rows.length} รายการ</span>
          <button className="modal-close" onClick={onClose}><X size={27}/></button>
        </div>
        <div className="modal-body">
          <div style={{fontSize:17,color:"#a29bc4",marginBottom:10}}>
            เลือกแถวที่ต้องการ แล้วเลือกวิธีจัดการด้านล่าง — แถวที่ไม่ทำอะไรจะถูก<b>ข้าม</b>ทั้งหมด (ปลอดภัยสุด)
            {doneCount>0&&<span style={{color:"#34d399"}}> · บันทึกแล้ว {doneCount} รายการ</span>}
          </div>
          {remaining.length===0&&<div className="empty">จัดการครบทุกรายการแล้ว</div>}
          {remaining.length>0&&(
            <div className="exp-table-wrap" style={{maxHeight:320,overflowY:"auto"}}>
              <table className="exp-table">
                <thead>
                  <tr>

        </div>

    </div>
  );
}
/* ── ประเภทสินทรัพย์ของ finance.investments (เฟส 1 ของแผนยกเครื่องหน้า Investments) ── */
const INVEST_TYPES=[

const INVEST_TYPE_LABELS=INVEST_TYPES.reduce((m,t)=>{m[t.key]=t.label;return m;},{});
// เฟส 4: สีประจำประเภทสินทรัพย์ ใช้ในแถบสัดส่วน/ตารางภาพรวม
const INVEST_TYPE_COLORS={retirement:"#8b5cf6",insurance:"#60a5fa",gold:"#fbbf24",crypto:"#f472b6",stock:"#34d399",fund:"#38bdf8",other:"#8a82a8"};
const INVEST_CSV_CATEGORY="ออม ลงทุน"; // category ใน CSV ของ Make by KBank ที่หมายถึงการโอนไปลงทุน (สะกดแบบนี้เป๊ะ)

/* รีวิวแถว "ออม ลงทุน" จาก CSV — ให้ผู้ใช้เลือกประเภทสินทรัพย์เองเสมอ (ห้าม auto 100%)

            {doneCount>0&&<span style={{color:"#34d399"}}> · บันทึกแล้ว {doneCount} รายการ</span>}

/* ═══ แยกรายจ่าย 1 รายการออกเป็นหลายหมวด (split transaction) ═══
   วิธีเก็บ: แตกเป็นรายการจริงหลายแถวใน finance.expenses แล้วลบแถวเดิมทิ้ง (ไม่ใช่ nested object)
   เพื่อให้ทุกจุดที่รวมยอด/กราฟ/งบ ใช้งานได้ทันทีโดยไม่ต้องแก้ตรรกะที่ไหนเลย
   trace ย้อนกลับได้ด้วย splitFrom (id เดิม) + splitGroup (จับกลุ่มแถวที่มาจากรายการเดียวกัน)
   กฎเดิมยังอยู่: ทุกแถวที่แตกออกมา amount ติดลบเสมอ และผลรวมต้องเท่ายอดเดิมเป๊ะ */
function SplitExpenseModal({row,catOptions,onClose,onApply}) {
  const orig=Math.abs(Number(row.amount)||0);
  const [parts,setParts]=useState(()=>[
    {k:uid(),cat:row.category||"",amount:""},
    {k:uid(),cat:"",amount:""},
  ]);
  const [newCatFor,setNewCatFor]=useState({});
  const n=(v)=>{ const x=Number(v); return isFinite(x)?x:0; };
  const catOf=(p)=>(newCatFor[p.k]!=null?newCatFor[p.k]:p.cat).trim();
  const sum=parts.reduce((a,p)=>a+n(p.amount),0);
  const left=Math.round((orig-sum)*100)/100;
  const setPart=(k,patch)=>setParts(ps=>ps.map(p=>p.k===k?{...p,...patch}:p));
  const addPart=()=>setParts(ps=>[...ps,{k:uid(),cat:"",amount:""}]);
  const removePart=(k)=>setParts(ps=>ps.length<=2?ps:ps.filter(p=>p.k!==k));
  // เติมส่วนต่างให้แถวนี้ — clamp ไม่ให้ติดลบ (กรณีแถวอื่นกรอกเกินยอดเดิมไปแล้ว)
  const fillRest=(k)=>setPart(k,{amount:String(Math.max(0,Math.round((n(parts.find(p=>p.k===k).amount)+left)*100)/100))});
  const ready=Math.abs(left)<0.01&&parts.every(p=>catOf(p)&&n(p.amount)>0);
  const apply=()=>{
    if(!ready) return;
    const group=uid();
    onApply(parts.map((p,i)=>({
      id:uid(),date:row.date,
      amount:-Math.abs(n(p.amount)),          // กฎเดิม: expenses ติดลบเสมอ
      category:catOf(p),
      memo:`${row.memo||"แยกรายการ"} (แยก ${i+1}/${parts.length})`,
      source:row.source||"manual",importSource:row.importSource,
      // ถ้ารายการเดิมเคยยืนยันจับคู่หนี้ไปแล้ว ให้แถวย่อยสืบทอดไปด้วย ไม่งั้นจะกลับมาโผล่ในรายการรอยืนยันอีก
      ...(row.linkedDebtId?{linkedDebtId:row.linkedDebtId}:{}),
      splitFrom:row.id,splitGroup:group,
    })));
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>✂️ แยกรายการเป็นหลายหมวด</span><button className="modal-close" onClick={onClose}><X size={27}/></button></div>
        <div className="modal-body">
          <div className="recat-hint">
            {row.date} · {row.memo||"(ไม่มีโน้ต)"} · ยอดเดิม <b style={{color:"#fb923c"}}>฿{orig.toLocaleString()}</b> (หมวด {row.category||"—"})
            <br/>รายการเดิมจะถูกแทนที่ด้วยแถวย่อยด้านล่าง — ผลรวมต้องเท่ายอดเดิมพอดี
          </div>
          {parts.map((p,i)=>(
            <div key={p.k} style={{display:"flex",gap:8,alignItems:"flex-end",marginTop:10,flexWrap:"wrap"}}>
              <div style={{flex:2,minWidth:150}}>
                <label className="field-label">หมวดที่ {i+1}</label>
                {newCatFor[p.k]!=null?(
                  <input className="modal-input" autoFocus placeholder="พิมพ์หมวดใหม่" value={newCatFor[p.k]}
                    onChange={e=>setNewCatFor(m=>({...m,[p.k]:e.target.value}))}/>
                ):(
                  <select className="modal-input" value={p.cat} onChange={e=>{
                    if(e.target.value==="__new__"){ setNewCatFor(m=>({...m,[p.k]:""})); return; }
                    setPart(p.k,{cat:e.target.value});
                  }}>
                    <option value="">— เลือกหมวด —</option>
                    {catOptions.map(c=><option key={c} value={c}>{c}</option>)}
                    <option value="__new__">+ หมวดใหม่…</option>
                  </select>
                )}
              </div>
              <div style={{flex:1,minWidth:110}}>
                <label className="field-label">จำนวนเงิน</label>
                <input type="number" className="modal-input" inputMode="decimal" placeholder="0" style={{textAlign:"right"}}
                  value={p.amount} onChange={e=>setPart(p.k,{amount:e.target.value})}/>
              </div>
              <button className="del-btn" title="ใส่ยอดที่เหลือทั้งหมด" disabled={Math.abs(left)<0.01} onClick={()=>fillRest(p.k)}><ArrowLeft size={17}/></button>
              <button className="del-btn" title="ลบแถว" disabled={parts.length<=2} onClick={()=>removePart(p.k)}><Trash2 size={18}/></button>
            </div>
          ))}
          <button className="text-btn" style={{marginTop:10}} onClick={addPart}><Plus size={15}/> เพิ่มหมวด</button>
          <div className="recat-action" style={{marginTop:12}}>
            <div style={{fontSize:17,color:Math.abs(left)<0.01?"#34d399":"#fbbf24"}}>
              รวม ฿{Math.round(sum).toLocaleString()} / ฿{orig.toLocaleString()} · {Math.abs(left)<0.01?"ครบพอดี":(left>0?`ยังเหลือ ฿${left.toLocaleString()}`:`เกินมา ฿${Math.abs(left).toLocaleString()}`)}
            </div>
            <button className="modal-btn-save" style={{marginTop:10,width:"100%"}} disabled={!ready} onClick={apply}>
              แยกเป็น {parts.length} รายการ
            </button>
          </div>
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ยกเลิก</button></div>
      </div>
    </div>
  );
}
function FinanceExpensesTab({finance,persist}) {
  const expensesMonths={};
  (finance.finance.expenses||[]).forEach(exp=>{
    const m=monthYearKey(exp.date);
    expensesMonths[m]=true;
  });
  const validMonths=Object.keys(expensesMonths).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort().reverse();
  const defaultMonth=validMonths.length>0?validMonths[0]:currentMonthKey();
  const [showCSVImport,setShowCSVImport]=useState(false);
  const [depositRows,setDepositRows]=useState(null);
  const [investRows,setInvestRows]=useState(null);
  const [expAmount,setExpAmount]=useState("");
  const [expCategory,setExpCategory]=useState("อาหาร");
  const [expMemo,setExpMemo]=useState("");
  const [expDate,setExpDate]=useState(todayISO());
  const [selectedMonth,setSelectedMonth]=useState(defaultMonth);
  const [selectedIds,setSelectedIds]=useState(()=>new Set());
  const addExpense=()=>{
    const amt=Number(expAmount);
    if(!expCategory.trim()||!amt||amt<=0) return;
    persist({
      ...finance,
      finance:{
        ...finance.finance,
        expenses:[...finance.finance.expenses,{id:uid(),date:expDate,amount:-Math.abs(amt),category:expCategory.trim(),memo:expMemo.trim(),source:"manual"}]
      }
    });
    setExpAmount("");setExpMemo("");
  };
  const removeExpense=(id)=>persist({
    ...finance,
    finance:{...finance.finance,expenses:finance.finance.expenses.filter(e=>e.id!==id)}
  });
  const removeSelectedExpenses=()=>{
    if(selectedIds.size===0) return;
    persist({
      ...finance,
      finance:{...finance.finance,expenses:finance.finance.expenses.filter(e=>!selectedIds.has(e.id))}
    });
    setSelectedIds(new Set());
  };
  const toggleSelectId=(id)=>setSelectedIds(prev=>{
    const next=new Set(prev);
    if(next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const handleCSVUpload=async(e)=>{
    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const text=await file.text();
      const lines=text.split("\n").map(l=>l.trim()).filter(l=>l);
      const header=lines[0].split(",").map(h=>h.trim().toLowerCase());
      const txnIdx=header.findIndex(h=>h.includes("txn")||h.includes("amount"));
      const dateIdx=header.findIndex(h=>h.includes("date"));
      const categoryIdx=header.findIndex(h=>h.includes("category"));
      const memoIdx=header.findIndex(h=>h.includes("memo")||h.includes("note"));
      const typeIdxFound=header.findIndex(h=>h.includes("type"));
      const typeIdx=typeIdxFound>=0?typeIdxFound:1; // คอลัมน์ B = "Type" ถ้าหาชื่อคอลัมน์ไม่เจอ
      const EXCLUDED_TYPES=["move money"]; // deposit ไม่ทิ้งแล้ว — ส่งไปหน้ารีวิวแทน
      if(txnIdx<0||dateIdx<0) {alert("ไม่พบ Txn หรือ Date column");return;}
      const newExpenses=[];
      const deposits=[];
      const invests=[];
      let skippedByType=0;
      /* เดาหมวดให้แถวที่ CSV ไม่ได้ระบุหมวด (หรือระบุเป็น "อื่นๆ") — ใช้ map ที่เรียนรู้จากการจัดหมวดเองเป็นหลัก
         ไม่แตะแถวที่ CSV มีหมวดชัดเจนอยู่แล้ว และติด guessedCategory:true ไว้ให้ตรวจย้อนหลังได้ */
      const impMap=loadMemoCatMap();
      const VAGUE=["อื่นๆ","อื่น ๆ","ไม่ระบุ",""];
      let guessedCount=0;
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(",").map(c=>c.trim());
        const amt=parseFloat(cols[txnIdx]);
        const date=normalizeExpenseDate(cols[dateIdx]);
        const cat=cols[categoryIdx]||"อื่นๆ";
        const catNorm=cat.replace(/\s+/g," ").trim(); // KBank export บางไฟล์มีเว้นวรรคซ้อน เช่น "ออม  ลงทุน" (2 ช่อง) ต้อง normalize ก่อนเทียบ
        const memo=cols[memoIdx]||"";
        const type=(cols[typeIdx]||"").trim().toLowerCase();
        const isExcludedType=EXCLUDED_TYPES.some(t=>type.includes(t));
        if(isExcludedType){ skippedByType++; continue; }
        if(type.includes("deposit")){
          if(date&&amt>0) deposits.push({id:uid(),date,amount:amt,note:memo});
          continue;
        }
        if(amt<0&&date){
          // แถวหมวด "ออม ลงทุน" ไม่เข้ารายจ่ายทันที — ส่งไปหน้ารีวิวให้เลือกประเภทสินทรัพย์ก่อน
          if(catNorm===INVEST_CSV_CATEGORY){ invests.push({id:uid(),date,amount:amt,note:memo,category:INVEST_CSV_CATEGORY}); continue; }
          let useCat=cat, guessed=false;
          if(VAGUE.includes(catNorm)){
            const g=guessCategory(memo,impMap);
            if(g){ useCat=g.cat; guessed=true; guessedCount++; }
          }
          newExpenses.push({id:uid(),date,amount:amt,category:useCat,memo:memo,source:"kbank-csv",...(guessed?{guessedCategory:true}:{})});
        }
      }
      persist({
        ...finance,
        finance:{
          ...finance.finance,
          expenses:[...finance.finance.expenses,...newExpenses]
        }
      });
      setShowCSVImport(false);
      alert(`นำเข้า ${newExpenses.length} รายการสำเร็จ${guessedCount>0?` (เดาหมวดให้ ${guessedCount} รายการ — ตรวจได้ที่ปุ่มจัดหมวด)`:""}${skippedByType>0?` (ข้าม ${skippedByType} รายการที่เป็น move money)`:""}${deposits.length>0?` · พบเงินเข้า (Deposit) ${deposits.length} รายการ ให้รีวิวต่อ`:""}${invests.length>0?` · พบรายการ "${INVEST_CSV_CATEGORY}" ${invests.length} รายการ ให้รีวิวต่อ`:""}`);
      if(deposits.length>0) setDepositRows(deposits);
      if(invests.length>0) setInvestRows(invests);
    }catch(err){
      alert("ขอโทษ เกิดข้อผิดพลาดในการอ่านไฟล์");
    }
  };
  // บันทึกผลรีวิวแถว Deposit: "เงินคืน" ลง expenses แบบ amount บวก (ข้อยกเว้นเดียวของกฎติดลบ — ดู expOut())
  const applyDeposits=(rows,mode,target)=>{
    if(mode==="refund"){
      const add=rows.map(r=>({id:uid(),date:r.date,amount:Math.abs(r.amount),category:target,
        memo:("คืนเงิน "+(r.note||"")).trim(),source:"csv-refund"}));
      persist({...finance,finance:{...finance.finance,expenses:[...finance.finance.expenses,...add]}});
    }else if(mode==="income"){
      const add=rows.map(r=>({id:uid(),date:r.date,month:monthYearKey(r.date),amount:Math.abs(r.amount),
        source:target,note:r.note||"",importSource:"kbank-csv"}));
      persist({...finance,finance:{...finance.finance,income:[...(finance.finance.income||[]),...add]}});
    }
  };
  // บันทึกผลรีวิวแถว "ออม ลงทุน": ลง finance.investments (amount เป็นบวกตามกฎของ investments)
  // rows ที่มี _fromExpenseId คือแถวที่ดึงมาจากรายจ่ายเดิม (ผ่านปุ่มแก้ไขรายการที่นำเข้าผิด) ต้องลบออกจาก expenses ด้วย
  const applyInvestments=(rows,type)=>{
    const add=rows.map(r=>({id:uid(),date:r.date,amount:Math.abs(r.amount),
      name:(r.note||"").trim()||INVEST_TYPE_LABELS[type],type,source:"kbank-csv"}));
    const fixIds=new Set(rows.filter(r=>r._fromExpenseId).map(r=>r._fromExpenseId));
    persist({...finance,finance:{...finance.finance,
      investments:[...(finance.finance.investments||[]),...add],
      expenses:fixIds.size?finance.finance.expenses.filter(e=>!fixIds.has(e.id)):finance.finance.expenses}});
  };
  // แถวที่ผู้ใช้ไม่ได้จัดการ = รายจ่ายปกติตามเดิม (ไม่ปล่อยให้ข้อมูลหาย)
  // ถ้าเป็นแถวที่ดึงมาจากรายจ่ายเดิม (_fromExpenseId) แถวนั้นอยู่ใน expenses อยู่แล้ว ไม่ต้องเพิ่มซ้ำ
  const closeInvestReview=(leftover)=>{
    setInvestRows(null);
    if(!leftover||leftover.length===0) return;
    const add=leftover.filter(r=>!r._fromExpenseId).map(r=>({id:uid(),date:r.date,amount:-Math.abs(r.amount),
      category:r.category||INVEST_CSV_CATEGORY,memo:r.note||"",source:"kbank-csv"}));
    if(add.length) persist({...finance,finance:{...finance.finance,expenses:[...finance.finance.expenses,...add]}});
  };
  // ── แก้ไขย้อนหลัง: รายจ่ายเดิมที่หมวดตรงกับ "ออม ลงทุน" (นับรวมกรณีเว้นวรรคเพี้ยนจากบั๊กเดิม) ที่หลุดเข้ามาเป็นรายจ่าย ──
  const strayInvestExpenses=(finance.finance.expenses||[]).filter(e=>(e.category||"").replace(/\s+/g," ").trim()===INVEST_CSV_CATEGORY);
  const fixStrayInvestments=()=>setInvestRows(strayInvestExpenses.map(e=>({id:uid(),date:e.date,amount:e.amount,note:e.memo,category:INVEST_CSV_CATEGORY,_fromExpenseId:e.id})));
  const expensesByCategory={};
  (finance.finance.expenses||[]).forEach(exp=>{
    expensesByCategory[exp.category]=(expensesByCategory[exp.category]||0)+expOut(exp);
  });
  const sortedCategories=Object.entries(expensesByCategory).sort((a,b)=>b[1]-a[1]);
  const expensesThisMonth={};
  (finance.finance.expenses||[]).forEach(exp=>{
    const m=monthYearKey(exp.date);
    if(m===selectedMonth){
      expensesThisMonth[exp.category]=(expensesThisMonth[exp.category]||0)+expOut(exp);
    }
  });
  const categoryData=Object.entries(expensesThisMonth).map(([cat,amt])=>({name:cat,value:amt})).sort((a,b)=>b.value-a.value);
  const monthOptions=validMonths;
  const monthLabel=monthOptions.includes(selectedMonth)?new Date(`${selectedMonth}-01`).toLocaleDateString("en-US",{month:"long",year:"numeric"}):"Select month";
  const allExpenses=(finance.finance.expenses||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const [fMonth,setFMonth]=useState("all");
  const [fCat,setFCat]=useState("all");
  const [fSrc,setFSrc]=useState("all");
  const [editRow,setEditRow]=useState(null);
  const listMonths=[...new Set(allExpenses.map(e=>monthYearKey(e.date)).filter(m=>/^\d{4}-\d{2}$/.test(m)))].sort().reverse();
  const listCats=[...new Set(allExpenses.map(e=>e.category).filter(Boolean))].sort();
  const listOrigins=[...new Set(allExpenses.map(originOf))].sort();
  const sortedExpenses=allExpenses.filter(e=>
    (fMonth==="all"||monthYearKey(e.date)===fMonth)&&(fCat==="all"||e.category===fCat)&&(fSrc==="all"||originOf(e)===fSrc));
  const allSelected=sortedExpenses.length>0&&sortedExpenses.every(e=>selectedIds.has(e.id));
  const someSelected=sortedExpenses.some(e=>selectedIds.has(e.id))&&!allSelected;
  const toggleSelectAll=()=>{
    const next=new Set(selectedIds);
    if(allSelected) sortedExpenses.forEach(e=>next.delete(e.id));
    else sortedExpenses.forEach(e=>next.add(e.id));
    setSelectedIds(next);
  };
  const saveEdit=(row)=>{
    persist({...finance,finance:{...finance.finance,expenses:(finance.finance.expenses||[]).map(e=>e.id===row.id?row:e)}});
    setEditRow(null);
  };
  /* แยกรายจ่าย 1 รายการเป็นหลายหมวด */
  const [splitRow,setSplitRow]=useState(null);
  const applySplit=(newRows)=>{
    const cur=finance.finance.expenses||[];
    persist({...finance,finance:{...finance.finance,
      expenses:[...cur.filter(e=>e.id!==splitRow.id),...newRows]}});
    setSplitRow(null);
  };
  /* แบนเนอร์ + ทางลัดเปิดหน้าจัดหมวด สำหรับหมวดก้อนใหญ่ที่ยังไม่ได้แยก */
  const [showRecatExp,setShowRecatExp]=useState(false);
  const vagueCats=["อื่นๆ","อื่น ๆ","ไม่ระบุ",""];
  const vagueRows=(finance.finance.expenses||[]).filter(e=>vagueCats.includes(String(e.category||"").trim()));
  const vagueTotal=vagueRows.reduce((a,e)=>a+expOut(e),0);
  /* ohm จัดหมวดครบแล้ว ที่เหลือคือ "อื่นๆ" จริงๆ — ปิดแบนเนอร์ได้ แต่จะกลับมาเตือนเองถ้ามีรายการอื่นๆ เพิ่มขึ้นจากตอนที่กดปิด
     (เก็บจำนวนตอนกดปิดไว้ ไม่ใช่ปิดถาวร เพื่อให้ import รอบหน้าที่เดาหมวดไม่ได้ยังเตือนอยู่) */
  const VAGUE_DISMISS_KEY="secretary-vague-dismiss";
  const [vagueDismissed,setVagueDismissed]=useState(()=>{ try{ return Number(localStorage.getItem(VAGUE_DISMISS_KEY))||0; }catch(e){ return 0; } });
  const dismissVague=()=>{ try{ localStorage.setItem(VAGUE_DISMISS_KEY,String(vagueRows.length)); }catch(e){} setVagueDismissed(vagueRows.length); };
  const showVague=vagueRows.length>vagueDismissed;
  return (
    <div className="fin-section">
      {showRecatExp&&<RecategorizeModal finance={finance} persist={persist} startCat="อื่นๆ" onClose={()=>setShowRecatExp(false)}/>}
      {showVague&&(
        <div style={{margin:"0 20px 16px",padding:"12px 16px",background:"#241d3a",border:"1px solid #8b5cf6",borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <span style={{fontSize:16,color:"#c4b5fd"}}>รายจ่ายหมวด "อื่นๆ" {vagueRows.length} รายการ · ฿{Math.round(vagueTotal).toLocaleString()}{vagueDismissed>0?` (เพิ่มขึ้น ${vagueRows.length-vagueDismissed} รายการจากครั้งก่อน)`:""}</span>
          <div style={{display:"flex",gap:8}}>
            <button className="text-btn" onClick={()=>setShowRecatExp(true)}>จัดหมวด</button>
            <button className="text-btn" style={{color:"#a29bc4"}} onClick={dismissVague}>ที่เหลือคืออื่นๆ จริง</button>
          </div>
        </div>
      )}
      {strayInvestExpenses.length>0&&(
        <div style={{margin:"0 20px 16px",padding:"12px 16px",background:"#2a1f3d",border:"1px solid #f59e0b",borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <span style={{fontSize:16,color:"#fbbf24"}}>พบรายการ "ออม ลงทุน" {strayInvestExpenses.length} รายการ ที่หลุดเข้ามาเป็นรายจ่าย (บั๊กเว้นวรรค 2 ช่องที่แก้แล้ว) รวม ฿{strayInvestExpenses.reduce((a,e)=>a+Math.abs(e.amount),0).toLocaleString()}</span>
          <button className="text-btn" onClick={fixStrayInvestments}>ย้ายไปเป็นเงินลงทุน</button>
        </div>
      )}
      <div style={{padding:"0 20px",marginBottom:16}}>
        <label style={{fontSize:17,color:"#a29bc4",marginBottom:4,display:"block"}}>Month</label>
        <select value={selectedMonth} onChange={(e)=>setSelectedMonth(e.target.value)} style={{background:"#191330",border:"1px solid #3a3155",borderRadius:8,color:"#f2eefc",padding:"6px 10px",fontFamily:"'Noto Sans Thai',sans-serif",fontSize:20,cursor:"pointer"}}>
          {monthOptions.map(m=>(
            <option key={m} value={m}>{new Date(`${m}-01`).toLocaleDateString("en-US",{month:"long",year:"numeric"})}</option>
          ))}
        </select>
      </div>
      <div style={{padding:"0 20px",marginBottom:20}}>
        <CategoryPieCard
          title="Expenses by Category" subtitle={monthLabel} data={categoryData} accent="#fb923c" sign="-"
          emptyText="No expenses recorded for this month"
          getItems={(name)=>(finance.finance.expenses||[]).filter(e=>e.category===name&&monthYearKey(e.date)===selectedMonth).map(e=>({id:e.id,date:e.date,memo:e.memo,amount:e.amount}))}/>
      </div>
      <div className="card">
        <div className="card-head" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          Add Expense
          <button className="text-btn" onClick={()=>setShowCSVImport(!showCSVImport)}><Upload size={21}/> Import CSV</button>
        </div>
        {showCSVImport&&(
          <div style={{padding:"12px",background:"#191330",borderRadius:8,marginBottom:12,border:"1px dashed #3a3155"}}>
            <label style={{fontSize:18,color:"#a29bc4",display:"block",marginBottom:6}}>Upload CSV exported from your banking app</label>
            <input type="file" accept=".csv,.xlsx" onChange={handleCSVUpload} style={{fontSize:18}}/>
          </div>
        )}
        <div className="fin-row-2">
          <div>
            <label className="field-label">Date</label>
            <input type="date" value={expDate} onChange={e=>setExpDate(e.target.value)} className="modal-input"/>
          </div>
          <div>
            <label className="field-label">Amount</label>
            <input type="number" placeholder="0" value={expAmount} onChange={e=>setExpAmount(e.target.value)} className="modal-input"/>
          </div>
        </div>
        <div>
          <label className="field-label">Category</label>
          <input placeholder="เช่น อาหาร, ค่าน้ำมัน..." value={expCategory} onChange={e=>setExpCategory(e.target.value)} className="modal-input"/>
        </div>
        <div>
          <label className="field-label">Note</label>
          <input placeholder="เพิ่มเติม..." value={expMemo} onChange={e=>setExpMemo(e.target.value)} className="modal-input"/>
        </div>
        <button className="icon-btn" onClick={addExpense} style={{alignSelf:"flex-end",marginTop:8}}><Plus size={24}/></button>
      </div>
      <div className="card">
        <div className="card-head">Expenses by Category (all time)</div>
        {sortedCategories.length===0&&<div className="empty">ยังไม่มีรายจ่าย</div>}
        {sortedCategories.map(([cat,total],i)=>(
          <div key={cat} style={{paddingBottom:10,borderBottom:"1px solid #2f2745"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:20}}>{cat}</span>
              <span style={{color:"#fb923c",fontFamily:"'IBM Plex Mono',monospace",fontSize:20}}>-฿{total.toLocaleString()}</span>
            </div>
            <div style={{background:"#191330",height:4,borderRadius:2,overflow:"hidden"}}>
              <div style={{height:"100%",background:COLORS[i%COLORS.length],width:`${(total/(Math.max(...sortedCategories.map(x=>x[1]))||1))*100}%`}}/>
            </div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-head" style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <span>All Expenses</span>
          {selectedIds.size>0&&(
            <button className="del-selected-btn" onClick={removeSelectedExpenses}>
              <Trash2 size={18}/> ลบที่เลือก ({selectedIds.size})
            </button>
          )}
        </div>
        <TxnFilterBar months={listMonths} cats={listCats} catLabel="categories" fMonth={fMonth} setFMonth={setFMonth} fCat={fCat} setFCat={setFCat}
          origins={listOrigins} fSrc={fSrc} setFSrc={setFSrc}
          shown={sortedExpenses.length} total={allExpenses.length} onReset={()=>{setFMonth("all");setFCat("all");setFSrc("all");}}/>
        {allExpenses.length===0&&<div className="empty">ยังไม่มีรายการ</div>}
        {allExpenses.length>0&&sortedExpenses.length===0&&<div className="empty">ไม่พบรายการตามตัวกรองนี้</div>}
        {sortedExpenses.length>0&&(
          <>
          <div className="txn-filter-total">รวม <b style={{color:"#fb923c"}}>-฿{sortedExpenses.reduce((a,e)=>a+expOut(e),0).toLocaleString()}</b></div>
          <div className="exp-table-wrap">
            <table className="exp-table">
              <thead>
                <tr>
                  <th className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={allSelected} ref={el=>{if(el) el.indeterminate=someSelected;}} onChange={toggleSelectAll}/></th>
                  <th>Date</th>
                  <th>Category</th>
                  <th className="exp-col-amount">Amount</th>
                  <th>Note</th>
                  <th className="exp-col-actions"></th>
                </tr>
              </thead>
              <tbody>
                {sortedExpenses.map(exp=>(
                  <tr key={exp.id} className={selectedIds.has(exp.id)?"row-selected":""}>
                    <td className="exp-col-check"><input type="checkbox" className="exp-checkbox" checked={selectedIds.has(exp.id)} onChange={()=>toggleSelectId(exp.id)}/></td>
                    <td className="exp-col-date">{exp.date}</td>
                    <td>{exp.category} {exp.source==="kbank-csv"&&<span className="exp-csv-badge">CSV</span>}{exp.source==="payslip"&&<span className="exp-csv-badge" style={{color:"#6ee7b7",borderColor:"#2a5a48",background:"#16302a"}}>SLIP</span>}{exp.source==="csv-refund"&&<span className="exp-csv-badge" style={{color:"#34d399",borderColor:"#2a5a48",background:"#16302a"}}>คืนเงิน</span>}</td>
                    <td className="exp-col-amount exp-amount-value" style={exp.amount>0?{color:"#34d399"}:undefined}>{exp.amount>0?"+":"-"}฿{Math.abs(exp.amount).toLocaleString()}</td>
                    <td className="exp-col-memo">{exp.memo||"—"}</td>
                    <td className="exp-col-actions">
                      <div className="txn-row-actions">
                        <button className="del-btn" title="แก้ไข" onClick={()=>setEditRow(exp)}><Edit3 size={18}/></button>
                        {/* รายการคืนเงิน (amount บวก) แยกไม่ได้ — SplitExpenseModal บังคับผลลัพธ์ติดลบ จะพลิกเครื่องหมายทำยอดเพี้ยน */}
                        {exp.amount<0&&<button className="del-btn" title="แยกเป็นหลายหมวด" onClick={()=>setSplitRow(exp)}><SplitIcon size={17}/></button>}
                        <button className="del-btn" title="ลบ" onClick={()=>removeExpense(exp.id)}><Trash2 size={19}/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          </>
        )}
        {editRow&&<TxnEditModal kind="expense" initial={editRow} options={listCats} onClose={()=>setEditRow(null)} onSave={saveEdit}/>}
        {splitRow&&<SplitExpenseModal row={splitRow} catOptions={listCats.length?listCats:["อื่นๆ"]} onClose={()=>setSplitRow(null)} onApply={applySplit}/>}
        {depositRows&&<DepositReviewModal rows={depositRows} catOptions={listCats.length?listCats:["อื่นๆ"]}
          srcOptions={[...new Set([...(finance.finance.income||[]).map(i=>i.source).filter(Boolean),"อื่นๆ"])].sort()}
          onClose={()=>setDepositRows(null)} onApply={applyDeposits}/>}
        {investRows&&<InvestmentReviewModal rows={investRows} onClose={closeInvestReview} onApply={applyInvestments}/>}
      </div>
    </div>
  );
}
/* ═══ บันทึกการซื้อเพิ่ม (รองรับ DCA ที่ซื้อทุกวัน — กรอกเป็นยอดรวมรายงวด ไม่ต้องลงทีละครั้ง) ═══
   กรอก 2 ตัวเลข: งวดนี้ได้เหรียญมากี่หน่วย + จ่ายเงินรวมเท่าไร → ระบบคิดต้นทุนเฉลี่ยถ่วงน้ำหนักใหม่ให้
   ต้นทุนเฉลี่ยหลัง merge เก็บเป็น THB เสมอ (ถ้างวดจ่าย USD จะแปลงด้วยเรตของงวดนั้น ไม่ใช่เรตวันนี้)
   เก็บทุกงวดไว้ใน h.buys[] เพื่อดูประวัติ DCA และไว้คำนวณ XIRR ในอนาคต */
function AddBuyModal({holding,fx,onClose,onSave}) {
  const [date,setDate]=useState(todayISO());
  const [qty,setQty]=useState("");
  const [total,setTotal]=useState("");
  const [cur,setCur]=useState("THB");
  const [rate,setRate]=useState(fx?String(fx):"");
  const n=(v)=>{ const x=Number(v); return isFinite(x)?x:0; };
  const usedRate=cur==="USD"?(n(rate)||fx):1;
  const totalTHB=n(total)*usedRate;
  const unit=n(qty)>0?totalTHB/n(qty):0;
  const prevQty=n(holding.quantity);
  const prevCostTHB=holdingCostTHB(holding,fx);
  const newQty=prevQty+n(qty);
  const newAvg=newQty>0?(prevCostTHB+totalTHB)/newQty:0;
  const ready=n(qty)>0&&n(total)>0&&(cur==="THB"||usedRate>0);
  const apply=()=>{
    if(!ready) return;
    onSave({
      buy:{id:uid(),date,qty:n(qty),total:n(total),currency:cur,fxRate:cur==="USD"?usedRate:1,totalTHB},
      quantity:String(newQty),
      avgCost:String(Math.round(newAvg*100)/100),
      costCurrency:"THB",     // หลัง merge ต้นทุนเป็นบาทเสมอ — งวดที่จ่าย USD ถูกล็อกด้วยเรตของงวดไปแล้ว
      costFxRate:"",
      firstHeldDate:holding.firstHeldDate||date,
    });
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>➕ ซื้อเพิ่ม {holding.coin||"เหรียญ"}</span><button className="modal-close" onClick={onClose}><X size={27}/></button></div>
        <div className="modal-body">
          <div className="recat-hint">
            ตั้ง DCA รายวันก็กรอกรวมเป็นเดือนได้ — ใส่ยอดรวมของงวด (เช่น "เดือน ส.ค. ได้ 0.0042 BTC จ่ายไป ฿9,300")
            <br/>ตอนนี้ถืออยู่ {prevQty.toLocaleString()} หน่วย · ต้นทุนรวม ฿{Math.round(prevCostTHB).toLocaleString()}
          </div>
          <div className="fin-row-2">
            <div>
              <label className="field-label">วันที่ (สิ้นงวด)</label>
              <input type="date" className="modal-input" value={date} onChange={e=>setDate(e.target.value)}/>
            </div>
            <div>
              <label className="field-label">งวดนี้ได้เหรียญมากี่หน่วย</label>
              <input className="modal-input" inputMode="decimal" placeholder="0.0042" value={qty} onChange={e=>setQty(e.target.value)}/>
            </div>
          </div>
          <div className="fin-row-2">
            <div>

  const remove=(id)=>persist({...finance,finance:{...finance.finance,investments:(finance.finance.investments||[]).filter(x=>x.id!==id)}});

  const cancelEditInv=()=>{ setEditInvId(null); setEditInvDraft(null); };

    const amt=Math.abs(Number(editInvDraft.amount))||0;
    if(!amt){ return; }
    persist({...finance,finance:{...finance.finance,investments:(finance.finance.investments||[]).map(x=>x.id===editInvId?{...x,date:editInvDraft.date,name:editInvDraft.name.trim(),type:editInvDraft.type,amount:amt}:x)}});

  /* ── เพิ่มรายการลงทุนแบบ manual (ไม่ผ่าน CSV/payslip) — ตอนนี้ผ่าน AddInvestmentModal (ปุ่ม "+ เพิ่มรายการ" ด้านล่าง) ── */

  const num=(v)=>{ const n=Number(v); return isFinite(n)?n:0; };
  // มูลค่า crypto คำนวณจากตาราง holdings อัตโนมัติ ไม่ต้องกรอกใน investmentValues.crypto

  const setFx=(v)=>persist({...finance,finance:{...finance.finance,fxRate:{...(finance.finance.fxRate||{}),USDTHB:{value:v,updatedAt:todayISO()}}}});
