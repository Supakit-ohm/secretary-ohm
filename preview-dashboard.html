            </div>
            <div className="inv-alloc-list">
              {activeTypes.map(t=>(
                <div key={t.key} className="pnl-row">
                  <span style={{width:10,height:10,borderRadius:3,background:t.color,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:16,color:"#f2eefc"}}>{t.label}</span>
                      <span style={{fontSize:16,color:"#a78bfa",fontFamily:"'IBM Plex Mono',monospace"}}>฿{Math.round(t.value).toLocaleString()}</span>
                    </div>
                    <div style={{fontSize:14,color:"#a29bc4",marginTop:2}}>ใส่ไป ฿{Math.round(t.contrib).toLocaleString()} · {t.pnl>=0?"+":"-"}฿{Math.abs(Math.round(t.pnl)).toLocaleString()}</div>
                    {renderPnlBar(t.pnl,t.contrib>0?(t.pnl/t.contrib)*100:0)}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
      {chart.length>0&&(
        <div className="card" style={{margin:"0 20px 20px"}}>
          <div className="card-head">Contributions by Month</div>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={chart} margin={{top:5,right:10,left:0,bottom:5}}>
              <defs><linearGradient id="invGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#c4b5fd"/><stop offset="100%" stopColor="#8b5cf6"/></linearGradient></defs>
              <CartesianGrid strokeDasharray="3 3" stroke="#2f2745" vertical={false}/>
              <XAxis dataKey="month" tick={{fontSize:15,fill:"#a29bc4"}} axisLine={{stroke:"#3a3155"}} tickLine={false}/>
              <YAxis tick={{fontSize:14,fill:"#a29bc4"}} axisLine={false} tickLine={false} tickFormatter={v=>v>=1000?`${v/1000}k`:v}/>
              <Tooltip cursor={{fill:"rgba(139,92,246,.06)"}} contentStyle={{background:"#221b38",border:"1px solid #3a3155",borderRadius:10,color:"#f2eefc",fontFamily:"'Noto Sans Thai',sans-serif"}} formatter={v=>[`฿${Number(v).toLocaleString()}`,""]}/>
              <Bar dataKey="value" fill="url(#invGrad)" radius={[8,8,0,0]} maxBarSize={54}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      )}
      <div className="card" style={{margin:"0 20px 20px"}}>
        <div className="card-head">กรอกมูลค่าปัจจุบัน (อัปเดตเป็นระยะ)</div>
        <div style={{padding:"0 16px 8px",fontSize:15,color:"#a29bc4"}}>
          กรอกมูลค่าล่าสุดของแต่ละประเภท แล้วการ์ด "ภาพรวมพอร์ตตามประเภท" ด้านบนจะอัปเดตตาม
        </div>
        {staleTypes.length>0&&(
          <div style={{margin:"0 16px 10px",padding:"10px 14px",background:"#2a1f3d",border:"1px solid #f59e0b",borderRadius:10,fontSize:15,color:"#fbbf24"}}>
            มูลค่าของ {staleTypes.map(t=>t.label).join(", ")} ไม่ได้อัปเดตเกิน 30 วันแล้ว — ตัวเลขกำไร/ขาดทุนด้านบนอาจคลาดเคลื่อน
          </div>
        )}
        <div className="inv-card-list">
          {INVEST_TYPES.map(t=>{
            const u=iv[t.key]&&iv[t.key].updatedAt;
            const age=u?-daysUntil(u):null;
            return (
              <div key={t.key} className="inv-item-card">
                <div className="inv-item-head">
                  <span style={{fontSize:17,color:"#f2eefc"}}>{t.label}</span>
                  <span style={{fontSize:15,color:"#a29bc4"}}>ใส่ไป ฿{Math.round(contribByType[t.key]||0).toLocaleString()}</span>
                </div>
                {t.key==="crypto"
                  ? <div style={{marginTop:6,fontSize:16,color:"#a78bfa"}}>฿{Math.round(cryptoValue).toLocaleString()} <span style={{fontSize:14,color:"#a29bc4"}}>(คำนวณจากพอร์ตคริปโตด้านล่าง)</span></div>
                  : (
                    <div style={{display:"flex",alignItems:"center",gap:10,marginTop:6,flexWrap:"wrap"}}>
                      <span style={{fontSize:15,color:"#a29bc4"}}>มูลค่าปัจจุบัน</span>
                      <input className="modal-input" style={{maxWidth:160,textAlign:"right"}} inputMode="decimal"
                        value={(iv[t.key]&&iv[t.key].value)!==undefined?iv[t.key].value:""}
                        onChange={e=>setTypeValue(t.key,e.target.value)} placeholder="0"/>
                      <span style={{fontSize:14,color:!u?"#fbbf24":age>=60?"#fb923c":age>=30?"#fbbf24":"#a29bc4"}}>
                        {!u?((contribByType[t.key]||0)>0?"ยังไม่เคยกรอก":"—"):`อัปเดต ${u}${age>=30?` · ${age} วันแล้ว`:""}`}
                      </span>
                    </div>
                  )}
              </div>
            );
          })}
        </div>
      </div>
      <div className="card" style={{margin:"0 20px 20px"}}>
        <div className="card-head">
          <span>พอร์ตคริปโต</span>
          <div className="card-head-right" style={{display:"flex",gap:8}}>
            {holdings.length>1&&<button className="text-btn" onClick={sortHoldings}>เรียงตามมูลค่า</button>}
            <button className="text-btn" onClick={()=>setShowAddCoin(true)}>+ เพิ่มเหรียญ</button>
          </div>
        </div>
        <div className="recat-hint" style={{margin:"0 16px 10px"}}>
          กรอกต้นทุน/ราคาเป็น THB หรือ USD ก็ได้ เลือกแยกกันได้ต่อช่อง — ทุกยอดสรุปแปลงเป็นบาททั้งหมด ·
          ต้นทุนที่จ่ายเป็น USD ใส่ "เรตตอนซื้อ" ไว้ด้วยจะแม่นที่สุด (ถ้าเว้นว่างจะใช้เรตปัจจุบันแทน)
        </div>
        <div style={{padding:"0 16px 8px",fontSize:17,color:"#a29bc4"}}>
          ต้นทุนรวม <b>฿{Math.round(cryptoCost).toLocaleString()}</b> ·
          มูลค่าปัจจุบัน <b style={{color:"#a78bfa"}}>฿{Math.round(cryptoValue).toLocaleString()}</b> ·
          กำไร/ขาดทุน <b style={{color:cryptoValue-cryptoCost>=0?"#34d399":"#fb923c"}}>
            {cryptoValue-cryptoCost>=0?"+":"-"}฿{Math.abs(Math.round(cryptoValue-cryptoCost)).toLocaleString()}
            {cryptoCost>0&&` (${cryptoValue-cryptoCost>=0?"+":"-"}${Math.abs(((cryptoValue-cryptoCost)/cryptoCost)*100).toFixed(1)}%)`}
          </b>
        </div>
        {best&&num(best.quantity)>0&&(
          <div style={{padding:"0 16px 8px",fontSize:15,color:"#a29bc4"}}>
            ดีที่สุด <b style={{color:"#34d399"}}>{best.coin||"—"} {coinStat(best).pct>=0?"+":""}{coinStat(best).pct.toFixed(1)}%</b>
            {worst&&worst.id!==best.id&&<> · แย่ที่สุด <b style={{color:"#fb923c"}}>{worst.coin||"—"} {coinStat(worst).pct>=0?"+":""}{coinStat(worst).pct.toFixed(1)}%</b></>}
          </div>
        )}
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"0 16px 10px"}}>
          <span style={{fontSize:15,color:"#a29bc4"}}>เรต USD → THB</span>
          <input className="modal-input" style={{maxWidth:110,textAlign:"right"}} inputMode="decimal" placeholder="36.50"
            value={(finance.finance.fxRate&&finance.finance.fxRate.USDTHB&&finance.finance.fxRate.USDTHB.value)||""}
            onChange={e=>setFx(e.target.value)}/>
          <span style={{fontSize:14,color:"#a29bc4"}}>
            {(finance.finance.fxRate&&finance.finance.fxRate.USDTHB&&finance.finance.fxRate.USDTHB.updatedAt)?`อัปเดต ${finance.finance.fxRate.USDTHB.updatedAt}`:"ยังไม่เคยกรอก"}
          </span>
        </div>
        {needsFx&&!fx&&(
          <div style={{margin:"0 16px 10px",padding:"8px 12px",background:"#3a1f1f",border:"1px solid #f87171",borderRadius:10,fontSize:15,color:"#fca5a5"}}>
            มีเหรียญที่กรอกเป็น USD แต่ยังไม่ได้ใส่เรต USD → THB — มูลค่าและกำไร/ขาดทุนจะยังคำนวณไม่ได้จนกว่าจะกรอกเรต
          </div>
        )}
        {stalePrice.length>0&&(
          <div style={{margin:"0 16px 10px",padding:"8px 12px",background:"#2a1f3d",border:"1px solid #f59e0b",borderRadius:10,fontSize:15,color:"#fbbf24"}}>
            ราคาของ {stalePrice.map(h=>h.coin||"(ไม่มีชื่อ)").join(", ")} ไม่ได้อัปเดตเกิน 7 วัน — คริปโตผันผวนเร็ว ตัวเลขกำไร/ขาดทุนอาจไม่ตรงความจริง
          </div>
        )}
        {buyFor&&<AddBuyModal holding={buyFor} fx={fx} onClose={()=>setBuyFor(null)} onSave={saveBuy}/>}
        {showAddCoin&&<AddCoinModal fx={fx} onClose={()=>setShowAddCoin(false)} onSave={addCoin}/>}
        {holdings.length===0&&<div className="empty">ยังไม่มีเหรียญ — กด "เพิ่มเหรียญ" เพื่อกรอกพอร์ตที่มีอยู่</div>}
        {holdings.length>0&&(
          <div className="crypto-platform-grid">
            {platformList.map(pl=>{
              const plPnl=pl.value-pl.cost;
              const plPct=pl.cost>0?(plPnl/pl.cost)*100:0;
              const plPie=pl.items.filter(h=>coinStat(h).value>0).map(h=>({name:h.coin||"—",value:coinStat(h).value}));
              return (
                <div key={pl.name} className="crypto-platform-col">
                  <div className="crypto-platform-head">
                    <span>{pl.name}</span>
                    <span style={{fontSize:14,color:"#a29bc4",fontWeight:400}}>{pl.coins} เหรียญ</span>
                  </div>
                  <div style={{fontSize:15,color:"#a29bc4",padding:"6px 0 4px"}}>
                    ใส่ไป ฿{Math.round(pl.cost).toLocaleString()} · มูลค่า <b style={{color:"#a78bfa"}}>฿{Math.round(pl.value).toLocaleString()}</b>{" "}
                    <span style={{color:plPnl>=0?"#34d399":"#fb923c"}}>
                      {plPnl>=0?"+":"-"}฿{Math.abs(Math.round(plPnl)).toLocaleString()} ({plPnl>=0?"+":"-"}{Math.abs(plPct).toFixed(1)}%)
                    </span>
                  </div>
                  {plPie.length>0&&(
                    <div className="crypto-mini-pie">
                      <ResponsiveContainer width="100%" height="100%">
                        <PieChart margin={{top:4,right:4,bottom:4,left:4}}>
                          <Pie data={plPie} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius="50%" outerRadius="85%" paddingAngle={2} isAnimationActive={false}>
                            {plPie.map((d,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}
                          </Pie>
                          <Tooltip contentStyle={{background:"#221b38",border:"1px solid #3a3155",borderRadius:10,color:"#f2eefc",fontFamily:"'Noto Sans Thai',sans-serif"}} formatter={v=>[`฿${Number(v).toLocaleString()}`,""]}/>
                        </PieChart>
                      </ResponsiveContainer>
                    </div>
                  )}
                  <div className="inv-card-list" style={{padding:0}}>
                    {pl.items.map(h=>{
                      const st=coinStat(h);
                      const priceAge=h.priceUpdatedAt?-daysUntil(h.priceUpdatedAt):null;
                      const editing=editCoinId===h.id;
                      return (
                        <div key={h.id} className="inv-item-card">
                          <div className="inv-item-head">
                            <span style={{fontSize:16,color:"#f2eefc"}}>{h.coin||"(ไม่มีชื่อ)"} <span style={{fontSize:13,color:"#a29bc4"}}>· {st.share.toFixed(1)}%</span></span>
                            <div className="inv-item-actions">
                              <button className="del-btn" title="บันทึกการซื้อเพิ่ม / DCA" onClick={()=>setBuyFor(h)}><Plus size={18}/></button>
                              <button className="del-btn" onClick={()=>setEditCoinId(editing?null:h.id)}><Edit3 size={16}/></button>
                              <button className="del-btn" onClick={()=>removeHolding(h.id)}><Trash2 size={18}/></button>
                            </div>
                          </div>
                          {!editing&&(
                            <>
                              <div style={{display:"flex",justifyContent:"space-between",gap:8,marginTop:4,flexWrap:"wrap"}}>
                                <span style={{fontSize:14,color:"#a29bc4"}}>{num(h.quantity).toLocaleString()} หน่วย</span>
                                <span style={{fontSize:16,color:"#a78bfa",fontFamily:"'IBM Plex Mono',monospace"}}>฿{Math.round(st.value).toLocaleString()}</span>
                              </div>
                              {st.cost>0&&renderPnlBar(st.pnl,st.pct)}
                              {(h.buys||[]).length>0&&<div style={{fontSize:13,color:"#34d399",marginTop:4}}>บันทึกซื้อ {h.buys.length} งวด</div>}
                              {priceAge!=null&&priceAge>=7&&<div style={{fontSize:13,color:"#fbbf24",marginTop:4}}>ราคาค้าง {priceAge} วัน</div>}
                            </>
                          )}
                          {editing&&(
                            <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:8}}>
                              <div className="fin-row-2">
                                <div><label className="field-label">เหรียญ</label><input className="modal-input" value={h.coin} onChange={e=>editHolding(h.id,"coin",e.target.value)} placeholder="BTC"/></div>
                                <div><label className="field-label">เก็บไว้ที่</label><input className="modal-input" value={h.platform||""} onChange={e=>editHolding(h.id,"platform",e.target.value)} placeholder="Binance Global"/></div>
                              </div>
                              <div className="fin-row-2">
                                <div><label className="field-label">จำนวน</label><input className="modal-input" inputMode="decimal" value={h.quantity} onChange={e=>editHolding(h.id,"quantity",e.target.value)} placeholder="0"/></div>
                                <div><label className="field-label">เริ่มถือ</label><input type="date" className="modal-input" value={h.firstHeldDate||""} onChange={e=>editHolding(h.id,"firstHeldDate",e.target.value)}/></div>
                              </div>
                              <div className="fin-row-2">
                                <div>
                                  <label className="field-label">ต้นทุนเฉลี่ย/หน่วย</label>
                                  <div style={{display:"flex",gap:4}}>
                                    <input className="modal-input" inputMode="decimal" value={h.avgCost} onChange={e=>editHolding(h.id,"avgCost",e.target.value)} placeholder="0"/>
                                    <select className="modal-input" style={{maxWidth:78}} value={h.costCurrency||"THB"} onChange={e=>editHolding(h.id,"costCurrency",e.target.value)}>
                                      <option value="THB">THB</option><option value="USD">USD</option>
                                    </select>
                                  </div>
                                </div>
                                <div>
                                  <label className="field-label">ราคาปัจจุบัน/หน่วย</label>
                                  <div style={{display:"flex",gap:4}}>
                                    <input className="modal-input" inputMode="decimal" value={h.currentPrice} onChange={e=>editHolding(h.id,"currentPrice",e.target.value)} placeholder="0"/>
                                    <select className="modal-input" style={{maxWidth:78}} value={h.priceCurrency||"THB"} onChange={e=>editHolding(h.id,"priceCurrency",e.target.value)}>
                                      <option value="THB">THB</option><option value="USD">USD</option>
                                    </select>
                                  </div>
                                </div>
                              </div>
                              {h.costCurrency==="USD"&&(
                                <div>
                                  <label className="field-label">เรตตอนซื้อ (ไม่บังคับ)</label>
                                  <input className="modal-input" inputMode="decimal" value={h.costFxRate||""} onChange={e=>editHolding(h.id,"costFxRate",e.target.value)} placeholder={fx?String(fx):"36.50"}/>
                                </div>
                              )}
                              <button className="modal-btn-save" onClick={()=>setEditCoinId(null)}>เสร็จแล้ว</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      <div className="card" style={{margin:"0 20px 20px"}}>
        <div className="card-head">เป้าหมายการลงทุน</div>
        <div style={{padding:"0 16px 8px",fontSize:15,color:"#a29bc4"}}>
          ดึงจากเป้าหมายหมวด "การเงิน" ในหน้า Tracker — เพิ่ม/แก้ไขได้ที่หน้านั้น
        </div>
        {finGoals.length===0&&<div className="empty">ยังไม่มีเป้าหมายหมวดการเงิน — สร้างที่หน้า Tracker แล้วเลือกหมวด "การเงิน"</div>}
        {finGoals.length>0&&(
          <div style={{padding:"0 16px 12px"}}>
            {shortGoals.length>0&&(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:16,color:"#c4b5fd",margin:"6px 0"}}>ระยะสั้น (ครบกำหนดใน 1 ปี)</div>
                {shortGoals.map(renderGoal)}
              </div>
            )}
            {longGoals.length>0&&(
              <div>
                <div style={{fontSize:16,color:"#c4b5fd",margin:"6px 0"}}>ระยะยาว (1 ปีขึ้นไป / ไม่กำหนดวัน)</div>
                {longGoals.map(renderGoal)}
              </div>
            )}
          </div>
        )}
      </div>
      <div className="card" style={{margin:"0 20px 20px"}}>
        <div className="card-head">
          <span>เพิ่มรายการลงทุน</span>
          <button className="text-btn" onClick={()=>setShowAddInv(true)}>+ เพิ่มรายการ</button>
        </div>
        <div style={{padding:"0 16px 14px",fontSize:15,color:"#a29bc4"}}>สำหรับรายการที่ไม่ได้มาจาก CSV/สลิปเงินเดือน — กด "+ เพิ่มรายการ" เพื่อกรอก</div>
        {showAddInv&&(
          <AddInvestmentModal
            onClose={()=>setShowAddInv(false)}
            onSave={(row)=>{
              persist({...finance,finance:{...finance.finance,investments:[...(finance.finance.investments||[]),
                {id:uid(),date:row.date,amount:Math.abs(Number(row.amount)),name:row.name.trim()||INVEST_TYPE_LABELS[row.type],type:row.type,source:"manual"}]}});
              setShowAddInv(false);
            }}
          />
        )}
      </div>
      <div className="card" style={{margin:"0 20px"}}>
        <div className="card-head">Savings & Investments — รายการทั้งหมด</div>
        {list.length===0&&<div className="empty">ยังไม่มีรายการ — เงินสะสม กบข./กสจ. จากสลิปเงินเดือนจะมาอยู่ตรงนี้</div>}
        {list.length>0&&(
          <div className="inv-card-list">
            {list.map(i=>{
              const editing=editInvId===i.id;
              return (
                <div key={i.id} className="inv-item-card">
                  {!editing?(
                    <>
                      <div className="inv-item-head">
                        <span style={{fontSize:16,color:"#f2eefc"}}>{i.name}</span>
                        <span style={{fontSize:16,color:"#a78bfa",fontFamily:"'IBM Plex Mono',monospace"}}>฿{i.amount.toLocaleString()}</span>
                      </div>
                      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginTop:6}}>
                        <span style={{fontSize:14,color:"#a29bc4"}}>{i.date}</span>
                        <span className="exp-csv-badge" style={{color:"#c4b5fd",borderColor:"#3a3155",background:"#221b38"}}>{INVEST_TYPE_LABELS[i.type]||INVEST_TYPE_LABELS.other}</span>
                        <span className="exp-csv-badge">{ORIGIN_LABELS[originOf(i)]||"กรอกเอง"}</span>
                        <div className="inv-item-actions" style={{marginLeft:"auto"}}>
                          <button className="del-btn" onClick={()=>startEditInv(i)}><Edit3 size={17}/></button>
                          <button className="del-btn" onClick={()=>remove(i.id)}><Trash2 size={19}/></button>
                        </div>
                      </div>
                    </>
                  ):(
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      <div className="fin-row-2">
                        <div><label className="field-label">Date</label><input type="date" className="modal-input" value={editInvDraft.date} onChange={e=>setEditInvDraft({...editInvDraft,date:e.target.value})}/></div>
                        <div><label className="field-label">Name</label><input className="modal-input" value={editInvDraft.name} onChange={e=>setEditInvDraft({...editInvDraft,name:e.target.value})}/></div>
                      </div>
                      <div className="fin-row-2">
                        <div>
                          <label className="field-label">ประเภท</label>
                          <select className="modal-input" value={editInvDraft.type} onChange={e=>setEditInvDraft({...editInvDraft,type:e.target.value})}>
                            {INVEST_TYPES.map(t=><option key={t.key} value={t.key}>{t.label}</option>)}
                          </select>
                        </div>
                        <div><label className="field-label">Amount</label><input type="number" className="modal-input" inputMode="decimal" value={editInvDraft.amount} onChange={e=>setEditInvDraft({...editInvDraft,amount:e.target.value})}/></div>
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button className="del-btn" style={{color:"#34d399"}} onClick={saveEditInv}><Check size={19}/></button>
                        <button className="del-btn" onClick={cancelEditInv}><X size={19}/></button>
                        <button className="del-btn" onClick={()=>{cancelEditInv();remove(i.id);}}><Trash2 size={19}/></button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}
/* ═══ Debts (เฟส 1: CRUD หนี้พื้นฐาน) ═══ */
/* หนี้มี 2 ชนิด: external = หนี้กับเจ้าหนี้ภายนอก, self = หนี้ตัวเอง (ดึงเงินเก็บ/เงินลงทุนมาใช้แล้วตั้งใจคืนตัวเอง)
   ยอดคงเหลือของ self กรอกเองล้วนๆ ไม่ผูก/ไม่หักกับ investments อัตโนมัติเด็ดขาด */
const DEBT_KINDS=[{key:"external",label:"หนี้ภายนอก"},{key:"self",label:"หนี้ตัวเอง"}];
const DEBT_TYPES_EXTERNAL=[
  {key:"car-loan",label:"ผ่อนรถ"},
  {key:"mortgage",label:"ผ่อนบ้าน"},
  {key:"coop-loan",label:"กู้สหกรณ์"},

];
const DEBT_TYPE_LABELS=DEBT_TYPES_EXTERNAL.reduce((a,t)=>{a[t.key]=t.label;return a;},{});
const DEBT_KIND_STYLE={
  external:{color:"#fb923c",borderColor:"#4a3320",background:"#33220f"},

/* ═══ Net Worth: เงินสด + มูลค่าพอร์ตลงทุน − หนี้คงเหลือ ═══
   แหล่งคำนวณเดียวของทั้งแอป — FinanceInvestmentsTab ก็เรียก 2 ตัวนี้ด้วย อย่าคำนวณซ้ำที่อื่น */
const nv=(v)=>{ const x=Number(v); return isFinite(x)?x:0; };
/* อัตราแลกเปลี่ยน USD→THB กรอกเองเป็นระยะ (ไม่ต่อ API ตามแนวทางเดิมของแอป)
   เก็บที่ finance.fxRate = { USDTHB: {value, updatedAt} } */
function usdThb(f){ const r=f.finance.fxRate&&f.finance.fxRate.USDTHB; return nv(r&&r.value); }
/* แปลงเป็นบาทเสมอ — ภาพรวมทั้งแอปเป็น THB สกุลเดียว
   ต้นทุนที่จ่ายเป็น USD ใช้ "เรตตอนซื้อ" (costFxRate) ถ้ากรอกไว้ ไม่ใช่เรตวันนี้
   เพราะเงินบาทที่จ่ายไปจริงล็อกไปแล้ว ถ้าใช้เรตวันนี้ ต้นทุนในอดีตจะขยับตามค่าเงิน = กำไร/ขาดทุนเพี้ยน */
function holdingCostTHB(h,fx){
  const rate=(h.costCurrency==="USD")?(nv(h.costFxRate)||fx):1;
  return nv(h.quantity)*nv(h.avgCost)*rate;
}
function holdingValueTHB(h,fx){
  const rate=(h.priceCurrency==="USD")?fx:1;   // มูลค่าปัจจุบันใช้เรตวันนี้เสมอ
  return nv(h.quantity)*nv(h.currentPrice)*rate;
}
function cryptoPortfolioValue(f){
  const fx=usdThb(f);
  return (f.finance.cryptoHoldings||[]).reduce((a,h)=>a+holdingValueTHB(h,fx),0);
}
function portfolioValue(f){
  const iv=f.finance.investmentValues||{};
  return INVEST_TYPES.reduce((a,t)=>a+(t.key==="crypto"?cryptoPortfolioValue(f):nv(iv[t.key]&&iv[t.key].value)),0);
}
function totalDebtBalance(f){ return (f.finance.debts||[]).reduce((a,d)=>a+nv(d.currentBalance),0); }
function totalCash(f){ return (f.finance.cashAccounts||[]).reduce((a,c)=>a+nv(c.balance),0); }
/* เงินสดกรอกยอดคงเหลือเองเป็นระยะ (โครงเดียวกับ investmentValues / debts.currentBalance)
   ไม่คำนวณสะสมจาก income−expenses เพราะข้อมูลไม่ได้ครอบคลุมทุกบัญชี จะเพี้ยนแบบเงียบๆ */

          <div style={{width:`${(invest/barMax)*100}%`,background:"#a78bfa"}} title={`ลงทุน ฿${Math.round(invest).toLocaleString()}`}/>

}
function FinanceDebtsTab({finance,persist}) {
  const list=(finance.finance.debts||[]).slice().sort((a,b)=>(Number(b.currentBalance)||0)-(Number(a.currentBalance)||0));

  const setDebts=(next)=>persist({...finance,finance:{...finance.finance,debts:next}});
  const remove=(id)=>setDebts((finance.finance.debts||[]).filter(x=>x.id!==id));
  /* ── เฟส 2: จับคู่กับ Expenses (ยืนยันเอง ห้ามหักอัตโนมัติ) ── */
  const expenses=finance.finance.expenses||[];
  const catKey=(c)=>String(c||"").replace(/\s+/g," ").trim();
  const expCategories=Array.from(new Set(expenses.map(e=>catKey(e.category)).filter(Boolean))).sort();
  // หมวดที่ถูกหนี้ตัวอื่นจองไปแล้ว — 1 รายจ่าย map ได้แค่ 1 หนี้ (linkedDebtId เป็นค่าเดียว)
  const takenCat={};
  (finance.finance.debts||[]).forEach(d=>{ if(d.linkedExpenseCategory) takenCat[catKey(d.linkedExpenseCategory)]=d.id; });
  const catDisabled=(c,selfId)=>takenCat[c]&&takenCat[c]!==selfId;
  const pendingFor=(d)=>{
    if(!d.linkedExpenseCategory) return null;
    const k=catKey(d.linkedExpenseCategory);
    const rows=expenses.filter(e=>catKey(e.category)===k&&!e.linkedDebtId);
    if(!rows.length) return {rows:[],sum:0};
    const dates=rows.map(e=>e.date).filter(Boolean).sort();
    return {rows,sum:rows.reduce((a,e)=>a+expOut(e),0),from:dates[0],to:dates[dates.length-1]};
  };
  const confirmMatch=(d)=>{
    const p=pendingFor(d);
    if(!p||!p.rows.length) return;
    const ids=new Set(p.rows.map(e=>e.id));
    persist({...finance,finance:{...finance.finance,
      debts:(finance.finance.debts||[]).map(x=>x.id===d.id?{...x,currentBalance:n(x.currentBalance)-p.sum,updatedAt:todayISO()}:x),

/* ═══ Payslip import ═══ */
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESSERACT_URL="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";
const SLIP_AMOUNT_RE=/\d{1,3}(?:,\d{3})*\.\d{2}/g;
const UTILITY_KEYWORDS=["ค่าน้ำ","ค่าไฟ","ค่าอ่านหน่วย","ค่าขยะ","cable tv"];
const SAVINGS_KEYWORDS=["กบข","กสจ"];
// หัวข้อที่บอกว่าจบส่วน "รายการเงินหัก" แล้ว — ห้ามอ่านเลยไป (กันนับ กบข. ซ้ำจากตาราง 2 รอบ)
const DED_END_MARKERS=["รายการจ่ายเงินเดือน","ระบบสารสนเทศ","รายการเงินเพิ่ม","รวมเงินหัก"];
const CAT_TAX="ภาษี ณ ที่จ่าย";
const CAT_UTILITY="ค่าสาธารณูปโภค";
const CAT_OTHER="รายการหักประจำเดือน";
function loadExternalScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[data-ext="${src}"]`)) return res();
    const s=document.createElement("script");
    s.src=src; s.dataset.ext=src; s.onload=()=>res(); s.onerror=()=>rej(new Error("โหลดไลบรารีไม่สำเร็จ: "+src));
    document.head.appendChild(s);
  });
}
function slipNum(s){ return Number(String(s).replace(/,/g,"")); }
function classifyDeduction(name){
  const low=name.toLowerCase();
  if(UTILITY_KEYWORDS.some(k=>low.includes(k.toLowerCase()))) return "utility";
  if(SAVINGS_KEYWORDS.some(k=>name.includes(k))) return "savings";
  return "other";
}
function parsePayslip(rawText){
  const text=String(rawText||"").replace(/ /g," ");
  const warnings=[];
  const iAdd=text.indexOf("รายการเงินเพิ่ม");
  const iDed=text.indexOf("รายการเงินหัก");
  const headEnd=iAdd>=0?iAdd:(iDed>=0?iDed:text.length);
  const summary=(text.slice(0,headEnd).match(SLIP_AMOUNT_RE)||[]).map(slipNum);
  let base=null,allowance=null,gross=null,tax=null,deductTotal=null,grandDeduct=null,net=null;
  if(summary.length>=7){ [base,allowance,gross,tax,deductTotal,grandDeduct,net]=summary.slice(-7); }
  else warnings.push(`อ่านแถวสรุปด้านบนไม่ครบ (พบ ${summary.length} ตัวเลข ต้องการ 7)`);
  // ตัดเฉพาะช่วง "รายการเงินหัก" เท่านั้น ไม่ให้เลยไปอ่านตารางท้ายสลิป (เช่น "รายการจ่ายเงินเดือน 2 รอบ")
  let dedText="";
  if(iDed>=0){
    dedText=text.slice(iDed);
    let cut=dedText.length;
    DED_END_MARKERS.forEach(mk=>{ const p=dedText.indexOf(mk,1); if(p>0&&p<cut) cut=p; });
    dedText=dedText.slice(0,cut);
  } else warnings.push('ไม่พบหัวข้อ "รายการเงินหัก" — อาจอ่านไฟล์ไม่ครบ');
  const items=[]; const re=/(\d{8})\s*([\s\S]*?)\s((?:\d{1,3}(?:,\d{3})*)?\.\d{2})(?=\s|$)/g; let m;
  while((m=re.exec(dedText))!==null){
    const name=m[2].replace(/\s+/g," ").trim();
    if(!name) continue;
    if(name.length>60){ warnings.push(`รายการ ${m[1]} อ่านได้ชื่อยาวผิดปกติ อาจอ่านคร่อมส่วนอื่น — โปรดตรวจสอบ`); continue; }
    items.push({id:uid(),code:m[1],name,amount:slipNum(m[3]),bucket:classifyDeduction(name)});
  }
  const r2=n=>Math.round(n*100)/100;
  const sumOf=b=>r2(items.filter(i=>i.bucket===b).reduce((a,i)=>a+i.amount,0));
  const utilities=sumOf("utility"), savings=sumOf("savings"), other=sumOf("other");
  const itemsSum=r2(utilities+savings+other);
  const near=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<0.05;
  const checks=[];
  if(deductTotal!=null) checks.push({label:"ผลรวมรายการหัก = ช่องเงินหัก",ok:near(itemsSum,deductTotal),got:itemsSum,want:deductTotal});
  if(deductTotal!=null&&tax!=null&&grandDeduct!=null) checks.push({label:"เงินหัก + ภาษี = รวมหัก",ok:near(deductTotal+tax,grandDeduct),got:r2(deductTotal+tax),want:grandDeduct});
  if(gross!=null&&grandDeduct!=null&&net!=null) checks.push({label:"รวมรับ − รวมหัก = คงรับ",ok:near(gross-grandDeduct,net),got:r2(gross-grandDeduct),want:net});
  if(base!=null&&allowance!=null&&gross!=null) checks.push({label:"อัตราเงินเดือน + เงินเพิ่ม = รวมรับ",ok:near(base+allowance,gross),got:r2(base+allowance),want:gross});
  return {base,allowance,gross,tax,deductTotal,grandDeduct,net,items,utilities,savings,other,itemsSum,checks,allOk:checks.length>0&&checks.every(c=>c.ok),warnings};
}
async function extractPdfText(file){
  await loadExternalScript(PDFJS_URL);
  const lib=window.pdfjsLib;
  if(!lib) throw new Error("โหลด pdf.js ไม่สำเร็จ");
  lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    let lastY=null,line="";
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      if(lastY!==null&&Math.abs(y-lastY)>3){ out+=line.trim()+"\n"; line=""; }
      line+=it.str+" "; lastY=y;
    });
    out+=line.trim()+"\n";
  }
  return out;
}
async function extractImageText(file,onProgress){
  await loadExternalScript(TESSERACT_URL);
  const T=window.Tesseract;
  if(!T) throw new Error("โหลด Tesseract.js ไม่สำเร็จ");
  const url=URL.createObjectURL(file);
  try{
    const res=await T.recognize(url,"tha+eng",{logger:msg=>{ if(msg.status==="recognizing text"&&onProgress) onProgress(Math.round(msg.progress*100)); }});
    return res.data.text;
  } finally { URL.revokeObjectURL(url); }
}

                <div className="type-tabs" style={{marginTop:8}}>
                  <button className={`type-btn ${dupChoice==="replace"?"active":""}`} onClick={()=>setDupChoice("replace")}>แทนที่ของเดิม</button>
                  <button className={`type-btn ${dupChoice==="add"?"active":""}`} onClick={()=>setDupChoice("add")}>เพิ่มเข้าไป</button>
                </div>
              </div>
            )}
          </div>
        )}
        {step==="preview"&&(
          <div className="modal-foot">
            <button className="modal-btn-cancel" onClick={()=>{setStep("pick");setParsed(null);}}>ย้อนกลับ</button>
            <button className="modal-btn-save" disabled={isDuplicate&&!dupChoice} onClick={()=>doSave(dupChoice==="replace")}>
              {isDuplicate&&!dupChoice?"เลือกวิธีบันทึกก่อน":"บันทึกลงรายรับ-รายจ่าย"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
/* ═══ เดาหมวดรายจ่ายอัตโนมัติ (ช่วยสลาย "อื่นๆ" ก้อนใหญ่) ═══
   2 ชั้น: (1) map ที่ "เรียนรู้" จากทุกครั้งที่ผู้ใช้กดย้ายหมวดเอง — แม่นที่สุดเพราะเป็นข้อมูลจริงของผู้ใช้
           (2) กฎคำค้นตั้งต้น สำหรับ memo ที่ไม่เคยเจอ
   ทั้งสองชั้นเป็นแค่ "ข้อเสนอ" เสมอ ต้องกดยืนยันเองทุกครั้ง ไม่มี auto-save เงียบๆ */
const MEMO_CAT_KEY="secretary-memo-cat-map";
const memoKey=(m)=>String(m||"").toLowerCase().replace(/\s+/g," ").trim();
function loadMemoCatMap(){ try{ return JSON.parse(localStorage.getItem(MEMO_CAT_KEY)||"{}")||{}; }catch(e){ return {}; } }
function saveMemoCatMap(map){ try{ localStorage.setItem(MEMO_CAT_KEY,JSON.stringify(map)); }catch(e){} }
const CATEGORY_RULES=[

  {cat:"ของใช้/ซูเปอร์",kw:["lotus","โลตัส","bigc","big c","บิ๊กซี","makro","แม็คโคร","tops","villa market","cp fresh","ซูเปอร์","supermarket","watsons","วัตสัน","ร้านสะดวกซื้อ","ikea","homepro","โฮมโปร","ไทวัสดุ","dohome"]},

  {cat:"บันเทิง/สมาชิกรายเดือน",kw:["netflix","spotify","youtube premium","disney","iqiyi","viu","wetv","steam","google play","app store","icloud","openai","chatgpt","claude","canva","adobe","โรงหนัง","major","sf cinema"]},
  {cat:"สุขภาพ",kw:["โรงพยาบาล","hospital","คลินิก","clinic","ร้านขายยา","pharmacy","เภสัช","ทันตกรรม","dental","ฟิตเนส","fitness","gym","แล็บ"]},
  {cat:"ค่าสาธารณูปโภค",kw:["การไฟฟ้า","การประปา","ค่าน้ำ","ค่าไฟ","ais","true","dtac","3bb","nt ","อินเทอร์เน็ต","internet","ค่าโทรศัพท์"]},
  {cat:"ค่าธรรมเนียม/ดอกเบี้ย",kw:["ค่าธรรมเนียม","ธรรมเนียม","fee","ดอกเบี้ย","interest","ปรับ"]},

/* คืน {cat,by} — by = "learned" (เคยย้ายเอง) | "rule" (กฎคำค้น) | null */
function guessCategory(memo,map){
  const k=memoKey(memo);
  if(!k) return null;
  if(map&&map[k]) return {cat:map[k],by:"learned"};
  for(const r of CATEGORY_RULES){ if(r.kw.some(w=>k.includes(w))) return {cat:r.cat,by:"rule"}; }
  return null;
}
function RecategorizeModal({finance,persist,onClose,startCat}) {
  const expenses=finance.finance.expenses||[];
  const allCats=[...new Set(expenses.map(e=>e.category).filter(Boolean))].sort();
  const [srcCat,setSrcCat]=useState(startCat&&allCats.includes(startCat)?startCat:(allCats.includes("อื่นๆ")?"อื่นๆ":allCats[0]||""));
  const [picked,setPicked]=useState(()=>new Set());
  const [target,setTarget]=useState("");
  const [newCat,setNewCat]=useState("");
  const [catMap,setCatMap]=useState(loadMemoCatMap);
  const [splitRow,setSplitRow]=useState(null);   // แยกได้เฉพาะกลุ่มที่มีรายการเดียว
  const applySplit=(newRows)=>{
    persist({...finance,finance:{...finance.finance,
      expenses:[...expenses.filter(e=>e.id!==splitRow.id),...newRows]}});
    setSplitRow(null); setPicked(new Set());
  };
  const pool=expenses.filter(e=>e.category===srcCat);
  const groups={};
  pool.forEach(e=>{
    const k=(e.memo||"").trim()||"(ไม่มีโน้ต)";
    if(!groups[k]) groups[k]={memo:k,ids:[],total:0,count:0};
    groups[k].ids.push(e.id); groups[k].total+=expOut(e); groups[k].count++;
  });
  Object.values(groups).forEach(g=>{ g.guess=g.memo==="(ไม่มีโน้ต)"?null:guessCategory(g.memo,catMap); });
  const groupList=Object.values(groups).sort((a,b)=>b.total-a.total);
  /* สรุปข้อเสนอ: จัดกลุ่มที่เดาได้ตามหมวดปลายทาง เพื่อกดเลือกทีเดียวทั้งหมวด */
  const suggestions={};
  groupList.forEach(g=>{
    if(!g.guess||g.guess.cat===srcCat) return;
    const c=g.guess.cat;
    if(!suggestions[c]) suggestions[c]={cat:c,ids:[],total:0,groups:0,learned:0};
    suggestions[c].ids.push(...g.ids); suggestions[c].total+=g.total; suggestions[c].groups++;
    if(g.guess.by==="learned") suggestions[c].learned++;
  });
  const sugList=Object.values(suggestions).sort((a,b)=>b.total-a.total);
  const pickSuggestion=(sg)=>{ setPicked(new Set(sg.ids)); setTarget(sg.cat); setNewCat(""); };
  const learn=(rows,cat)=>{
    const nm={...catMap};
    rows.forEach(e=>{ const k=memoKey(e.memo); if(k) nm[k]=cat; });
    saveMemoCatMap(nm); setCatMap(nm);
  };
  /* ย้ายทุกกลุ่มที่เดาได้พร้อมกัน — ยังต้องกดยืนยันผ่าน confirm */
  const applyAllGuesses=()=>{
    const plan={};
    groupList.forEach(g=>{ if(g.guess&&g.guess.cat!==srcCat) g.ids.forEach(id=>{ plan[id]=g.guess.cat; }); });
    const cnt=Object.keys(plan).length;
    if(!cnt) return;
    const summary=sugList.map(x=>`${x.cat} (${x.ids.length})`).join(", ");
    if(!window.confirm(`ย้าย ${cnt} รายการตามที่ระบบเดา?\n\n${summary}\n\nย้อนกลับได้โดยจัดหมวดใหม่อีกครั้ง`)) return;
    persist({...finance,finance:{...finance.finance,
      expenses:expenses.map(e=>plan[e.id]?{...e,category:plan[e.id]}:e)}});
    const nm={...catMap};
    expenses.forEach(e=>{ if(plan[e.id]){ const k=memoKey(e.memo); if(k) nm[k]=plan[e.id]; } });
    saveMemoCatMap(nm); setCatMap(nm);
    setPicked(new Set());
  };
  const toggleGroup=(g)=>setPicked(prev=>{
    const n=new Set(prev);
    const on=g.ids.every(id=>n.has(id));
    g.ids.forEach(id=>on?n.delete(id):n.add(id));
    return n;
  });
  const pickedTotal=pool.filter(e=>picked.has(e.id)).reduce((a,e)=>a+expOut(e),0);
  const finalTarget=(newCat.trim()||target).trim();
  const apply=()=>{
    if(!finalTarget||picked.size===0) return;
    persist({...finance,finance:{...finance.finance,
      expenses:expenses.map(e=>picked.has(e.id)?{...e,category:finalTarget}:e)}});
    learn(pool.filter(e=>picked.has(e.id)),finalTarget);   // จำไว้ใช้เดาครั้งหน้า
    setPicked(new Set()); setNewCat("");
  };
  return (
    <>
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal recat-modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>🗂️ จัดหมวดหมู่ใหม่</span><button className="modal-close" onClick={onClose}><X size={27}/></button></div>
        <div className="modal-body">
          <div className="recat-hint">รายการที่โน้ตเหมือนกันถูกจับกลุ่มไว้แล้ว — กดเลือกทีเดียวได้ทั้งกลุ่ม · ป้าย <b style={{color:"#34d399"}}>เขียว</b> = เคยย้ายโน้ตนี้เอง, <b style={{color:"#c4b5fd"}}>ม่วง</b> = เดาจากคำในโน้ต</div>
          <div>
            <label className="field-label">จัดหมวดจาก</label>
            <select className="modal-input" style={{cursor:"pointer"}} value={srcCat} onChange={e=>{setSrcCat(e.target.value);setPicked(new Set());}}>
              {allCats.map(c=><option key={c} value={c}>{c} ({expenses.filter(x=>x.category===c).length} รายการ)</option>)}
            </select>
          </div>
          {sugList.length>0&&(
            <div className="recat-action" style={{marginTop:12}}>
              <div style={{fontSize:16,color:"#c9b8f0",marginBottom:8}}>
                ระบบเดาหมวดให้ได้ {sugList.reduce((a,x)=>a+x.ids.length,0)} รายการ — กดหมวดเพื่อเลือกทั้งชุด แล้วตรวจก่อนย้าย
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {sugList.map(sg=>(
                  <button key={sg.cat} className="recat-group" style={{width:"auto",padding:"6px 12px"}} onClick={()=>pickSuggestion(sg)}>
                    <span className="recat-memo">{sg.cat}</span>
                    <span className="recat-count">×{sg.ids.length}</span>
                    <span className="recat-amt">฿{Math.round(sg.total).toLocaleString()}</span>
                  </button>
                ))}
              </div>
              <button className="modal-btn-save" style={{marginTop:10,width:"100%",opacity:.9}} onClick={applyAllGuesses}>
                ย้ายทั้งหมดตามที่เดา ({sugList.reduce((a,x)=>a+x.ids.length,0)} รายการ)
              </button>
            </div>
          )}
          <div className="recat-list">
            {groupList.length===0&&<div className="empty">ไม่มีรายการในหมวดนี้</div>}
            {groupList.map(g=>{
              const on=g.ids.every(id=>picked.has(id));
              const one=g.count===1?pool.find(e=>e.id===g.ids[0]):null;
              const single=one&&one.amount<0?one:null;   // รายการคืนเงิน (บวก) แยกไม่ได้
              return (
                <div key={g.memo} style={{display:"flex",alignItems:"center",gap:6}}>
                <button className={`recat-group ${on?"on":""}`} style={{flex:1}} onClick={()=>toggleGroup(g)}>
                  <span className={`status-btn ${on?"done":""}`} style={{width:22,height:22}}>{on&&<Check size={14}/>}</span>
                  <span className="recat-memo">{g.memo}</span>
                  {g.guess&&g.guess.cat!==srcCat&&(
                    <span className="recat-count" style={{color:g.guess.by==="learned"?"#34d399":"#c4b5fd"}}
                      title={g.guess.by==="learned"?"เคยย้ายโน้ตนี้ไปหมวดนี้มาก่อน":"เดาจากคำในโน้ต"}>
                      → {g.guess.cat}
                    </span>
                  )}
                  {g.count>1&&<span className="recat-count">×{g.count}</span>}
                  <span className="recat-amt">฿{g.total.toLocaleString()}</span>
                </button>
                {single&&<button className="del-btn" title="แยกรายการนี้เป็นหลายหมวด" onClick={()=>setSplitRow(single)}><SplitIcon size={16}/></button>}
                </div>
              );
            })}
          </div>
          {picked.size>0&&(
            <div className="recat-action">
              <div style={{fontSize:17,color:"#c9b8f0",marginBottom:8}}>เลือกไว้ <b>{picked.size}</b> รายการ · ฿{pickedTotal.toLocaleString()}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <select className="modal-input" style={{flex:1,minWidth:150,cursor:"pointer"}} value={target} onChange={e=>{setTarget(e.target.value);setNewCat("");}}>
                  <option value="">— ย้ายไปหมวด —</option>
                  {allCats.filter(c=>c!==srcCat).map(c=><option key={c} value={c}>{c}</option>)}
                </select>
                <input className="modal-input" style={{flex:1,minWidth:150}} placeholder="หรือพิมพ์หมวดใหม่" value={newCat} onChange={e=>{setNewCat(e.target.value);setTarget("");}}/>
              </div>
              <button className="modal-btn-save" style={{marginTop:10,width:"100%"}} disabled={!finalTarget} onClick={apply}>
                ย้าย {picked.size} รายการ → {finalTarget||"…"}
              </button>
            </div>
          )}
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ปิด</button></div>
      </div>
    </div>
    {/* วางนอก backdrop ของ modal จัดหมวด ไม่งั้นคลิกปิด modal ซ้อนจะ bubble ไปปิดตัวนอกด้วย */}
    {splitRow&&<SplitExpenseModal row={splitRow} catOptions={allCats.length?allCats:["อื่นๆ"]} onClose={()=>setSplitRow(null)} onApply={applySplit}/>}
    </>
  );
}

function GoalCard({goal,onEdit,onDelete,onUpdate}) {
  const [expanded,setExpanded]=useState(false);
  const [editingValue,setEditingValue]=useState(false);
  const [valueDraft,setValueDraft]=useState(goal.currentValue);
  const progress=goalProgress(goal);
  const cat=goalCategoryInfo(goal.category);
  const CatIcon=cat.icon;
  const pri=goalPriorityInfo(goal.priority);
  const dLeft=daysUntil(goal.targetDate);
  const isDone=progress>=100;
  const r=30,c=2*Math.PI*r,off=c-(progress/100)*c;
  const saveValue=()=>{ onUpdate({...goal,currentValue:Number(valueDraft)||0}); setEditingValue(false); };
  const bumpPercent=(delta)=>onUpdate({...goal,currentValue:Math.max(0,Math.min(100,(goal.currentValue||0)+delta))});
  const toggleMilestone=(id)=>onUpdate({...goal,milestones:goal.milestones.map(m=>m.id===id?{...m,done:!m.done}:m)});
  return (
    <div className="goal-card" style={{"--goal-color":goal.color}}>
      <div className="goal-card-top">
        <div className="goal-cat-badge" style={{background:`${goal.color}22`,color:goal.color}}><CatIcon size={15}/> {cat.label}</div>
        <div className="goal-priority-dot" style={{background:pri.color}} title={`ความสำคัญ: ${pri.label}`}/>
      </div>
      <div className="goal-card-title">{goal.title}</div>
      {goal.description&&<div className="goal-card-desc">{goal.description}</div>}
      <div className="goal-progress-row">
        <div className="goal-progress-ring-wrap">
          <svg viewBox="0 0 72 72" className="goal-ring-svg">
            <circle cx="36" cy="36" r={r} className="ring-track"/>
            <circle cx="36" cy="36" r={r} stroke={goal.color} strokeDasharray={c} strokeDashoffset={off} className="ring-value"/>
            <text x="36" y="41" textAnchor="middle" className="goal-ring-number">{progress}%</text>
          </svg>
        </div>
        <div className="goal-progress-meta">
          {goal.measureType==="numeric"&&(
            editingValue?(
              <div className="goal-inline-edit">
                <input type="number" className="modal-input" value={valueDraft} onChange={e=>setValueDraft(e.target.value)} autoFocus onKeyDown={e=>e.key==="Enter"&&saveValue()}/>
                <button className="icon-btn" style={{width:32,height:32,minWidth:32}} onClick={saveValue}><Check size={16}/></button>
              </div>
            ):(
              <div className="goal-numeric-value" onClick={()=>{setValueDraft(goal.currentValue);setEditingValue(true);}}>
                <span>{(goal.currentValue||0).toLocaleString()}</span>&nbsp;/&nbsp;{goal.targetValue.toLocaleString()} {goal.unit}
                <Edit3 size={14} style={{marginLeft:6,opacity:.6}}/>
              </div>
            )
          )}
          {goal.measureType==="percent"&&(
            <div className="goal-percent-controls">
              <button className="mini-btn" onClick={()=>bumpPercent(-10)}>−</button>
              <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:18}}>{progress}%</span>
              <button className="mini-btn" onClick={()=>bumpPercent(10)}>+</button>
            </div>
          )}
          {goal.measureType==="checklist"&&(
            <button className="goal-checklist-toggle" onClick={()=>setExpanded(e=>!e)}>
              <ListChecks size={16}/> {goal.milestones.filter(m=>m.done).length}/{goal.milestones.length} ขั้นตอน
              {expanded?<ChevronUp size={16}/>:<ChevronDown size={16}/>}
            </button>
          )}
          {goal.targetDate&&(
            <div className={`goal-deadline ${dLeft!=null&&dLeft<0&&!isDone?"overdue":""}`}>
              <Clock size={14}/> {isDone?"สำเร็จแล้ว":dLeft==null?"":dLeft<0?`เลยกำหนด ${Math.abs(dLeft)} วัน`:dLeft===0?"ครบกำหนดวันนี้":`เหลือ ${dLeft} วัน`}
            </div>
          )}
        </div>
      </div>
      {goal.measureType==="checklist"&&expanded&&(
        <div className="goal-milestone-list">
          {goal.milestones.length===0&&<div className="empty" style={{fontSize:17}}>ยังไม่มีขั้นตอนย่อย</div>}
          {goal.milestones.map(m=>(
            <div key={m.id} className="milestone-row">
              <button className={`status-btn ${m.done?"done":""}`} onClick={()=>toggleMilestone(m.id)}>{m.done&&<Check size={16}/>}</button>
              <span style={{flex:1,fontSize:18,textDecoration:m.done?"line-through":"none",color:m.done?"#6f6790":"#f2eefc"}}>{m.text}</span>
            </div>
          ))}
        </div>
      )}
      <div className="goal-card-actions">
        <button className="text-btn" onClick={()=>onEdit(goal)}><Edit3 size={16}/> แก้ไข</button>
        <button className="del-txt-btn" onClick={()=>onDelete(goal.id)}><Trash2 size={16}/> ลบ</button>
      </div>
    </div>
  );
}

function ProjectModal({onClose,onSave,initial}) {

  const canSave=form.title.trim()&&(form.measureType!=="numeric"||Number(form.targetValue)!==Number(form.baselineValue));
  const msSorted=sortedMilestones(form);
  const addAutoMilestones=()=>set("milestones",[...form.milestones,...autoMilestones(form.milestones)]);
  const addMilestone=()=>{
    const used=new Set(form.milestones.map(m=>Number(m.pct)));
    let pct=50; for(let v=10;v<=100;v+=10){ if(!used.has(v)){ pct=v; break; } }
    set("milestones",[...form.milestones,{id:uid(),pct,label:"",reachedAt:null}]);
  };
  const setMilestone=(id,k,v)=>set("milestones",form.milestones.map(m=>m.id===id?{...m,[k]:v}:m));
  const delMilestone=(id)=>set("milestones",form.milestones.filter(m=>m.id!==id));
  const cleanMilestones=()=>{
    const seen=new Set();

      .map(m=>({...m,pct:Math.max(1,Math.min(100,Math.round(Number(m.pct)||0))),label:String(m.label||"").trim()}))
      .filter(m=>{ if(seen.has(m.pct)) return false; seen.add(m.pct); return true; })
      .sort((a,b)=>a.pct-b.pct);
  };
  const save=()=>{ if(!canSave) return; onSave({...form,id:initial?.id||uid(),title:form.title.trim(),description:form.description.trim(),targetValue:Number(form.targetValue)||100,baselineValue:Number(form.baselineValue)||0,manualValue:Number(form.manualValue)||0,targetDate:form.targetDate||null,milestones:cleanMilestones()}); };

function TaskRow({task,project,onToggle,onEdit,onDelete,showProject}) {

  const streak=isRecurring(task)?taskStreak(task):0;
  return (
    <div className={`trk-task-row ${done?"done":""}`}>
      <button className={`status-btn ${done?"done":""}`} onClick={()=>onToggle(task.id)}>{done&&<Check size={16}/>}</button>
      <div className="trk-task-main">
        <div className="trk-task-title">{task.title}</div>
        <div className="trk-task-meta">
          {showProject&&(project
            ? <span className="trk-task-project" style={{color:project.color,background:`${project.color}1f`}}>{project.title}</span>

          {isRecurring(task)&&<span className="trk-recur-badge">🔁 {(RECURRENCE_OPTIONS.find(r=>r.key===task.recurrence)||{}).label}</span>}
          {streak>0&&<span className="trk-streak">🔥 {streak}</span>}

        <button className="del-btn" onClick={()=>onDelete(task.id)}><Trash2 size={16}/></button>
      </div>
    </div>
  );
}

function ProjectCard({project,data,onOpen}) {

function TodayPanel({data,persist,onOpenProject,onAddTask,onEditTask}) {
  const tasks=data.tasks||[];
  const projById={}; (data.projects||[]).forEach(p=>projById[p.id]=p);
  const todayList=tasks.filter(taskIsDueToday);
  const overdue=todayList.filter(taskIsOverdue);
  const recurring=todayList.filter(t=>isRecurring(t));
  const dueToday=todayList.filter(t=>!isRecurring(t)&&!taskIsOverdue(t));
  const doneCount=todayList.filter(t=>taskDoneOn(t)).length;
  const pct=todayList.length?Math.round((doneCount/todayList.length)*100):0;
  const toggleTask=(id)=>{
    const t=tasks.find(x=>x.id===id);
    const willBeDone=!taskDoneOn(t);
    persist({...data,tasks:toggleTaskInList(tasks,id),activity:willBeDone?logActivity(data,{source:"task",text:`ทำงานสำเร็จ "${t.title}"`,status:"completed"}):data.activity});
  };
  const delTask=(id)=>persist({...data,tasks:tasks.filter(x=>x.id!==id)});
  const group=(label,list)=>list.length>0&&(
    <>
      <div className="trk-section-label">{label} ({list.length})</div>
      {list.map(t=><TaskRow key={t.id} task={t} project={projById[t.projectId]} showProject onToggle={toggleTask} onEdit={onEditTask} onDelete={delTask}/>)}
    </>
  );
  return (
    <div className="card">
      <div className="card-head">
        <ListTodo size={24}/> Today
        <div className="card-head-right">
          <span className="trk-today-pct">{doneCount}/{todayList.length}</span>
          <button className="icon-btn" onClick={onAddTask}><Plus size={22}/></button>
        </div>
      </div>
      <div className="trk-today-bar"><div className="trk-today-bar-fill" style={{width:`${pct}%`}}/></div>
      {todayList.length===0&&<div className="empty">ไม่มีงานค้างวันนี้ 🎉 กด + เพื่อเพิ่มงาน</div>}
      {group("⚠️ Overdue",overdue)}
      {group("📅 Due today",dueToday)}
      {group("🔁 Recurring",recurring)}
    </div>
  );
}
function TrackerPage({data,persist}) {
  const [openId,setOpenId]=useState(null);
  const [showProjModal,setShowProjModal]=useState(false);
  const [editProj,setEditProj]=useState(null);
  const [showTaskModal,setShowTaskModal]=useState(false);
  const [editTask,setEditTask]=useState(null);
  const [filter,setFilter]=useState("active");
  const projects=data.projects||[];
  const openProject=projects.find(p=>p.id===openId);
  const saveProject=(p)=>{
    const ex=projects.find(x=>x.id===p.id);
    persist({...data,projects:ex?projects.map(x=>x.id===p.id?p:x):[...projects,p],activity:ex?data.activity:logActivity(data,{source:"goal",text:`สร้างโปรเจกต์ "${p.title}"`})});
    setShowProjModal(false); setEditProj(null);
  };
  const saveTask=(t)=>{
    const ex=(data.tasks||[]).find(x=>x.id===t.id);

  const delProject=(id)=>{
    if(!confirm("ลบโปรเจกต์นี้? งานและ check-in ทั้งหมดในโปรเจกต์จะถูกลบด้วย")) return;
    persist({...data,projects:projects.filter(p=>p.id!==id),tasks:(data.tasks||[]).filter(t=>t.projectId!==id),checkins:(data.checkins||[]).filter(c=>c.projectId!==id)});
    setOpenId(null);
  };
  if(openProject) return (
    <div className="page-content">
      {showProjModal&&<ProjectModal initial={editProj} onClose={()=>{setShowProjModal(false);setEditProj(null);}} onSave={saveProject}/>}

      </div>
    </div>
  );
  const withProg=projects.map(p=>({...p,_prog:projectProgress(p,data),_health:projectHealth(p,data)}));
  const activeList=withProg.filter(p=>p._prog<100&&p.status!=="paused");
  const doneList=withProg.filter(p=>p._prog>=100);
  const behindList=withProg.filter(p=>p._health.key==="behind"||p._health.key==="overdue");
  let shown=filter==="active"?activeList:filter==="done"?doneList:filter==="behind"?behindList:withProg;
  const rank={high:0,medium:1,low:2};

      <div className="goal-stat-row">

      </div>

                  <button className={`goal-filter-pill ${filter==="done"?"active":""}`} onClick={()=>setFilter("done")}>Done</button>
                  <button className={`goal-filter-pill ${filter==="all"?"active":""}`} onClick={()=>setFilter("all")}>All</button>
                </div>

              {shown.map(p=><ProjectCard key={p.id} project={p} data={data} onOpen={setOpenId}/>)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );

function useCountUp(target,ms=800){
  const [v,setV]=useState(0);
  useEffect(()=>{
    let raf,start=null;
    const from=0,to=Number(target)||0;
    const tick=(ts)=>{
      if(start===null) start=ts;
      const t=Math.min(1,(ts-start)/ms);
      const e=1-Math.pow(1-t,3);
      setV(from+(to-from)*e);
      if(t<1) raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[target,ms]);
  return v;
}
function MomentumSpark({points}){
  const vals=points.filter(v=>v!=null);
  if(vals.length<2) return <div className="mom-spark-empty">ยังไม่มีเส้นทาง 30 วัน</div>;
  const min=Math.min(...vals), max=Math.max(...vals);
  const span=(max-min)||1;
  const W=100,H=28;
  const step=points.length>1?W/(points.length-1):W;
  let d="",started=false;
  points.forEach((v,i)=>{
    if(v==null) return;
    const x=(i*step).toFixed(2);
    const y=(H-((v-min)/span)*(H-4)-2).toFixed(2);
    d+=(started?" L":"M")+x+" "+y; started=true;
  });
  return (
    <svg className="mom-spark" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <path d={d+` L${W} ${H} L0 ${H} Z`} className="mom-spark-fill"/>
      <path d={d} className="mom-spark-line"/>
    </svg>
  );
}
function MomentumCard({data,onOpen}){
  const m=useMemo(()=>{
    const today=todayISO();
    const now=overallProgressNow(data);
    const spans=[
      {key:"d",label:"เมื่อวาน",date:shiftISO(today,{d:-1})},
      {key:"w",label:"อาทิตย์ก่อน",date:shiftISO(today,{d:-7})},
      {key:"m",label:"เดือนก่อน",date:shiftISO(today,{m:-1})},
      {key:"y",label:"ปีก่อน",date:shiftISO(today,{y:-1})},
    ].map(s=>{
      const p=progressOn(data,s.date);
      return {...s,delta:p?now-p.value:null,exact:p?p.exact:false};
    });
    const spark=[];
    for(let i=29;i>=0;i--){
      if(i===0){ spark.push(now); continue; }
      const p=progressOn(data,shiftISO(today,{d:-i}));
      spark.push(p?p.value:null);
    }
    const week=spans.find(s=>s.key==="w");
    const streak=momentumStreak(data);
    const state=(week&&week.delta!=null&&week.delta>=1)?"hot":(week&&week.delta!=null&&week.delta>0)?"warm":(streak===0?"cold":"warm");
    return {now,spans,spark,streak,state,early:earliestTrackerDate(data),count:(data.projects||[]).filter(p=>p.status!=="archived").length};
  },[data]);
  const shown=useCountUp(m.now);
  const C=2*Math.PI*42;
  const off=C*(1-Math.max(0,Math.min(100,m.now))/100);
  const stroke=m.state==="hot"?"#34d399":m.state==="warm"?"#8b5cf6":"#5a5175";
  if(!m.count) return (
    <div className="mom-card mom-cold" onClick={onOpen} role="button">
      <div className="mom-head"><span className="mom-title">โมเมนตัม</span></div>
      <div className="mom-empty">ยังไม่มีโปรเจกต์ — กดเพื่อสร้างเป้าหมายแรก ✨</div>
    </div>
  );
  return (
    <div className={`mom-card mom-${m.state}`} onClick={onOpen} role="button">
      <div className="mom-head">
        <span className="mom-title">โมเมนตัม</span>
        {m.streak>0&&<span className="mom-streak"><Flame size={14}/> {m.streak} วัน</span>}
      </div>
      <div className="mom-body">
        <div className="mom-ring">
          <svg viewBox="0 0 100 100">
            <circle className="mom-ring-bg" cx="50" cy="50" r="42"/>
            <circle className="mom-ring-fg" cx="50" cy="50" r="42" stroke={stroke}
              strokeDasharray={C} strokeDashoffset={off}/>
          </svg>
          <div className="mom-ring-center">
            <div className="mom-ring-val">{shown.toFixed(0)}<span>%</span></div>
            <div className="mom-ring-sub">{m.count} โปรเจกต์</div>
          </div>
        </div>
        <div className="mom-right">
          <MomentumSpark points={m.spark}/>
          <div className="mom-spans">
            {m.spans.map(s=>(
              <div className="mom-span" key={s.key}>
                <div className="mom-span-label">{s.label}</div>
                {s.delta==null
                  ? <div className="mom-span-none" title={m.early?`เริ่มเก็บข้อมูล ${thaiDate(m.early)}`:""}>—</div>
                  : <div className={`mom-span-val ${s.delta>0.05?"up":s.delta<-0.05?"down":"flat"}`}>
                      {s.delta>0.05?"+":""}{Math.abs(s.delta)<0.05?"0":s.delta.toFixed(1)}%
                      {!s.exact&&<span className="mom-est" title="ประมาณการจากข้อมูลย้อนหลัง">~</span>}
                    </div>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );

      persist({...data,tasks:[...(data.tasks||[]),{id:uid(),projectId:null,title:text,note:"",status:"pending",dueDate:rec==="none"?smartDailyDate():null,recurrence:rec,weight:1,completions:{}}],activity:logActivity(data,{source:"task",text:`เพิ่มงาน "${text}"`})});
    } else if(type==="expense"){
      persist({...data,finance:{...data.finance,expenses:[...data.finance.expenses,{id:uid(),date:todayISO(),amount:-Math.abs(amount),category,memo:text,source:"manual"}]},activity:logActivity(data,{source:"expense",text:`บันทึกรายจ่าย ${category} -฿${Math.abs(amount).toLocaleString()}`})});
    } else if(type==="journal"){
      const journal=data.journal||[];
      const today=journal.find(j=>j.date===todayISO());
      const nextJournal=today?journal.map(j=>j.date===todayISO()?{...j,entry:(j.entry?j.entry+"\n":"")+text}:j):[...journal,{id:uid(),date:todayISO(),entry:text}];
      persist({...data,journal:nextJournal,activity:logActivity(data,{source:"journal",text:`บันทึก Journal "${text.slice(0,32)}${text.length>32?"…":""}"`})});
    }
    setShowQuick(false);
  };
  const todayTasks=(data.tasks||[]).filter(taskIsDueToday);
  const totalTodoCount=todayTasks.length;
  const doneTodayCount=todayTasks.filter(t=>taskDoneOn(t)).length;
  const pendingCount=totalTodoCount-doneTodayCount;
  const assistantMessage=(()=>{
    if(todayEvents.length>0) return `วันนี้มี ${todayEvents.length} นัดหมาย อย่าลืมนะ 💜`;
    if(pendingCount>0) return `เหลืออีก ${pendingCount} งานที่ยังไม่เสร็จ สู้ๆ!`;
    if(totalTodoCount>0&&pendingCount===0) return "เคลียร์งานหมดแล้ว เก่งมาก! 🎉";
    return "วันนี้ยังว่าง ลองตั้งเป้าหมายใหม่ดูไหม?";
  })();
  const searchResults=(()=>{
    const q=search.trim().toLowerCase();
    if(!q) return [];
    const out=[];
    notes.forEach(n=>{ if(n.text.toLowerCase().includes(q)) out.push({id:n.id,kind:"note",label:"โน้ต",text:n.text,page:0}); });
    (data.tasks||[]).forEach(t=>{ if((t.title||"").toLowerCase().includes(q)) out.push({id:t.id,kind:"task",label:"งาน",text:t.title,page:2}); });
    events.forEach(e=>{ if((e.title||"").toLowerCase().includes(q)) out.push({id:e.id,kind:"event",label:"ตารางงาน",text:e.title,page:0}); });
    (data.projects||[]).forEach(p=>{ if((p.title||"").toLowerCase().includes(q)) out.push({id:p.id,kind:"project",label:"โปรเจกต์",text:p.title,page:2}); });
    (data.documents||[]).forEach(d=>{ if((d.title||"").toLowerCase().includes(q)) out.push({id:d.id,kind:"doc",label:"เอกสาร",text:d.title,page:4}); });
    (data.bookQueue||[]).forEach(b=>{ if((b.title||"").toLowerCase().includes(q)) out.push({id:b.id,kind:"book",label:"หนังสือ",text:b.title,page:5}); });
    (data.finance.expenses||[]).forEach(e=>{ if(`${e.category} ${e.memo||""}`.toLowerCase().includes(q)) out.push({id:e.id,kind:"expense",label:"รายจ่าย",text:`${e.category} · ${e.memo||e.date}`,page:1}); });
    return out.slice(0,8);
  })();
  return (
    <div className="app">
      {toasts.length>0&&(
        <div className="ms-toast-wrap">
          {toasts.map(t=><MilestoneToast key={t.id} toast={t} onClose={()=>setToasts(prev=>prev.filter(x=>x.id!==t.id))}/>)}
        </div>
      )}
      {showDashTask&&<TaskModal initial={editDashTask} projects={data.projects||[]} onClose={()=>{setShowDashTask(false);setEditDashTask(null);}} onSave={(t)=>{
        const ex=(data.tasks||[]).find(x=>x.id===t.id);
        persist({...data,tasks:ex?(data.tasks||[]).map(x=>x.id===t.id?t:x):[...(data.tasks||[]),t],activity:ex?data.activity:logActivity(data,{source:"task",text:`เพิ่มงาน "${t.title}"`})});
        setShowDashTask(false); setEditDashTask(null);
      }}/>}
      {showNoteModal&&<NoteModal onClose={()=>{setShowNoteModal(false);setEditNote(null);}} onSave={saveNote} initial={editNote}/>}
      {showEventModal&&<EventModal onClose={()=>{setShowEventModal(false);setEditEvent(null);}} onSave={saveEvent} initial={editEvent}/>}
      {showCal&&<CalendarModal events={events} onClose={()=>setShowCal(false)} onEditEvent={openEditEvent} onDeleteEvent={deleteEvent}/>}
      {showQuick&&<QuickCaptureModal onClose={()=>setShowQuick(false)} onSave={handleQuickCapture}/>}
      <div className="main-wrap">
        <TopNav page={page} setPage={setPage} search={search} setSearch={setSearch} searchResults={searchResults} onQuickCapture={()=>setShowQuick(true)}/>
        <div className="content-grid">
          <div className="content-main">
            {page===0&&(
              <>
                <TodayPanel data={data} persist={persist} onAddTask={()=>{setEditDashTask(null);setShowDashTask(true);}} onEditTask={t=>{setEditDashTask(t);setShowDashTask(true);}}/>
                <div className="card">
                  <div className="card-head">
                    <Clock size={27}/> Schedule
                    <div className="card-head-right">
                      <button className="text-btn" onClick={()=>setShowCal(true)}><CalendarDays size={21}/> Calendar</button>
                      <button className="icon-btn" onClick={()=>setShowEventModal(true)}><Plus size={24}/></button>
                    </div>
                  </div>
                  <div className="ev-cols">
                    <div>
                      <div className="ev-col-head">Today</div>
                      {todayEvents.length===0&&<div className="empty">ไม่มีงานวันนี้</div>}
                      {todayEvents.map(e=>(
                        <div className="ev-item" key={e.id}>
                          <span className="ev-time">{e.startTime||""}{e.endTime?`–${e.endTime}`:""}</span>
                          <div className="ev-body"><div className="ev-title">{e.title}</div>{e.note&&<div className="ev-note">{e.note}</div>}</div>
                          <button className="del-btn" onClick={()=>deleteEvent(e.id)}><Trash2 size={20}/></button>
                        </div>
                      ))}
                    </div>
                    <div>
                      <div className="ev-col-head">Upcoming</div>
                      {upcomingEvents.length===0&&<div className="empty">ไม่มีงานที่จะมาถึง</div>}
                      {upcomingEvents.slice(0,5).map(e=>(
                        <div className="ev-item" key={e.id}>
                          <div className="ev-body">
                            <div className="ev-title">{e.title}</div>
                            <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap"}}>
                              <span className="ev-date-badge">{dayLabel(e.startDate)}{e.startTime?` ${e.startTime}`:""}</span>
                              {e.note&&<span className="ev-note">{e.note}</span>}
                            </div>
                          </div>
                          <button className="del-btn" onClick={()=>deleteEvent(e.id)}><Trash2 size={20}/></button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="card">
                  <div className="card-head">
                    <StickyNote size={27}/> Notes
                    <div className="card-head-right">
                      <button className="icon-btn" onClick={()=>{setEditNote(null);setShowNoteModal(true);}}><Plus size={27}/></button>
                    </div>
                  </div>
                  {notes.length===0&&<div className="empty">ยังไม่มีโน้ต กด + เพื่อเพิ่ม</div>}
                  <div className="notes-grid">
                    {visibleNotes.map(n=>(
                      <div key={n.id} className={`note-card ${n.color}`}>
                        <div className="note-actions">
                          <button className="note-action-btn" onClick={()=>openEditNote(n)}><Edit3 size={17}/></button>
                          <button className="note-action-btn" onClick={()=>removeNote(n.id)}><Trash2 size={17}/></button>
                        </div>
                        {n.text}
                      </div>
                    ))}
                  </div>
                  {hiddenNotes>0&&(
                    <button className="show-more-btn" onClick={()=>setNotesExpanded(e=>!e)}>
                      {notesExpanded?<>แสดงน้อยลง<ChevronUp size={21}/></>:<>แสดงอีก {hiddenNotes} โน้ต<ChevronDown size={21}/></>}
                    </button>
                  )}
                </div>
                <HistoryPanel activity={data.activity}/>
              </>
            )}
            {page===1&&<FinancePage data={data} persist={persist}/>}
            {page===2&&<TrackerPage data={data} persist={persist}/>}
            {page===3&&<HealthPage data={data} persist={persist}/>}
            {page===4&&<DocumentPage data={data} persist={persist}/>}
            {page===5&&<BookQueuePage data={data} persist={persist}/>}
            {page===6&&<JournalPage data={data} persist={persist}/>}
          </div>
          {page===0&&(
            <div className="hero-panel">
              <div className="hero-top">
                <div className="hero-avatar">O</div>
                <div style={{flex:1}}>
                  <div className="hero-name">{greetText} 👋</div>
                  <div className="hero-sub">คุณโอห์ม · {dateStr}</div>
                </div>
              </div>
              <div className="hero-stage">
                <div className="hero-bubble">{assistantMessage}</div>
                <div className="hero-illustration"><GreetIcon size={72}/></div>
                <div className="hero-podium"/>
              </div>
              <div className="hero-brand">เลขาส่วนตัว ✨</div>
              <div className="hero-tagline">สมองที่สองของคุณ · จำแทนคุณทุกอย่าง</div>
              <div className="hero-time-badge">{timeStr}</div>
              <MomentumCard data={data} onOpen={()=>setPage(2)}/>
              <div className="hero-tiles">
                <div className="hero-tile" onClick={()=>setPage(2)} role="button">
                  <div className="hero-tile-icon"><ListTodo size={18}/></div>
                  <div className="hero-tile-value">{doneTodayCount}<span className="hero-tile-total">/{totalTodoCount}</span></div>
                  <div className="hero-tile-label">งานวันนี้</div>
                  <div className="hero-tile-sub" style={{color:"#34d399"}}>{Math.round(rings.todo)}% แล้ว</div>
                </div>
                <div className="hero-tile" onClick={()=>setPage(2)} role="button">
                  <div className="hero-tile-icon"><Target size={18}/></div>
                  <div className="hero-tile-value">{(data.projects||[]).length}</div>
                  <div className="hero-tile-label">โปรเจกต์</div>
                  <div className="hero-tile-sub" style={{color:"#60a5fa"}}>เฉลี่ย {Math.round(rings.goals)}%</div>
                </div>
                <div className="hero-tile" onClick={()=>setPage(5)} role="button">
                  <div className="hero-tile-icon"><BookOpen size={18}/></div>
                  <div className="hero-tile-value">{bookStats.reading}<span className="hero-tile-total">/{bookStats.total}</span></div>
                  <div className="hero-tile-label">หนังสือ</div>
                  <div className="hero-tile-sub" style={{color:"#fbbf24"}}>อ่านแล้ว {bookStats.done} เล่ม</div>
                </div>
              </div>
              <button className="hero-tile hero-tile-cta hero-cta-full" onClick={()=>setShowQuick(true)}>
                <div className="hero-cta-title">✨ Quick Capture</div>
                <div className="hero-cta-sub">จดอะไรก็ได้ ทันที</div>
                <div className="hero-cta-arrow"><ArrowRight size={18}/></div>
              </button>
              {todayEvents[0]&&(
                <div className="hero-next-event">
                  <div className="hero-next-label">⏰ งานถัดไปวันนี้</div>
                  <div className="hero-next-title">{todayEvents[0].title}</div>
                  {todayEvents[0].startTime&&<div className="hero-next-time">{todayEvents[0].startTime}{todayEvents[0].endTime?`–${todayEvents[0].endTime}`:""}</div>}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
      <PageNav page={page} setPage={setPage}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SecretaryDashboard/>);
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW register failed", err));
  });
}
</script>
</body>
</html>
