        )}
        {step==="preview"&&(
          <div className="modal-foot">
            <button className="modal-btn-cancel" onClick={()=>{setStep("pick");setParsed(null);}}>ย้อนกลับ</button>
            <button className="modal-btn-save" disabled={isDuplicate&&!dupChoice} onClick={()=>doSave(dupChoice==="replace")}>
              {isDuplicate&&!dupChoice?"เลือกวิธีบันทึกก่อน":"บันทึกลงรายรับ-รายจ่าย"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
/* ═══ เดาหมวดรายจ่ายอัตโนมัติ (ช่วยสลาย "อื่นๆ" ก้อนใหญ่) ═══
   2 ชั้น: (1) map ที่ "เรียนรู้" จากทุกครั้งที่ผู้ใช้กดย้ายหมวดเอง — แม่นที่สุดเพราะเป็นข้อมูลจริงของผู้ใช้
           (2) กฎคำค้นตั้งต้น สำหรับ memo ที่ไม่เคยเจอ
   ทั้งสองชั้นเป็นแค่ "ข้อเสนอ" เสมอ ต้องกดยืนยันเองทุกครั้ง ไม่มี auto-save เงียบๆ */
const MEMO_CAT_KEY="secretary-memo-cat-map";
const memoKey=(m)=>String(m||"").toLowerCase().replace(/\s+/g," ").trim();
function loadMemoCatMap(){ try{ return JSON.parse(localStorage.getItem(MEMO_CAT_KEY)||"{}")||{}; }catch(e){ return {}; } }
function saveMemoCatMap(map){ try{ localStorage.setItem(MEMO_CAT_KEY,JSON.stringify(map)); }catch(e){} }
const CATEGORY_RULES=[
  {cat:"อาหาร/เครื่องดื่ม",kw:["7-eleven","7 eleven","seven","เซเว่น","cafe","คาเฟ่","coffee","กาแฟ","starbucks","อเมซอน","amazon cafe","ร้านอาหาร","restaurant","ก๋วยเตี๋ยว","ข้าว","ส้มตำ","หมูกระทะ","shabu","ชาบู","ปิ้งย่าง","kfc","mcdonald","แมค","pizza","สุกี้","mk ","บุฟเฟ่","grabfood","lineman","line man","foodpanda","robinhood","เบเกอรี","bakery","ชานม","น้ำ​ปั่น"]},
  {cat:"ของใช้/ซูเปอร์",kw:["lotus","โลตัส","bigc","big c","บิ๊กซี","makro","แม็คโคร","tops","villa market","cp fresh","ซูเปอร์","supermarket","watsons","วัตสัน","ร้านสะดวกซื้อ","ikea","homepro","โฮมโปร","ไทวัสดุ","dohome"]},
  {cat:"เดินทาง/น้ำมัน",kw:["ptt","ปตท","บางจาก","bangchak","shell","เชลล์","esso","caltex","ปั๊ม","น้ำมัน","grab","bolt","taxi","แท็กซี่","bts","mrt","ทางด่วน","easy pass","m-pass","จอดรถ","parking","วินมอเตอร์ไซค์"]},
  {cat:"ช้อปปิ้งออนไลน์",kw:["shopee","ช้อปปี้","lazada","ลาซาด้า","tiktok shop","jd central","kerry","flash express","ไปรษณีย์"]},
  {cat:"บันเทิง/สมาชิกรายเดือน",kw:["netflix","spotify","youtube premium","disney","iqiyi","viu","wetv","steam","google play","app store","icloud","openai","chatgpt","claude","canva","adobe","โรงหนัง","major","sf cinema"]},
  {cat:"สุขภาพ",kw:["โรงพยาบาล","hospital","คลินิก","clinic","ร้านขายยา","pharmacy","เภสัช","ทันตกรรม","dental","ฟิตเนส","fitness","gym","แล็บ"]},
  {cat:"ค่าสาธารณูปโภค",kw:["การไฟฟ้า","การประปา","ค่าน้ำ","ค่าไฟ","ais","true","dtac","3bb","nt ","อินเทอร์เน็ต","internet","ค่าโทรศัพท์"]},
  {cat:"ค่าธรรมเนียม/ดอกเบี้ย",kw:["ค่าธรรมเนียม","ธรรมเนียม","fee","ดอกเบี้ย","interest","ปรับ"]},
];
/* คืน {cat,by} — by = "learned" (เคยย้ายเอง) | "rule" (กฎคำค้น) | null */
function guessCategory(memo,map){
  const k=memoKey(memo);
  if(!k) return null;
  if(map&&map[k]) return {cat:map[k],by:"learned"};
  for(const r of CATEGORY_RULES){ if(r.kw.some(w=>k.includes(w))) return {cat:r.cat,by:"rule"}; }
  return null;
}
function RecategorizeModal({finance,persist,onClose,startCat}) {
  const expenses=finance.finance.expenses||[];
  const allCats=[...new Set(expenses.map(e=>e.category).filter(Boolean))].sort();
  const [srcCat,setSrcCat]=useState(startCat&&allCats.includes(startCat)?startCat:(allCats.includes("อื่นๆ")?"อื่นๆ":allCats[0]||""));
  const [picked,setPicked]=useState(()=>new Set());
  const [target,setTarget]=useState("");
  const [newCat,setNewCat]=useState("");
  const [catMap,setCatMap]=useState(loadMemoCatMap);
  const [splitRow,setSplitRow]=useState(null);   // แยกได้เฉพาะกลุ่มที่มีรายการเดียว
  const applySplit=(newRows)=>{
    persist({...finance,finance:{...finance.finance,
      expenses:[...expenses.filter(e=>e.id!==splitRow.id),...newRows]}});
    setSplitRow(null); setPicked(new Set());
  };
  const pool=expenses.filter(e=>e.category===srcCat);
  const groups={};
  pool.forEach(e=>{
    const k=(e.memo||"").trim()||"(ไม่มีโน้ต)";
    if(!groups[k]) groups[k]={memo:k,ids:[],total:0,count:0};
    groups[k].ids.push(e.id); groups[k].total+=expOut(e); groups[k].count++;
  });
  Object.values(groups).forEach(g=>{ g.guess=g.memo==="(ไม่มีโน้ต)"?null:guessCategory(g.memo,catMap); });
  const groupList=Object.values(groups).sort((a,b)=>b.total-a.total);
  /* สรุปข้อเสนอ: จัดกลุ่มที่เดาได้ตามหมวดปลายทาง เพื่อกดเลือกทีเดียวทั้งหมวด */
  const suggestions={};
  groupList.forEach(g=>{
    if(!g.guess||g.guess.cat===srcCat) return;
    const c=g.guess.cat;
    if(!suggestions[c]) suggestions[c]={cat:c,ids:[],total:0,groups:0,learned:0};
    suggestions[c].ids.push(...g.ids); suggestions[c].total+=g.total; suggestions[c].groups++;
    if(g.guess.by==="learned") suggestions[c].learned++;
  });
  const sugList=Object.values(suggestions).sort((a,b)=>b.total-a.total);
  const pickSuggestion=(sg)=>{ setPicked(new Set(sg.ids)); setTarget(sg.cat); setNewCat(""); };
  const learn=(rows,cat)=>{
    const nm={...catMap};
    rows.forEach(e=>{ const k=memoKey(e.memo); if(k) nm[k]=cat; });
    saveMemoCatMap(nm); setCatMap(nm);
  };
  /* ย้ายทุกกลุ่มที่เดาได้พร้อมกัน — ยังต้องกดยืนยันผ่าน confirm */
  const applyAllGuesses=()=>{
    const plan={};
    groupList.forEach(g=>{ if(g.guess&&g.guess.cat!==srcCat) g.ids.forEach(id=>{ plan[id]=g.guess.cat; }); });
    const cnt=Object.keys(plan).length;
    if(!cnt) return;
    const summary=sugList.map(x=>`${x.cat} (${x.ids.length})`).join(", ");
    if(!window.confirm(`ย้าย ${cnt} รายการตามที่ระบบเดา?\n\n${summary}\n\nย้อนกลับได้โดยจัดหมวดใหม่อีกครั้ง`)) return;
    persist({...finance,finance:{...finance.finance,
      expenses:expenses.map(e=>plan[e.id]?{...e,category:plan[e.id]}:e)}});
    const nm={...catMap};
    expenses.forEach(e=>{ if(plan[e.id]){ const k=memoKey(e.memo); if(k) nm[k]=plan[e.id]; } });
    saveMemoCatMap(nm); setCatMap(nm);
    setPicked(new Set());
  };
  const toggleGroup=(g)=>setPicked(prev=>{
    const n=new Set(prev);
    const on=g.ids.every(id=>n.has(id));
    g.ids.forEach(id=>on?n.delete(id):n.add(id));
    return n;
  });
  const pickedTotal=pool.filter(e=>picked.has(e.id)).reduce((a,e)=>a+expOut(e),0);
  const finalTarget=(newCat.trim()||target).trim();
  const apply=()=>{
    if(!finalTarget||picked.size===0) return;
    persist({...finance,finance:{...finance.finance,
      expenses:expenses.map(e=>picked.has(e.id)?{...e,category:finalTarget}:e)}});
    learn(pool.filter(e=>picked.has(e.id)),finalTarget);   // จำไว้ใช้เดาครั้งหน้า
    setPicked(new Set()); setNewCat("");
  };
  return (
    <>
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal recat-modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>🗂️ จัดหมวดหมู่ใหม่</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="modal-body">
          <div className="recat-hint">รายการที่โน้ตเหมือนกันถูกจับกลุ่มไว้แล้ว — กดเลือกทีเดียวได้ทั้งกลุ่ม · ป้าย <b style={{color:"#34d399"}}>เขียว</b> = เคยย้ายโน้ตนี้เอง, <b style={{color:"var(--ink-3)"}}>ม่วง</b> = เดาจากคำในโน้ต</div>
          <div>
            <label className="field-label">จัดหมวดจาก</label>
            <select className="modal-input" style={{cursor:"pointer"}} value={srcCat} onChange={e=>{setSrcCat(e.target.value);setPicked(new Set());}}>
              {allCats.map(c=><option key={c} value={c}>{c} ({expenses.filter(x=>x.category===c).length} รายการ)</option>)}
            </select>
          </div>
          {sugList.length>0&&(
            <div className="recat-action" style={{marginTop:12}}>
              <div style={{fontSize:11.5,color:"var(--ink-3)",marginBottom:8}}>
                ระบบเดาหมวดให้ได้ {sugList.reduce((a,x)=>a+x.ids.length,0)} รายการ — กดหมวดเพื่อเลือกทั้งชุด แล้วตรวจก่อนย้าย
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {sugList.map(sg=>(
                  <button key={sg.cat} className="recat-group" style={{width:"auto",padding:"6px 12px"}} onClick={()=>pickSuggestion(sg)}>
                    <span className="recat-memo">{sg.cat}</span>
                    <span className="recat-count">×{sg.ids.length}</span>
                    <span className="recat-amt">฿{Math.round(sg.total).toLocaleString()}</span>
                  </button>
                ))}
              </div>
              <button className="modal-btn-save" style={{marginTop:10,width:"100%",opacity:.9}} onClick={applyAllGuesses}>
                ย้ายทั้งหมดตามที่เดา ({sugList.reduce((a,x)=>a+x.ids.length,0)} รายการ)
              </button>
            </div>
          )}
          <div className="recat-list">
            {groupList.length===0&&<div className="empty">ไม่มีรายการในหมวดนี้</div>}
            {groupList.map(g=>{
              const on=g.ids.every(id=>picked.has(id));
              const one=g.count===1?pool.find(e=>e.id===g.ids[0]):null;
              const single=one&&one.amount<0?one:null;   // รายการคืนเงิน (บวก) แยกไม่ได้
              return (
                <div key={g.memo} style={{display:"flex",alignItems:"center",gap:6}}>
                <button className={`recat-group ${on?"on":""}`} style={{flex:1}} onClick={()=>toggleGroup(g)}>
                  <span className={`status-btn ${on?"done":""}`} style={{width:22,height:22}}>{on&&<Check size={14}/>}</span>
                  <span className="recat-memo">{g.memo}</span>
                  {g.guess&&g.guess.cat!==srcCat&&(
                    <span className="recat-count" style={{color:g.guess.by==="learned"?"#34d399":"var(--ink-3)"}}
                      title={g.guess.by==="learned"?"เคยย้ายโน้ตนี้ไปหมวดนี้มาก่อน":"เดาจากคำในโน้ต"}>
                      → {g.guess.cat}
                    </span>
                  )}
                  {g.count>1&&<span className="recat-count">×{g.count}</span>}
                  <span className="recat-amt">฿{g.total.toLocaleString()}</span>
                </button>
                {single&&<button className="del-btn" title="แยกรายการนี้เป็นหลายหมวด" onClick={()=>setSplitRow(single)}><SplitIcon size={12}/></button>}
                </div>
              );
            })}
          </div>
          {picked.size>0&&(
            <div className="recat-action">
              <div style={{fontSize:12.5,color:"var(--ink-3)",marginBottom:8}}>เลือกไว้ <b>{picked.size}</b> รายการ · ฿{pickedTotal.toLocaleString()}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <select className="modal-input" style={{flex:1,minWidth:150,cursor:"pointer"}} value={target} onChange={e=>{setTarget(e.target.value);setNewCat("");}}>
                  <option value="">— ย้ายไปหมวด —</option>
                  {allCats.filter(c=>c!==srcCat).map(c=><option key={c} value={c}>{c}</option>)}
                </select>
                <input className="modal-input" style={{flex:1,minWidth:150}} placeholder="หรือพิมพ์หมวดใหม่" value={newCat} onChange={e=>{setNewCat(e.target.value);setTarget("");}}/>
              </div>
              <button className="modal-btn-save" style={{marginTop:10,width:"100%"}} disabled={!finalTarget} onClick={apply}>
                ย้าย {picked.size} รายการ → {finalTarget||"…"}
              </button>
            </div>
          )}
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ปิด</button></div>
      </div>
    </div>
    {/* วางนอก backdrop ของ modal จัดหมวด ไม่งั้นคลิกปิด modal ซ้อนจะ bubble ไปปิดตัวนอกด้วย */}
    {splitRow&&<SplitExpenseModal row={splitRow} catOptions={allCats.length?allCats:["อื่นๆ"]} onClose={()=>setSplitRow(null)} onApply={applySplit}/>}
    </>
  );
}

function ProjectCard({project,data,onOpen}) {
  const prog=projectProgress(project,data);
  const health=projectHealth(project,data);
  const cat=goalCategoryInfo(project.category); const CatIcon=cat.icon;
  const pri=goalPriorityInfo(project.priority);
  const tasks=projectTasks(data,project.id);
  const doneCount=tasks.filter(t=>taskDoneOn(t)).length;
  const dLeft=daysUntil(project.targetDate);
  const exp=expectedProgress(project);
  const curVal=projectCurrentValue(project,data);
  const nextMs=nextMilestone(project,prog);
  return (
    <button className="prj-card" style={{"--goal-color":project.color}} onClick={()=>onOpen(project.id)}>
      <div className="goal-card-top">
        <div className="goal-cat-badge" style={{background:`${project.color}22`,color:project.color}}><CatIcon size={14}/> {cat.label}</div>
        <div className="goal-priority-dot" style={{background:pri.color}}/>
      </div>
      <div className="prj-card-title">{project.title}</div>
      <div className="prj-bar-wrap">
        <div className="prj-bar">
          <div className="prj-bar-fill" style={{width:`${prog}%`,background:project.color}}/>
          {exp!=null&&prog<100&&<div className="prj-bar-marker" style={{left:`${Math.min(100,exp)}%`}} title={`ควรอยู่ที่ ${Math.round(exp)}%`}/>}
          {sortedMilestones(project).map(m=>(
            <div key={m.id} className={`prj-bar-ms ${prog>=Number(m.pct)?"hit":""}`} style={{left:`${Math.min(100,Number(m.pct))}%`,"--goal-color":project.color}} title={`${milestoneLabel(m)} · ${m.pct}%`}/>
          ))}
        </div>
        <span className="prj-bar-pct" style={{color:project.color}}>{prog}%</span>
      </div>
      {nextMs&&<div className="prj-card-next-ms"><Flag size={13}/> หมุดถัดไป {milestoneLabel(nextMs)} · อีก {Math.max(0,Math.ceil(Number(nextMs.pct)-prog))}%</div>}
      <div className="prj-card-foot">
        <span className="prj-health-badge" style={{background:`${health.color}1f`,color:health.color}}>● {health.label}</span>
        {project.measureType==="numeric"
          ? <span className="prj-card-sub">{curVal.toLocaleString()} / {(project.targetValue||0).toLocaleString()} {project.unit}</span>
          : project.measureType==="tasks"
            ? <span className="prj-card-sub">{doneCount}/{tasks.length} งาน</span>
            : <span className="prj-card-sub">กำหนดเอง</span>}
        {project.targetDate&&<span className="prj-card-sub">{dLeft<0?`เลย ${Math.abs(dLeft)} วัน`:`เหลือ ${dLeft} วัน`}</span>}
      </div>
    </button>
  );
}
/* ═══ ข้อ 24/6: หน้า Tracker เป็น bento ตามธรรมนูญข้อ 32 ═══
   สถานะโปรเจกต์ 5 กลุ่ม — สีเป็น hex ไม่ใช่ var() เพราะ DashDonut ยัดลง SVG stroke */
const TRK_BUCKETS=[
  {key:"overdue",label:"เลยกำหนด",color:"#f87171"},
  {key:"behind",label:"ช้ากว่าแผน",color:"#fb923c"},
  {key:"ontrack",label:"ตามแผน",color:"#10b981"},
  {key:"done",label:"สำเร็จแล้ว",color:"#6ee7b7"},
  {key:"paused",label:"พักไว้",color:"#4d7f6c"},
];
function TodayPanel({data,persist,onOpenProject,onAddTask,onEditTask}) {
  const tasks=data.tasks||[];
  const projById={}; (data.projects||[]).forEach(p=>projById[p.id]=p);
  const todayList=tasks.filter(taskIsDueToday);
  const overdue=todayList.filter(taskIsOverdue);
  const recurring=todayList.filter(t=>isRecurring(t));
  const dueToday=todayList.filter(t=>!isRecurring(t)&&!taskIsOverdue(t));
  const doneCount=todayList.filter(t=>taskDoneOn(t)).length;
  const pct=todayList.length?Math.round((doneCount/todayList.length)*100):0;
  const toggleTask=(id)=>{
    const t=tasks.find(x=>x.id===id);
    const willBeDone=!taskDoneOn(t);
    persist({...data,tasks:toggleTaskInList(tasks,id),activity:willBeDone?logActivity(data,{source:"task",text:`ทำงานสำเร็จ "${t.title}"`,status:"completed"}):data.activity});
  };
  const delTask=(id)=>persist({...data,tasks:tasks.filter(x=>x.id!==id)});
  const group=(label,list)=>list.length>0&&(
    <>
      <div className="trk-section-label">{label} ({list.length})</div>
      {list.map(t=><TaskRow key={t.id} task={t} project={projById[t.projectId]} showProject onToggle={toggleTask} onEdit={onEditTask} onDelete={delTask}/>)}
    </>
  );
  /* ปุ่ม + ในหัวการ์ดถูกถอดออก — ปุ่มเพิ่มข้อมูลของหน้าเหลือปุ่มเดียวในฮีโร่ (ข้อ 32/2) */
  return (
    <div className="db-card db-span2">
      <div className="db-head">
        <div><div className="db-title">งานวันนี้</div><div className="db-note">{thaiDate(todayISO())}</div></div>
        <div className="db-bignum-inline db-mono">{doneCount}<span>/{todayList.length}</span></div>
      </div>
      <div className="db-track trk-today-track"><div className="db-fill" style={{width:`${pct}%`}}/></div>
      {todayList.length===0&&<div className="db-empty">ไม่มีงานค้างวันนี้ 🎉 กด “เพิ่มข้อมูล” ด้านบนถ้าอยากเพิ่มงาน</div>}
      {group("⚠️ เลยกำหนด",overdue)}
      {group("📅 ครบกำหนดวันนี้",dueToday)}
      {group("🔁 งานประจำ",recurring)}
    </div>
  );
}
function TrackerPage({data,persist}) {
  const [openId,setOpenId]=useState(null);
  const [showProjModal,setShowProjModal]=useState(false);
  const [editProj,setEditProj]=useState(null);
  const [showTaskModal,setShowTaskModal]=useState(false);
  const [editTask,setEditTask]=useState(null);
  const [showAddPicker,setShowAddPicker]=useState(false);
  const [filter,setFilter]=useState("active");
  /* ต้องเรียก hook ก่อน early return ของหน้ารายละเอียดโปรเจกต์ ไม่งั้นผิด rules of hooks */
  const rl=useRowLimit(6);
  const projects=data.projects||[];
  const openProject=projects.find(p=>p.id===openId);
  const saveProject=(p)=>{
    const ex=projects.find(x=>x.id===p.id);
    persist({...data,projects:ex?projects.map(x=>x.id===p.id?p:x):[...projects,p],activity:ex?data.activity:logActivity(data,{source:"goal",text:`สร้างโปรเจกต์ "${p.title}"`})});
    setShowProjModal(false); setEditProj(null);
  };
  const saveTask=(t)=>{
    const ex=(data.tasks||[]).find(x=>x.id===t.id);
    persist({...data,tasks:ex?(data.tasks||[]).map(x=>x.id===t.id?t:x):[...(data.tasks||[]),t],activity:ex?data.activity:logActivity(data,{source:"task",text:`เพิ่มงาน "${t.title}"`})});
    setShowTaskModal(false); setEditTask(null);
  };
  const delProject=(id)=>{
    if(!confirm("ลบโปรเจกต์นี้? งานและ check-in ทั้งหมดในโปรเจกต์จะถูกลบด้วย")) return;
    persist({...data,projects:projects.filter(p=>p.id!==id),tasks:(data.tasks||[]).filter(t=>t.projectId!==id),checkins:(data.checkins||[]).filter(c=>c.projectId!==id)});
    setOpenId(null);
  };
  if(openProject) return (
    <div className="page-content trk-page">
      {showProjModal&&<ProjectModal initial={editProj} onClose={()=>{setShowProjModal(false);setEditProj(null);}} onSave={saveProject}/>}
      <ProjectDetail project={openProject} data={data} persist={persist} onBack={()=>setOpenId(null)} onEdit={p=>{setEditProj(p);setShowProjModal(true);}}/>
      <div className="trk-del-row">
        <button className="del-txt-btn" onClick={()=>delProject(openProject.id)}><Trash2 size={12}/> ลบโปรเจกต์นี้</button>
      </div>
    </div>
  );
  const withProg=projects.map(p=>({...p,_prog:projectProgress(p,data),_health:projectHealth(p,data)}));

  const bucketOf=(h)=>(h.key==="overdue"||h.key==="behind"||h.key==="done"||h.key==="paused")?h.key:"ontrack";

          <div className="db-bignum">

/* ═══════════════════════════════════════════════════════════════════
   ข้อ 56 ขั้นที่ 7A: Health — ติดตามการนอน · ออกกำลังกาย · ดื่มน้ำ (ไม่ติดตามการกิน) + ทดสอบสมรรถนะทุก 3 เดือน
   ข้อมูล (root):
     healthDaily[]    = {id, date, sleepMin?, waterL?, steps?, restingHR?, weight?, exercise?:[{id,type,min,note,src}], src?}  วันละ 1 รายการ
                        (ขั้นที่ 8: Garmin → Apple Health → iOS Shortcuts → Jack จะเติม sleepMin/steps/restingHR/exercise ให้เอง)
     healthSettings   = {sleepGoalMin, waterGoalL}
     fitnessTests[]   = {id, date, values:{<field>:number}, notes}
     checkups[]       = ขั้นที่ 7B (import PDF ใบตรวจสุขภาพ)
   Jack ไม่แปลผลทางการแพทย์ · ชื่อฟิลด์ต้องตรงกับ line-bot/Bot.gs (HEALTH_* / FITNESS_FIELDS)
   ═══════════════════════════════════════════════════════════════════ */
const HEALTH_DEFAULTS={sleepGoalMin:420,waterGoalL:2};
const EXERCISE_TYPES=["วิ่ง","เดิน","ปั่นจักรยาน","ว่ายน้ำ","เวทเทรนนิ่ง","โยคะ/ยืดเหยียด","กีฬา","อื่นๆ"];
const FITNESS_FIELDS=[
  {k:"run12",l:"วิ่ง/เดิน 12 นาที",u:"ม.",dir:1,radar:"วิ่ง 12'"},
  {k:"pushup",l:"วิดพื้น strict สูงสุด",u:"ครั้ง",dir:1,radar:"วิดพื้น"},
  {k:"pullup",l:"ดึงข้อ strict สูงสุด",u:"ครั้ง",dir:1,radar:"ดึงข้อ"},
  {k:"plank",l:"แพลงก์ค้างนานสุด",u:"วินาที",dir:1,radar:"แพลงก์"},
  {k:"squat60",l:"สควอท 60 วินาที",u:"ครั้ง",dir:1,radar:"สควอท"},
  {k:"kneeWallL",l:"Knee-to-wall ซ้าย (ดีสุด)",u:"ซม.",dir:1},
  {k:"kneeWallR",l:"Knee-to-wall ขวา (ดีสุด)",u:"ซม.",dir:1},
  {k:"gripL",l:"แรงบีบมือ ซ้าย (ดีสุด 3 ครั้ง)",u:"กก.",dir:1},
  {k:"gripR",l:"แรงบีบมือ ขวา (ดีสุด 3 ครั้ง)",u:"กก.",dir:1},
  {k:"sitReach",l:"นั่งงอตัว sit-and-reach",u:"ซม.",dir:1,radar:"ยืดหยุ่น"},
  {k:"vo2max",l:"VO2max (Garmin)",u:"",dir:1,radar:"VO2max"},
  {k:"rhr",l:"ชีพจรขณะพัก (Garmin)",u:"bpm",dir:-1},
  {k:"weight",l:"น้ำหนัก",u:"กก.",dir:0},
  {k:"waist",l:"รอบเอว (เฉลี่ย 2 ครั้ง)",u:"ซม.",dir:-1},
];
const FITNESS_EVERY_DAYS=90;
function healthSettings(data){ return {...HEALTH_DEFAULTS,...((data&&data.healthSettings)||{})}; }
function healthDayMap(data){ const m={}; ((data&&data.healthDaily)||[]).forEach(h=>{ if(h&&h.date&&!m[h.date]) m[h.date]=h; }); return m; }
function sortedTests(data){ return ((data&&data.fitnessTests)||[]).filter(t=>t&&t.date).slice().sort((a,b)=>a.date.localeCompare(b.date)); }
function fmtSleep(min){ if(min==null||min==="") return "–"; const m=Math.round(Number(min)); return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`; }
function exMinutes(h){ return ((h&&h.exercise)||[]).reduce((a,e)=>a+(Number(e.min)||0),0); }
/* ค่าที่ "ดีขึ้น" เทียบกับครั้งก่อน (dir 0 = ไม่นับ เช่นน้ำหนัก) */
function fitnessImprovements(prev,cur){
  if(!prev||!cur) return [];
  return FITNESS_FIELDS.filter(f=>f.dir!==0).filter(f=>{
    const a=Number(prev.values&&prev.values[f.k]), b=Number(cur.values&&cur.values[f.k]);
    return isFinite(a)&&isFinite(b)&&prev.values[f.k]!==""&&cur.values[f.k]!==""&&prev.values[f.k]!=null&&cur.values[f.k]!=null&&(f.dir>0?b>a:b<a);
  });
}
/* ย้ายข้อมูล health แบบเก่า {date,weight,energy,sleep,mood} → healthDaily ครั้งเดียว (ข้ามแถวตัวอย่างของแอป h1/h2 น้ำหนัก 70) */
function migrateOldHealth(d){
  if(d.healthMigrated) return null;
  const old=Array.isArray(d.health)?d.health:[];
  const demo=(h)=>(h.id==="h1"||h.id==="h2")&&Number(h.weight)===70;
  const daily=Array.isArray(d.healthDaily)?d.healthDaily.slice():[];
  const have=new Set(daily.map(h=>h.date));
  old.filter(h=>h&&h.date&&!demo(h)&&!have.has(h.date)).forEach(h=>{
    const it={id:uid(),date:h.date,src:"old"};
    if(Number(h.weight)>0) it.weight=Number(h.weight);
    if(Number(h.sleep)>0) it.sleepMin=Math.round(Number(h.sleep)*60);
    daily.push(it); have.add(h.date);
  });
  return {healthDaily:daily,healthMigrated:true};
}

function FitnessRadar({first,latest}){
  const axes=FITNESS_FIELDS.filter(f=>f.radar);
  const val=(t,f)=>{ const v=Number(t&&t.values&&t.values[f.k]); return isFinite(v)&&t.values[f.k]!==""&&t.values[f.k]!=null?v:null; };
  const pts=(t)=>axes.map((f,i)=>{ const a=val(first,f), b=val(latest,f), mx=Math.max(a||0,b||0), v=val(t,f); const r=mx>0&&v!=null?v/mx:0; const ang=-Math.PI/2+i*2*Math.PI/axes.length; return [100+Math.cos(ang)*80*r,100+Math.sin(ang)*80*r]; });
  const poly=(p)=>p.map(x=>x.map(n=>n.toFixed(1)).join(",")).join(" ");
  return (
    <svg viewBox="-22 -4 244 208" className="hl-radar" role="img" aria-label="กราฟใยแมงมุม ครั้งแรกเทียบล่าสุด">
      {[0.25,0.5,0.75,1].map(r=><polygon key={r} points={poly(axes.map((_,i)=>{const ang=-Math.PI/2+i*2*Math.PI/axes.length;return [100+Math.cos(ang)*80*r,100+Math.sin(ang)*80*r];}))} className="hl-radar-grid"/>)}
      {axes.map((f,i)=>{ const ang=-Math.PI/2+i*2*Math.PI/axes.length; return (
        <g key={f.k}><line x1="100" y1="100" x2={100+Math.cos(ang)*80} y2={100+Math.sin(ang)*80} className="hl-radar-grid"/>
          <text x={100+Math.cos(ang)*93} y={100+Math.sin(ang)*93+3} textAnchor="middle" className="hl-radar-lab">{f.radar}</text></g>); })}
      {first&&latest&&first!==latest&&<polygon points={poly(pts(first))} className="hl-radar-first"/>}
      {latest&&<polygon points={poly(pts(latest))} className="hl-radar-latest"/>}
    </svg>
  );
}
function FitnessTestModal({initial,prev,onClose,onSave,onDelete}){

        <div className="modal-body">
          <div className="pf-note">กติกา: เวลา/วอร์มอัพ/ลำดับเหมือนเดิมทุกครั้ง · วิ่ง 12 นาทีแยกวัน (กลับมาเติมทีหลังได้) · knee-to-wall ดีสุด 2–3 ครั้ง/ข้าง · แรงบีบมือดีสุด 3 ครั้ง/ข้าง · รอบเอวเฉลี่ย 2 ครั้ง · ไม่ต้องกรอกครบ</div>
          <div><label className="field-label">วันที่ทดสอบ</label><input type="date" className="modal-input" value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div className="hl-test-grid">

              <div key={f.k}>

                <input type="number" inputMode="decimal" className="modal-input" value={vals[f.k]} onChange={e=>setVals(v=>({...v,[f.k]:e.target.value}))} placeholder={pv!=null?`ครั้งก่อน ${pv}`:""}/>
              </div>); })}
          </div>
          <div><label className="field-label">หมายเหตุ</label><textarea className="modal-input" rows={2} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="เช่น นอนน้อย เจ็บเข่าซ้าย ทดสอบตอนเย็น"/></div>
        </div>

          <button className="modal-btn-cancel" onClick={onClose}>ยกเลิก</button>
          <button className="modal-btn-save" onClick={save} disabled={!any||!date}>บันทึก</button>
        </div>
      </div>
    </div>
  );

/* ═══ ข้อ 56 ขั้นที่ 7B: import ใบตรวจสุขภาพ (PDF ข้อความ ฟอร์มโรงพยาบาล QF-ART-39) ═══
   pdf.js → รายการข้อความพร้อมพิกัด (x,y) → อ่านตามตำแหน่งคอลัมน์ (ไม่ใช่ข้อความเรียงบรรทัด เพราะหน้าเป็น 2 คอลัมน์ ซ้าย=เลือด/ปัสสาวะ ขวา=เอกซเรย์/ชีพ ฯลฯ)
   **ไม่อ่าน/ไม่เก็บข้อมูลระบุตัวตน** (ชื่อ HN VN วันเกิด อายุ อาชีพ สังกัด สิทธิ์) — parser ไม่แตะบริเวณนั้นเลย เก็บแค่วันที่ตรวจ + ผล
   ฟอร์มเปลี่ยน → warnings + หน้ายืนยันแก้ค่าได้ (อนาคตค่อยใช้ AI สำรองตามแผนข้อ 56) */
const CHECKUP_FORM="QF-ART-39";
/* ฟอนต์ไทยใน PDF บางตัวใช้ตัวอักษรช่วง Private Use (U+F700–F71A) แทนวรรณยุกต์/สระที่ขยับตำแหน่ง → แปลงกลับเป็นตัวปกติ */
const THAI_PUA={"":"ฐ","":"ญ","":"ิ","":"ี","":"ึ","":"ื",
  "":"่","":"้","":"๊","":"๋","":"์","":"่","":"้","":"๊","":"๋","":"์",
  "":"ั","":"ํ","":"็","":"่","":"้","":"๊","":"๋","":"์","":"ุ","":"ู","":"ฺ"};
function fixThaiPua(s){ return String(s||"").replace(/[-]/g,c=>THAI_PUA[c]||"").replace(/ํา/g,"ำ"); }
const CHECKUP_BLOOD={"WBC":"เม็ดเลือดขาว","RBC":"เม็ดเลือดแดง","Platelet":"เกล็ดเลือด","Hemoglobin":"ฮีโมโกลบิน","Hematocrit":"ความเข้มข้นเม็ดเลือดแดง",
  "HbA1c":"น้ำตาลสะสม","Glucose":"น้ำตาลในเลือด","BUN":"ยูเรียในเลือด","Creatinine":"การทำงานของไต (ครีเอตินิน)","Uric":"กรดยูริก",
  "Total Cholesterol":"คอเลสเตอรอลรวม","Triglyceride":"ไตรกลีเซอไรด์","HDL-Cholesterol":"ไขมันดี HDL","LDL-(Calculate)":"ไขมันเลว LDL (คำนวณ)","LDL-direct":"ไขมันเลว LDL (วัดตรง)",
  "SGOT-AST":"เอนไซม์ตับ AST","SGPT-ALT":"เอนไซม์ตับ ALT","Albumin":"อัลบูมิน","ALP":"เอนไซม์ ALP","Total Bilirubin":"บิลิรูบินรวม","Total protein":"โปรตีนรวม","Syphilis IgG":"ซิฟิลิส"};
const CHECKUP_URINE={"Color":"สี","Clearity":"ความใส","Sp.gravity":"ความถ่วงจำเพาะ","PH":"ความเป็นกรด-ด่าง","Protein":"โปรตีน","Sugar":"น้ำตาล","Ketone":"คีโตน",
  "Nitrite":"ไนไตรท์","Bilirubin":"บิลิรูบิน","Urobilinogen":"ยูโรบิลิโนเจน","Leukocyte":"เม็ดเลือดขาว","Blood":"เม็ดเลือดแดง"};
const CHECKUP_VITALS=[{k:"bpSys",l:"ความดันตัวบน",u:"mmHg"},{k:"bpDia",l:"ความดันตัวล่าง",u:"mmHg"},{k:"pulse",l:"ชีพจร",u:"/min"},{k:"weight",l:"น้ำหนัก",u:"กก."},{k:"height",l:"ส่วนสูง",u:"ซม."},{k:"waist",l:"รอบเอว",u:"ซม."},{k:"bmi",l:"BMI",u:""}];
function checkupNum(v){ const s=String(v==null?"":v).trim(); return /^-?\d+(\.\d+)?$/.test(s)?Number(s):null; }
function parseCheckupItems(raw){
  const items=(raw||[]).map(t=>({p:t.p,x:t.x,y:t.y,s:fixThaiPua(t.s).replace(/\s+/g," ").trim()})).filter(t=>t.s);
  const warnings=[];
  const p1=items.filter(t=>t.p===1);
  const row=(y,x0,x1,pg)=>(pg||p1).filter(t=>Math.abs(t.y-y)<=3&&t.x>=x0&&t.x<x1).sort((a,b)=>a.x-b.x);
  const find=(re,pg)=>(pg||p1).find(t=>re.test(t.s));
  const isNum=s=>/^\d+(\.\d+)?$/.test(s);
  const form=items.some(t=>t.s.includes(CHECKUP_FORM));
  if(!form) warnings.push(`ไม่พบรหัสฟอร์ม ${CHECKUP_FORM} — ฟอร์มอาจเปลี่ยน โปรดตรวจทุกค่า`);
  /* วันที่ตรวจ (พ.ศ. → ค.ศ.) */
  let date=null;
  const dl=find(/วันที่ตรวจ/);
  if(dl){ const v=row(dl.y,dl.x+1,dl.x+200).map(t=>t.s).find(s=>/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)); if(v){ let [d,m,y]=v.split("/").map(Number); if(y>2400) y-=543; date=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; } }
  if(!date) warnings.push("อ่านวันที่ตรวจไม่ได้ — ใส่เองในหน้ายืนยัน");
  /* ตาราง: รหัส (คอลัมน์ x≈116) · ผล (x 180–236 ธง h/l แยกตัว) · ค่าปกติ (x 236–275) · หน่วย (x 275–300) */
  const table=(yTop,yBot,labels)=>{
    const out=[];
    p1.filter(t=>t.x>=108&&t.x<130&&t.y<yTop&&t.y>yBot).sort((a,b)=>b.y-a.y).forEach(c=>{
      const code=c.s; if(/^การตรวจ|^ผลการตรวจ/.test(code)) return;
      const vals=row(c.y,180,236);
      const flagIt=vals.find(t=>/^[hlHL]$/.test(t.s));
      const value=vals.filter(t=>t!==flagIt).map(t=>t.s).join(" ");
      let range=row(c.y,236,275).map(t=>t.s).join(" "), unit=row(c.y,275,300).map(t=>t.s).join(" ");
      const m=range.match(/^([<>≤≥]?\s*\d[\d.]*(?:\s*-\s*\d[\d.]*)?)\s*(.*)$/);
      if(m){ range=m[1].replace(/\s+/g,""); if(m[2]&&!unit) unit=m[2]; }
      unit=unit.replace(/\s*\/\s*/g,"/").replace(/^10\/ul$/i,"10³/ul").replace(/\s+/g," ").trim();
      out.push({code,label:labels[code]||fixThaiPua(code),value,num:checkupNum(value),flag:flagIt?flagIt.s.toLowerCase():"",range,unit});
    });
    return out;
  };
  const hb=find(/^การตรวจเลือด/), hu=find(/^การตรวจปัสสาวะ/);
  const blood=hb?table(hb.y-5,hu?hu.y+5:0,CHECKUP_BLOOD):[];
  const urine=hu?table(hu.y-5,20,CHECKUP_URINE):[];
  if(!blood.length) warnings.push("ไม่พบตารางผลเลือด");
  if(!urine.length) warnings.push("ไม่พบตารางผลปัสสาวะ");
  const unknown=blood.filter(r=>!CHECKUP_BLOOD[r.code]).concat(urine.filter(r=>!CHECKUP_URINE[r.code])).map(r=>r.code);
  if(unknown.length) warnings.push("มีรายการที่ไม่รู้จัก: "+unknown.join(", "));
  /* สัญญาณชีพ + น้ำหนัก/ส่วนสูง/รอบเอว/BMI (ตัวเลขอยู่บรรทัดเดียวกับป้าย แยกซ้าย/ขวาด้วยตำแหน่งป้ายถัดไป) */
  const nums=(lab,x1)=>lab?row(lab.y,lab.x+1,x1||700).filter(t=>isNum(t.s)).map(t=>Number(t.s)):[];
  const bp=nums(find(/Blood pressure/i));
  const tempL=find(/\(Temp\)/i), hL=find(/\(Height\)/i), bmiL=find(/^BMI/i);
  const vitals={bpSys:bp[0]??null,bpDia:bp[1]??null,pulse:nums(find(/\(pulse\)/i),tempL?tempL.x:700)[0]??null,
    weight:nums(find(/\(Weight\)/i),hL?hL.x:700)[0]??null,height:hL?(nums(hL)[0]??null):null,
    waist:nums(find(/\((Wist|Waist)/i),bmiL?bmiL.x:700)[0]??null,bmi:bmiL?(nums(bmiL)[0]??null):null};
  /* ข้อความสรุป: เอกซเรย์ / คลื่นไฟฟ้าหัวใจ / การได้ยิน / ฟัน (ค่าที่อยู่บรรทัดเดียวกับป้าย ไม่เอาเส้น ____) */
  const textRight=(lab)=>lab?row(lab.y,lab.x+1,700).map(t=>t.s).filter(s=>!/^_+$/.test(s)).join(" ").trim():"";
  const cl=find(/^Chest\s*:/i);
  let xray={impression:"",detail:""};
  if(cl){
    const lines=p1.filter(t=>t.x>=cl.x-5&&t.y<cl.y&&t.y>cl.y-110).sort((a,b)=>b.y-a.y).map(t=>t.s).filter(s=>!/^=+/.test(s)&&!/\bMD\.?$/i.test(s));
    const imp=lines.find(s=>/^IMPRESSION/i.test(s));
    xray={impression:imp?imp.replace(/^IMPRESSION\s*:?\s*/i,"").trim():"",detail:lines.filter(s=>s!==imp).join(" ")};
  }
  const ekgL=p1.find(t=>t.x>=290&&/^ผลการตรวจ_/.test(t.s));
  const ekg=textRight(ekgL);
  const hearing={right:textRight(p1.find(t=>t.x>=290&&/^หูขวา/.test(t.s))),left:textRight(p1.find(t=>t.x>=290&&/^หูซ้าย/.test(t.s)))};
  const gumL=p1.find(t=>/^สภาพเหงือก/.test(t.s));
  const dental={mouth:textRight(p1.find(t=>/^สภาพช่องปาก/.test(t.s))),gums:gumL?row(gumL.y,gumL.x+1,gumL.x+120).map(t=>t.s).filter(s=>!/^_+$/.test(s)&&!/^สภาพฟัน/.test(s)).join(" "):""};
  /* คำแนะนำแพทย์ (หน้า 2 คอลัมน์ขวา ใต้หัวข้อ "คำแนะนำ") */
  const al=items.find(t=>t.p===2&&/^คำแนะนำ$/.test(t.s));
  const advice=al?items.filter(t=>t.p===2&&t.x>=280&&t.y<al.y&&t.y>al.y-160).sort((a,b)=>b.y-a.y).map(t=>t.s).join("\n"):"";
  const ok=blood.length+urine.length>0;
  return {ok,form,date,blood,urine,vitals,xray,ekg,hearing,dental,advice,warnings};
}
async function extractPdfItems(file){
  await loadExternalScript(PDFJS_URL);
  const lib=window.pdfjsLib;
  if(!lib) throw new Error("โหลด pdf.js ไม่สำเร็จ");
  lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    tc.items.forEach(it=>{ if(String(it.str).trim()) out.push({p,x:Math.round(it.transform[4]),y:Math.round(it.transform[5]),s:it.str}); });
  }
  return out;
}

function checkupMonthLabel(d){ return new Date(d+"T00:00:00").toLocaleDateString("th-TH",{month:"short",year:"numeric",calendar:"buddhist"}); }
function CheckupImportModal({data,persist,onClose}){
  const api=useFireFiles();
  const [step,setStep]=useState("pick");
  const [err,setErr]=useState("");
  const [file,setFile]=useState(null);
  const [r,setR]=useState(null);
  const [attach,setAttach]=useState(true);
  const [msg,setMsg]=useState("");
  const pick=async(f)=>{
    if(!f) return;
    setErr(""); setFile(f); setStep("busy");
    try{
      const items=await extractPdfItems(f);
      const res=parseCheckupItems(items);
      if(!res.ok){ setErr("อ่านผลตรวจจากไฟล์นี้ไม่ได้ (อาจเป็นไฟล์สแกน/รูป หรือฟอร์มต่างจากเดิม) — ต้องเป็น PDF ที่มีข้อความ"); setStep("pick"); return; }
      setR({...res,date:res.date||todayISO()}); setStep("review");
    }catch(e){ setErr(String(e&&e.message||e)); setStep("pick"); }
  };
  const setRow=(tab,i,patch)=>setR(x=>({...x,[tab]:x[tab].map((row,j)=>j===i?{...row,...patch,...(patch.value!=null?{num:checkupNum(patch.value)}:{})}:row)}));
  const same=r&&(data.checkups||[]).find(c=>c.date===r.date);
  const save=async()=>{
    if(same&&!window.confirm(`มีผลตรวจวันที่ ${thaiDate(r.date)} อยู่แล้ว — แทนที่ด้วยไฟล์นี้?`)) return;
    const id=same?same.id:uid();
    const vit={}; CHECKUP_VITALS.forEach(v=>{ const n=checkupNum(r.vitals[v.k]); if(n!=null) vit[v.k]=n; });
    const item={id,date:r.date,form:r.form?CHECKUP_FORM:"",blood:r.blood,urine:r.urine,vitals:vit,xray:r.xray,ekg:r.ekg,hearing:r.hearing,dental:r.dental,advice:r.advice,importedAt:new Date().toISOString()};
    const list=data.checkups||[];
    persist({...data,checkups:same?list.map(c=>c.id===id?item:c):[...list,item],activity:logActivity(data,{source:"health",text:`นำเข้าผลตรวจสุขภาพ ${thaiDate(r.date)}`})});
    if(attach&&file&&api){
      if(api.needsToken&&api.needsToken()){ setMsg("บันทึกผลแล้ว — ยังไม่ได้อนุญาต Google Drive เลยยังไม่แนบ PDF (แนบทีหลังได้ที่รายการผลตรวจ)"); setStep("done"); return; }
      try{ setStep("busy"); await api.upload(file,{kind:"checkup",id}); }
      catch(e){ setMsg("บันทึกผลแล้ว แต่แนบ PDF ไม่สำเร็จ: "+(e&&e.message||e)+" — แนบทีหลังได้"); setStep("done"); return; }
    }
    onClose();
  };
  const flagCls=(f)=>f==="h"?" ck-h":f==="l"?" ck-l":"";
  const Table=({tab,title})=>(   /* เรียกเป็นฟังก์ชัน ไม่ใช่ <Table/> — กัน input หลุดโฟกัสทุกครั้งที่พิมพ์ */
    <div className="ck-tbl">
      <div className="field-label">{title}</div>
      {r[tab].map((row,i)=>(
        <div className={`ck-rrow${flagCls(row.flag)}`} key={row.code+i}>
          <span className="ck-rl">{row.label}<small>{row.code}</small></span>
          <input className="modal-input ck-rv" value={row.value} onChange={e=>setRow(tab,i,{value:e.target.value})}/>
          <select className="modal-input ck-rf" value={row.flag} onChange={e=>setRow(tab,i,{flag:e.target.value})}><option value="">ปกติ</option><option value="h">สูง (h)</option><option value="l">ต่ำ (l)</option></select>
          <span className="ck-rr">{row.range}{row.unit?` ${row.unit}`:""}</span>
        </div>
      ))}
    </div>
  );
  return (
    <div className="modal-backdrop" onClick={step==="busy"?undefined:onClose}>
      <div className="modal ck-modal" style={{maxWidth:720}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>นำเข้าผลตรวจสุขภาพ (PDF)</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="modal-body">
          {step==="pick"&&(<>
            <div className="pf-note">รองรับใบรายงานผลตรวจสุขภาพแบบ PDF ที่มีข้อความ (ฟอร์ม {CHECKUP_FORM}) · อ่านในเครื่องนี้เท่านั้น · <b>ไม่เก็บชื่อ HN วันเกิด หรือข้อมูลระบุตัวตน</b> เก็บแค่วันที่ตรวจและผล · ตรวจ/แก้ค่าก่อนบันทึกได้</div>
            <label className="db-chip pf-ok ck-pick">เลือกไฟล์ PDF<input type="file" accept="application/pdf,.pdf" style={{display:"none"}} onChange={e=>pick(e.target.files&&e.target.files[0])}/></label>
            {err&&<div className="slip-warn">{err}</div>}
          </>)}
          {step==="busy"&&<div className="db-empty">กำลังทำงาน…</div>}
          {step==="done"&&<div className="slip-warn">{msg}</div>}
          {step==="review"&&r&&(<>
            {r.warnings.length>0&&<div className="slip-warn">{r.warnings.map((w,i)=><div key={i}>⚠️ {w}</div>)}</div>}
            <div className="ck-top">
              <div><label className="field-label">วันที่ตรวจ</label><input type="date" className="modal-input" value={r.date} onChange={e=>setR(x=>({...x,date:e.target.value}))}/></div>
              {same&&<div className="ck-same">มีผลวันที่นี้อยู่แล้ว — บันทึกจะแทนที่</div>}

              ))}
            </div>
            {Table({tab:"blood",title:`ผลเลือด (${r.blood.length} รายการ)`})}
            {Table({tab:"urine",title:`ผลปัสสาวะ (${r.urine.length} รายการ)`})}
            <div className="ck-sum">
              <div><label className="field-label">เอกซเรย์ทรวงอก (สรุป)</label><input className="modal-input" value={r.xray.impression} onChange={e=>setR(x=>({...x,xray:{...x.xray,impression:e.target.value}}))}/></div>
              <div><label className="field-label">คลื่นไฟฟ้าหัวใจ</label><input className="modal-input" value={r.ekg} onChange={e=>setR(x=>({...x,ekg:e.target.value}))}/></div>
              <div><label className="field-label">การได้ยิน หูขวา</label><input className="modal-input" value={r.hearing.right} onChange={e=>setR(x=>({...x,hearing:{...x.hearing,right:e.target.value}}))}/></div>
              <div><label className="field-label">การได้ยิน หูซ้าย</label><input className="modal-input" value={r.hearing.left} onChange={e=>setR(x=>({...x,hearing:{...x.hearing,left:e.target.value}}))}/></div>
            </div>
            <div><label className="field-label">คำแนะนำจากแพทย์</label><textarea className="modal-input" rows={3} value={r.advice} onChange={e=>setR(x=>({...x,advice:e.target.value}))}/></div>
            {api&&<label className="ck-attach"><input type="checkbox" checked={attach} onChange={e=>setAttach(e.target.checked)}/> แนบไฟล์ PDF เข้า Google Drive (โฟลเดอร์ของแอป)</label>}
          </>)}
        </div>
        <div className="modal-foot">
          <button className="modal-btn-cancel" onClick={onClose}>{step==="done"?"ปิด":"ยกเลิก"}</button>
          {step==="review"&&<button className="modal-btn-save" onClick={save} disabled={!r||!r.date}>บันทึกผลตรวจ</button>}
        </div>
      </div>
    </div>
  );
}
/* ตารางเทียบปี: แถว = รายการ (เลือด → ปัสสาวะ → สัญญาณชีพ) · คอลัมน์ = ผลตรวจแต่ละครั้ง (ล่าสุดก่อน สูงสุด 4) · ธง h/l = สีส้ม */
function CheckupCard({data,persist}){

  const [show,setShow]=useState({blood:true,urine:false,vitals:true});

  const flagged=latest?[...(latest.blood||[]),...(latest.urine||[])].filter(x=>x.flag):[];
  const Section=({tab,title})=>{
    const rows=tab==="vitals"?CHECKUP_VITALS.map(v=>({code:v.k,label:v.l,unit:v.u,range:""})):rowsOf(tab);
    if(!rows.length) return null;
    return (
      <div className="ck-sec">
        <button type="button" className="ck-sec-head" onClick={()=>setShow(s=>({...s,[tab]:!s[tab]}))}>{show[tab]?"▾":"▸"} {title}</button>

          <div className="ck-cmp" style={{"--ck-cols":cols.length}}>
            <div className="ck-cmp-row ck-cmp-h"><span>รายการ</span>{cols.map(c=><span key={c.id} className="db-mono">{checkupMonthLabel(c.date)}</span>)}<span>ค่าปกติ</span></div>
            {rows.map(rw=>(
              <div className="ck-cmp-row" key={rw.code}>
                <span className="ck-cmp-l">{rw.label}</span>

                  const x=cell(c,tab,rw.code); return <span key={c.id} className={`db-mono${x&&x.flag?" ck-flag":""}`}>{x&&x.value?x.value:"–"}{x&&x.flag?` ${x.flag}`:""}</span>; })}
                <span className="ck-cmp-r">{rw.range}{rw.unit?` ${rw.unit}`:""}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };
  return (
    <div className="db-card db-span4 hl-check">
      {imp&&<CheckupImportModal data={data} persist={persist} onClose={()=>setImp(false)}/>}

        {Section({tab:"vitals",title:"สัญญาณชีพ / สัดส่วนร่างกาย"})}

}

function HealthPage({data,persist}) {

  const [form,setForm]=useState(()=>toForm(cur));
  const [dirty,setDirty]=useState(false);
  const [exType,setExType]=useState(EXERCISE_TYPES[0]);

  const f=(k,v)=>{ setForm(x=>({...x,[k]:v})); setDirty(true); };

  /* ทดสอบสมรรถนะ */

          {[["😴 นอน",w=>(w.h&&w.h.sleepMin)||0,maxSleep,S.sleepGoalMin,v=>fmtSleep(v),"#a78bfa"],["💧 น้ำ",w=>(w.h&&w.h.waterL)||0,maxWater,S.waterGoalL,v=>v?`${v}L`:"",'#60a5fa'],["🏃 ออกกำลังกาย",w=>exMinutes(w.h),maxEx,null,v=>v?`${v}'`:"","var(--accent)"]].map(([lab,get,mx,goal,fmt,color])=>(

              </div>
              <div className="hl-fit-table">
                {FITNESS_FIELDS.map(f=>{

                  const d=(a!=null&&b!=null&&tests.length>1)?b-a:null;
                  const good=d!=null&&f.dir!==0&&(f.dir>0?d>0:d<0), bad=d!=null&&f.dir!==0&&(f.dir>0?d<0:d>0);
                  return (
                    <div className="hl-fit-row" key={f.k}>

                      <span className={`db-mono hl-delta${good?" good":bad?" bad":""}`}>{d!=null&&d!==0?(d>0?"+":"")+Math.round(d*10)/10:""}</span>
                    </div>);

          )}

              {tests.slice().reverse().map(t=>{ const imp=fitnessImprovements(prevOf(t),t).length; return (

        <CheckupCard data={data} persist={persist}/>
      </div>
    </div>
  );

/* ═══ ข้อ 66 (ขั้นที่ 9 ของแผนข้อ 56): Documents ═══
   หมวด 5 หมวด · วันหมดอายุ (ไม่บังคับ) · ช่องข้อมูลสำคัญตามหมวด (เก็บใน d.info เป็น {ป้าย:ค่า})
   งาน/ราชการ = โหมดจำกัด: เก็บได้แค่ข้อมูลอ้างอิง ปิดแนบไฟล์ + Jack ไม่อ่าน (ยกเว้นติ๊ก d.open="ไม่ลับ")
   หมวดเก่า (ประชาชน/สัญญา/การเงิน/ประกัน/อื่นๆ) แปลงตอนแสดง/บันทึก ไม่ต้อง migrate ข้อมูลทั้งก้อน */
const DOC_CATS=[
  {k:"ประจำตัว",icon:"🪪",fields:["เลขที่เอกสาร","หน่วยงานที่ออก"]},
  {k:"งาน/ราชการ",icon:"🎖️",restricted:true,fields:["เลขที่","ที่เก็บตัวจริง"]},
  {k:"ประวัติ/ใบรับรอง",icon:"👤",fields:["หน่วยงานที่ออก","เลขที่"]},
  {k:"ยานพาหนะ",icon:"🚗",fields:["ทะเบียน","บริษัทประกัน","เลขกรมธรรม์","เบอร์ติดต่อ"]},
  {k:"ทั่วไป",icon:"📁",fields:["บริษัท/หน่วยงาน","เลขที่/เลขกรมธรรม์","เบอร์ติดต่อ"]},
];
const DOC_CAT_LEGACY={"ประชาชน":"ประจำตัว","สัญญา":"ทั่วไป","การเงิน":"ทั่วไป","ประกัน":"ทั่วไป","อื่นๆ":"ทั่วไป","":"ทั่วไป"};
function docCatKey(c){ if(DOC_CATS.some(x=>x.k===c)) return c; return DOC_CAT_LEGACY[c]||"ทั่วไป"; }
function docCatDef(c){ return DOC_CATS.find(x=>x.k===docCatKey(c)); }
function docRestricted(d){ const def=docCatDef(d.category); return !!(def&&def.restricted&&!d.open); }
/* เหลืออีกกี่วัน: null=ไม่มีวันหมดอายุ, ติดลบ=หมดแล้ว */
function docDaysLeft(d){ return d&&d.expiry?daysUntil(d.expiry):null; }
function docExpiryText(n){ return n==null?"":n<0?`หมดอายุแล้ว ${-n} วัน`:n===0?"หมดอายุวันนี้":`อีก ${n} วัน`; }
function DocumentPage({data,persist}) {
  /* ข้อ 55 ขั้นที่ 8: อ่านจาก data.documents ตรงๆ (เดิมมิเรอร์เป็น state แล้วไม่อัปเดตตามข้อมูลจากเครื่องอื่น/Jack) */
  const docs=data.documents||[];
  const empty={title:"",category:"ทั่วไป",description:"",link:"",expiry:"",info:{},open:false};
  const [editId,setEditId]=useState(null);   // null | "new" | id ของเอกสารที่กำลังแก้
  const [form,setForm]=useState(empty);
  const [filter,setFilter]=useState("all");
  const attCounts=useAttachCounts("document");
  const openNew=()=>{ setForm(empty); setEditId("new"); };
  const openEdit=d=>{ setForm({title:d.title||"",category:docCatKey(d.category),description:d.description||"",link:d.link||"",expiry:d.expiry||"",info:{...(d.info||{})},open:!!d.open}); setEditId(d.id); };
  const clean=f=>{
    const info={}; Object.keys(f.info||{}).forEach(k=>{ const v=String(f.info[k]||"").trim(); if(v) info[k]=v; });
    return {...f,title:f.title.trim(),info,expiry:/^\d{4}-\d{2}-\d{2}$/.test(f.expiry)?f.expiry:"",open:docCatDef(f.category).restricted?!!f.open:false};
  };
  const save=()=>{
    const f=clean(form); if(!f.title) return;
    if(editId==="new") persist({...data,documents:[...docs,{id:uid(),...f}]});
    else persist({...data,documents:docs.map(d=>d.id===editId?{...d,...f}:d)});
    setEditId(null);
  };
  const removeDoc=d=>{
    const n=attCounts[d.id]||0;
    if(n&&!window.confirm(`ลบเอกสาร "${d.title}"?\nไฟล์แนบ ${n} ไฟล์จะย้ายลงถังขยะ Google Drive (กู้คืนได้ 30 วัน)`)) return;
    persist({...data,documents:docs.filter(x=>x.id!==d.id)});
    trashAttachments("document",[d.id]);
  };
  const setCat=c=>setForm(f=>({...f,category:c,open:docCatDef(c).restricted?f.open:false}));
  const def=docCatDef(form.category);
  const formBox=(
    <div className="doc-form">
      <div style={{marginBottom:10}}>
        <label className="field-label">ชื่อเอกสาร *</label>
        <input className="modal-input" placeholder="บัตรประชาชน" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/>
      </div>
      <div style={{marginBottom:10}}>

/* ── ข้อ 24/9d (Book Queue shelf — เปลี่ยนแหล่งปก): ทดสอบสดกับ ohm แล้ว Google Books API (ไม่มี key) โดน 429 ค้างยาวมาก
   (ยิงตรงจาก network ของ ohm เอง หลังพัก 10+ นาทีก็ยังเจอ 429 — เป็น IP-level quota ที่ตึงเกินจะใช้งานจริงได้)
   → เปลี่ยนไปใช้ **Open Library** แทนทั้งหมด (openlibrary.org/search.json + covers.openlibrary.org — public, ไม่ต้องมี key เหมือนกัน
   แต่ quota กว้างกว่ามาก ทดสอบสดกับ network เดียวกันนี้แล้วได้ปกจริงทันที ทั้ง Atomic Habits และ The Lean Startup)
   โครงสร้าง status ('done'/'rate-limited'/'error') + coverCheckedAt + backoff/retry ทั้งหมดจากข้อ 24/9c ยังใช้เหมือนเดิมทุกอย่าง
   เผื่อ Open Library เองก็มีเพดานเช่นกัน (ไม่ได้ประกาศต่อสาธารณะ) ── */
let bookCoverBackoffUntil=0;
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function fetchBookCover(title,author){
  try{
    const params=new URLSearchParams({title:title,limit:"1",fields:"cover_i"});
    if(author) params.set("author",author);
    const res=await fetch(`https://openlibrary.org/search.json?${params.toString()}`);
    if(res.status===429){ bookCoverBackoffUntil=Date.now()+10*60*1000; return {status:'rate-limited'}; }
    if(!res.ok) return {status:'error'};
    const json=await res.json();
    const coverId=json.docs&&json.docs[0]&&json.docs[0].cover_i;
    return {status:'done',url:coverId?`https://covers.openlibrary.org/b/id/${coverId}-M.jpg`:null};
  }catch(e){ return {status:'error'}; }
}

   ohm เลือกทำทั้ง 3 อย่าง (แท็ก/ตัวกรอง, สถิติ, คำคม) พร้อมกันจากเมนู "งานแนะนำต่อ"

/* คอมโพเนนต์ใช้ร่วม: ช่องแท็ก (พิมพ์คั่นด้วยจุลภาค + คลิกจากแท็กที่เคยใช้ได้เลย) */

function BookFormModal({initial,onClose,onSave,tagOptions}) {
  const blankForm={title:"",author:"",status:"to-read",priority:3,coverUrl:"",coverManual:false,rating:"",reviewText:"",tags:[],quotes:[],startedDate:"",finishedDate:""};
  const [form,setForm]=useState(initial?{...blankForm,...initial}:blankForm);
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const ready=String(form.title||"").trim().length>0;
  const [coverBusy,setCoverBusy]=useState(false);
  const fileInputRef=useRef(null);
  /* ── ข้อ 24/9e: อัปโหลดปกเอง (ทางเลือกเสริมของข้อ 24/9d ที่ดึงอัตโนมัติจาก Open Library)
     ย่อรูปด้วย canvas ก่อนเก็บ (กว้างสุด 300px, JPEG q.82) แล้วฝังเป็น data URI ใน coverUrl ตรงๆ
     ซิงก์ผ่าน Drive JSON เดิมได้เลยเหมือน field อื่น — coverManual:true กันไม่ให้ระบบดึงอัตโนมัติมาทับ ── */
  const handleCoverFile=(file)=>{
    if(!file) return;
    setCoverBusy(true);
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const MAX_W=300;
        const scale=Math.min(1,MAX_W/img.width);
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        setF('coverUrl',canvas.toDataURL('image/jpeg',0.82));
        setF('coverManual',true);
        setCoverBusy(false);
      };
      img.onerror=()=>setCoverBusy(false);
      img.src=e.target.result;
    };
    reader.onerror=()=>setCoverBusy(false);
    reader.readAsDataURL(file);
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <span>{initial?"แก้ไขหนังสือ":"➕ เพิ่มหนังสือ"}</span>

          </div>

            <label className="field-label">ปกหนังสือ</label>
            <div className="book-cover-picker">
              <div className="book-cover-picker-preview">
                {form.coverUrl?<img src={form.coverUrl} alt=""/>:<BookOpen size={18}/>}
              </div>
              <div className="book-cover-picker-actions">
                <input ref={fileInputRef} type="file" accept="image/*" style={{display:"none"}}
                  onChange={e=>handleCoverFile(e.target.files&&e.target.files[0])}/>
                <button type="button" className="pill-btn" disabled={coverBusy}
                  onClick={()=>fileInputRef.current&&fileInputRef.current.click()}>
                  {coverBusy?"กำลังย่อรูป...":"อัปโหลดปกเอง"}
                </button>
                {form.coverManual&&
                  <button type="button" className="pill-btn" onClick={()=>{setF('coverUrl',"");setF('coverManual',false);}}>
                    กลับไปดึงอัตโนมัติ
                  </button>}
              </div>
            </div>
          </div>
          <div className="fin-row-2">
            <div>
              <label className="field-label">สถานะ</label>
              <select className="modal-input" value={form.status} onChange={e=>setF("status",e.target.value)}>
                <option value="to-read">ต้องอ่าน</option>
                <option value="reading">กำลังอ่าน</option>
                <option value="done">อ่านแล้ว</option>
              </select>
            </div>
            <div>
              <label className="field-label">ความสำคัญ</label>
              <input type="range" min="1" max="5" value={form.priority} onChange={e=>setF("priority",parseInt(e.target.value))} style={{width:"100%"}}/>
              <div className="db-note" style={{textAlign:"center"}}>{"⭐".repeat(form.priority)}</div>
            </div>
          </div>
          {/* ข้อ 50: แท็ก — กรองในชั้นวางได้ทีหลัง */}
          <TagsField value={form.tags} onChange={v=>setF("tags",v)} suggestions={tagOptions}/>
          {/* ข้อ 50: วันที่เริ่ม/จบ — ปกติระบบตั้งให้อัตโนมัติตอนกด "เริ่มอ่าน"/"อ่านจบแล้ว" ที่การ์ดสถานะ แก้ไขเองตรงนี้ได้เผื่อย้อนหลัง/backfill */}
          <div className="fin-row-2">
            <div>
              <label className="field-label">วันที่เริ่มอ่าน (ไม่บังคับ)</label>
              <input type="date" className="modal-input" value={form.startedDate||""} onChange={e=>setF("startedDate",e.target.value)}/>
            </div>
            <div>
              <label className="field-label">วันที่อ่านจบ (ไม่บังคับ)</label>

          <QuotesField quotes={form.quotes} onChange={v=>setF("quotes",v)}/>
          <button className="modal-btn-save" disabled={!ready} onClick={()=>ready&&onSave(form)}>
            {initial?"บันทึกการแก้ไข":"บันทึกหนังสือ"}
          </button>
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ยกเลิก</button></div>
      </div>
    </div>
  );
}
function BookQueueTab({data,persist}) {
  const books=data.bookQueue||[];
  const setBooks=(next)=>persist({...data,bookQueue:next});
  const removeBook=(id)=>setBooks(books.filter(b=>b.id!==id));
  /* ข้อ 50: ตอนเลื่อนสถานะ ตั้ง startedDate/finishedDate ให้อัตโนมัติ (ถ้ายังไม่เคยตั้งไว้ — ไม่ทับของเดิมถ้าเคยแก้เองแล้ว)
     ใช้เป็นข้อมูลดิบของการ์ด "สถิติการอ่าน" ด้านล่าง แก้ไขย้อนหลังเองได้ใน BookFormModal */
  const advance=(b)=>setBooks(books.map(x=>{
    if(x.id!==b.id) return x;
    if(x.status==='to-read') return {...x,status:'reading',startedDate:x.startedDate||todayISO()};
    return {...x,status:'done',finishedDate:x.finishedDate||todayISO()};
  }));

  const groups={'to-read':[],'reading':[],'done':[]};
  books.forEach(b=>groups[b.status]?.push(b));
  groups['to-read'].sort((a,b)=>(Number(b.priority)||0)-(Number(a.priority)||0));
  groups['reading'].sort((a,b)=>(Number(b.priority)||0)-(Number(a.priority)||0));
  const statusLabels={'to-read':'ต้องอ่าน','reading':'กำลังอ่าน','done':'อ่านแล้ว'};

  /* ข้อ 24/9: เพิ่ม/แก้ไขผ่าน BookFormModal ตัวเดียว (ข้อ 32/2 ปุ่มเดียวต่อหน้า) */
  const [modal,setModal]=useState(null); // null | {mode:"add"} | {mode:"edit",id,initial}
  const openAdd=()=>setModal({mode:"add"});
  const openEdit=(b)=>setModal({mode:"edit",id:b.id,initial:{
    title:b.title||"",author:b.author||"",status:b.status||"to-read",priority:b.priority||3,
    coverUrl:b.coverUrl||"",coverManual:!!b.coverManual,
    rating:b.rating?String(b.rating):"",reviewText:b.reviewText||"",
    tags:b.tags||[],quotes:b.quotes||[],startedDate:b.startedDate||"",finishedDate:b.finishedDate||"",
  }});
  /* ── ข้อ 24/9e: บันทึกปก — ถ้าอัปโหลดเอง (coverManual) เก็บตามที่กรอก, ถ้ากด "กลับไปดึงอัตโนมัติ"
     (coverManual กลับเป็น false + coverUrl ว่าง) ให้ล้าง coverCheckedAt ด้วย จะได้ให้ระบบไล่ดึงใหม่ทันทีตอนเปิดหน้าครั้งหน้า
     ข้อ 45/2: รีวิว+คะแนนติดกับหนังสือเล่มนั้นตรงๆ ไม่บังคับกรอก (rating="" = ยังไม่ให้คะแนน) ── */
  const saveBook=(f)=>{
    const row={
      title:String(f.title||"").trim(),author:String(f.author||"").trim(),
      status:f.status,priority:Number(f.priority)||3,
      coverUrl:f.coverUrl||null,coverManual:!!f.coverManual,
      rating:f.rating?Math.max(1,Math.min(10,Number(f.rating))):null,
      reviewText:String(f.reviewText||"").trim(),
      tags:Array.isArray(f.tags)?f.tags:[],quotes:Array.isArray(f.quotes)?f.quotes:[],
      startedDate:f.startedDate||null,finishedDate:f.finishedDate||null,
    };
    if(!row.title) return;
    if(modal&&modal.mode==="edit"){
      setBooks(books.map(b=>{
        if(b.id!==modal.id) return b;
        const next={...b,...row};
        if(!row.coverManual&&!row.coverUrl) next.coverCheckedAt=null;
        return next;
      }));
    } else setBooks([...books,{id:uid(),...row}]);
    setModal(null);
  };

  /* ── ข้อ 24/9c: ไล่ดึงปกหนังสือทีละเล่ม เว้นจังหวะกัน rate limit + retry อัตโนมัติถ้าเช็คแล้วไม่เจอปก (ดู comment ที่ fetchBookCover)
     ข้อ 24/9e: ข้ามเล่มที่อัปโหลดปกเอง (coverManual) ไม่ให้ระบบไปทับ ── */
  const COVER_RETRY_MS=24*60*60*1000;
  const needsCover=(b)=>!b.coverManual&&!b.coverUrl&&(!b.coverCheckedAt||Date.now()-b.coverCheckedAt>COVER_RETRY_MS);
  const dataRef=useRef(data); dataRef.current=data;
  const persistRef=useRef(persist); persistRef.current=persist;
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const attempted=new Set();
      while(!cancelled){
        if(Date.now()<bookCoverBackoffUntil) break; // เพิ่งโดน 429 มา พักไว้ก่อน ลองใหม่ตอนเปิดหน้าครั้งหน้า
        const list=dataRef.current.bookQueue||[];
        const target=list.find(b=>needsCover(b)&&!attempted.has(b.id));
        if(!target) break;
        attempted.add(target.id);
        const result=await fetchBookCover(target.title,target.author);
        if(cancelled) return;
        if(result.status==='rate-limited') break; // หยุดทั้งชุดตอนนี้ ไม่ทำเล่มอื่นพัง
        if(result.status==='done'){
          const latest=dataRef.current;
          persistRef.current({...latest,bookQueue:(latest.bookQueue||[]).map(b=>b.id===target.id?{...b,coverUrl:result.url||null,coverCheckedAt:Date.now()}:b)});
        }
        // status==='error' (ชั่วคราว เช่นเน็ตสะดุด): ข้ามเล่มนี้ไปก่อน ไม่บันทึกเวลา จะลองใหม่ตอนเปิดหน้าครั้งหน้า
        await sleep(2500);
      }
    })();
    return ()=>{ cancelled=true; };
  },[]);
  const retryCover=(b)=>{
    if(b.coverManual) return; // เล่มนี้อัปโหลดปกเองไว้ ไม่ต้องไปยุ่ง
    if(Date.now()<bookCoverBackoffUntil) return; // ยังอยู่ช่วงพักจาก rate limit
    fetchBookCover(b.title,b.author).then(result=>{
      if(result.status!=='done') return;
      const latest=dataRef.current;
      persistRef.current({...latest,bookQueue:(latest.bookQueue||[]).map(x=>x.id===b.id?{...x,coverUrl:result.url||null,coverCheckedAt:Date.now()}:x)});
    });
  };

  /* ── ข้อ 50: ตัวกรองแท็ก — กรองเฉพาะโซน "รายการหนังสือทั้งหมด" (การ์ดกำลังอ่าน/ต้องอ่านด้านบนยังโชว์ครบเหมือนเดิม
     เพราะเป็นการ์ดเชิงหน้าที่ ไม่ใช่การ์ดสำหรับเบราส์) — ไม่ normalize ตัวพิมพ์/ช่องว่าง แนวทางเดียวกับ channel ── */
  const allTags=Array.from(new Set(books.flatMap(b=>b.tags||[]))).sort((a,b)=>a.localeCompare(b,'th'));
  const [activeTags,setActiveTags]=useState([]);
  const toggleTag=(t)=>setActiveTags(cur=>cur.includes(t)?cur.filter(x=>x!==t):[...cur,t]);
  const shelfBooks=activeTags.length?books.filter(b=>(b.tags||[]).some(t=>activeTags.includes(t))):books;

  /* ── ข้อ 50: สถิติการอ่าน — ใช้ finishedDate ที่ตั้งอัตโนมัติตอนกด "อ่านจบแล้ว" (ข้างบน) ── */
  const nowISO=todayISO();
  const thisMonthKey=nowISO.slice(0,7), thisYearKey=nowISO.slice(0,4);
  const finishedBooks=books.filter(b=>b.status==='done'&&b.finishedDate);
  const finishedThisMonth=finishedBooks.filter(b=>b.finishedDate.slice(0,7)===thisMonthKey).length;
  const finishedThisYear=finishedBooks.filter(b=>b.finishedDate.slice(0,4)===thisYearKey).length;
  const ratedFinished=finishedBooks.filter(b=>b.rating);
  const avgFinishedRating=ratedFinished.length?(ratedFinished.reduce((s,b)=>s+Number(b.rating),0)/ratedFinished.length):null;

  /* ── ข้อ 50: คลังคำคม — รวมคำคมจากทุกเล่ม เรียงใหม่สุดก่อน ── */
  const removeQuote=(bookId,quoteId)=>setBooks(books.map(b=>b.id===bookId?{...b,quotes:(b.quotes||[]).filter(q=>q.id!==quoteId)}:b));
  const allQuotes=books.flatMap(b=>(b.quotes||[]).map(q=>({...q,bookId:b.id,bookTitle:b.title})))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  return (
    <div className="book-page">
      {/* ── ฮีโร่: สเกลเดียวกับหน้า Home ตามธรรมนูญข้อ 32 (38px + margin:0) ── */}
      <div className="db-hero">
        <div>
          <h1 className="db-hero-title">Book Queue <span>· คิวหนังสือ</span></h1>
          <div className="db-hero-line">
            {books.length} เล่มในคิว · ต้องอ่าน {groups['to-read'].length} · กำลังอ่าน {groups.reading.length} · อ่านแล้ว {groups.done.length}
          </div>
          {/* ข้อ 32/2: ปุ่มเพิ่มข้อมูลของทั้งหน้าเหลือปุ่มนี้ปุ่มเดียว */}
          <button className="db-btn primary inv-add-btn" onClick={openAdd}><Plus size={14}/> เพิ่มข้อมูล</button>
        </div>
        <div className="db-bignums">
          <div className="db-bignum">
            <div className="n db-mono" style={{color:"var(--blue)"}}>{groups['to-read'].length}</div>
            <div className="l"><span className="db-dot" style={{background:"var(--blue)"}}/> ต้องอ่าน</div>
          </div>
          <div className="db-bignum">
            <div className="n db-mono" style={{color:"var(--orange-soft)"}}>{groups.reading.length}</div>
            <div className="l"><span className="db-dot" style={{background:"var(--orange)"}}/> กำลังอ่าน</div>
          </div>
          <div className="db-bignum">
            <div className="n acc db-mono">{groups.done.length}</div>
            <div className="l"><span className="db-dot a"/> อ่านแล้ว</div>
          </div>
        </div>
      </div>

      <div className="db-bento">
        {/* ── การ์ด 1: กำลังอ่านตอนนี้ ── */}
        <div className="db-card db-span2">
          <div className="db-head"><div><div className="db-title">กำลังอ่าน</div><div className="db-note">เล่มที่หยิบมาอ่านอยู่ตอนนี้</div></div></div>
          {groups.reading.length===0
            ? <div className="db-empty">ยังไม่มีเล่มที่กำลังอ่าน — กด “เริ่มอ่าน” จากรายการต้องอ่าน</div>
            : groups.reading.map(b=>(
              <div key={b.id} className="db-row">
                <div className="db-tmain">
                  <div className="db-tname">{b.title}</div>
                  <div className="db-tsub">{b.author||"—"} · {"⭐".repeat(b.priority||0)}</div>
                </div>
                <button className="pill-btn primary" onClick={()=>advance(b)}>อ่านจบแล้ว</button>
              </div>
            ))}
        </div>

        {/* ── การ์ด 2: คิวต้องอ่าน เรียงตามความสำคัญ ── */}
        <div className="db-card db-span2">
          <div className="db-head"><div><div className="db-title">ต้องอ่าน</div><div className="db-note">เรียงตามความสำคัญ มากไปน้อย</div></div></div>
          {groups['to-read'].length===0
            ? <div className="db-empty">คิวว่าง — กด “เพิ่มข้อมูล” เพื่อเพิ่มเล่มถัดไป</div>
            : groups['to-read'].map(b=>(
              <div key={b.id} className="db-row">
                <div className="db-tmain">
                  <div className="db-tname">{b.title}</div>
                  <div className="db-tsub">{b.author||"—"} · {"⭐".repeat(b.priority||0)}</div>
                </div>
                <button className="pill-btn" onClick={()=>advance(b)}>เริ่มอ่าน</button>
              </div>
            ))}
        </div>

        {/* ── การ์ด 3: รายการหนังสือทั้งหมด — โชว์เป็นชั้นหนังสือ (shelf) พร้อมปกจริง + จุดสถานะ ── */}
        <DashCollapse span="db-span4" title="รายการหนังสือทั้งหมด"
          note={books.length?(activeTags.length?`${shelfBooks.length}/${books.length} เล่ม`:`${books.length} เล่ม`):"ยังไม่มีรายการ"}
          defaultOpen={true}>
          {/* ข้อ 50: แถบตัวกรองแท็ก — กดแท็กเพื่อกรอง กดซ้ำเพื่อยกเลิก เลือกได้หลายแท็ก (OR) */}
          {allTags.length>0&&(
            <div className="tag-filter-row">
              {allTags.map(t=>(
                <button key={t} className={`db-chip tag-filter-chip${activeTags.includes(t)?' active':''}`} onClick={()=>toggleTag(t)}>{t}</button>
              ))}
              {activeTags.length>0&&<button className="db-chip" onClick={()=>setActiveTags([])}>ล้างตัวกรอง ✕</button>}
            </div>
          )}
          {shelfBooks.length===0
            ? <div className="db-empty">{books.length===0?'ยังไม่มีหนังสือในระบบ — กด "เพิ่มข้อมูล" ด้านบน':'ไม่มีเล่มที่ตรงกับแท็กที่เลือก'}</div>
            : (
            <div className="book-shelf">
              {shelfBooks.map(b=>(
                <div key={b.id} className="book-shelf-item">
                  <div className="book-shelf-cover">
                    {b.coverUrl
                      ? <img src={b.coverUrl} alt={b.title} loading="lazy"/>
                      : <div className="book-shelf-fallback" title="กดเพื่อลองดึงปกใหม่" onClick={()=>retryCover(b)}><BookOpen size={18}/><div className="db-tname">{b.title}</div></div>}
                    <span className={`book-shelf-dot ${b.status}`} title={statusLabels[b.status]||b.status}/>
                  </div>
                  <div className="book-shelf-info">
                    <div className="db-tname" title={b.title}>{b.title}</div>
                    {(b.author||b.rating)&&<div className="db-tsub" title={b.author}>{b.author||"—"}{b.rating?` · ★ ${b.rating}/10`:""}</div>}
                    {/* ข้อ 50: บรรทัดแท็ก + จำนวนคำคม (ถ้ามี) */}
                    {((b.tags&&b.tags.length)||(b.quotes&&b.quotes.length))?(
                      <div className="shelf-tags" title={(b.tags||[]).join(', ')}>
                        {(b.tags||[]).join(', ')}{b.quotes&&b.quotes.length?`${(b.tags&&b.tags.length)?' · ':''}💬 ${b.quotes.length}`:''}
                      </div>
                    ):null}
                  </div>
                  <div className="inv-item-actions book-shelf-actions">
                    <button className="db-chip" title="แก้ไข" onClick={()=>openEdit(b)}><Edit3 size={12}/></button>
                    <button className="db-chip" title="ลบ" onClick={()=>removeBook(b.id)}><Trash2 size={12}/></button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </DashCollapse>

        {/* ── ข้อ 50: การ์ดสถิติการอ่าน ── */}
        <div className="db-card db-span2">
          <div className="db-head"><div><div className="db-title">สถิติการอ่าน</div><div className="db-note">นับจากวันที่กด "อ่านจบแล้ว"</div></div></div>
          <div className="db-bignums">
            <div className="db-bignum">
              <div className="n db-mono" style={{color:"var(--orange-soft)"}}>{finishedThisMonth}</div>
              <div className="l">อ่านจบเดือนนี้</div>
            </div>
            <div className="db-bignum">
              <div className="n db-mono" style={{color:"var(--gold)"}}>{finishedThisYear}</div>
              <div className="l">อ่านจบปีนี้</div>
            </div>
            <div className="db-bignum">
              <div className="n acc db-mono">{finishedBooks.length}</div>
              <div className="l">อ่านจบทั้งหมด</div>
            </div>
          </div>
          <div className="db-note" style={{marginTop:10,textAlign:"center"}}>
            {avgFinishedRating!=null?`คะแนนเฉลี่ยเล่มที่อ่านจบ ★ ${avgFinishedRating.toFixed(1)}/10`:'ยังไม่มีเล่มที่ให้คะแนนไว้'}
          </div>
        </div>

        {/* ── ข้อ 50: คลังคำคม — รวมจากทุกเล่ม ── */}
        <DashCollapse span="db-span2" title="คลังคำคม"
          note={allQuotes.length?`${allQuotes.length} คำคม`:"ยังไม่มี"}
          defaultOpen={false}>
          {allQuotes.length===0
            ? <div className="db-empty">ยังไม่มีคำคม — เพิ่มได้จากฟอร์มแก้ไขหนังสือแต่ละเล่ม</div>
            : allQuotes.map(q=>(
              <div key={q.id} className="db-row">
                <div className="db-tmain">
                  <div className="quote-text">"{q.text}"</div>
                  <div className="db-tsub">{q.bookTitle}{q.note?` · ${q.note}`:""}</div>
                </div>
                <button className="db-chip" title="ลบ" onClick={()=>removeQuote(q.bookId,q.id)}><Trash2 size={12}/></button>
              </div>
            ))}
        </DashCollapse>
      </div>

      {modal&&<BookFormModal initial={modal.initial} onClose={()=>setModal(null)} onSave={saveBook} tagOptions={allTags}/>}
    </div>
  );
}
/* ═══ ข้อ 56 ขั้นที่ 6: Journal = ปฏิทินอารมณ์รายเดือน + หัวข้อนำ 4 ข้อ + สิ่งที่ทำจริงวันนั้น + คลังบทเรียน + สะท้อนสัปดาห์จาก Jack
   ข้อมูล: journal[] = {id,date,entry(ข้อความดิบ),mood(1-5),parts:{did,highlight,feel,lesson}} — รูปเดิม {date,entry,mood} ใช้ต่อได้ ไม่ต้อง migrate
   Jack (LINE) แยกหัวข้อให้ตอนโอมเล่ารวดเดียว · journalReflections[] = {id,week,end,text,days,moodAvg,at} เขียนโดย Jack คืนวันอาทิตย์
   JOURNAL_PARTS/JOURNAL_MOODS ต้องตรงกับ JOURNAL_PARTS/MOODS ใน line-bot/Bot.gs */
const JOURNAL_PARTS=[
  {k:"did",e:"📍",l:"วันนี้ทำอะไร"},
  {k:"highlight",e:"✨",l:"เจออะไร/เรื่องเด่น"},
  {k:"feel",e:"💭",l:"รู้สึกยังไง"},
  {k:"lesson",e:"💡",l:"บทเรียนวันนี้"},
];
const JOURNAL_MOODS=[{v:1,e:"😩",l:"แย่มาก"},{v:2,e:"😕",l:"ไม่ค่อยดี"},{v:3,e:"😐",l:"กลางๆ"},{v:4,e:"🙂",l:"ดี"},{v:5,e:"🤩",l:"ดีมาก"}];
function journalMood(v){ return JOURNAL_MOODS.find(m=>m.v===Number(v))||null; }
function journalWritten(j){ if(!j) return false; if(String(j.entry||"").trim()) return true; const p=j.parts||{}; return JOURNAL_PARTS.some(x=>String(p[x.k]||"").trim()); }
function journalMap(data){ const m={}; (data.journal||[]).forEach(j=>{ if(j&&j.date&&!m[j.date]) m[j.date]=j; }); return m; }
/* สิ่งที่ทำจริงวันนั้น (ดึงอัตโนมัติ) จัดกลุ่มตาม target — งานประจำนับเฉพาะรายวัน (รายสัปดาห์/เดือนไม่รู้วันที่ติ๊กจริง) */
function journalDayActivity(data,date){
  const projById={}; (data.projects||[]).forEach(p=>{ if(p&&p.id) projById[p.id]=p; });
  const groups={}, push=(p,icon,text)=>{ const key=p?p.id:"_none"; (groups[key]||(groups[key]={key,project:p||null,items:[]})).items.push({icon,text}); };
  (data.tasks||[]).forEach(t=>{
    if(!t||!t.id) return;
    const p=t.projectId?projById[t.projectId]:null;
    if(isRecurring(t)){ if(t.recurrence==="daily"&&(t.completions||{})[date]) push(p,"🔁",t.title); }
    else if(t.status==="done"&&xpLocalDate(t.completedAt)===date) push(p,"✅",t.title);
  });
  (data.projects||[]).forEach(p=>{ (p.milestones||[]).forEach(m=>{ if(m&&String(m.reachedAt||"").slice(0,10)===date) push(p,"🚩",`ถึงหมุด ${milestoneLabel(m)}`); }); });
  (data.checkins||[]).forEach(c=>{ if(c&&c.date===date){ const p=projById[c.projectId]; push(p||null,"📈",`บันทึกความคืบหน้า ${Number(c.value).toLocaleString()}${p&&p.unit?" "+p.unit:""}`); } });
  (data.bookQueue||[]).forEach(b=>{ if(b&&b.status==="done"&&String(b.finishedDate||"").slice(0,10)===date) push(null,"📚",`อ่านจบ ${b.title}`); });
  (data.mediaReviews||[]).forEach(r=>{ if(r&&String(r.date||"").slice(0,10)===date) push(null,r.type==="podcast"?"🎧":"🎬",`รีวิว ${r.title}`); });
  const order=(data.projects||[]).map(p=>p.id);
  return Object.values(groups).sort((a,b)=>a.key==="_none"?1:b.key==="_none"?-1:order.indexOf(a.key)-order.indexOf(b.key));
}
function JournalPage({data,persist,initialDate}) {
  const today=todayISO();
  const start=initialDate||today;
  const [month,setMonth]=useState(start.slice(0,7));
  const [sel,setSel]=useState(start);
  const jm=useMemo(()=>journalMap(data),[data.journal]);
  const cur=jm[sel]||null;
  const blank=()=>({mood:null,entry:"",parts:{did:"",highlight:"",feel:"",lesson:""}});
  const fromEntry=(j)=>j?{mood:j.mood||null,entry:String(j.entry||""),parts:{did:"",highlight:"",feel:"",lesson:"",...(j.parts||{})}}:blank();
  const [form,setForm]=useState(()=>fromEntry(cur));
  const [dirty,setDirty]=useState(false);
  const [showRaw,setShowRaw]=useState(false);
  const [showLessons,setShowLessons]=useState(false);
  const [openRefl,setOpenRefl]=useState(0);
  useEffect(()=>{ if(!dirty){ setForm(fromEntry(cur)); } },[cur,sel]);          // ข้อมูลใหม่จาก Jack/เครื่องอื่นไหลเข้า ถ้ายังไม่ได้แก้ค้าง
  const pick=(d)=>{ if(dirty&&!window.confirm("ยังไม่ได้บันทึกวันที่แก้อยู่ — ทิ้งการแก้ไข?")) return; setDirty(false); setSel(d); setForm(fromEntry(jm[d]||null)); setShowRaw(false); };
  const upd=(patch)=>{ setForm(f=>({...f,...patch})); setDirty(true); };
  const updPart=(k,v)=>{ setForm(f=>({...f,parts:{...f.parts,[k]:v}})); setDirty(true); };
  const save=(override)=>{
    const f=override||form;
    const parts={}; JOURNAL_PARTS.forEach(p=>{ const v=String(f.parts[p.k]||"").trim(); if(v) parts[p.k]=v; });
    const entry=String(f.entry||"").trim();
    const list=data.journal||[];
    const ex=list.find(j=>j.date===sel);
    let next;
    if(!entry&&!f.mood&&!Object.keys(parts).length){ next=list.filter(j=>j.date!==sel); }
    else {
      const item={...(ex||{id:uid(),date:sel}),entry,mood:f.mood||undefined,parts:Object.keys(parts).length?parts:undefined};
      if(!item.mood) delete item.mood; if(!item.parts) delete item.parts;
      next=ex?list.map(j=>j===ex?item:j):[...list,item];
    }
    persist({...data,journal:next,activity:!ex&&(entry||Object.keys(parts).length)?logActivity(data,{source:"journal",text:`เขียน Journal ${thaiDate(sel)}`}):data.activity});
    setDirty(false);
  };
  const setMood=(v)=>{ const f={...form,mood:form.mood===v?null:v}; setForm(f); save(f); };   // กดอารมณ์ = บันทึกทันที (กดซ้ำ = เอาออก)
  /* ปฏิทิน */
  const [y,m]=month.split("-").map(Number);

  const handleCoverFile=(file)=>{

                {(channelOptions||[]).map(c=><option key={c} value={c}>{c}</option>)}

function PlaybackTab({data,persist}) {
  const reviews=data.mediaReviews||[];
  const setReviews=(next)=>persist({...data,mediaReviews:next});
  const removeReview=(id)=>setReviews(reviews.filter(r=>r.id!==id));

  const counts={video:0,podcast:0};
  reviews.forEach(r=>{ if(counts[r.type]!=null) counts[r.type]++; });

  /* ข้อ 48: รายชื่อช่อง/เพลย์ลิสต์ที่เคยกรอกไว้ — ใช้ทำ dropdown ในฟอร์ม กันพิมพ์ชื่อซ้ำเพี้ยน */
  const channelOptions=Array.from(new Set(reviews.map(r=>String(r.channel||"").trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'th'));

  /* ── ข้อ 50: ตัวกรอง — แท็ก (OR) + ประเภท กรองเฉพาะโซนชั้นวาง (bignums ด้านบนยังนับจากรีวิวทั้งหมดเสมอ) ── */
  const allTags=Array.from(new Set(reviews.flatMap(r=>r.tags||[]))).sort((a,b)=>a.localeCompare(b,'th'));
  const [activeTags,setActiveTags]=useState([]);
  const toggleTag=(t)=>setActiveTags(cur=>cur.includes(t)?cur.filter(x=>x!==t):[...cur,t]);
  const [typeFilter,setTypeFilter]=useState('all'); // 'all' | 'video' | 'podcast'
  const filteredReviews=reviews.filter(r=>
    (typeFilter==='all'||r.type===typeFilter) &&
    (activeTags.length===0||(r.tags||[]).some(t=>activeTags.includes(t)))
  );
  const sorted=filteredReviews.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  /* ข้อ 32/2: ปุ่มเพิ่มข้อมูลปุ่มเดียวต่อหน้า — เพิ่ม/แก้ไขผ่าน PlaybackFormModal ตัวเดียว (เหมือน BookFormModal) */
  const [modal,setModal]=useState(null); // null | {mode:"add",initial?} | {mode:"edit",id,initial}
  const openAdd=(prefillChannel)=>setModal({mode:"add",initial:prefillChannel?{channel:prefillChannel}:undefined});
  const openEdit=(r)=>setModal({mode:"edit",id:r.id,initial:{
    title:r.title||"",type:r.type||"video",rating:Number(r.rating)||8,
    reviewText:r.reviewText||"",date:r.date||todayISO(),link:r.link||"",coverUrl:r.coverUrl||"",
    channel:r.channel||"",tags:r.tags||[],quotes:r.quotes||[],
  }});
  const saveReview=(f)=>{
    const row={
      title:String(f.title||"").trim(),type:f.type||"video",
      rating:Math.max(1,Math.min(10,Number(f.rating)||1)),
      reviewText:String(f.reviewText||"").trim(),
      date:f.date||todayISO(),link:String(f.link||"").trim(),
      coverUrl:f.coverUrl||null,
      channel:String(f.channel||"").trim(),
      tags:Array.isArray(f.tags)?f.tags:[],quotes:Array.isArray(f.quotes)?f.quotes:[],
    };
    if(!row.title) return;
    if(modal&&modal.mode==="edit") setReviews(reviews.map(r=>r.id===modal.id?{...r,...row}:r));
    else setReviews([...reviews,{id:uid(),...row}]);
    setModal(null);
  };

  /* ── ข้อ 50: สถิติการดู/ฟัง — นับจากรีวิวทั้งหมด (ไม่ผ่านตัวกรอง) ── */
  const nowISO2=todayISO();

  const reviewsThisMonth=reviews.filter(r=>(r.date||"").slice(0,7)===thisMonthKey2).length;
  const reviewsThisYear=reviews.filter(r=>(r.date||"").slice(0,4)===thisYearKey2).length;
  const ratedReviews=reviews.filter(r=>r.rating);
  const avgReviewRating=ratedReviews.length?(ratedReviews.reduce((s,r)=>s+Number(r.rating),0)/ratedReviews.length):null;
  const channelCounts={};
  reviews.forEach(r=>{ const ch=String(r.channel||"").trim(); if(ch) channelCounts[ch]=(channelCounts[ch]||0)+1; });
  const topChannelEntry=Object.entries(channelCounts).sort((a,b)=>b[1]-a[1])[0]||null;

  /* ── ข้อ 50: คลังคำคม — รวมจากทุกรีวิว เรียงใหม่สุดก่อน ── */
  const removeQuote=(reviewId,quoteId)=>setReviews(reviews.map(r=>r.id===reviewId?{...r,quotes:(r.quotes||[]).filter(q=>q.id!==quoteId)}:r));
  const allQuotes=reviews.flatMap(r=>(r.quotes||[]).map(q=>({...q,srcId:r.id,srcTitle:r.title})))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  /* ── ข้อ 48: ชั้นวาง Playback แบบเดียวกับ Book Queue — รายการที่มีชื่อ "ช่อง/เพลย์ลิสต์" ตรงกัน
     จะถูกรวมเป็นการ์ดโฟลเดอร์ใบเดียว (ปก = ตอนล่าสุดในช่องนั้น), ส่วนรายการเดี่ยวๆ (ไม่มีช่อง) ก็ยังเป็นการ์ดเดี่ยวเหมือนเดิม
     เรียงรวมกันด้วยวันที่ล่าสุดของแต่ละใบ (การ์ดโฟลเดอร์ใช้วันที่ของตอนล่าสุดในกลุ่ม) ── */
  const groupsMap=new Map();
  const standalone=[];
  sorted.forEach(r=>{
    const ch=String(r.channel||"").trim();
    if(!ch){ standalone.push(r); return; }
    if(!groupsMap.has(ch)) groupsMap.set(ch,[]);
    groupsMap.get(ch).push(r);

  const shelfEntries=[
    ...standalone.map(r=>({kind:"item",key:"i:"+r.id,date:r.date,r})),
    ...Array.from(groupsMap.entries()).map(([channel,items])=>({kind:"folder",key:"f:"+channel,date:items[0].date,channel,items})),

  const [openFolders,setOpenFolders]=useState({}); // {[channel]:true}

             (ปุ่ม "เพิ่มตอนในช่องนี้" ในแผงโฟลเดอร์ใช้พารามิเตอร์นี้) — ถ้าไม่ห่อ arrow function ค่า event ของ React
