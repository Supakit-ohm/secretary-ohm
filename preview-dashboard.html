<div id="driveBar" style="position:fixed;top:10px;right:10px;z-index:9999;font-family:sans-serif;font-size:13px;">
  <button id="driveConnectBtn" style="background:#8b5cf6;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;">เชื่อมต่อ Google Drive</button>
  <span id="driveStatus" style="margin-left:8px;color:#cbd5e1;"></span>

<script>
// ================== Google Drive sync (plain JS, ทำงานนอก React) ==================
(function () {
  var STORAGE_KEY = "secretary-dashboard-v1";
  var CACHE_FOLDER_KEY = "secretary-drive-folder-id";
  var CACHE_FILE_KEY = "secretary-drive-file-id";
  var tokenClient = null, accessToken = null;
  var folderId = localStorage.getItem(CACHE_FOLDER_KEY) || null;
  var fileId = localStorage.getItem(CACHE_FILE_KEY) || null;
  var pushTimer = null;

  function setStatus(text, kind) {
    var el = document.getElementById("driveStatus");
    if (el) { el.textContent = text; el.style.color = kind === "err" ? "#fb923c" : "#34d399"; }
  }

  function driveFetch(url, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers, { Authorization: "Bearer " + accessToken });
    return fetch(url, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (!res.ok) return res.text().then(function (body) { throw new Error("Drive API " + res.status + ": " + body.slice(0, 200)); });
      return res;
    });
  }

  function ensureFolder() {
    if (folderId) return Promise.resolve(folderId);
    var name = window.APP_CONFIG.DRIVE_FOLDER_NAME;
    var query = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='" + name + "' and trashed=false");
    return driveFetch("https://www.googleapis.com/drive/v3/files?q=" + query + "&fields=files(id,name)&spaces=drive")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.files && data.files.length) { folderId = data.files[0].id; return folderId; }
        return driveFetch("https://www.googleapis.com/drive/v3/files", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, mimeType: "application/vnd.google-apps.folder" })
        }).then(function (r) { return r.json(); }).then(function (data2) { folderId = data2.id; return folderId; });
      })
      .then(function (id) { localStorage.setItem(CACHE_FOLDER_KEY, id); return id; });
  }

  function ensureFile() {
    if (fileId) return Promise.resolve(fileId);
    var name = window.APP_CONFIG.DATA_FILE_NAME;
    var query = encodeURIComponent("name='" + name + "' and '" + folderId + "' in parents and trashed=false");
    return driveFetch("https://www.googleapis.com/drive/v3/files?q=" + query + "&fields=files(id,name)&spaces=drive")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.files && data.files.length) { fileId = data.files[0].id; return { id: fileId, isNew: false }; }
        var boundary = "secretaryohmboundary";
        var metadata = { name: name, parents: [folderId], mimeType: "application/json" };
        var initialContent = localStorage.getItem(STORAGE_KEY) || "{}";
        var body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) +
          "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + initialContent + "\r\n--" + boundary + "--";
        return driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
          method: "POST",
          headers: { "Content-Type": "multipart/related; boundary=" + boundary },
          body: body
        }).then(function (r) { return r.json(); }).then(function (data2) { fileId = data2.id; return { id: fileId, isNew: true }; });
      })
      .then(function (result) { localStorage.setItem(CACHE_FILE_KEY, result.id); return result; });
  }

  function pullFromDrive() {
    return driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media")
      .then(function (r) { return r.text(); });
  }

  function pushToDrive(jsonText) {
    return driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: jsonText
    });
  }

  function schedulePush(jsonText) {
    setStatus("กำลังบันทึกขึ้น Drive…");
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      pushToDrive(jsonText).then(function () { setStatus("ซิงก์กับ Drive แล้ว ✓"); })
        .catch(function (e) { console.error(e); setStatus("บันทึก Drive ไม่สำเร็จ", "err"); });
    }, 1200);
  }

  function afterSignedIn() {
    document.getElementById("driveConnectBtn").textContent = "เชื่อมต่อ Drive แล้ว ✓";
    document.getElementById("driveConnectBtn").disabled = true;
    setStatus("กำลังตรวจสอบข้อมูล…");
    ensureFolder().then(ensureFile).then(function (result) {
      if (result.isNew) {
        // ไฟล์ใหม่ ยังไม่มีข้อมูลบน Drive -> อัปโหลดข้อมูลในเครื่องนี้ขึ้นไปตั้งต้น
        setStatus("ซิงก์กับ Drive แล้ว ✓");
        return;
      }
      return pullFromDrive().then(function (remoteText) {
        var localText = localStorage.getItem(STORAGE_KEY) || "{}";
        if (remoteText && remoteText.trim() && remoteText !== localText) {
          var useRemote = window.confirm(
            "พบข้อมูลอยู่บน Google Drive แล้ว (อาจมาจากเครื่องอื่น)\n\nกด OK เพื่อดึงข้อมูลจาก Drive มาใช้ในเครื่องนี้ (ข้อมูลในเครื่องนี้จะถูกแทนที่)\nกด Cancel เพื่อเก็บข้อมูลในเครื่องนี้ไว้ และอัปโหลดทับขึ้น Drive แทน"
          );
          if (useRemote) {
            localStorage.setItem(STORAGE_KEY, remoteText);
            setStatus("ดึงข้อมูลจาก Drive แล้ว — กำลังโหลดหน้าใหม่…");
            location.reload();
          } else {
            pushToDrive(localText).then(function () { setStatus("อัปโหลดทับ Drive แล้ว ✓"); });
          }
        } else {
          setStatus("ซิงก์กับ Drive แล้ว ✓");
        }
      });
    }).catch(function (e) {
      console.error(e);
      setStatus("เชื่อมต่อ Drive ไม่สำเร็จ", "err");
    });
  }

  function initGoogleIdentity() {
    var config = window.APP_CONFIG;
    if (!config || !config.CLIENT_ID || config.CLIENT_ID.indexOf("YOUR_") === 0) {
      document.getElementById("driveConnectBtn").style.display = "none";
      return;
    }
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      setTimeout(initGoogleIdentity, 300);
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: config.CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function (response) {
        if (response.error) { setStatus("เชื่อมต่อไม่สำเร็จ", "err"); return; }
        accessToken = response.access_token;
        afterSignedIn();
      }
    });
  }

  document.getElementById("driveConnectBtn").addEventListener("click", function () {
    if (!tokenClient) { alert("ยังไม่พร้อมเชื่อมต่อ Google — รอสักครู่แล้วลองใหม่"); return; }
    tokenClient.requestAccessToken({ prompt: "consent" });
  });

  window.DriveSync = {
    isSignedIn: function () { return !!accessToken; },
    schedulePush: schedulePush
  };

  initGoogleIdentity();
})();
</script>

const FONTS = `@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');`;
const STORAGE_KEY = "secretary-dashboard-v1";
const VISIBLE_LIMIT = 5;
const NOTE_VISIBLE = 9;
const NEXT_STATUS = { pending: "done", done: "failed", failed: "pending" };
const COLORS = ["#8b5cf6", "#34d399", "#fb923c", "#60a5fa", "#5a7a9e", "#d4956a"];
/* ── helpers ── */
function pad(n) { return String(n).padStart(2, "0"); }
function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function normalizeExpenseDate(raw) {
  if (!raw) return raw;
  const s = String(raw).trim();
  const isoMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (isoMatch) return `${isoMatch[1]}-${pad(Number(isoMatch[2]))}-${pad(Number(isoMatch[3]))}`;
  // รูปแบบไฟล์ CSV ธนาคารไทย: วัน/เดือน/ปี เช่น 9/7/2026 = 9 กรกฎาคม 2026
  const slashMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (slashMatch) {
    const [, d, m, y] = slashMatch;
    return `${y}-${pad(Number(m))}-${pad(Number(d))}`;
  }
  return s;
}
function todayISO() { return isoDate(new Date()); }
function tomorrowISO() { const d=new Date(); d.setDate(d.getDate()+1); return isoDate(d); }
function mondayISO(d) { const dt=new Date(d); const day=dt.getDay(); dt.setDate(dt.getDate()+(day===0?-6:1-day)); return isoDate(dt); }
function currentMonthKey() { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function smartDailyDate() { return new Date().getHours()>=18?tomorrowISO():todayISO(); }
function dayLabel(s) {
  if (!s) return "";
  if (s===todayISO()) return "Today";
  if (s===tomorrowISO()) return "Tomorrow";
  const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});
}
function thaiDate(s) {
  if (!s) return "";
  const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short",year:"numeric",calendar:"buddhist"});
}
function monthYearKey(dateStr) {
  if (!dateStr) return "";
  return dateStr.slice(0,7);
}
const DEFAULT_EVENTS = [
  { id:"e1", title:"ประชุมทีม", startDate:todayISO(), startTime:"09:00", endDate:todayISO(), endTime:"10:00", note:"" },
  { id:"e2", title:"พบแพทย์", startDate:tomorrowISO(), startTime:"14:00", endDate:tomorrowISO(), endTime:"15:00", note:"โรงพยาบาลใกล้บ้าน" },
];
const NOTE_COLORS = ["amber","teal","rose","violet","slate"];
const PAGE_TITLES = ["Dashboard","Finance","Tracker","Health","Documents","Books","Journal"];
const GOAL_COLORS = ["#8b5cf6","#34d399","#fb923c","#60a5fa","#f472b6","#fbbf24","#f87171","#5a7a9e"];
const GOAL_CATEGORIES = [
  {key:"finance",label:"การเงิน",icon:Wallet},
  {key:"health",label:"สุขภาพ",icon:Heart},
  {key:"career",label:"การงาน",icon:Target},
  {key:"learning",label:"การเรียนรู้",icon:BookOpen},
  {key:"relationship",label:"ความสัมพันธ์",icon:Users},
  {key:"personal",label:"ส่วนตัว",icon:Zap},
  {key:"other",label:"อื่นๆ",icon:FileText},
];
const GOAL_PRIORITIES = [
  {key:"high",label:"สูง",color:"#f87171"},
  {key:"medium",label:"กลาง",color:"#fbbf24"},
  {key:"low",label:"ต่ำ",color:"#60a5fa"},
];
const GOAL_MEASURE_TYPES = [
  {key:"numeric",label:"ตัวเลข",icon:Hash,hint:"เหมาะกับเป้าหมายที่นับเป็นตัวเลขได้ เช่น เงินเก็บ น้ำหนัก จำนวนครั้ง"},
  {key:"checklist",label:"เช็คลิสต์ย่อย",icon:ListChecks,hint:"เหมาะกับโปรเจกต์ที่แบ่งเป็นขั้นตอนย่อยได้ ความคืบหน้าคิดจากขั้นตอนที่ทำเสร็จ"},
  {key:"percent",label:"เปอร์เซ็นต์เอง",icon:Percent,hint:"เหมาะกับเป้าหมายเชิงทักษะที่วัดตัวเลขยาก เช่น ความคล่องภาษา ปรับเปอร์เซ็นต์เอง"},
];
function goalCategoryInfo(key){ return GOAL_CATEGORIES.find(c=>c.key===key)||GOAL_CATEGORIES[GOAL_CATEGORIES.length-1]; }
function goalPriorityInfo(key){ return GOAL_PRIORITIES.find(p=>p.key===key)||GOAL_PRIORITIES[1]; }
/* ═══ Project / Task / Check-in tracker ═══ */
const RECURRENCE_OPTIONS=[
  {key:"none",label:"ครั้งเดียว"},
  {key:"daily",label:"ทุกวัน"},
  {key:"weekly",label:"ทุกสัปดาห์"},
  {key:"monthly",label:"ทุกเดือน"},
];
const PROJECT_MEASURE_TYPES=[
  {key:"numeric",label:"ตัวเลขสะสม",icon:Hash,hint:"วัดจากตัวเลขที่บันทึก check-in เช่น เงินเก็บ น้ำหนัก ระยะทาง — ได้กราฟ ความเร็ว และวันที่คาดว่าจะสำเร็จ"},
  {key:"tasks",label:"ความคืบหน้าจากงาน",icon:ListChecks,hint:"วัดจาก % ของงานย่อยที่ทำเสร็จ (ถ่วงน้ำหนักได้) เหมาะกับโปรเจกต์ที่แบ่งเป็นขั้นตอน"},
  {key:"manual",label:"กำหนด % เอง",icon:Percent,hint:"ปรับเปอร์เซ็นต์เอง เหมาะกับงานที่วัดเป็นตัวเลขยาก เช่น ทักษะภาษา"},
];
function isRecurring(t){ return t && t.recurrence && t.recurrence!=="none"; }
function periodKey(recurrence,dateStr){
  if(recurrence==="weekly") return mondayISO(dateStr);
  if(recurrence==="monthly") return dateStr.slice(0,7);
  return dateStr;
}
function taskDoneOn(t,dateStr=todayISO()){
  if(!isRecurring(t)) return t.status==="done";
  return !!(t.completions||{})[periodKey(t.recurrence,dateStr)];
}
function toggleTaskInList(tasks,taskId,dateStr=todayISO()){
  return (tasks||[]).map(t=>{
    if(t.id!==taskId) return t;
    if(isRecurring(t)){
      const key=periodKey(t.recurrence,dateStr);
      const comp={...(t.completions||{})};
      if(comp[key]) delete comp[key]; else comp[key]=true;
      return {...t,completions:comp};
    }
    const nowDone=t.status!=="done";
    return {...t,status:nowDone?"done":"pending",completedAt:nowDone?new Date().toISOString():null};
  });
}
function taskStreak(t){
  if(!isRecurring(t)) return 0;
  const comp=t.completions||{};
  const d=new Date(todayISO()+"T00:00:00");
  const step=()=>{ if(t.recurrence==="daily") d.setDate(d.getDate()-1); else if(t.recurrence==="weekly") d.setDate(d.getDate()-7); else d.setMonth(d.getMonth()-1); };
  if(!comp[periodKey(t.recurrence,isoDate(d))]) step();
  let streak=0;
  for(let i=0;i<400;i++){
    if(comp[periodKey(t.recurrence,isoDate(d))]){ streak++; step(); } else break;
  }
  return streak;
}
function taskCompletionRate(t,periods=30){
  if(!isRecurring(t)) return t.status==="done"?100:0;
  const comp=t.completions||{};
  const d=new Date(todayISO()+"T00:00:00");
  const seen=new Set(); let total=0,done=0;
  for(let i=0;i<periods*32&&total<periods;i++){
    const key=periodKey(t.recurrence,isoDate(d));
    if(!seen.has(key)){ seen.add(key); total++; if(comp[key]) done++; }
    d.setDate(d.getDate()-1);
  }
  return total?Math.round((done/total)*100):0;
}
function taskIsDueToday(t){
  if(isRecurring(t)) return true;
  if(t.status==="done") return false;
  if(!t.dueDate) return false;
  return t.dueDate<=todayISO();
}
function taskIsOverdue(t){
  if(isRecurring(t)||t.status==="done"||!t.dueDate) return false;
  return t.dueDate<todayISO();
}
function projectCheckins(data,projectId){
  return (data.checkins||[]).filter(c=>c.projectId===projectId).slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}
function projectTasks(data,projectId){ return (data.tasks||[]).filter(t=>t.projectId===projectId); }
function projectCurrentValue(p,data){
  const cs=projectCheckins(data,p.id);
  return cs.length?cs[cs.length-1].value:(p.baselineValue||0);
}
function projectProgress(p,data){
  if(!p) return 0;
  if(p.measureType==="numeric"){
    const base=p.baselineValue||0, span=(p.targetValue||0)-base;
    if(!span) return 0;
    return Math.max(0,Math.min(100,Math.round(((projectCurrentValue(p,data)-base)/span)*100)));
  }
  if(p.measureType==="tasks"){
    const ts=projectTasks(data,p.id);
    if(!ts.length) return 0;
    let totW=0,doneW=0;
    ts.forEach(t=>{ const w=t.weight||1; totW+=w; doneW += isRecurring(t)? w*(taskCompletionRate(t)/100) : (t.status==="done"?w:0); });
    return totW?Math.round((doneW/totW)*100):0;
  }
  return Math.max(0,Math.min(100,Math.round(p.manualValue||0)));
}
function projectVelocity(p,data){
  if(p.measureType!=="numeric") return null;
  const cs=projectCheckins(data,p.id);
  if(cs.length<2) return null;
  const first=cs[0], last=cs[cs.length-1];
  const days=(new Date(last.date+"T00:00:00")-new Date(first.date+"T00:00:00"))/86400000;
  if(days<=0) return null;
  const perDay=(last.value-first.value)/days;

const FIXED_HINTS=["ผ่อน","ภาษี","สาธารณูปโภค","ประกัน","ค่าเช่า","รายการหักประจำเดือน","ค่าน้ำ","ค่าไฟ","อินเทอร์เน็ต","ค่าเน็ต","ค่าโทร","ค่าเทอม"];
function guessCategoryType(cat){ return FIXED_HINTS.some(k=>String(cat).includes(k))?"fixed":"variable"; }
function getBudget(data,cat){

}
// 0 = เกินงบ, 1 = ยังอยู่ในงบ, 2 = ยังไม่ตั้งงบ
function budgetRank(r){
  if(r.budget>0&&r.total>r.budget) return 0;
  if(r.budget>0) return 1;
  return 2;
}
const BUDGET_GROUP_LABEL=["🔴 เกินงบ — เรียงจากเกินมากสุด","🟢 ยังอยู่ในงบ — เรียงจากใกล้เต็มงบสุด","⚪ ยังไม่ตั้งงบ"];
function compareByBudgetStatus(a,b){
  const ra=budgetRank(a), rb=budgetRank(b);
  if(ra!==rb) return ra-rb;
  if(ra===0) return (b.total-b.budget)-(a.total-a.budget); // เกินเป็นจำนวนเงินมากสุดก่อน
  if(ra===1) return (b.total/b.budget)-(a.total/a.budget); // ใช้ไปคิดเป็น % สูงสุดก่อน (ใกล้เต็มงบ)
  return b.total-a.total;                                   // ไม่มีงบ: ใช้มากสุดก่อน
}
function monthsBefore(monthKey,n){
  const out=[]; const [y,m]=monthKey.split("-").map(Number);
  for(let i=1;i<=n;i++){ const d=new Date(y,m-1-i,1); out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); }
  return out;
}
function buildMonthReview(data,monthKey){
  const expAll=data.finance.expenses||[];
  const exp=expAll.filter(e=>monthYearKey(e.date)===monthKey);
  const inc=(data.finance.income||[]).filter(i=>(i.month||monthYearKey(i.date))===monthKey);
  const inv=(data.finance.investments||[]).filter(v=>monthYearKey(v.date)===monthKey);
  const totalIncome=inc.reduce((a,i)=>a+i.amount,0);
  const totalExpense=exp.reduce((a,e)=>a+Math.abs(e.amount),0);
  const totalSaved=inv.reduce((a,v)=>a+v.amount,0);
  const leftover=totalIncome-totalExpense-totalSaved;
  const savingRate=totalIncome>0?((totalSaved+Math.max(0,leftover))/totalIncome)*100:0;
  const byCat={};
  exp.forEach(e=>{
    if(!byCat[e.category]) byCat[e.category]={cat:e.category,total:0,items:[]};
    byCat[e.category].total+=Math.abs(e.amount);
    byCat[e.category].items.push(e);
  });
  const prev3=monthsBefore(monthKey,3);
  const rows=Object.values(byCat).map(r=>{
    const b=getBudget(data,r.cat);
    const hist=prev3.map(m=>expAll.filter(e=>e.category===r.cat&&monthYearKey(e.date)===m).reduce((a,e)=>a+Math.abs(e.amount),0));
    const seen=hist.filter((v,i)=>expAll.some(e=>e.category===r.cat&&monthYearKey(e.date)===prev3[i]));
    const avg=seen.length?seen.reduce((a,v)=>a+v,0)/seen.length:null;
    return {...r,budget:b.amount,type:b.type,avg,
      diff:b.amount>0?r.total-b.amount:null,
      pct:b.amount>0?(r.total/b.amount)*100:null};
  }).sort((a,b)=>b.total-a.total);
  const variable=rows.filter(r=>r.type==="variable").sort(compareByBudgetStatus);
  const fixed=rows.filter(r=>r.type==="fixed").sort(compareByBudgetStatus);
  const sum=a=>a.reduce((x,r)=>x+r.total,0);
  const budgeted=rows.filter(r=>r.budget>0);
  const totalBudget=budgeted.reduce((a,r)=>a+r.budget,0);
  const totalVsBudget=budgeted.reduce((a,r)=>a+r.total,0);
  return {monthKey,exp,inc,inv,totalIncome,totalExpense,totalSaved,leftover,savingRate,
    rows,variable,fixed,variableTotal:sum(variable),fixedTotal:sum(fixed),
    totalBudget,totalVsBudget,hasBudget:budgeted.length>0};
}
function detectAnomalies(data,monthKey,review){
  const out=[];
  const expAll=data.finance.expenses||[];
  const prior=expAll.filter(e=>monthYearKey(e.date)<monthKey);
  const priorCats=new Set(prior.map(e=>e.category));
  const median=(arr)=>{ if(!arr.length) return null; const s=arr.slice().sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  review.rows.forEach(r=>{
    const overBudget=r.budget>0&&r.total>r.budget*1.2;
    if(overBudget)
      out.push({key:"over-"+r.cat,level:"bad",icon:"⚠️",title:`${r.cat} เกินงบ ${Math.round(((r.total-r.budget)/r.budget)*100)}%`,
        detail:`ใช้ ฿${Math.round(r.total).toLocaleString()} จากงบ ฿${r.budget.toLocaleString()} (เกิน ฿${Math.round(r.total-r.budget).toLocaleString()})`,cat:r.cat});
    if(prior.length>0&&!priorCats.has(r.cat))
      out.push({key:"new-"+r.cat,level:"info",icon:"🆕",title:`หมวดใหม่: ${r.cat}`,
        detail:`เพิ่งเริ่มมีค่าใช้จ่ายหมวดนี้เดือนนี้ รวม ฿${Math.round(r.total).toLocaleString()}`,cat:r.cat});
    // ไม่เตือนซ้ำ: ถ้าเกินงบอยู่แล้วก็ไม่ต้องบอกว่าพุ่งขึ้นอีก เพราะสื่อความหมายเดียวกัน
    else if(!overBudget&&r.avg!=null&&r.avg>0&&r.total>=r.avg*1.6&&r.total-r.avg>=800)
      out.push({key:"spike-"+r.cat,level:"warn",icon:"📈",title:`${r.cat} พุ่งขึ้น ${Math.round(((r.total-r.avg)/r.avg)*100)}%`,
        detail:`เดือนนี้ ฿${Math.round(r.total).toLocaleString()} เทียบค่าเฉลี่ย 3 เดือนก่อน ฿${Math.round(r.avg).toLocaleString()}`,cat:r.cat});
    // ก้อนใหญ่ผิดปกติ = ใหญ่กว่ารายการอื่นในหมวดเดียวกันอย่างน้อย 3 เท่า (ไม่ใช่แค่สัดส่วนสูง)
    if(r.items.length>1){
      r.items.forEach(e=>{
        const amt=Math.abs(e.amount);
        if(amt<1000) return;
        const others=r.items.filter(x=>x.id!==e.id).map(x=>Math.abs(x.amount));
        const med=median(others);
        if(med!=null&&med>0&&amt>=med*3)
          out.push({key:"big-"+e.id,level:"warn",icon:"💥",title:`รายการก้อนใหญ่ผิดปกติใน ${r.cat}`,
            detail:`${e.date} · ${e.memo||"ไม่มีโน้ต"} · ฿${amt.toLocaleString()} — ใหญ่กว่ารายการอื่นในหมวดนี้ราว ${Math.round(amt/med)} เท่า`,cat:r.cat});
      });
    }
  });
  const order={bad:0,warn:1,info:2};
  return out.sort((a,b)=>order[a.level]-order[b.level]);
}

function relativeTime(iso) {
  if(!iso) return "";
  const then=new Date(iso), now=new Date();
  const diffMin=Math.round((now-then)/60000);
  const hhmm=then.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  if(diffMin<1) return "เมื่อสักครู่";
  if(diffMin<60) return `${diffMin} นาทีที่แล้ว`;
  if(isoDate(then)===todayISO()) return `วันนี้ ${hhmm}`;
  const y=new Date(); y.setDate(y.getDate()-1);
  if(isoDate(then)===isoDate(y)) return `เมื่อวาน ${hhmm}`;
  return `${then.toLocaleDateString("th-TH",{day:"numeric",month:"short"})} ${hhmm}`;
}

function applyResets(data) {

  if (cleanedDaily.length!==next.todos.daily.length){next.todos={...next.todos,daily:cleanedDaily};changed=true;}
  const markers=next.resetMarkers||{weekStart:mondayISO(new Date()),month:currentMonthKey()};
  const thisWeek=mondayISO(new Date()); const thisMonth=currentMonthKey();
  let nm=markers;
  if (markers.weekStart!==thisWeek){next.todos={...next.todos,weekly:[]};nm={...nm,weekStart:thisWeek};changed=true;}
  if (markers.month!==thisMonth){next.todos={...next.todos,monthly:[]};nm={...nm,month:thisMonth};changed=true;}
  if (nm!==markers) next.resetMarkers=nm;
  return {data:next,changed};
}

function CalendarModal({events,onClose,onEditEvent,onDeleteEvent}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [detail,setDetail]=useState(null);
  const prevMonth=()=>{ if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth=()=>{ if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  const startOffset=firstDay===0?6:firstDay-1;
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  const monthStr=`${year}-${pad(month+1)}`;
  const eventsThisMonth=events.filter(e=>e.startDate&&e.startDate.startsWith(monthStr));
  function eventsOnDay(d){const iso=`${year}-${pad(month+1)}-${pad(d)}`;return eventsThisMonth.filter(e=>e.startDate===iso||(e.endDate&&e.endDate>=iso&&e.startDate<=iso));}
  const monthLabel=new Date(year,month,1).toLocaleDateString("th-TH",{month:"long",year:"numeric",calendar:"buddhist"});
  const dayNames=["จ","อ","พ","พฤ","ศ","ส","อา"];
  const today=todayISO();
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal cal-modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <div className="cal-nav"><button className="cal-nav-btn" onClick={prevMonth}><ChevronLeft size={27}/></button><span className="cal-month-label">{monthLabel}</span><button className="cal-nav-btn" onClick={nextMonth}><ChevronRightIcon size={27}/></button></div>
          <button className="modal-close" onClick={onClose}><X size={27}/></button>
        </div>
        {!detail?(
          <>
            <div className="cal-grid-head">{dayNames.map(d=><div key={d} className="cal-day-name">{d}</div>)}</div>
            <div className="cal-grid">
              {cells.map((d,i)=>{
                if(!d) return <div key={`blank-${i}`} className="cal-cell empty-cell"/>;
                const iso=`${year}-${pad(month+1)}-${pad(d)}`;
                const evs=eventsOnDay(d);
                return (
                  <div key={iso} className={`cal-cell ${iso===today?"cal-today":""}`} onClick={()=>evs.length&&setDetail({date:iso,evs})}>
                    <span className="cal-d">{d}</span>
                    {evs.slice(0,2).map(e=><div key={e.id} className="cal-dot-label">{e.title}</div>)}
                    {evs.length>2&&<div className="cal-more">+{evs.length-2}</div>}
                  </div>
                );
              })}
            </div>
            <div className="cal-upcoming-list">
              <div className="cal-sec-title">งานที่กำลังจะมาถึง</div>
              {events.filter(e=>e.startDate>=todayISO()).sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,6).map(e=>(
                <div key={e.id} className="cal-ev-row">
                  <span className="cal-ev-date">{thaiDate(e.startDate)}{e.startTime?` ${e.startTime}`:""}</span>
                  <span className="cal-ev-title">{e.title}</span>
                  <button className="del-btn" onClick={()=>onDeleteEvent(e.id)}><Trash2 size={20}/></button>
                </div>
              ))}
              {events.filter(e=>e.startDate>=todayISO()).length===0&&<div className="empty">ไม่มีงานในอนาคต</div>}
            </div>
          </>
        ):(
          <div className="cal-detail">
            <button className="back-btn" onClick={()=>setDetail(null)}><ChevronLeft size={24}/> กลับ</button>
            <div className="cal-detail-date">{thaiDate(detail.date)}</div>
            {detail.evs.map(e=>(
              <div key={e.id} className="cal-detail-card">
                <div className="cal-detail-title">{e.title}</div>
                <div className="cal-detail-meta">{e.startTime&&<span>⏰ {e.startTime}{e.endTime?` – ${e.endTime}`:""}</span>}{e.endDate&&e.endDate!==e.startDate&&<span> ถึง {thaiDate(e.endDate)}</span>}</div>
                {e.note&&<div className="cal-detail-note">{e.note}</div>}
                <div className="cal-detail-actions">
                  <button className="modal-btn-cancel" onClick={()=>{onEditEvent(e);setDetail(null);}}>แก้ไข</button>
                  <button className="del-txt-btn" onClick={()=>{onDeleteEvent(e.id);setDetail(d=>({...d,evs:d.evs.filter(x=>x.id!==e.id)}));}}>ลบ</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

  const RAD=Math.PI/180;
  const r=outerRadius+22;

  const y=cy+r*Math.sin(-midAngle*RAD);
  const anchor=x>cx?"start":"end";
  return (
    <text x={x} y={y} fill={fill} textAnchor={anchor} dominantBaseline="central" style={{fontSize:14,fontFamily:"'Noto Sans Thai',sans-serif",fontWeight:600}}>
      {name} {(percent*100).toFixed(1)}%
    </text>
  );

function FinanceExpensesTab({finance,persist}) {

    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const text=await file.text();
      const lines=text.split("\n").map(l=>l.trim()).filter(l=>l);
      const header=lines[0].split(",").map(h=>h.trim().toLowerCase());
      const txnIdx=header.findIndex(h=>h.includes("txn")||h.includes("amount"));
      const dateIdx=header.findIndex(h=>h.includes("date"));
      const categoryIdx=header.findIndex(h=>h.includes("category"));
      const memoIdx=header.findIndex(h=>h.includes("memo")||h.includes("note"));
      const typeIdxFound=header.findIndex(h=>h.includes("type"));
      const typeIdx=typeIdxFound>=0?typeIdxFound:1; // คอลัมน์ B = "Type" ถ้าหาชื่อคอลัมน์ไม่เจอ
      const EXCLUDED_TYPES=["move money","deposit"];
      if(txnIdx<0||dateIdx<0) {alert("ไม่พบ Txn หรือ Date column");return;}
      const newExpenses=[];
      let skippedByType=0;
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(",").map(c=>c.trim());
        const amt=parseFloat(cols[txnIdx]);
        const date=normalizeExpenseDate(cols[dateIdx]);
        const cat=cols[categoryIdx]||"อื่นๆ";
        const memo=cols[memoIdx]||"";
        const type=(cols[typeIdx]||"").trim().toLowerCase();
        const isExcludedType=EXCLUDED_TYPES.some(t=>type.includes(t));
        if(isExcludedType){ skippedByType++; continue; }
        if(amt<0&&date){
          newExpenses.push({id:uid(),date,amount:amt,category:cat,memo:memo,source:"kbank-csv"});
        }
      }
      persist({
        ...finance,
        finance:{
          ...finance.finance,
          expenses:[...finance.finance.expenses,...newExpenses]
        }
      });
      setShowCSVImport(false);
      alert(`นำเข้า ${newExpenses.length} รายการสำเร็จ${skippedByType>0?` (ข้าม ${skippedByType} รายการที่เป็น move money / deposit)`:""}`);

/* ═══ Payslip import ═══ */
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESSERACT_URL="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";
const SLIP_AMOUNT_RE=/\d{1,3}(?:,\d{3})*\.\d{2}/g;
const UTILITY_KEYWORDS=["ค่าน้ำ","ค่าไฟ","ค่าอ่านหน่วย","ค่าขยะ","cable tv"];
const SAVINGS_KEYWORDS=["กบข","กสจ"];
// หัวข้อที่บอกว่าจบส่วน "รายการเงินหัก" แล้ว — ห้ามอ่านเลยไป (กันนับ กบข. ซ้ำจากตาราง 2 รอบ)
const DED_END_MARKERS=["รายการจ่ายเงินเดือน","ระบบสารสนเทศ","รายการเงินเพิ่ม","รวมเงินหัก"];
const CAT_TAX="ภาษี ณ ที่จ่าย";
const CAT_UTILITY="ค่าสาธารณูปโภค";
const CAT_OTHER="รายการหักประจำเดือน";
function loadExternalScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[data-ext="${src}"]`)) return res();
    const s=document.createElement("script");
    s.src=src; s.dataset.ext=src; s.onload=()=>res(); s.onerror=()=>rej(new Error("โหลดไลบรารีไม่สำเร็จ: "+src));
    document.head.appendChild(s);
  });
}
function slipNum(s){ return Number(String(s).replace(/,/g,"")); }
function classifyDeduction(name){
  const low=name.toLowerCase();
  if(UTILITY_KEYWORDS.some(k=>low.includes(k.toLowerCase()))) return "utility";
  if(SAVINGS_KEYWORDS.some(k=>name.includes(k))) return "savings";
  return "other";
}
function parsePayslip(rawText){
  const text=String(rawText||"").replace(/ /g," ");
  const warnings=[];
  const iAdd=text.indexOf("รายการเงินเพิ่ม");
  const iDed=text.indexOf("รายการเงินหัก");
  const headEnd=iAdd>=0?iAdd:(iDed>=0?iDed:text.length);
  const summary=(text.slice(0,headEnd).match(SLIP_AMOUNT_RE)||[]).map(slipNum);
  let base=null,allowance=null,gross=null,tax=null,deductTotal=null,grandDeduct=null,net=null;
  if(summary.length>=7){ [base,allowance,gross,tax,deductTotal,grandDeduct,net]=summary.slice(-7); }
  else warnings.push(`อ่านแถวสรุปด้านบนไม่ครบ (พบ ${summary.length} ตัวเลข ต้องการ 7)`);
  // ตัดเฉพาะช่วง "รายการเงินหัก" เท่านั้น ไม่ให้เลยไปอ่านตารางท้ายสลิป (เช่น "รายการจ่ายเงินเดือน 2 รอบ")
  let dedText="";
  if(iDed>=0){
    dedText=text.slice(iDed);
    let cut=dedText.length;
    DED_END_MARKERS.forEach(mk=>{ const p=dedText.indexOf(mk,1); if(p>0&&p<cut) cut=p; });
    dedText=dedText.slice(0,cut);
  } else warnings.push('ไม่พบหัวข้อ "รายการเงินหัก" — อาจอ่านไฟล์ไม่ครบ');
  const items=[]; const re=/(\d{8})\s*([\s\S]*?)\s((?:\d{1,3}(?:,\d{3})*)?\.\d{2})(?=\s|$)/g; let m;
  while((m=re.exec(dedText))!==null){
    const name=m[2].replace(/\s+/g," ").trim();
    if(!name) continue;
    if(name.length>60){ warnings.push(`รายการ ${m[1]} อ่านได้ชื่อยาวผิดปกติ อาจอ่านคร่อมส่วนอื่น — โปรดตรวจสอบ`); continue; }
    items.push({id:uid(),code:m[1],name,amount:slipNum(m[3]),bucket:classifyDeduction(name)});
  }
  const r2=n=>Math.round(n*100)/100;
  const sumOf=b=>r2(items.filter(i=>i.bucket===b).reduce((a,i)=>a+i.amount,0));
  const utilities=sumOf("utility"), savings=sumOf("savings"), other=sumOf("other");
  const itemsSum=r2(utilities+savings+other);
  const near=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<0.05;
  const checks=[];
  if(deductTotal!=null) checks.push({label:"ผลรวมรายการหัก = ช่องเงินหัก",ok:near(itemsSum,deductTotal),got:itemsSum,want:deductTotal});
  if(deductTotal!=null&&tax!=null&&grandDeduct!=null) checks.push({label:"เงินหัก + ภาษี = รวมหัก",ok:near(deductTotal+tax,grandDeduct),got:r2(deductTotal+tax),want:grandDeduct});
  if(gross!=null&&grandDeduct!=null&&net!=null) checks.push({label:"รวมรับ − รวมหัก = คงรับ",ok:near(gross-grandDeduct,net),got:r2(gross-grandDeduct),want:net});
  if(base!=null&&allowance!=null&&gross!=null) checks.push({label:"อัตราเงินเดือน + เงินเพิ่ม = รวมรับ",ok:near(base+allowance,gross),got:r2(base+allowance),want:gross});
  return {base,allowance,gross,tax,deductTotal,grandDeduct,net,items,utilities,savings,other,itemsSum,checks,allOk:checks.length>0&&checks.every(c=>c.ok),warnings};
}
async function extractPdfText(file){
  await loadExternalScript(PDFJS_URL);
  const lib=window.pdfjsLib;
  if(!lib) throw new Error("โหลด pdf.js ไม่สำเร็จ");
  lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const buf=await file.arrayBuffer();
  const pdf=await lib.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    let lastY=null,line="";
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      if(lastY!==null&&Math.abs(y-lastY)>3){ out+=line.trim()+"\n"; line=""; }
      line+=it.str+" "; lastY=y;
    });
    out+=line.trim()+"\n";
  }
  return out;
}
async function extractImageText(file,onProgress){
  await loadExternalScript(TESSERACT_URL);
  const T=window.Tesseract;
  if(!T) throw new Error("โหลด Tesseract.js ไม่สำเร็จ");
  const url=URL.createObjectURL(file);
  try{
    const res=await T.recognize(url,"tha+eng",{logger:msg=>{ if(msg.status==="recognizing text"&&onProgress) onProgress(Math.round(msg.progress*100)); }});
    return res.data.text;
  } finally { URL.revokeObjectURL(url); }
}
function SlipImportModal({data,persist,onClose}) {
  const [step,setStep]=useState("pick");

  const [err,setErr]=useState("");

  const [slipDate,setSlipDate]=useState(todayISO());
  const [form,setForm]=useState({gross:0,tax:0,utilities:0,other:0,savings:0});
  const [showItems,setShowItems]=useState(false);
  const [dupChoice,setDupChoice]=useState(null);
  const slipMonth=monthYearKey(slipDate);

  const isDuplicate=existing.length>0;

    const p=parsePayslip(text);
    if(p.gross==null&&p.items.length===0){ setErr("อ่านสลิปไม่ออกเลย — ลองใช้โหมดวางข้อความแทน"); setStep("pick"); return; }

  };

    try{
      let text;
      if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
        setBusyMsg("กำลังอ่าน PDF...");
        text=await extractPdfText(file);
        if(text.replace(/\s/g,"").length<40){
          setBusyMsg("PDF นี้เป็นภาพสแกน กำลังใช้ OCR (โหลดครั้งแรกอาจนาน)...");
          throw new Error("PDF นี้ไม่มีข้อความให้อ่าน (เป็นภาพสแกน) — กรุณาบันทึกเป็นรูปภาพแล้วอัปโหลดใหม่ หรือใช้โหมดวางข้อความ");
        }
      } else {
        setBusyMsg("กำลังอ่านรูปด้วย OCR (โหลดโมเดลภาษาไทยครั้งแรกอาจใช้เวลาสักครู่)...");
        text=await extractImageText(file,setProgress);
      }
      runParse(text);
    }catch(ex){ setErr(ex.message||"เกิดข้อผิดพลาดในการอ่านไฟล์"); setStep("pick"); }
  };
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const doSave=(replace)=>{
    let income=data.finance.income||[];
    let expenses=data.finance.expenses||[];
    let investments=data.finance.investments||[];
    if(replace){
      income=income.filter(i=>!(i.slipMonth===slipMonth&&i.importSource==="payslip"));
      expenses=expenses.filter(e=>!(e.slipMonth===slipMonth&&e.importSource==="payslip"));
      investments=investments.filter(v=>!(v.slipMonth===slipMonth&&v.source==="payslip"));
    }
    const tag={importSource:"payslip",slipMonth};
    const newIncome=[];
    if(Number(form.gross)>0) newIncome.push({id:uid(),date:slipDate,month:slipMonth,amount:Number(form.gross),source:"เงินเดือน",note:"นำเข้าจากสลิปเงินเดือน",...tag});
    const newExp=[];
    const pushExp=(amt,cat,memo)=>{ if(Number(amt)>0) newExp.push({id:uid(),date:slipDate,amount:-Math.abs(Number(amt)),category:cat,memo,source:"payslip",...tag}); };
    pushExp(form.tax,CAT_TAX,"ภาษีหัก ณ ที่จ่ายจากสลิปเงินเดือน");
    pushExp(form.utilities,CAT_UTILITY,(parsed?parsed.items.filter(i=>i.bucket==="utility").map(i=>i.name).join(", "):""));

function RecategorizeModal({finance,persist,onClose,startCat}) {
  const expenses=finance.finance.expenses||[];
  const allCats=[...new Set(expenses.map(e=>e.category).filter(Boolean))].sort();
  const [srcCat,setSrcCat]=useState(startCat&&allCats.includes(startCat)?startCat:(allCats.includes("อื่นๆ")?"อื่นๆ":allCats[0]||""));
  const [picked,setPicked]=useState(()=>new Set());
  const [target,setTarget]=useState("");
  const [newCat,setNewCat]=useState("");
  const pool=expenses.filter(e=>e.category===srcCat);
  const groups={};
  pool.forEach(e=>{
    const k=(e.memo||"").trim()||"(ไม่มีโน้ต)";
    if(!groups[k]) groups[k]={memo:k,ids:[],total:0,count:0};
    groups[k].ids.push(e.id); groups[k].total+=Math.abs(e.amount); groups[k].count++;
  });
  const groupList=Object.values(groups).sort((a,b)=>b.total-a.total);
  const toggleGroup=(g)=>setPicked(prev=>{
    const n=new Set(prev);
    const on=g.ids.every(id=>n.has(id));
    g.ids.forEach(id=>on?n.delete(id):n.add(id));
    return n;
  });
  const pickedTotal=pool.filter(e=>picked.has(e.id)).reduce((a,e)=>a+Math.abs(e.amount),0);
  const finalTarget=(newCat.trim()||target).trim();
  const apply=()=>{
    if(!finalTarget||picked.size===0) return;
    persist({...finance,finance:{...finance.finance,
      expenses:expenses.map(e=>picked.has(e.id)?{...e,category:finalTarget}:e)}});
    setPicked(new Set()); setNewCat("");
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal recat-modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>🗂️ จัดหมวดหมู่ใหม่</span><button className="modal-close" onClick={onClose}><X size={27}/></button></div>
        <div className="modal-body">
          <div className="recat-hint">รายการที่โน้ตเหมือนกันถูกจับกลุ่มไว้แล้ว — กดเลือกทีเดียวได้ทั้งกลุ่ม</div>
          <div>
            <label className="field-label">จัดหมวดจาก</label>
            <select className="modal-input" style={{cursor:"pointer"}} value={srcCat} onChange={e=>{setSrcCat(e.target.value);setPicked(new Set());}}>
              {allCats.map(c=><option key={c} value={c}>{c} ({expenses.filter(x=>x.category===c).length} รายการ)</option>)}
            </select>
          </div>
          <div className="recat-list">
            {groupList.length===0&&<div className="empty">ไม่มีรายการในหมวดนี้</div>}
            {groupList.map(g=>{
              const on=g.ids.every(id=>picked.has(id));
              return (
                <button key={g.memo} className={`recat-group ${on?"on":""}`} onClick={()=>toggleGroup(g)}>
                  <span className={`status-btn ${on?"done":""}`} style={{width:22,height:22}}>{on&&<Check size={14}/>}</span>
                  <span className="recat-memo">{g.memo}</span>
                  {g.count>1&&<span className="recat-count">×{g.count}</span>}
                  <span className="recat-amt">฿{g.total.toLocaleString()}</span>
                </button>
              );
            })}
          </div>
          {picked.size>0&&(
            <div className="recat-action">
              <div style={{fontSize:17,color:"#c9b8f0",marginBottom:8}}>เลือกไว้ <b>{picked.size}</b> รายการ · ฿{pickedTotal.toLocaleString()}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <select className="modal-input" style={{flex:1,minWidth:150,cursor:"pointer"}} value={target} onChange={e=>{setTarget(e.target.value);setNewCat("");}}>
                  <option value="">— ย้ายไปหมวด —</option>
                  {allCats.filter(c=>c!==srcCat).map(c=><option key={c} value={c}>{c}</option>)}
                </select>
                <input className="modal-input" style={{flex:1,minWidth:150}} placeholder="หรือพิมพ์หมวดใหม่" value={newCat} onChange={e=>{setNewCat(e.target.value);setTarget("");}}/>
              </div>
              <button className="modal-btn-save" style={{marginTop:10,width:"100%"}} disabled={!finalTarget} onClick={apply}>
                ย้าย {picked.size} รายการ → {finalTarget||"…"}
              </button>
            </div>
          )}
        </div>
        <div className="modal-foot"><button className="modal-btn-cancel" onClick={onClose}>ปิด</button></div>
      </div>
    </div>
  );
}

              const b=getBudget(data,c);

                    <button className={`budget-type-btn ${b.type==="fixed"?"on fixed":""}`} onClick={()=>setBudget(c,{type:"fixed"})}>คงที่</button>
                  </div>

function GoalCard({goal,onEdit,onDelete,onUpdate}) {
  const [expanded,setExpanded]=useState(false);
  const [editingValue,setEditingValue]=useState(false);
  const [valueDraft,setValueDraft]=useState(goal.currentValue);
  const progress=goalProgress(goal);
  const cat=goalCategoryInfo(goal.category);
  const CatIcon=cat.icon;
  const pri=goalPriorityInfo(goal.priority);
  const dLeft=daysUntil(goal.targetDate);
  const isDone=progress>=100;
  const r=30,c=2*Math.PI*r,off=c-(progress/100)*c;
  const saveValue=()=>{ onUpdate({...goal,currentValue:Number(valueDraft)||0}); setEditingValue(false); };
  const bumpPercent=(delta)=>onUpdate({...goal,currentValue:Math.max(0,Math.min(100,(goal.currentValue||0)+delta))});
  const toggleMilestone=(id)=>onUpdate({...goal,milestones:goal.milestones.map(m=>m.id===id?{...m,done:!m.done}:m)});
  return (
    <div className="goal-card" style={{"--goal-color":goal.color}}>
      <div className="goal-card-top">
        <div className="goal-cat-badge" style={{background:`${goal.color}22`,color:goal.color}}><CatIcon size={15}/> {cat.label}</div>
        <div className="goal-priority-dot" style={{background:pri.color}} title={`ความสำคัญ: ${pri.label}`}/>
      </div>
      <div className="goal-card-title">{goal.title}</div>
      {goal.description&&<div className="goal-card-desc">{goal.description}</div>}
      <div className="goal-progress-row">
        <div className="goal-progress-ring-wrap">
          <svg viewBox="0 0 72 72" className="goal-ring-svg">
            <circle cx="36" cy="36" r={r} className="ring-track"/>
            <circle cx="36" cy="36" r={r} stroke={goal.color} strokeDasharray={c} strokeDashoffset={off} className="ring-value"/>
            <text x="36" y="41" textAnchor="middle" className="goal-ring-number">{progress}%</text>
          </svg>
        </div>
        <div className="goal-progress-meta">
          {goal.measureType==="numeric"&&(
            editingValue?(
              <div className="goal-inline-edit">
                <input type="number" className="modal-input" value={valueDraft} onChange={e=>setValueDraft(e.target.value)} autoFocus onKeyDown={e=>e.key==="Enter"&&saveValue()}/>
                <button className="icon-btn" style={{width:32,height:32,minWidth:32}} onClick={saveValue}><Check size={16}/></button>
              </div>
            ):(
              <div className="goal-numeric-value" onClick={()=>{setValueDraft(goal.currentValue);setEditingValue(true);}}>
                <span>{(goal.currentValue||0).toLocaleString()}</span>&nbsp;/&nbsp;{goal.targetValue.toLocaleString()} {goal.unit}
                <Edit3 size={14} style={{marginLeft:6,opacity:.6}}/>
              </div>
            )
          )}
          {goal.measureType==="percent"&&(
            <div className="goal-percent-controls">
              <button className="mini-btn" onClick={()=>bumpPercent(-10)}>−</button>
              <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:18}}>{progress}%</span>
              <button className="mini-btn" onClick={()=>bumpPercent(10)}>+</button>
            </div>
          )}
          {goal.measureType==="checklist"&&(
            <button className="goal-checklist-toggle" onClick={()=>setExpanded(e=>!e)}>
              <ListChecks size={16}/> {goal.milestones.filter(m=>m.done).length}/{goal.milestones.length} ขั้นตอน
              {expanded?<ChevronUp size={16}/>:<ChevronDown size={16}/>}
            </button>
          )}
          {goal.targetDate&&(
            <div className={`goal-deadline ${dLeft!=null&&dLeft<0&&!isDone?"overdue":""}`}>
              <Clock size={14}/> {isDone?"สำเร็จแล้ว":dLeft==null?"":dLeft<0?`เลยกำหนด ${Math.abs(dLeft)} วัน`:dLeft===0?"ครบกำหนดวันนี้":`เหลือ ${dLeft} วัน`}
            </div>
          )}
        </div>
      </div>
      {goal.measureType==="checklist"&&expanded&&(
        <div className="goal-milestone-list">
          {goal.milestones.length===0&&<div className="empty" style={{fontSize:17}}>ยังไม่มีขั้นตอนย่อย</div>}
          {goal.milestones.map(m=>(
            <div key={m.id} className="milestone-row">
              <button className={`status-btn ${m.done?"done":""}`} onClick={()=>toggleMilestone(m.id)}>{m.done&&<Check size={16}/>}</button>
              <span style={{flex:1,fontSize:18,textDecoration:m.done?"line-through":"none",color:m.done?"#6f6790":"#f2eefc"}}>{m.text}</span>
            </div>
          ))}
        </div>
      )}
      <div className="goal-card-actions">
        <button className="text-btn" onClick={()=>onEdit(goal)}><Edit3 size={16}/> แก้ไข</button>
        <button className="del-txt-btn" onClick={()=>onDelete(goal.id)}><Trash2 size={16}/> ลบ</button>
      </div>
    </div>
  );
}

function TaskRow({task,project,onToggle,onEdit,onDelete,showProject}) {

function TodayPanel({data,persist,onOpenProject,onAddTask,onEditTask}) {
  const tasks=data.tasks||[];
  const projById={}; (data.projects||[]).forEach(p=>projById[p.id]=p);
  const todayList=tasks.filter(taskIsDueToday);
  const overdue=todayList.filter(taskIsOverdue);
  const recurring=todayList.filter(t=>isRecurring(t));
  const dueToday=todayList.filter(t=>!isRecurring(t)&&!taskIsOverdue(t));
  const doneCount=todayList.filter(t=>taskDoneOn(t)).length;
  const pct=todayList.length?Math.round((doneCount/todayList.length)*100):0;
  const toggleTask=(id)=>{
    const t=tasks.find(x=>x.id===id);
    const willBeDone=!taskDoneOn(t);

    <>

    <div className="card">
      <div className="card-head">
        <ListTodo size={24}/> Today

        </div>
      </div>
      <div className="trk-today-bar"><div className="trk-today-bar-fill" style={{width:`${pct}%`}}/></div>
      {todayList.length===0&&<div className="empty">ไม่มีงานค้างวันนี้ 🎉 กด + เพื่อเพิ่มงาน</div>}

      {showProjModal&&<ProjectModal initial={editProj} onClose={()=>{setShowProjModal(false);setEditProj(null);}} onSave={saveProject}/>}

            </div>
            {shown.length===0&&<div className="empty" style={{padding:"24px 0",textAlign:"center"}}>ไม่มีโปรเจกต์ในตัวกรองนี้ กด + เพื่อสร้าง</div>}

        .hero-tile-label{font-size:14px;color:#b7abd8;margin-top:4px;}
        .hero-tile-sub{font-size:13px;margin-top:3px;}
        .hero-tile-cta{background:linear-gradient(135deg,#fbbf24,#fb923c);border:none;cursor:pointer;font-family:'Noto Sans Thai',sans-serif;position:relative;display:flex;flex-direction:column;justify-content:center;transition:transform .15s;}
        .hero-tile-cta:hover{transform:translateY(-2px);}
        .hero-cta-title{font-size:16px;font-weight:700;color:#3a2400;}
        .hero-cta-sub{font-size:13px;color:#6b4400;margin-top:3px;}
        .hero-cta-arrow{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;color:#3a2400;}
        .hero-next-event{margin-top:12px;width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:14px;text-align:left;position:relative;z-index:2;}
        .hero-next-label{font-size:14px;color:#b7abd8;}
        .hero-next-title{font-size:19px;font-weight:600;color:#fff;margin-top:4px;}
        .hero-next-time{font-family:'IBM Plex Mono',monospace;font-size:16px;color:#6ee7b7;margin-top:2px;}
        @media(min-width:901px){.page-nav{display:none;}}
        @media(max-width:900px){.sidebar{display:none;}.main-wrap{margin-left:0;}.topbar{padding:20px 16px 0;}.content-grid{padding:16px;}.quick-capture-btn{padding:10px 14px;font-size:16px;}}
        @media(max-width:1200px){.hero-panel{display:none;}}
        @media(max-width:720px){
          .todo-cols,.ev-cols{grid-template-columns:1fr;}
          .notes-grid{grid-template-columns:repeat(2,1fr);}
          .rings-row{gap:10px;}
          .ring-wrap{width:78px;}
          .modal-row2{grid-template-columns:1fr;}
          .fin-summary-row{grid-template-columns:1fr;}
          .fin-tab-nav{padding:12px 12px 0;}
          .fin-summary-box,.fin-chart-wrap,.card{margin-left:0;margin-right:0;}
        }
        @media(max-width:400px){
          .notes-grid{grid-template-columns:1fr;}
        }
      `}</style>
      {showDashTask&&<TaskModal initial={editDashTask} projects={data.projects||[]} onClose={()=>{setShowDashTask(false);setEditDashTask(null);}} onSave={(t)=>{
        const ex=(data.tasks||[]).find(x=>x.id===t.id);
        persist({...data,tasks:ex?(data.tasks||[]).map(x=>x.id===t.id?t:x):[...(data.tasks||[]),t],activity:ex?data.activity:logActivity(data,{source:"task",text:`เพิ่มงาน "${t.title}"`})});
        setShowDashTask(false); setEditDashTask(null);
      }}/>}
      {showNoteModal&&<NoteModal onClose={()=>{setShowNoteModal(false);setEditNote(null);}} onSave={saveNote} initial={editNote}/>}
      {showEventModal&&<EventModal onClose={()=>{setShowEventModal(false);setEditEvent(null);}} onSave={saveEvent} initial={editEvent}/>}
      {showCal&&<CalendarModal events={events} onClose={()=>setShowCal(false)} onEditEvent={openEditEvent} onDeleteEvent={deleteEvent}/>}
      {showQuick&&<QuickCaptureModal onClose={()=>setShowQuick(false)} onSave={handleQuickCapture}/>}
      <Sidebar page={page} setPage={setPage}/>
      <div className="main-wrap">
        <div className="topbar">
          <div className="topbar-title">{PAGE_TITLES[page]}</div>
          <div className="topbar-right">
            <div className="search-wrap">
              <div className="search-bar">
                <Search size={18}/>
                <input placeholder="ค้นหาโน้ต งาน เป้าหมาย..." value={search} onChange={e=>setSearch(e.target.value)}/>
                {search&&<button className="search-clear" onClick={()=>setSearch("")}><X size={16}/></button>}
              </div>
              {search.trim()&&(
                <div className="search-results">
                  {searchResults.length===0&&<div className="search-empty">ไม่พบผลลัพธ์</div>}
                  {searchResults.map(r=>(
                    <button key={`${r.kind}-${r.id}`} className="search-result-item" onClick={()=>{setPage(r.page);setSearch("");}}>
                      <span className="search-result-kind">{r.label}</span>
                      <span className="search-result-text">{r.text}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button className="quick-capture-btn" onClick={()=>setShowQuick(true)}><Plus size={18}/> Quick Capture</button>
          </div>
        </div>
        <div className="content-grid">
          <div className="content-main">
            {page===0&&(
              <>
                <TodayPanel data={data} persist={persist} onAddTask={()=>{setEditDashTask(null);setShowDashTask(true);}} onEditTask={t=>{setEditDashTask(t);setShowDashTask(true);}}/>
                <div className="card">
                  <div className="card-head">
                    <Clock size={27}/> Schedule
                    <div className="card-head-right">
                      <button className="text-btn" onClick={()=>setShowCal(true)}><CalendarDays size={21}/> Calendar</button>
                      <button className="icon-btn" onClick={()=>setShowEventModal(true)}><Plus size={24}/></button>
                    </div>
                  </div>
                  <div className="ev-cols">
                    <div>
                      <div className="ev-col-head">Today</div>
                      {todayEvents.length===0&&<div className="empty">ไม่มีงานวันนี้</div>}
                      {todayEvents.map(e=>(
                        <div className="ev-item" key={e.id}>
                          <span className="ev-time">{e.startTime||""}{e.endTime?`–${e.endTime}`:""}</span>
                          <div className="ev-body"><div className="ev-title">{e.title}</div>{e.note&&<div className="ev-note">{e.note}</div>}</div>
                          <button className="del-btn" onClick={()=>deleteEvent(e.id)}><Trash2 size={20}/></button>
                        </div>
                      ))}
                    </div>
                    <div>
                      <div className="ev-col-head">Upcoming</div>
                      {upcomingEvents.length===0&&<div className="empty">ไม่มีงานที่จะมาถึง</div>}
                      {upcomingEvents.slice(0,5).map(e=>(
                        <div className="ev-item" key={e.id}>
                          <div className="ev-body">
                            <div className="ev-title">{e.title}</div>
                            <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap"}}>
                              <span className="ev-date-badge">{dayLabel(e.startDate)}{e.startTime?` ${e.startTime}`:""}</span>
                              {e.note&&<span className="ev-note">{e.note}</span>}
                            </div>
                          </div>
                          <button className="del-btn" onClick={()=>deleteEvent(e.id)}><Trash2 size={20}/></button>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="card">
                  <div className="card-head">
                    <StickyNote size={27}/> Notes
                    <div className="card-head-right">
                      <button className="icon-btn" onClick={()=>{setEditNote(null);setShowNoteModal(true);}}><Plus size={27}/></button>
                    </div>
                  </div>
                  {notes.length===0&&<div className="empty">ยังไม่มีโน้ต กด + เพื่อเพิ่ม</div>}
                  <div className="notes-grid">
                    {visibleNotes.map(n=>(
                      <div key={n.id} className={`note-card ${n.color}`}>
                        <div className="note-actions">
                          <button className="note-action-btn" onClick={()=>openEditNote(n)}><Edit3 size={17}/></button>
                          <button className="note-action-btn" onClick={()=>removeNote(n.id)}><Trash2 size={17}/></button>
                        </div>
                        {n.text}
                      </div>
                    ))}
                  </div>
                  {hiddenNotes>0&&(
                    <button className="show-more-btn" onClick={()=>setNotesExpanded(e=>!e)}>
                      {notesExpanded?<>แสดงน้อยลง<ChevronUp size={21}/></>:<>แสดงอีก {hiddenNotes} โน้ต<ChevronDown size={21}/></>}
                    </button>
                  )}
                </div>
                <HistoryPanel activity={data.activity}/>
              </>
            )}
            {page===1&&<FinancePage data={data} persist={persist}/>}
            {page===2&&<TrackerPage data={data} persist={persist}/>}
            {page===3&&<HealthPage data={data} persist={persist}/>}
            {page===4&&<DocumentPage data={data} persist={persist}/>}
            {page===5&&<BookQueuePage data={data} persist={persist}/>}
            {page===6&&<JournalPage data={data} persist={persist}/>}
          </div>
          {page===0&&(
            <div className="hero-panel">
              <div className="hero-top">
                <div className="hero-avatar">O</div>
                <div style={{flex:1}}>
                  <div className="hero-name">{greetText} 👋</div>
                  <div className="hero-sub">คุณโอห์ม · {dateStr}</div>
                </div>
              </div>
              <div className="hero-stage">
                <div className="hero-bubble">{assistantMessage}</div>
                <div className="hero-illustration"><GreetIcon size={72}/></div>
                <div className="hero-podium"/>
              </div>
              <div className="hero-brand">เลขาส่วนตัว ✨</div>
              <div className="hero-tagline">สมองที่สองของคุณ · จำแทนคุณทุกอย่าง</div>
              <div className="hero-time-badge">{timeStr}</div>
              <div className="hero-tiles">
                <div className="hero-tile">
                  <div className="hero-tile-icon"><ListTodo size={18}/></div>
                  <div className="hero-tile-value">{doneTodayCount}<span className="hero-tile-total">/{totalTodoCount}</span></div>
                  <div className="hero-tile-label">งานสำเร็จ</div>
                  <div className="hero-tile-sub" style={{color:"#34d399"}}>{Math.round(rings.todo)}% แล้ว</div>
                </div>
                <div className="hero-tile">
                  <div className="hero-tile-icon"><Target size={18}/></div>
                  <div className="hero-tile-value">{(data.projects||[]).length}</div>
                  <div className="hero-tile-label">โปรเจกต์</div>
                  <div className="hero-tile-sub" style={{color:"#60a5fa"}}>เฉลี่ย {Math.round(rings.goals)}%</div>
                </div>
                <div className="hero-tile">
                  <div className="hero-tile-icon"><StickyNote size={18}/></div>
                  <div className="hero-tile-value">{notes.length}</div>
                  <div className="hero-tile-label">โน้ต</div>
                  <div className="hero-tile-sub" style={{color:"#fbbf24"}}>{(data.activity||[]).length} กิจกรรม</div>
                </div>
                <button className="hero-tile hero-tile-cta" onClick={()=>setShowQuick(true)}>
                  <div className="hero-cta-title">✨ Quick Capture</div>
                  <div className="hero-cta-sub">จดอะไรก็ได้ ทันที</div>
                  <div className="hero-cta-arrow"><ArrowRight size={18}/></div>
                </button>
              </div>
              {todayEvents[0]&&(
                <div className="hero-next-event">
                  <div className="hero-next-label">⏰ งานถัดไปวันนี้</div>
                  <div className="hero-next-title">{todayEvents[0].title}</div>
                  {todayEvents[0].startTime&&<div className="hero-next-time">{todayEvents[0].startTime}{todayEvents[0].endTime?`–${todayEvents[0].endTime}`:""}</div>}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
      <PageNav page={page} setPage={setPage}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SecretaryDashboard/>);
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW register failed", err));
  });
}
</script>
</body>
</html>
