<!-- ข้อ 55 ขั้นที่ 3: เลิกแถบลอยซ้ายล่าง (ohm ขอ) — Export/Import อยู่ในเมนู O แล้ว ปุ่มพวกนี้เหลือเป็นตัวกดซ่อนให้ AccountMenu เรียก -->
<div id="driveBar" hidden style="display:none;">
  <button id="exportJsonBtn" type="button"></button>
  <button id="importJsonBtn" type="button"></button>
  <input id="importJsonFile" type="file" accept="application/json" />
</div>

<script>
// ================== Export/Import JSON สำรองข้อมูล (plain JS, ทำงานนอก React) ==================
(function () {
  var STORAGE_KEY = "secretary-dashboard-v1";

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function exportJson() {
    var raw = window.localStorage.getItem(STORAGE_KEY) || "{}";
    var blob = new Blob([raw], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "secretary-backup-" + todayStr() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- ตรวจโครงสร้างไฟล์ ----------
  function isArr(v) { return Array.isArray(v); }

  function validateShape(obj) {
    var problems = [];
    if (!obj.finance || typeof obj.finance !== "object" || isArr(obj.finance)) {
      problems.push('ไม่พบ key "finance"');
    } else {
      if (!isArr(obj.finance.income)) problems.push('finance.income ไม่ใช่ array');
      if (!isArr(obj.finance.expenses)) problems.push('finance.expenses ไม่ใช่ array');
    }
    if (!isArr(obj.projects)) problems.push('ไม่พบ key "projects" (หรือไม่ใช่ array)');
    if (!isArr(obj.tasks)) problems.push('ไม่พบ key "tasks" (หรือไม่ใช่ array)');
    return problems;
  }

  // ---------- สรุปข้อมูลเพื่อเทียบก่อนเขียนทับ ----------
  var DATE_FIELDS = ["date", "createdAt", "created", "startDate", "dueDate", "due", "month"];

  function pickDate(r) {
    for (var i = 0; i < DATE_FIELDS.length; i++) {
      var v = r && r[DATE_FIELDS[i]];
      if (typeof v === "string" && /^\d{4}-\d{2}/.test(v)) return v.slice(0, 10);
    }
    return null;
  }

  function dateRange(rows) {
    var min = null, max = null;
    (rows || []).forEach(function (r) {
      var d = pickDate(r);
      if (!d) return;
      if (min === null || d < min) min = d;
      if (max === null || d > max) max = d;
    });
    if (!min) return "—";
    return min === max ? min : min + " → " + max;
  }

  function sumAmount(rows) {
    return (rows || []).reduce(function (s, r) { return s + (Number(r && r.amount) || 0); }, 0);
  }

  function fmtBaht(n) {
    return Math.round(n).toLocaleString("en-US") + " ฿";
  }

  function statOf(rows, withSum) {
    var arr = isArr(rows) ? rows : [];
    return { n: arr.length, range: dateRange(arr), sum: withSum ? fmtBaht(sumAmount(arr)) : "" };
  }

  function summarize(obj) {
    var f = (obj && obj.finance) || {};
    return {
      income: statOf(f.income, true),
      expenses: statOf(f.expenses, true),
      investments: statOf(f.investments, true),
      projects: statOf(obj && obj.projects, false),
      tasks: statOf(obj && obj.tasks, false)
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // ---------- หน้ายืนยันก่อนเขียนทับ ----------
  var CMP_ROWS = [
    ["income", "รายรับ", "#34d399"],
    ["expenses", "รายจ่าย", "#fb923c"],
    ["investments", "เงินออม/ลงทุน", "var(--accent)"],
    ["projects", "โปรเจกต์", "var(--ink-3)"],
    ["tasks", "งาน (tasks)", "var(--ink-3)"]
  ];

  function cellHtml(st, color) {
    var sub = st.range;
    if (st.sum) sub += "<br>" + st.sum;
    return '<div style="font:600 17px/1.2 \'IBM Plex Mono\',monospace;color:' + color + ';">' + st.n +
      '<span style="font-size:11px;color:var(--ink-5);font-weight:400;"> รายการ</span></div>' +
      '<div style="font-size:11px;color:var(--ink-5);margin-top:3px;line-height:1.45;">' + sub + "</div>";
  }

  function showImportConfirm(fileName, fileSum, curSum) {
    return new Promise(function (resolve) {
      var rowsHtml = CMP_ROWS.map(function (r) {
        var key = r[0], label = r[1], color = r[2];
        var fSt = fileSum[key], cSt = curSum[key];
        var delta = fSt.n - cSt.n;
        var deltaTxt = delta === 0 ? "เท่าเดิม" : (delta > 0 ? "+" + delta : String(delta));
        var deltaColor = delta === 0 ? "var(--ink-5)" : (delta > 0 ? "#34d399" : "#f87171");
        return '<tr style="border-top:1px solid var(--surface-2);">' +
          '<td style="padding:10px 8px;font-size:13px;color:var(--ink-bright-2);vertical-align:top;white-space:nowrap;">' + label + "</td>" +
          '<td style="padding:10px 8px;vertical-align:top;">' + cellHtml(fSt, color) + "</td>" +
          '<td style="padding:10px 8px;vertical-align:top;">' + cellHtml(cSt, "var(--ink-5)") + "</td>" +
          '<td style="padding:10px 8px;vertical-align:top;font:600 13px/1.2 \'IBM Plex Mono\',monospace;color:' + deltaColor + ';white-space:nowrap;">' + deltaTxt + "</td>" +
          "</tr>";
      }).join("");

      var ov = document.createElement("div");
      ov.id = "importConfirmOverlay";
      ov.setAttribute("style", "position:fixed;inset:0;z-index:9999;background:rgba(6,4,14,.82);display:flex;align-items:center;justify-content:center;padding:16px;font-family:'Noto Sans Thai',sans-serif;");
      ov.innerHTML =
        '<div style="background:var(--surface-modal);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:22px;color:var(--ink-bright-2);box-shadow:0 24px 70px rgba(0,0,0,.65);">' +
          '<div style="font-size:18px;font-weight:700;margin-bottom:4px;">ยืนยันการนำเข้าข้อมูล</div>' +
          '<div style="font-size:12px;color:var(--ink-5);word-break:break-all;margin-bottom:14px;">ไฟล์: ' + esc(fileName) + "</div>" +
          '<div style="background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#fca5a5;margin-bottom:14px;">' +
            "การนำเข้าจะ<b>เขียนทับข้อมูลปัจจุบันทั้งหมด</b> และซิงก์ทับ Google Drive ถ้าเชื่อมต่ออยู่ — <b>กู้คืนไม่ได้</b> แนะนำกดปุ่ม &quot;สำรองก่อน&quot; เก็บไฟล์ของข้อมูลปัจจุบันไว้ก่อน" +
          "</div>" +
          '<table style="width:100%;border-collapse:collapse;">' +
            '<thead><tr style="font-size:11px;color:var(--ink-5);text-align:left;">' +
              '<th style="padding:0 8px 6px;font-weight:600;"></th>' +
              '<th style="padding:0 8px 6px;font-weight:600;">ไฟล์ที่จะนำเข้า</th>' +
              '<th style="padding:0 8px 6px;font-weight:600;">ข้อมูลปัจจุบัน</th>' +
              '<th style="padding:0 8px 6px;font-weight:600;">ต่าง</th>' +
            "</tr></thead><tbody>" + rowsHtml + "</tbody></table>" +
          '<div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px;">' +
            '<button id="icBackup" style="padding:10px 16px;border-radius:10px;background:var(--surface-modal);border:1px solid var(--line);color:#34d399;cursor:pointer;font-size:13px;font-family:inherit;">สำรองก่อน</button>' +
            '<button id="icCancel" style="padding:10px 18px;border-radius:10px;background:var(--surface-modal);border:1px solid var(--line);color:var(--ink-bright-2);cursor:pointer;font-size:13px;font-family:inherit;">ยกเลิก</button>' +
            '<button id="icOk" style="padding:10px 18px;border-radius:10px;background:#dc2626;border:1px solid #ef4444;color:#fff;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;">เขียนทับข้อมูลเดิม</button>' +
          "</div>" +
        "</div>";
      document.body.appendChild(ov);

      function close(result) {
        document.removeEventListener("keydown", onKey);
        if (ov.parentNode) ov.parentNode.removeChild(ov);
        resolve(result);
      }
      function onKey(e) { if (e.key === "Escape") close(false); }
      document.addEventListener("keydown", onKey);
      ov.addEventListener("click", function (e) { if (e.target === ov) close(false); });
      ov.querySelector("#icBackup").addEventListener("click", function () { exportJson(); });
      ov.querySelector("#icCancel").addEventListener("click", function () { close(false); });
      ov.querySelector("#icOk").addEventListener("click", function () { close(true); });
    });
  }

  async function importJsonFile(file) {
    var text;
    try {
      text = await file.text();
    } catch (e) {
      alert("อ่านไฟล์ไม่สำเร็จ: " + e.message);
      return;
    }
    var parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      alert("ไฟล์นี้ไม่ใช่ JSON ที่ถูกต้อง: " + e.message);
      return;
    }
    if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
      alert("โครงสร้างข้อมูลในไฟล์ไม่ถูกต้อง");
      return;
    }
    var problems = validateShape(parsed);
    if (problems.length) {
      alert(
        "ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอป Jack — ยกเลิกการนำเข้า\n\nสิ่งที่ตรวจไม่ผ่าน:\n• " +
        problems.join("\n• ") +
        "\n\nไฟล์ที่ถูกต้องต้องมี key finance (income/expenses), projects และ tasks ครบ"
      );
      return;
    }
    var current = {};
    try { current = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "{}") || {}; } catch (e) { current = {}; }
    var ok = await showImportConfirm(file.name || "(ไม่ทราบชื่อไฟล์)", summarize(parsed), summarize(current));
    if (!ok) return;
    var normalized = JSON.stringify(parsed);
    if (window.storage && window.storage.set) {
      try { await window.storage.set(STORAGE_KEY, normalized); }
      catch (e) { window.localStorage.setItem(STORAGE_KEY, normalized); }
    } else {
      window.localStorage.setItem(STORAGE_KEY, normalized);
    }
    if (window.FireSync && window.FireSync.isSignedIn()) { try { await window.FireSync.flush(4000); } catch (e) {} }
    alert("นำเข้าข้อมูลสำเร็จ กำลังโหลดหน้าใหม่");
    location.reload();
  }

  document.addEventListener("DOMContentLoaded", function () {
    var exportBtn = document.getElementById("exportJsonBtn");
    var importBtn = document.getElementById("importJsonBtn");
    var fileInput = document.getElementById("importJsonFile");
    if (exportBtn) exportBtn.addEventListener("click", exportJson);
    if (importBtn && fileInput) {
      importBtn.addEventListener("click", function () { fileInput.click(); });
      fileInput.addEventListener("change", function () {
        if (fileInput.files && fileInput.files[0]) importJsonFile(fileInput.files[0]);
        fileInput.value = "";
      });
    }
  });
})();
</script>

<script>
// ================== ข้อ 55 ขั้นที่ 4: แยกข้อมูลเป็นหลายเอกสาร (SecretaryParts) ==================
// ฟังก์ชันล้วน ไม่แตะ Firebase — แปลง "ข้อมูลทั้งก้อน" ⇄ "ชุดเอกสาร {docId: สตริง JSON}" ใต้ users/{uid}/parts/
// เหตุผล: (1) ไม่ชนเพดาน 1 MiB/เอกสาร (2) แก้อะไรส่งแค่เอกสารนั้น ไม่ต้องส่งทั้งก้อน
//         (3) แก้คนละส่วนจาก 2 เครื่องพร้อมกัน รวมกันได้ ไม่ทับกัน (4) บอต LINE (ขั้นที่ 6) เพิ่มรายการได้โดยอ่าน/เขียนแค่เอกสารเล็กๆ
// รูปแบบ docId (ชื่อ key ผ่าน esc() กัน . ~ / แปลกๆ):
//   k.<key>                 ค่าของ key ชั้นบนสุด (tasks, projects, budgets, …)
//   k.finance               "โครง" ของ finance — ทุก field ที่เป็น array ถูกแทนด้วย [] แล้วไปอยู่เอกสารของตัวเอง
//   f.<sub>                 finance.<sub> ที่เป็น array (investments, debts, cryptoHoldings, …)
//   fg.expenses.<YYYY-MM>   รายจ่ายแยกตามเดือนจาก date (ไม่มีวันที่ → .none)
//   fg.income.<YYYY-MM>     รายรับแยกตามเดือน
//   g.journal.<YYYY>        Journal แยกตามปี (k.journal เก็บแค่ [] เป็นตัวบอกว่ามี key นี้)
//   <id>~2, <id>~3 …        ถ้า array ใหญ่เกิน CHUNK_BYTES ตัดเป็นหลายท่อนตามลำดับ
// กติกาสำคัญ: split(assemble(p)) ต้องได้ p เดิมทุกตัวอักษร (ไม่งั้นซิงก์วนไม่จบ) — ลำดับรายการในกลุ่มเดียวกันคงเดิม
//   ข้ามกลุ่มเรียงตามชื่อกลุ่ม (เดือนเก่า→ใหม่, none ท้ายสุด) · แอปเรียงตามวันที่ตอนแสดงผลอยู่แล้ว
window.SecretaryParts = (function () {
  var CHUNK_BYTES = 400 * 1024;          // เพดานเอกสาร Firestore 1 MiB — ตัดที่ 400KB เผื่อ field อื่น/ภาษาไทย 3 ไบต์
  var GROUPED = { "finance.expenses": 7, "finance.income": 7, "journal": 4 };   // path → ความยาว prefix ของวันที่ (7=เดือน 4=ปี)
  var enc = typeof TextEncoder !== "undefined" ? new TextEncoder() : null;
  function bytes(s) { return enc ? enc.encode(s).length : String(s).length * 3; }
  function esc(k) { return encodeURIComponent(String(k)).replace(/\./g, "%2E").replace(/~/g, "%7E").replace(/\*/g, "%2A"); }
  function isObj(v) { return !!v && typeof v === "object" && !Array.isArray(v); }
  function groupOf(item, len) {
    var d = item && typeof item === "object" ? (item.date || item.month) : null;
    return typeof d === "string" && /^\d{4}-\d{2}/.test(d) ? d.slice(0, len) : "none";
  }
  function putArray(out, id, arr) {
    var chunks = [], cur = [], size = 2;
    for (var i = 0; i < arr.length; i++) {
      var s = JSON.stringify(arr[i] === undefined ? null : arr[i]);
      var b = bytes(s) + 1;
      if (cur.length && size + b > CHUNK_BYTES) { chunks.push(cur); cur = []; size = 2; }
      cur.push(arr[i]); size += b;
    }
    chunks.push(cur);
    for (var n = 0; n < chunks.length; n++) out[n ? id + "~" + (n + 1) : id] = JSON.stringify(chunks[n]);
  }
  function putGrouped(out, prefix, arr, len) {
    var groups = {}, order = [];
    arr.forEach(function (it) { var g = groupOf(it, len); if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(it); });
    order.forEach(function (g) { putArray(out, prefix + g, groups[g]); });
  }
  function split(data) {
    var out = {};
    if (!isObj(data)) return out;
    Object.keys(data).forEach(function (key) {
      var v = data[key];
      if (v === undefined) return;
      var id = "k." + esc(key);
      if (key === "finance" && isObj(v)) {
        var skel = {};
        Object.keys(v).forEach(function (sub) {
          var sv = v[sub];
          if (sv === undefined) return;
          if (!Array.isArray(sv)) { skel[sub] = sv; return; }
          skel[sub] = [];
          var len = GROUPED["finance." + sub];
          if (len) putGrouped(out, "fg." + esc(sub) + ".", sv, len); else putArray(out, "f." + esc(sub), sv);
        });
        out[id] = JSON.stringify(skel);
      } else if (Array.isArray(v) && GROUPED[key]) {
        out[id] = "[]";
        putGrouped(out, "g." + esc(key) + ".", v, GROUPED[key]);
      } else if (Array.isArray(v)) {
        putArray(out, id, v);
      } else {
        out[id] = JSON.stringify(v);
      }
    });
    return out;
  }
  function parse(s) { try { return JSON.parse(s); } catch (e) { console.warn("[SecretaryParts] อ่านเอกสารไม่ได้", e); return []; } }
  function collect(parts, base) {
    var arr = [];
    if (parts[base] != null) arr = arr.concat(parse(parts[base]));
    for (var n = 2; parts[base + "~" + n] != null; n++) arr = arr.concat(parse(parts[base + "~" + n]));
    return arr;
  }
  function collectGroups(parts, prefix) {
    var groups = {};
    Object.keys(parts).forEach(function (id) {
      if (id.indexOf(prefix) === 0) groups[id.slice(prefix.length).replace(/~\d+$/, "")] = 1;
    });
    var out = [];
    Object.keys(groups).sort().forEach(function (g) { out = out.concat(collect(parts, prefix + g)); });
    return out;
  }
  function assemble(parts) {
    var data = {};
    Object.keys(parts).sort().forEach(function (id) {
      if (id.indexOf("k.") !== 0 || /~\d+$/.test(id)) return;
      var key = decodeURIComponent(id.slice(2));
      var v = parse(parts[id]);
      if (Array.isArray(v)) {
        v = GROUPED[key] ? collectGroups(parts, "g." + esc(key) + ".") : collect(parts, id);
      } else if (key === "finance" && isObj(v)) {
        Object.keys(v).forEach(function (sub) {
          if (!Array.isArray(v[sub])) return;
          v[sub] = GROUPED["finance." + sub] ? collectGroups(parts, "fg." + esc(sub) + ".") : collect(parts, "f." + esc(sub));
        });
      }
      data[key] = v;
    });
    return data;
  }
  function same(a, b) {
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    for (var i = 0; i < ka.length; i++) if (a[ka[i]] !== b[ka[i]]) return false;
    return true;
  }
  function diffIds(a, b) {
    var ids = {};
    Object.keys(a).forEach(function (k) { ids[k] = 1; });
    Object.keys(b).forEach(function (k) { ids[k] = 1; });
    return Object.keys(ids).filter(function (k) { return a[k] !== b[k]; });
  }
  return { split: split, assemble: assemble, same: same, diffIds: diffIds, bytes: bytes, CHUNK_BYTES: CHUNK_BYTES, GROUPED: GROUPED };
})();
</script>

<script type="module">
// ================== ข้อ 55: Firestore sync (ESM จาก gstatic, ไม่มี build step) ==================
// ขั้นที่ 4 (2026-09-28): ที่เก็บหลัก = หลายเอกสารใต้ users/{uid}/parts/{docId} (แบ่งด้วย window.SecretaryParts ด้านบน)
//   แต่ละเอกสาร: json (สตริง JSON ของส่วนนั้น) · by (clientId) · at (serverTimestamp) · size
//   users/{uid}/app/meta : layout · migratedAt · lastDriveBackupAt · lastDriveBackupFile
//   users/{uid}/app/data : เอกสารเดียวแบบเดิม (ขั้นที่ 2-3) — อ่านครั้งเดียวตอนย้าย แล้วค้างไว้เป็นสำรอง ห้ามเขียนอีก

  var state = {
    user: null,          // {email, uid}
    phase: "init",       // init | signedOut | connecting | synced | saving | offline | error | migrating
    text: "",
    lastBackupAt: null,
    remoteLoaded: false,
    docCount: 0
  };
  var partsRef = null, metaRef = null, legacyRef = null, unsubParts = null, unsubMeta = null;
  var base = {};                 // {docId: json} ที่เชื่อว่าอยู่บนเซิร์ฟเวอร์แล้ว
  var pushTimer = null, inflight = 0, metaLoaded = false;
  var tokenClient = null, accessToken = null, tokenExpiresAt = 0, pendingTokenCb = null;
  var migrating = false, backupRunning = false;
  var rejectedMsg = "";   // ข้อความตอนบัญชีอื่นล็อกอิน — ต้องค้างให้เห็น ไม่ให้ "ยังไม่ได้ล็อกอิน" ทับทันที

  }
  function summarize(text) {
    try {
      var d = JSON.parse(text) || {}; var f = d.finance || {};
      return "รายรับ " + (f.income || []).length + " · รายจ่าย " + (f.expenses || []).length +
        " · งาน " + (d.tasks || []).length + " · โปรเจกต์ " + (d.projects || []).length + " · Journal " + (d.journal || []).length;
    } catch (e) { return "(อ่านไม่ได้)"; }
  }
  function assembleText(parts) { return JSON.stringify(P.assemble(parts)); }
  function sizeNote(parts) {

    Object.keys(parts || {}).forEach(function (id) { var b = P.bytes(parts[id]); if (b > big) big = b; });
    return big > WARN_BYTES ? "ซิงก์แล้ว — แต่มีเอกสารใหญ่ " + Math.round(big / 1024) + "KB ใกล้เพดาน 1MB" : "";

  // ---------- เขียนขึ้น Firestore ----------
  function commitParts(ids, parts) {

    return Promise.all(groups.map(function (g) {
      var b = writeBatch(db);
      g.forEach(function (id) {

    if (!ids.length) { if (!inflight) emit("synced", syncedText()); return Promise.resolve(); }

    return commitParts(ids, lp).then(function () {

          "บนคลาวด์ (Firestore): " + summarize(remoteText) + "\n" +
          "ในเครื่องนี้: " + summarize(localText()) + "\n\n" +
          "OK = ใช้ข้อมูลบนคลาวด์ (ของในเครื่องนี้เก็บสำรองไว้)\nCancel = ใช้ข้อมูลในเครื่องนี้ แล้วอัปขึ้นคลาวด์แทน")) {

    if (!pushTimer && P.diffIds(localParts() || {}, base).length) schedulePush();

    if (!pushTimer && !inflight) {

            "ในเครื่องนี้: " + summarize(local) + "\n\n" +

  // ---------- Google Drive (สำรองรายสัปดาห์เท่านั้น — ข้อ 55 ขั้นที่ 3 ลบ Drive sync แบบเดิมแล้ว) ----------
  function driveFetch(url, options) {

          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, mimeType: "application/vnd.google-apps.folder" })
        }).then(function (r) { return r.json(); }).then(function (d2) { return d2.id; });
      })
      .then(function (id) { localStorage.setItem("secretary-drive-folder-id", id); return id; });
  }
  function tokenValid() { return accessToken && Date.now() < tokenExpiresAt - 60000; }
  function backupToDrive(text) {
    if (backupRunning) return Promise.resolve(false);
    if (!tokenValid()) return Promise.reject(new Error("no-token"));
    backupRunning = true;
    var d = new Date();
    var name = "backup-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
    return findFolder().then(function (folderId) {
      var boundary = "secretaryohmbackup";
      var meta = { name: name, parents: [folderId], mimeType: "application/json" };
      var body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
        "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + (text || localText() || "{}") + "\r\n--" + boundary + "--";
      return driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
        method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body: body
      });
    }).then(function () {
      var at = new Date().toISOString();
      state.lastBackupAt = at;
      if (metaRef) setDoc(metaRef, { lastDriveBackupAt: at, lastDriveBackupFile: name }, { merge: true }).catch(function () {});
      emit(null, "สำรองขึ้น Drive แล้ว (" + name + ") ✓");
      return true;
    }).finally(function () { backupRunning = false; });
  }
  function backupDue() {
    return !state.lastBackupAt || (Date.now() - Date.parse(state.lastBackupAt)) > BACKUP_EVERY_MS;
  }
  function maybeAutoBackup() {
    // รอ meta โหลดก่อน ไม่งั้นยังไม่รู้วันสำรองล่าสุด แล้วสำรองซ้ำทุกครั้งที่เปิดแอป
    if (!metaLoaded || !state.remoteLoaded) return;
    if (tokenValid() && backupDue() && !backupRunning) backupToDrive(localText()).catch(function (e) { console.warn("[FireSync] auto backup", e); });
  }

  // ---------- ล็อกอิน ----------
  function initTokenClient() {
    if (tokenClient) return true;
    if (!window.google || !google.accounts || !google.accounts.oauth2) return false;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cfg.CLIENT_ID,
      scope: "openid email profile https://www.googleapis.com/auth/drive.file",
      callback: function (resp) {
        var cb = pendingTokenCb; pendingTokenCb = null;
        if (resp.error) { emit("error", "ล็อกอิน Google ไม่สำเร็จ"); if (cb) cb(resp); return; }
        accessToken = resp.access_token;
        tokenExpiresAt = Date.now() + (Number(resp.expires_in) || 3500) * 1000;
        if (cb) cb(null, resp);
      },
      error_callback: function (err) {
        var cb = pendingTokenCb; pendingTokenCb = null;
        emit(state.user ? state.phase : "signedOut", err && err.type === "popup_closed" ? "ปิดหน้าต่างล็อกอินไปก่อน" : "เปิดหน้าล็อกอินไม่ได้");
        if (cb) cb(err || { error: "popup" });
      }
    });
    return true;
  }
  (function waitGis() { if (!initTokenClient()) setTimeout(waitGis, 300); })();

  // ต้องเรียกจาก user gesture (กดปุ่ม) ไม่งั้น iOS บล็อก popup
  function requestToken(cb) {
    if (!initTokenClient()) { alert("ยังไม่พร้อมเชื่อมต่อ Google — รอสักครู่แล้วลองใหม่"); return; }
    pendingTokenCb = cb;
    tokenClient.requestAccessToken({});
  }
  function signIn() {
    emit("connecting", "กำลังล็อกอิน…");
    requestToken(function (err, resp) {
      if (err) return;
      var cred = GoogleAuthProvider.credential(null, resp.access_token);
      signInWithCredential(auth, cred).catch(function (e) {
        console.error("[FireSync] signIn", e);
        emit("error", "ล็อกอิน Firebase ไม่สำเร็จ (" + (e.code || "error") + ")");
      });
    });
  }
  function backupNow() {
    var go = function () {
      emit(null, "กำลังสำรองขึ้น Drive…");
      backupToDrive(localText()).catch(function (e) { console.error(e); emit(null, "สำรองขึ้น Drive ไม่สำเร็จ"); });
    };
    if (tokenValid()) go(); else requestToken(function (err) { if (!err) go(); });
  }
  function doSignOut() {
    return flush(2500).then(function () { return signOut(auth); });
  }

  onAuthStateChanged(auth, function (user) {
    if (unsubParts) { unsubParts(); unsubParts = null; }
    if (unsubMeta) { unsubMeta(); unsubMeta = null; }
    partsRef = metaRef = legacyRef = null; base = {}; metaLoaded = false;
    state.remoteLoaded = false; state.docCount = 0;
    resetFiles();
    if (!user) {
      state.user = null;
      state.wasUsed = !!localStorage.getItem(USED_KEY);
      emit("signedOut", rejectedMsg || "ยังไม่ได้ล็อกอิน — ข้อมูลอยู่ในเครื่องนี้อย่างเดียว ไม่ซิงก์");
      rejectedMsg = "";
      return;
    }
    if (!isAllowed(user.email)) {
      rejectedMsg = "บัญชี " + user.email + " ไม่มีสิทธิ์ใช้แอปนี้ — ล็อกอินด้วยบัญชีของโอม";
      emit("error", rejectedMsg);
      signOut(auth);
      return;
    }
    state.user = { email: user.email, uid: user.uid };
    try { localStorage.setItem(USED_KEY, "1"); } catch (e) {}
    emit("connecting", "กำลังโหลดข้อมูลจาก Firestore…");
    partsRef = collection(db, "users", user.uid, "parts");
    metaRef = doc(db, "users", user.uid, "app", "meta");
    legacyRef = doc(db, "users", user.uid, "app", "data");
    var onErr = function (e) {
      console.error("[FireSync] snapshot", e);
      emit("error", e && e.code === "permission-denied" ? "ไม่มีสิทธิ์อ่าน (เช็ก Security Rules/อีเมล)" : "เชื่อมต่อ Firestore ไม่สำเร็จ");
    };
    unsubMeta = onSnapshot(metaRef, onMeta, function (e) { console.warn("[FireSync] meta", e); metaLoaded = true; });
    unsubParts = onSnapshot(partsRef, { includeMetadataChanges: true }, onParts, onErr);
    startFiles(user.uid);
  });
  window.addEventListener("online", function () { if (state.user && state.phase === "offline") emit("connecting", "กลับมาออนไลน์ — กำลังซิงก์…"); });

  // ---------- ข้อ 55 ขั้นที่ 8: ไฟล์แนบ (ตัวไฟล์อยู่ Google Drive · Firestore เก็บแค่ข้อมูลอ้างอิง + รูปย่อ) ----------
  // users/{uid}/files/{fileId} : json = {id,name,mime,size,driveId,url,thumb,link:{kind,id}|null,from:"app"|"line",createdAt,trash,trashedAt}
  //   แยกจากข้อมูลก้อนหลัก (ไม่อยู่ใน localStorage/parts) → รูปย่อไม่กินที่ localStorage · React อ่านผ่าน window.FireFiles + event "secretary-files"
  //   ผูกกับรายการด้วย link อย่างเดียว (ไม่แตะตัวรายการ) → Jack ผูก/ย้ายได้โดยไม่ต้องเขียนเอกสารรายจ่ายชนกับแอป
  //   kind = expense | income | document | checkup (ขั้นที่ 7B) · link ที่ชี้ไปรายการที่ไม่มีแล้ว = ไฟล์รอจัด (โชว์ในหน้า Documents)
  //   ลบ = ตั้ง trash:true → Jack (Apps Script) ย้ายไฟล์ลงถังขยะ Drive รอบ 07:00 แล้วลบเอกสารนี้
  //   (แอปมีสิทธิ์ drive.file ลบไฟล์ที่ Jack สร้างไม่ได้ เลยให้ Jack ลบทั้งหมดที่เดียว)
  var files = {}, filesLoaded = false, filesError = "", unsubFiles = null;
  var FILE_MAX_BYTES = 5 * 1024 * 1024;            // multipart upload ของ Drive รับได้ถึง 5MB
  var FILES_FOLDER = "files-app";                   // SecretaryOhmApp/files-app (Jack ใช้ files-line — แอปมองไม่เห็นโฟลเดอร์ที่ Jack สร้าง)
  var FILES_FOLDER_KEY = "secretary-drive-files-folder-id";
  function filesEmit() { try { window.dispatchEvent(new CustomEvent("secretary-files")); } catch (e) {} }
  function resetFiles() {
    if (unsubFiles) { unsubFiles(); unsubFiles = null; }
    files = {}; filesLoaded = false; filesError = ""; filesEmit();
  }
  function startFiles(uid) {
    unsubFiles = onSnapshot(collection(db, "users", uid, "files"), function (snap) {
      var next = {};
      snap.forEach(function (d) {
        var x = d.data() || {};
        try { var m = JSON.parse(x.json); if (m && m.id) next[m.id] = m; } catch (e) { console.warn("[FireFiles] อ่านเอกสารไม่ได้", d.id); }
      });
      files = next; filesLoaded = true; filesError = ""; filesEmit();
    }, function (e) {
      console.warn("[FireFiles] snapshot", e);
      filesLoaded = true;
      filesError = e && e.code === "permission-denied" ? "ยังอ่านไฟล์แนบไม่ได้ — วาง firestore.rules ใหม่ใน Firebase Console ก่อน" : "โหลดรายการไฟล์แนบไม่สำเร็จ";
      filesEmit();
    });
  }
  function fileRef(id) { return doc(db, "users", state.user.uid, "files", id); }
  function writeFiles(list) {
    if (!state.user) return Promise.reject(new Error("ต้องล็อกอินก่อน"));
    list.forEach(function (m) { files[m.id] = m; });
    filesEmit();
    var b = writeBatch(db);
    list.forEach(function (m) { b.set(fileRef(m.id), { json: JSON.stringify(m), by: clientId, at: serverTimestamp() }); });
    return b.commit();
  }
  function fileList() {
    return Object.keys(files).map(function (k) { return files[k]; }).filter(function (f) { return !f.trash; })
      .sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
  }
  function findFilesFolder() {
    var cached = localStorage.getItem(FILES_FOLDER_KEY);
    if (cached) return Promise.resolve(cached);
    return findFolder().then(function (parent) {
      var q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='" + FILES_FOLDER + "' and '" + parent + "' in parents and trashed=false");
      return driveFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id)&spaces=drive").then(function (r) { return r.json(); }).then(function (d) {
        if (d.files && d.files.length) return d.files[0].id;
        return driveFetch("https://www.googleapis.com/drive/v3/files?fields=id", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: FILES_FOLDER, mimeType: "application/vnd.google-apps.folder", parents: [parent] })
        }).then(function (r) { return r.json(); }).then(function (d2) { return d2.id; });
      });
    }).then(function (id) { localStorage.setItem(FILES_FOLDER_KEY, id); return id; });
  }
  function driveUpload(blob, name, mime, retried) {
    return findFilesFolder().then(function (folderId) {
      var boundary = "secretaryohmfile" + Date.now().toString(36);
      var meta = { name: name, parents: [folderId], mimeType: mime };
      var body = new Blob(["--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
        "\r\n--" + boundary + "\r\nContent-Type: " + mime + "\r\n\r\n", blob, "\r\n--" + boundary + "--"]);
      return driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,name,mimeType,size", {
        method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body: body
      }).then(function (r) { return r.json(); });
    }).catch(function (e) {
      // โฟลเดอร์ที่จำไว้ถูกลบ/ย้าย → ลืมแล้วหาใหม่ 1 ครั้ง
      if (!retried && /Drive 404/.test(String(e && e.message))) { localStorage.removeItem(FILES_FOLDER_KEY); localStorage.removeItem("secretary-drive-folder-id"); return driveUpload(blob, name, mime, true); }
      throw e;
    });
  }
  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () { resolve(img); setTimeout(function () { URL.revokeObjectURL(url); }, 1000); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }
  function drawScaled(img, max) {
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, s = Math.min(1, max / Math.max(w, h));
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  function makeThumb(img) {
    // รูปย่อเก็บใน Firestore — คุมไม่ให้เกิน ~12KB
    var tries = [[200, 0.72], [160, 0.6], [120, 0.5]];
    for (var i = 0; i < tries.length; i++) {
      var u = drawScaled(img, tries[i][0]).toDataURL("image/jpeg", tries[i][1]);
      if (u.length <= 16000) return u;
    }
    return null;
  }
  function toBlob(canvas, q) { return new Promise(function (r) { canvas.toBlob(function (b) { r(b); }, "image/jpeg", q); }); }
  function datePrefix() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function prepareFile(file) {
    var name = String(file.name || "file").replace(/[\\/:*?"<>|]+/g, "_");
    var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(name);
    var isImg = /^image\//.test(file.type || "");
    if (!isPdf && !isImg) return Promise.reject(new Error("รับได้แค่รูปกับ PDF ครับ"));
    if (isPdf) {
      if (file.size > FILE_MAX_BYTES) return Promise.reject(new Error("PDF ใหญ่เกิน 5MB — อัปขึ้น Drive เองแล้ววางลิงก์ในช่อง Link ของเอกสารแทน"));
      return Promise.resolve({ blob: file, name: datePrefix() + "_" + name, mime: "application/pdf", thumb: null });
    }
    return loadImage(file).then(function (img) {
      var thumb = makeThumb(img);
      if (file.size <= FILE_MAX_BYTES) return { blob: file, name: datePrefix() + "_" + name, mime: file.type, thumb: thumb };
      // รูปใหญ่เกิน 5MB → ย่อเหลือด้านยาว 2400px (ยังอ่านใบเสร็จชัด)
      return toBlob(drawScaled(img, 2400), 0.85).then(function (b) {
        if (b && b.size > FILE_MAX_BYTES) return toBlob(drawScaled(img, 1800), 0.8);
        return b;
      }).then(function (b) {
        if (!b || b.size > FILE_MAX_BYTES) throw new Error("รูปใหญ่เกินไป ย่อแล้วก็ยังเกิน 5MB");
        return { blob: b, name: datePrefix() + "_" + name.replace(/\.[^.]+$/, "") + ".jpg", mime: "image/jpeg", thumb: thumb };
      });
    }, function () {
      // เบราว์เซอร์นี้เปิดรูปไม่ได้ (เช่น HEIC บน Chrome) → อัปตัวจริงไปเลย ไม่มีรูปย่อ
      if (file.size > FILE_MAX_BYTES) throw new Error("รูปนี้ใหญ่เกิน 5MB และเบราว์เซอร์ย่อให้ไม่ได้");
      return { blob: file, name: datePrefix() + "_" + name, mime: file.type || "application/octet-stream", thumb: null };
    });
  }
  function newFileId() { return "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function uploadFile(file, link) {
    if (!state.user) return Promise.reject(new Error("ต้องล็อกอินก่อนถึงจะแนบไฟล์ได้"));
    if (!tokenValid()) { var e = new Error("ต้องอนุญาต Google Drive ก่อน"); e.code = "no-token"; return Promise.reject(e); }
    return prepareFile(file).then(function (p) {
      return driveUpload(p.blob, p.name, p.mime).then(function (d) {
        var m = {
          id: newFileId(), name: d.name || p.name, mime: d.mimeType || p.mime, size: Number(d.size) || p.blob.size || 0,
          driveId: d.id, url: d.webViewLink || ("https://drive.google.com/file/d/" + d.id + "/view"),
          thumb: p.thumb || null, link: link || null, from: "app", createdAt: new Date().toISOString(), trash: false
        };
        return writeFiles([m]).then(function () { return m; });
      });
    });
  }
  function patchFiles(pred, patch) {
    var list = fileList().filter(pred).map(function (m) { return Object.assign({}, m, patch(m)); });
    return list.length ? writeFiles(list).then(function () { return list.length; }) : Promise.resolve(0);
  }
  function sameLink(m, kind, id) { return !!(m.link && m.link.kind === kind && m.link.id === id); }
  window.FireFiles = {
    ready: function () { return !!state.user && filesLoaded; },
    signedIn: function () { return !!state.user; },
    error: function () { return filesError; },
    list: fileList,
    forEntry: function (kind, id) { return fileList().filter(function (m) { return sameLink(m, kind, id); }); },
    needsToken: function () { return !tokenValid(); },
    authorize: function (cb) { requestToken(function (err) { filesEmit(); if (cb) cb(err); }); },   // ต้องเรียกจากการกดปุ่ม (iOS)
    upload: uploadFile,
    setLink: function (id, link) { return patchFiles(function (m) { return m.id === id; }, function () { return { link: link || null }; }); },
    relink: function (kind, fromId, toId) { return patchFiles(function (m) { return sameLink(m, kind, fromId); }, function () { return { link: { kind: kind, id: toId } }; }); },
    trash: function (id) { return patchFiles(function (m) { return m.id === id; }, function () { return { trash: true, trashedAt: new Date().toISOString() }; }); },
    trashLinked: function (kind, ids) {
      var set = {}; (ids || []).forEach(function (x) { set[x] = 1; });
      return patchFiles(function (m) { return !!(m.link && m.link.kind === kind && set[m.link.id]); }, function () { return { trash: true, trashedAt: new Date().toISOString() }; });
    }
  };

  window.FireSync = {
    isSignedIn: function () { return !!state.user; },
    isReady: function () { return !!partsRef && state.remoteLoaded; },
    schedulePush: schedulePush,
    flush: flush,
    signIn: signIn,
    signOut: doSignOut,
    backupNow: backupNow,
    status: function () { return Object.assign({}, state); }
  };
  emit("init", "กำลังเตรียมระบบซิงก์…");
  try { window.dispatchEvent(new CustomEvent("firesync-ready")); } catch (e) {}
})();
</script>

window.storage = {
  async get(key) {
    const value = window.localStorage.getItem(key);
    return value === null ? null : { value };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    if (window.FireSync && window.FireSync.isSignedIn()) window.FireSync.schedulePush(value);
    else {
      // แก้ตอนยังไม่ล็อกอิน Firestore (ยืนยันแล้วว่าไม่มีผู้ใช้ ไม่ใช่แค่กำลังกู้ session ตอนบูต) → จำไว้ ตอนล็อกอินจะถามก่อนทับ
      const ph=window.__syncStatus&&window.__syncStatus.phase;
      if (!window.FireSync || ph==="signedOut") { try { window.localStorage.setItem("secretary-unsynced-since", String(Date.now())); } catch (e) {} }
    }
    return true;
  }
};

function isRecurring(t){ return t && t.recurrence && t.recurrence!=="none"; }

function taskDoneOn(t,dateStr=todayISO()){

function toggleTaskInList(tasks,taskId,dateStr=todayISO()){
  return (tasks||[]).map(t=>{
    if(t.id!==taskId) return t;
    if(isRecurring(t)){
      const key=periodKey(t.recurrence,dateStr);
      const comp={...(t.completions||{})};
      if(comp[key]) delete comp[key]; else comp[key]=true;
      return {...t,completions:comp};
    }
    const nowDone=t.status!=="done";
    return {...t,status:nowDone?"done":"pending",completedAt:nowDone?new Date().toISOString():null};

function taskStreak(t){
  if(!isRecurring(t)) return 0;
  const comp=t.completions||{};
  const d=new Date(todayISO()+"T00:00:00");
  const step=()=>{ if(t.recurrence==="daily") d.setDate(d.getDate()-1); else if(t.recurrence==="weekly") d.setDate(d.getDate()-7); else d.setMonth(d.getMonth()-1); };
  if(!comp[periodKey(t.recurrence,isoDate(d))]) step();
  let streak=0;
  for(let i=0;i<400;i++){
    if(comp[periodKey(t.recurrence,isoDate(d))]){ streak++; step(); } else break;
  }
  return streak;
}
function taskCompletionRate(t,periods=30){
  if(!isRecurring(t)) return t.status==="done"?100:0;
  const comp=t.completions||{};
  const d=new Date(todayISO()+"T00:00:00");
  const seen=new Set(); let total=0,done=0;
  for(let i=0;i<periods*32&&total<periods;i++){
    const key=periodKey(t.recurrence,isoDate(d));
    if(!seen.has(key)){ seen.add(key); total++; if(comp[key]) done++; }
    d.setDate(d.getDate()-1);
  }
  return total?Math.round((done/total)*100):0;
}

const RHYTHM_MIN_MISSED={daily:2,weekly:1,monthly:1};

function taskRhythm(t,today=todayISO()){
  if(!isRecurring(t)) return null;

  let d=prevPeriodDate(t.recurrence,today), missed=0, found=false;
  for(let i=0;i<RHYTHM_MAX;i++){
    const k=periodKey(t.recurrence,d);
    if(born&&k<born) break;

    missed++; d=prevPeriodDate(t.recurrence,d);

  if(!found&&!born) return {missed:0,unknown:true,off:false,score:0};
  const unit=t.recurrence==="daily"?"วัน":t.recurrence==="weekly"?"สัปดาห์":"เดือน";
  return {missed,unit,off:missed>=RHYTHM_MIN_MISSED[t.recurrence],score:missed*(t.recurrence==="daily"?1:t.recurrence==="weekly"?7:30)};

function offRhythmTargets(data,today=todayISO()){
  const projById={}; (data.projects||[]).forEach(p=>projById[p.id]=p);
  const groups={};

function todayGroups(data,today=todayISO()){
  const projById={}; (data.projects||[]).forEach(p=>projById[p.id]=p);
  const order=(data.projects||[]).map(p=>p.id);
  const groups={};
  (data.tasks||[]).forEach(t=>{
    if(!t||!t.id) return;
    const p=t.projectId?projById[t.projectId]:null;
    let show=false;
    if(isRecurring(t)) show=!(p&&(p.status==="archived"||p.status==="paused"));
    else if(t.dueDate===today) show=true;
    else if(t.status!=="done"&&t.dueDate&&t.dueDate<today) show=true;
    if(!show) return;
    const key=p?p.id:"_none";
    (groups[key]||(groups[key]={key,project:p,items:[]})).items.push(t);
  });
  const rank=(t)=>taskDoneOn(t,today)?2:taskIsOverdue(t)?0:1;
  return Object.values(groups).map(g=>({...g,items:g.items.slice().sort((a,b)=>rank(a)-rank(b)),left:g.items.filter(t=>!taskDoneOn(t,today)).length}))
    .sort((a,b)=>a.key==="_none"?1:b.key==="_none"?-1:order.indexOf(a.key)-order.indexOf(b.key));

function projectCurrentValue(p,data){

function projectProgress(p,data){
  if(!p) return 0;
  if(p.measureType==="numeric"){
    const base=p.baselineValue||0, span=(p.targetValue||0)-base;
    if(!span) return 0;
    return Math.max(0,Math.min(100,Math.round(((projectCurrentValue(p,data)-base)/span)*100)));
  }

function projectVelocity(p,data){
  if(p.measureType!=="numeric") return null;

  if(cs.length<2) return null;
  const first=cs[0], last=cs[cs.length-1];
  const days=(new Date(last.date+"T00:00:00")-new Date(first.date+"T00:00:00"))/86400000;
  if(days<=0) return null;

  if(remaining<=0) projectedDate=last.date;

const AUTO_MILESTONE_PCTS=[25,50,75,100];
function sortedMilestones(p){ return (((p&&p.milestones)||[]).slice()).sort((a,b)=>Number(a.pct)-Number(b.pct)); }
function milestoneLabel(m){ return String((m&&m.label)||"").trim()||`${m?m.pct:0}%`; }
function milestoneValue(p,pct){
  if(!p||p.measureType!=="numeric") return null;
  const base=p.baselineValue||0, span=(p.targetValue||0)-base;
  if(!span) return null;
  return base+span*(Number(pct)/100);
}
function milestoneValueText(p,pct){
  const v=milestoneValue(p,pct);
  return v==null?null:`${Math.round(v).toLocaleString()}${p.unit?" "+p.unit:""}`;
}
function autoMilestones(existing){
  const have=new Set((existing||[]).map(m=>Number(m.pct)));
  return AUTO_MILESTONE_PCTS.filter(v=>!have.has(v)).map(v=>({id:uid(),pct:v,label:"",reachedAt:null}));
}
function nextMilestone(p,prog){ return sortedMilestones(p).find(m=>Number(m.pct)>prog)||null; }
/* ตรวจว่ามีหมุดไหน "เพิ่งข้าม" — คืน null ถ้าไม่มีอะไรเปลี่ยน (กัน persist วนซ้ำ)
   ถ้าความคืบหน้าถอยกลับต่ำกว่าหมุด จะล้าง reachedAt ให้ (ไม่ยิง toast) — ข้ามใหม่อีกครั้งจะเตือนอีก */
function syncMilestones(data){
  const t=todayISO(); let changed=false; const reached=[];
  const projects=(data.projects||[]).map(p=>{
    const ms=p.milestones;
    if(!ms||!ms.length) return p;
    const prog=projectProgress(p,data);
    let touched=false;
    const next=ms.map(m=>{
      const hit=prog>=Number(m.pct);
      if(hit&&!m.reachedAt){
        touched=true;
        reached.push({id:uid(),projectId:p.id,title:p.title,color:p.color,label:milestoneLabel(m),pct:Number(m.pct),valueText:milestoneValueText(p,m.pct)});
        return {...m,reachedAt:t};
      }
      if(!hit&&m.reachedAt){ touched=true; return {...m,reachedAt:null}; }
      return m;
    });
    if(!touched) return p;
    changed=true;
    return {...p,milestones:next};
  });
  return changed?{projects,reached}:null;
}
/* ═══ Momentum: ความคืบหน้ารวม + เทียบย้อนหลัง ═══ */
function activeProjectsAt(data,dateStr){
  return (data.projects||[]).filter(p=>{
    if(p.status==="archived") return false;
    const s=(p.startDate||p.createdAt||"").slice(0,10);
    return !s||s<=dateStr;
  });
}
function taskCompletionRateAt(t,asOf,periods=30){
  if(!isRecurring(t)) return (t.status==="done"&&(!t.completedAt||t.completedAt.slice(0,10)<=asOf))?100:0;
  const comp=t.completions||{};
  const d=new Date(asOf+"T00:00:00");
  const seen=new Set(); let total=0,done=0;
  for(let i=0;i<periods*32&&total<periods;i++){
    const key=periodKey(t.recurrence,isoDate(d));
    if(!seen.has(key)){ seen.add(key); total++; if(comp[key]) done++; }
    d.setDate(d.getDate()-1);
  }
  return total?Math.round((done/total)*100):0;
}
function projectProgressAt(p,data,dateStr){
  if(!p) return 0;
  if(p.measureType==="numeric"){
    const base=p.baselineValue||0, span=(p.targetValue||0)-base;
    if(!span) return 0;
    const cs=projectCheckins(data,p.id).filter(c=>(c.date||"")<=dateStr);
    const cur=cs.length?cs[cs.length-1].value:base;
    return Math.max(0,Math.min(100,((cur-base)/span)*100));
  }
  if(p.measureType==="tasks"){
    const ts=projectTasks(data,p.id);
    if(!ts.length) return 0;
    let totW=0,doneW=0;
    ts.forEach(t=>{ const w=t.weight||1; totW+=w; doneW+=w*(taskCompletionRateAt(t,dateStr)/100); });
    return totW?(doneW/totW)*100:0;
  }
  return Math.max(0,Math.min(100,p.manualValue||0));
}
function overallProgressNow(data){
  const ps=(data.projects||[]).filter(p=>p.status!=="archived");
  if(!ps.length) return 0;
  return ps.reduce((a,p)=>a+projectProgress(p,data),0)/ps.length;
}
function overallProgressAt(data,dateStr){
  const ps=activeProjectsAt(data,dateStr);
  if(!ps.length) return null;
  return ps.reduce((a,p)=>a+projectProgressAt(p,data,dateStr),0)/ps.length;
}
function earliestTrackerDate(data){
  let min=null;
  const take=(d)=>{ if(d&&(!min||d<min)) min=d; };
  (data.projects||[]).forEach(p=>take((p.startDate||p.createdAt||"").slice(0,10)));
  (data.checkins||[]).forEach(c=>take(c.date));
  Object.keys(data.progressLog||{}).forEach(take);
  return min;
}
function progressOn(data,dateStr){
  const early=earliestTrackerDate(data);
  if(early&&dateStr<early) return null;
  const log=data.progressLog||{};
  const keys=Object.keys(log).filter(k=>k<=dateStr).sort();
  if(keys.length) return {value:log[keys[keys.length-1]],exact:true};
  const v=overallProgressAt(data,dateStr);
  return v==null?null:{value:v,exact:false};
}
function shiftISO(dateStr,{d=0,m=0,y=0}){
  const dt=new Date(dateStr+"T00:00:00");
  if(d) dt.setDate(dt.getDate()+d);
  if(m) dt.setMonth(dt.getMonth()+m);
  if(y) dt.setFullYear(dt.getFullYear()+y);
  return isoDate(dt);
}
function movementDates(data){
  const s=new Set();
  (data.checkins||[]).forEach(c=>{ if(c.date) s.add(c.date); });
  (data.tasks||[]).forEach(t=>{
    if(isRecurring(t)){ if(t.recurrence==="daily") Object.keys(t.completions||{}).forEach(k=>s.add(k)); }
    else if(t.status==="done"&&t.completedAt) s.add(t.completedAt.slice(0,10));
  });
  return s;
}
function momentumStreak(data){
  const s=movementDates(data);
  const d=new Date(todayISO()+"T00:00:00");
  if(!s.has(isoDate(d))) d.setDate(d.getDate()-1);
  let n=0;
  for(let i=0;i<400;i++){ if(s.has(isoDate(d))){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
function recordProgressSnapshot(data){
  const t=todayISO();
  const v=Math.round(overallProgressNow(data)*10)/10;
  const log=data.progressLog||{};
  if(log[t]===v) return null;
  const next={...log,[t]:v};
  const keys=Object.keys(next).sort();
  if(keys.length>800) keys.slice(0,keys.length-800).forEach(k=>{ delete next[k]; });
  return next;
}
function migrateToTracker(parsed){
  if(parsed.projects) return null;
  const projects=[],tasks=[],checkins=[];
  normalizeGoals(parsed.goals||[]).forEach((g,i)=>{
    const measureType=g.measureType==="numeric"?"numeric":(g.measureType==="checklist"?"tasks":"manual");
    const pid=g.id||uid();
    projects.push({
      id:pid,title:g.title,description:g.description,category:g.category,priority:g.priority,
      color:g.color||GOAL_COLORS[i%GOAL_COLORS.length],status:"active",
      startDate:g.startDate||todayISO(),targetDate:g.targetDate||null,
      measureType,targetValue:g.targetValue!=null?g.targetValue:100,baselineValue:0,unit:g.unit||"",
      manualValue:measureType==="manual"?(g.currentValue||0):0,
    });
    if(measureType==="numeric"&&g.currentValue) checkins.push({id:uid(),projectId:pid,date:todayISO(),value:g.currentValue,note:"ยอดยกมาจากระบบเดิม"});
    (g.milestones||[]).forEach(m=>tasks.push({id:m.id||uid(),projectId:pid,title:m.text,note:"",status:m.done?"done":"pending",dueDate:null,recurrence:"none",weight:1,completions:{}}));
  });
  const secRec={daily:"none",weekly:"weekly",monthly:"monthly"};
  ["daily","weekly","monthly"].forEach(sec=>{
    (((parsed.todos||{})[sec])||[]).forEach(t=>tasks.push({
      id:t.id||uid(),projectId:null,title:t.text||"งาน",note:"",status:t.status||"pending",
      dueDate:sec==="daily"?(t.date||todayISO()):null,recurrence:secRec[sec],weight:1,completions:{},
    }));
  });
  (parsed.habits||[]).forEach(h=>tasks.push({
    id:h.id||uid(),projectId:null,title:h.name||"นิสัย",note:"",status:"pending",dueDate:null,
    recurrence:h.frequency||"daily",weight:1,completions:h.completed||{},
  }));
  return {projects,tasks,checkins};
}
function goalProgress(g) {
  if (!g) return 0;
  if (g.measureType==="checklist") {
    if (!g.milestones||g.milestones.length===0) return 0;
    return Math.round((g.milestones.filter(m=>m.done).length/g.milestones.length)*100);
  }
  if (g.measureType==="numeric") {
    if (!g.targetValue) return 0;
    return Math.max(0,Math.min(100,Math.round(((g.currentValue||0)/g.targetValue)*100)));
  }
  return Math.max(0,Math.min(100,Math.round(g.currentValue!=null?g.currentValue:(g.progress||0))));
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target=new Date(dateStr+"T00:00:00");
  const today=new Date(todayISO()+"T00:00:00");
  return Math.round((target-today)/86400000);
}
function normalizeGoals(goals) {
  if (!Array.isArray(goals)) return [];
  return goals.map((g,i)=>({
    id: g.id||uid(),
    title: g.title||"เป้าหมายไม่มีชื่อ",
    description: g.description||"",
    category: g.category||"other",
    priority: g.priority||"medium",
    measureType: g.measureType||"percent",
    targetValue: g.targetValue!=null?g.targetValue:100,
    currentValue: g.currentValue!=null?g.currentValue:(g.progress!=null?g.progress:0),
    unit: g.unit||"",
    milestones: g.milestones||[],
    startDate: g.startDate||todayISO(),
    targetDate: g.targetDate||null,
    color: g.color||GOAL_COLORS[i%GOAL_COLORS.length],
  }));
}

const FIXED_HINTS=["ผ่อน","ภาษี","สาธารณูปโภค","ประกัน","ค่าเช่า","รายการหักประจำเดือน","ค่าน้ำ","ค่าไฟ","อินเทอร์เน็ต","ค่าเน็ต","ค่าโทร","ค่าเทอม"];
function guessCategoryType(cat){ return FIXED_HINTS.some(k=>String(cat).includes(k))?"fixed":"variable"; }
function getBudget(data,cat){
  const b=(data.budgets||{})[cat];
  return {amount:b?Number(b.amount)||0:0,type:(b&&b.type)?b.type:guessCategoryType(cat)};
}
// 0 = เกินงบ, 1 = ยังอยู่ในงบ, 2 = ยังไม่ตั้งงบ
function budgetRank(r){
  if(r.budget>0&&r.total>r.budget) return 0;
  if(r.budget>0) return 1;
  return 2;
}
const BUDGET_GROUP_LABEL=["🔴 เกินงบ — เรียงจากเกินมากสุด","🟢 ยังอยู่ในงบ — เรียงจากใกล้เต็มงบสุด","⚪ ยังไม่ตั้งงบ"];
function compareByBudgetStatus(a,b){
  const ra=budgetRank(a), rb=budgetRank(b);
  if(ra!==rb) return ra-rb;
  if(ra===0) return (b.total-b.budget)-(a.total-a.budget); // เกินเป็นจำนวนเงินมากสุดก่อน
  if(ra===1) return (b.total/b.budget)-(a.total/a.budget); // ใช้ไปคิดเป็น % สูงสุดก่อน (ใกล้เต็มงบ)
  return b.total-a.total;                                   // ไม่มีงบ: ใช้มากสุดก่อน
}
function monthsBefore(monthKey,n){
  const out=[]; const [y,m]=monthKey.split("-").map(Number);
  for(let i=1;i<=n;i++){ const d=new Date(y,m-1-i,1); out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`); }
  return out;
}

  const leftover=totalIncome-totalExpense-totalSaved;
  const savingRate=totalIncome>0?((totalSaved+Math.max(0,leftover))/totalIncome)*100:0;
  const byCat={};
  exp.forEach(e=>{
    if(!byCat[e.category]) byCat[e.category]={cat:e.category,total:0,items:[]};
    byCat[e.category].total+=expOut(e);
    byCat[e.category].items.push(e);
  });
  const prev3=monthsBefore(monthKey,3);
  const rows=Object.values(byCat).map(r=>{
    const b=getBudget(data,r.cat);

    const seen=hist.filter((v,i)=>expAll.some(e=>e.category===r.cat&&monthYearKey(e.date)===prev3[i]));
    const avg=seen.length?seen.reduce((a,v)=>a+v,0)/seen.length:null;
    return {...r,budget:b.amount,type:b.type,avg,
      diff:b.amount>0?r.total-b.amount:null,
      pct:b.amount>0?(r.total/b.amount)*100:null};
  }).sort((a,b)=>b.total-a.total);
  const variable=rows.filter(r=>r.type==="variable").sort(compareByBudgetStatus);
  const fixed=rows.filter(r=>r.type==="fixed").sort(compareByBudgetStatus);
  const sum=a=>a.reduce((x,r)=>x+r.total,0);

function detectAnomalies(data,monthKey,review){
  const out=[];
  const expAll=data.finance.expenses||[];
  const prior=expAll.filter(e=>monthYearKey(e.date)<monthKey);
  const priorCats=new Set(prior.map(e=>e.category));
  const median=(arr)=>{ if(!arr.length) return null; const s=arr.slice().sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  review.rows.forEach(r=>{
    const overBudget=r.budget>0&&r.total>r.budget*1.2;
    if(overBudget)
      out.push({key:"over-"+r.cat,level:"bad",icon:"⚠️",title:`${r.cat} เกินงบ ${Math.round(((r.total-r.budget)/r.budget)*100)}%`,
        detail:`ใช้ ฿${Math.round(r.total).toLocaleString()} จากงบ ฿${r.budget.toLocaleString()} (เกิน ฿${Math.round(r.total-r.budget).toLocaleString()})`,cat:r.cat});
    if(prior.length>0&&!priorCats.has(r.cat))
      out.push({key:"new-"+r.cat,level:"info",icon:"🆕",title:`หมวดใหม่: ${r.cat}`,
        detail:`เพิ่งเริ่มมีค่าใช้จ่ายหมวดนี้เดือนนี้ รวม ฿${Math.round(r.total).toLocaleString()}`,cat:r.cat});
    // ไม่เตือนซ้ำ: ถ้าเกินงบอยู่แล้วก็ไม่ต้องบอกว่าพุ่งขึ้นอีก เพราะสื่อความหมายเดียวกัน
    else if(!overBudget&&r.avg!=null&&r.avg>0&&r.total>=r.avg*1.6&&r.total-r.avg>=800)
      out.push({key:"spike-"+r.cat,level:"warn",icon:"📈",title:`${r.cat} พุ่งขึ้น ${Math.round(((r.total-r.avg)/r.avg)*100)}%`,
        detail:`เดือนนี้ ฿${Math.round(r.total).toLocaleString()} เทียบค่าเฉลี่ย 3 เดือนก่อน ฿${Math.round(r.avg).toLocaleString()}`,cat:r.cat});
    // ก้อนใหญ่ผิดปกติ = ใหญ่กว่ารายการอื่นในหมวดเดียวกันอย่างน้อย 3 เท่า (ไม่ใช่แค่สัดส่วนสูง)
    if(r.items.length>1){
      r.items.forEach(e=>{
        const amt=expOut(e);
        if(amt<1000) return;
        const others=r.items.filter(x=>x.id!==e.id).map(x=>expOut(x)).filter(v=>v>0);
        const med=median(others);
        if(med!=null&&med>0&&amt>=med*3)
          out.push({key:"big-"+e.id,level:"warn",icon:"💥",title:`รายการก้อนใหญ่ผิดปกติใน ${r.cat}`,
            detail:`${e.date} · ${e.memo||"ไม่มีโน้ต"} · ฿${amt.toLocaleString()} — ใหญ่กว่ารายการอื่นในหมวดนี้ราว ${Math.round(amt/med)} เท่า`,cat:r.cat});
      });
    }
  });
  const order={bad:0,warn:1,info:2};
  return out.sort((a,b)=>order[a.level]-order[b.level]);
}

function relativeTime(iso) {
  if(!iso) return "";
  const then=new Date(iso), now=new Date();
  const diffMin=Math.round((now-then)/60000);
  const hhmm=then.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
  if(diffMin<1) return "เมื่อสักครู่";
  if(diffMin<60) return `${diffMin} นาทีที่แล้ว`;
  if(isoDate(then)===todayISO()) return `วันนี้ ${hhmm}`;
  const y=new Date(); y.setDate(y.getDate()-1);
  if(isoDate(then)===isoDate(y)) return `เมื่อวาน ${hhmm}`;
  return `${then.toLocaleDateString("th-TH",{day:"numeric",month:"short"})} ${hhmm}`;
}

function applyResets(data) {
  let changed=false; const next={...data};
  const cleanedDaily=next.todos.daily.filter(t=>!t.date||t.date>=todayISO());
  if (cleanedDaily.length!==next.todos.daily.length){next.todos={...next.todos,daily:cleanedDaily};changed=true;}
  const markers=next.resetMarkers||{weekStart:mondayISO(new Date()),month:currentMonthKey()};
  const thisWeek=mondayISO(new Date()); const thisMonth=currentMonthKey();
  let nm=markers;
  if (markers.weekStart!==thisWeek){next.todos={...next.todos,weekly:[]};nm={...nm,weekStart:thisWeek};changed=true;}
  if (markers.month!==thisMonth){next.todos={...next.todos,monthly:[]};nm={...nm,month:thisMonth};changed=true;}
  if (nm!==markers) next.resetMarkers=nm;
  return {data:next,changed};
}

function useSecretaryData() {
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  // ข้อ 55 ขั้นที่ 4 (บั๊กที่เจอตอนเทสต์): ข้อมูลจากคลาวด์มาถึง "ระหว่าง" render กับ useEffect ที่ค้างคิวอยู่
  // (เช่น effect บันทึก progressLog ของหน้า Home) → effect นั้นยังถือ data ชุดเก่า (เช่นค่าตั้งต้นของเครื่องใหม่) แล้ว persist ทับ
  // ของจริงทั้งก้อน แล้วส่งขึ้นคลาวด์ทับทุกเครื่อง → ระหว่างที่ข้อมูลจากคลาวด์ยังไม่ได้ render ให้ทิ้ง persist ทุกตัว
  // (effect พวกนั้นจะรันใหม่เองด้วยข้อมูลจริงหลัง render เพราะ deps เปลี่ยน)
  const remoteRef=useRef(null);
  if (remoteRef.current && data===remoteRef.current) remoteRef.current=null;
  useEffect(()=>{
    // ข้อมูลจากเครื่องอื่น (Firestore onSnapshot) — FireSync เขียนลง localStorage แล้วค่อยยิง event นี้
    const onRemote=e=>{
      try {
        const {cleaned,needsSave}=prepareLoadedData(JSON.parse(e.detail.text));
        remoteRef.current=cleaned;
        setData(cleaned);
        setLoading(false);
        if (needsSave) window.storage.set(STORAGE_KEY,JSON.stringify(cleaned)).catch(()=>{});
      } catch(err){ console.error("[remote-data]",err); }
    };
    window.addEventListener("secretary-remote-data",onRemote);
    (async()=>{
      try {
        const res=await window.storage.get(STORAGE_KEY);
        const parsed=res?JSON.parse(res.value):DEFAULT_DATA;
        const {cleaned,needsSave}=prepareLoadedData(parsed);
        setData(cleaned);
        if (needsSave) try{await window.storage.set(STORAGE_KEY,JSON.stringify(cleaned));}catch{}
      } catch { setData(DEFAULT_DATA); }
      finally { setLoading(false); }
    })();
    return ()=>window.removeEventListener("secretary-remote-data",onRemote);
  },[]);
  const persist=async(next)=>{
    if (remoteRef.current && next!==remoteRef.current) { console.warn("[persist] ข้าม — มีข้อมูลใหม่จากคลาวด์ที่ยังไม่ได้แสดง (กันเขียนทับด้วยข้อมูลเก่า)"); return; }
    setData(next); try{await window.storage.set(STORAGE_KEY,JSON.stringify(next));}catch{};
  };
  return {data,loading,persist};
}

  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  const monthStr=`${year}-${pad(month+1)}`;
  const eventsThisMonth=events.filter(e=>e.startDate&&e.startDate.startsWith(monthStr));
  function eventsOnDay(d){const iso=`${year}-${pad(month+1)}-${pad(d)}`;return eventsThisMonth.filter(e=>e.startDate===iso||(e.endDate&&e.endDate>=iso&&e.startDate<=iso));}
  const monthLabel=new Date(year,month,1).toLocaleDateString("th-TH",{month:"long",year:"numeric",calendar:"buddhist"});
  const dayNames=["จ","อ","พ","พฤ","ศ","ส","อา"];

          <button className="modal-close" onClick={onClose}><X size={15}/></button>

                if(!d) return <div key={`blank-${i}`} className="cal-cell empty-cell"/>;
                const iso=`${year}-${pad(month+1)}-${pad(d)}`;
                const evs=eventsOnDay(d);
                return (
                  <div key={iso} className={`cal-cell ${iso===today?"cal-today":""}`} onClick={()=>evs.length&&setDetail({date:iso,evs})}>
                    <span className="cal-d">{d}</span>
                    {evs.slice(0,2).map(e=><div key={e.id} className="cal-dot-label">{e.title}</div>)}

              })}
            </div>
            <div className="cal-upcoming-list">
              <div className="cal-sec-title">งานที่กำลังจะมาถึง</div>
              {events.filter(e=>e.startDate>=todayISO()).sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,6).map(e=>(
                <div key={e.id} className="cal-ev-row">

                  <span className="cal-ev-title">{e.title}</span>

                </div>

            </div>

        )}
      </div>
    </div>
  );

/* เมนูบัญชี (วงกลม O มุมขวาบน)

function daysAgoText(iso){
  if(!iso) return "ยังไม่เคยสำรอง";
  const d=Math.floor((Date.now()-Date.parse(iso))/86400000);
  return d<=0?"สำรองล่าสุดวันนี้":`สำรองล่าสุด ${d} วันก่อน`;
}
function AccountMenu({onProfile,profilePendingCount=0}) {
  const [open,setOpen]=useState(false);
  const [fs,setFs]=useState(()=>window.__syncStatus||null);

  const ref=useRef(null);
  useEffect(()=>{
    const onFs=e=>{ setFs(e.detail||null); setHasFire(!!window.FireSync); };
    const onReady=()=>setHasFire(true);
    window.addEventListener("sync-status",onFs);
    window.addEventListener("firesync-ready",onReady);
    if(window.FireSync){ setHasFire(true); setFs(window.__syncStatus||null); }
    return ()=>{ window.removeEventListener("sync-status",onFs); window.removeEventListener("firesync-ready",onReady); };
  },[]);
  useEffect(()=>{
    if(!open) return;
    const onDoc=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };

  },[open]);
  const clickById=id=>{ const b=document.getElementById(id); if(b) b.click(); };
  let state,statusText;
  const fireUser=hasFire&&fs&&fs.user;
  if(hasFire&&fs){

    statusText=fs.text||"";
  } else {
    state="err";
    statusText="ระบบซิงก์ยังโหลดไม่ขึ้น (อาจออฟไลน์) — ข้อมูลอยู่ในเครื่องนี้ ยังใช้งานได้ตามปกติ";

  return (
    <div className="acct-wrap" ref={ref}>
      {showWarn&&<button className="sync-warn" onClick={()=>window.FireSync.signIn()}><i className="fa-solid fa-triangle-exclamation"></i>ยังไม่ได้ล็อกอิน — ข้อมูลไม่ซิงก์ · แตะเพื่อเข้าสู่ระบบ</button>}
      <button className={`nav-icon-btn avatar acct-btn acct-${state}`} onClick={()=>setOpen(v=>!v)} title="บัญชีและการซิงก์">O<span className="acct-dot"></span></button>
      {open&&(

          {fireUser&&<div className="acct-email">{fs.user.email}</div>}

          {hasFire?(

              <button className="acct-item" onClick={()=>window.FireSync.backupNow()}>
                <i className="fa-solid fa-cloud-arrow-up"></i>
                <span className="acct-item-txt">สำรองขึ้น Google Drive ตอนนี้<small>{daysAgoText(fs.lastBackupAt)} · อัตโนมัติทุก 7 วัน</small></span>
              </button>
            ):(
              <button className="acct-item" onClick={()=>window.FireSync.signIn()}><i className="fa-brands fa-google"></i>เข้าสู่ระบบ Google (ซิงก์ทุกเครื่อง)</button>
            )
          ):(
            <button className="acct-item" onClick={()=>location.reload()}><i className="fa-solid fa-rotate-right"></i>โหลดหน้าใหม่ (ลองเชื่อมต่ออีกครั้ง)</button>
          )}
          {onProfile&&<button className="acct-item" onClick={()=>{onProfile();setOpen(false);}}><i className="fa-solid fa-id-card"></i>แฟ้มตัวโอม{profilePendingCount>0&&<span className="pf-badge">{profilePendingCount}</span>}</button>}
          <button className="acct-item" onClick={()=>{clickById("exportJsonBtn");setOpen(false);}}><i className="fa-solid fa-file-export"></i>Export JSON (สำรองข้อมูล)</button>

        </div>
      )}

  );
}

/* ── ข้อ 55 ขั้นที่ 8: ไฟล์แนบ (รูป/PDF → Google Drive · ข้อมูลอ้างอิงอยู่ Firestore users/{uid}/files ผ่าน window.FireFiles) ──
   ผูกกับรายการด้วย link {kind:"expense"|"income"|"document", id} ในเอกสารไฟล์ ไม่ได้เก็บในตัวรายการ
   ไฟล์ที่ยังไม่ผูก/ผูกกับรายการที่ถูกลบไปแล้ว → "ไฟล์รอจัด" ในหน้า Documents */
const Paperclip=makeIcon("fa-paperclip");
const FilePdfIcon=makeIcon("fa-file-pdf");
const ImageIcon=makeIcon("fa-image");
const InboxIcon=makeIcon("fa-inbox");
function useFireFiles(){
  const [,setTick]=useState(0);
  useEffect(()=>{
    const f=()=>setTick(t=>t+1);
    const evs=["secretary-files","sync-status","firesync-ready"];
    evs.forEach(e=>window.addEventListener(e,f));
    return ()=>evs.forEach(e=>window.removeEventListener(e,f));
  },[]);
  return window.FireFiles||null;
}
function useAttachCounts(kind){
  const api=useFireFiles();
  const m={};
  if(api) api.list().forEach(f=>{ if(f.link&&f.link.kind===kind) m[f.link.id]=(m[f.link.id]||0)+1; });
  return m;
}
/* ลบรายการ → ไฟล์ที่ผูกอยู่ย้ายลงถังขยะ Drive (Jack เก็บกวาดรอบ 07:00) */
function trashAttachments(kind,ids){ if(window.FireFiles&&ids&&ids.length) window.FireFiles.trashLinked(kind,ids).catch(e=>console.warn("[FireFiles] trash",e)); }
function isPdfFile(f){ return /pdf/.test(f.mime||"")||/\.pdf$/i.test(f.name||""); }
function FileThumb({f,size=52,onRemove}){

    </div>

function AttachStrip({kind,id}){
  const api=useFireFiles();
  const [busy,setBusy]=useState("");
  const [err,setErr]=useState("");
  const [pending,setPending]=useState(null);   // เลือกไฟล์แล้วแต่ยังไม่มีสิทธิ์ Drive → รอกดอนุญาต (iOS ต้องเป็นการกดปุ่มเท่านั้น)
  const inputRef=useRef(null);
  if(!api) return <div className="att-note">ระบบไฟล์แนบยังไม่พร้อม (รอโหลดสักครู่)</div>;
  const list=api.forEntry(kind,id);
  const run=async(arr)=>{
    if(!arr.length) return;
    setErr("");
    if(api.needsToken()){ setPending(arr); return; }
    for(let i=0;i<arr.length;i++){
      setBusy(`กำลังอัปโหลด ${i+1}/${arr.length}…`);
      try{ await api.upload(arr[i],{kind,id}); }
      catch(e){
        if(e&&e.code==="no-token"){ setPending(arr.slice(i)); break; }
        setErr(`${arr[i].name}: ${e&&e.message||e}`);
      }
    }
    setBusy("");
  };
  const authorizeThenRun=()=>{
    const p=pending;
    api.authorize(e=>{ if(e){ setErr("ยังไม่ได้อนุญาต Google Drive"); return; } setPending(null); run(p); });
  };
  const remove=(f)=>{
    if(!window.confirm(`ลบไฟล์ "${f.name}"?\n(ย้ายลงถังขยะ Google Drive — กู้คืนได้ 30 วัน)`)) return;
    api.trash(f.id).catch(e=>setErr(String(e&&e.message||e)));
  };
  return (
    <div className="att-strip">
      {list.length>0&&<div className="att-row">{list.map(f=><FileThumb key={f.id} f={f} onRemove={()=>remove(f)}/>)}</div>}
      {!api.signedIn()?<div className="att-note">ล็อกอิน Google (เมนู O) ก่อนถึงจะแนบไฟล์ได้</div>
        :pending?<button type="button" className="att-add" onClick={authorizeThenRun}><Paperclip size={12}/> อนุญาต Google Drive แล้วอัปโหลด {pending.length} ไฟล์</button>
        :<button type="button" className="att-add" disabled={!!busy} onClick={()=>inputRef.current&&inputRef.current.click()}><Paperclip size={12}/> {busy||"แนบรูป / PDF"}</button>}
      <input ref={inputRef} type="file" className="att-input" accept="image/*,application/pdf" multiple hidden
        onChange={e=>{ const arr=Array.from(e.target.files||[]); e.target.value=""; run(arr); }}/>
      {api.error()&&<div className="att-err">{api.error()}</div>}
      {err&&<div className="att-err">{err}</div>}
    </div>
  );
}

function TxnEditModal({kind,initial,onClose,onSave,options}) {
  const isIncome=kind==="income";

  }));
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const label=isIncome?"source":"category";
  const noteKey=isIncome?"note":"memo";
  // รวมหมวดที่มีอยู่ + หมวดปัจจุบันของรายการนี้ (เผื่อถูกลบไปแล้ว) ให้เลือกได้ครบ

  const [customMode,setCustomMode]=useState(false);
  const canSave=Number(form.amount)>0&&String(form[label]).trim()&&form.date;
  const save=()=>{
    if(!canSave) return;
    const amt=Math.abs(Number(form.amount));
    // รายการ "คืนเงิน" (source:"csv-refund") เก็บเป็นบวก — แก้ไขแล้วต้องไม่กลับเครื่องหมาย
    const isRefund=!isIncome&&initial.source==="csv-refund";
    const out={...form,amount:isIncome?amt:(isRefund?amt:-amt),date:form.date,[label]:String(form[label]).trim(),[noteKey]:String(form[noteKey]||"").trim()};
    if(isIncome) out.month=monthYearKey(form.date);
    onSave(out);
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
        <div className="modal-head"><span>{isIncome?"แก้ไขรายรับ":"แก้ไขรายจ่าย"}</span><button className="modal-close" onClick={onClose}><X size={15}/></button></div>
        <div className="modal-body">
          <div className="fin-row-2">
            <div>
              <label className="field-label">Date *</label>
              <input type="date" className="modal-input" value={form.date||""} onChange={e=>set("date",e.target.value)}/>
            </div>
            <div>
              <label className="field-label">Amount *</label>
              <input type="number" className="modal-input" value={form.amount} onChange={e=>set("amount",e.target.value)} style={{textAlign:"right",fontFamily:"'IBM Plex Mono',monospace"}}/>
            </div>
          </div>
          <div>
            <label className="field-label">{isIncome?"Source":"Category"} *</label>
            {customMode?(
              <div style={{display:"flex",gap:8}}>
                <input className="modal-input" autoFocus placeholder={isIncome?"ชื่อแหล่งรายรับใหม่":"ชื่อหมวดหมู่ใหม่"} value={form[label]} onChange={e=>set(label,e.target.value)}/>
                <button className="modal-btn-cancel" style={{flexShrink:0,padding:"8px 14px"}} title="กลับไปเลือกจากรายการเดิม"
                  onClick={()=>{setCustomMode(false);set(label,catOptions[0]||"");}}><ChevronLeft size={13}/></button>
              </div>
            ):(
              <select className="modal-input" style={{cursor:"pointer"}} value={form[label]}
                onChange={e=>{ if(e.target.value==="__new__"){setCustomMode(true);set(label,"");} else set(label,e.target.value); }}>
                {catOptions.map(o=><option key={o} value={o}>{o}</option>)}
                <option value="__new__">＋ {isIncome?"เพิ่มแหล่งรายรับใหม่":"เพิ่มหมวดหมู่ใหม่"}…</option>
              </select>
            )}
          </div>
          <div>
            <label className="field-label">Note</label>
            <input className="modal-input" value={form[noteKey]||""} onChange={e=>set(noteKey,e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/>
          </div>
          <div>
            <label className="field-label"><Paperclip size={10}/> ไฟล์แนบ (สลิป / ใบเสร็จ)</label>
            <AttachStrip kind={isIncome?"income":"expense"} id={initial.id}/>
          </div>
        </div>
        <div className="modal-foot">
          <button className="modal-btn-cancel" onClick={onClose}>ยกเลิก</button>
          <button className="modal-btn-save" onClick={save} disabled={!canSave}>บันทึก</button>
        </div>
      </div>
    </div>
  );

/* ── ที่มาของรายการ (ใช้กรอง "การนำเข้าข้อมูล") ──
   รายจ่ายเก็บที่มาไว้ในฟิลด์ `source`, รายรับเก็บไว้ใน `importSource` (source ของรายรับคือชื่อแหล่งรายได้) */
const ORIGIN_LABELS={manual:"กรอกเอง","kbank-csv":"CSV ธนาคาร",payslip:"สลิปเงินเดือน","csv-refund":"เงินคืน (CSV)"};
function originOf(r){
  if(r&&r.importSource) return r.importSource;
  if(r&&(r.source==="kbank-csv"||r.source==="payslip"||r.source==="csv-refund")) return r.source;

}

/* ═══ ข้อ 24/4: การ์ดโดนัทหมวดหมู่แบบ bento (ใช้ในหน้า Finance Overview)

   กดที่ legend เพื่อกางรายการของหมวดนั้น (แทนการคลิกชิ้นพายแบบเดิม — โดนัท SVG ไม่มี hit area รายชิ้น) ═══ */
function FinDonutCard({title,note,data,getItems,accent,sign,emptyText,span}){
  const [active,setActive]=useState(null);
  const total=data.reduce((a,c)=>a+c.value,0);
  const segs=data.map((d,i)=>({key:d.name,label:d.name,value:d.value,color:DB_CAT_COLORS[i%DB_CAT_COLORS.length]}));
  /* หมวดที่ยอดสุทธิ "ติดลบ" มีจริง — รายจ่ายหมวดนั้นถูกคืนเงินมากกว่าที่จ่าย (source:"csv-refund", amount บวก)
     โดนัทวาดชิ้นติดลบไม่ได้ ต้องตัดออกจากวง แต่ยังโชว์ใน legend เป็นจำนวนเงิน ไม่ใช่ % (ไม่งั้นจะเห็น "-8%") */
  const donutSegs=segs.filter(s=>s.value>0);
  const donutTotal=donutSegs.reduce((a,s)=>a+s.value,0);
  const activeIdx=segs.findIndex(s=>s.key===active);
  const activeSeg=activeIdx>=0?segs[activeIdx]:null;
  const activePct=activeSeg&&donutTotal>0?(activeSeg.value/donutTotal)*100:0;
  const items=activeSeg?getItems(activeSeg.key).slice().sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount)):[];
  return (
    <div className={`db-card ${span||"db-span2"}`}>
      <div className="db-head">
        <div><div className="db-title">{title}</div><div className="db-note">{note}{data.length>0&&" · กดที่หมวดเพื่อดูรายการ"}</div></div>
        <div className="db-bignum-inline db-mono" style={{color:accent}}>{total>0?`${sign}฿${dbShort(total)}`:"—"}</div>
      </div>
      {data.length===0||donutTotal<=0
        ? <div className="db-empty">{emptyText}</div>
        : (
          <>
            <div className="db-donut-wrap">
              <DashDonut segs={donutSegs} total={donutTotal}/>
              <div className="db-legend fin-legend-click">
                {segs.slice(0,6).map(s=>(
                  <span className={`db-lg fin-lg-btn ${active===s.key?"on":""}`} key={s.key}
                    onClick={()=>setActive(p=>p===s.key?null:s.key)} role="button">
                    <i style={{background:s.value>0?s.color:"var(--ink-6)"}}/> {s.label}
                    <b className="db-mono">{s.value>0?`${Math.round((s.value/donutTotal)*100)}%`:`${sign==="-"?"+":""}฿${dbShort(Math.abs(s.value))}`}</b>
                  </span>
                ))}
                {segs.length>6&&<span className="db-lg"><i style={{background:"var(--ink-6)"}}/> อื่นๆ อีก {segs.length-6} หมวด</span>}
              </div>
            </div>
            {donutTotal!==total&&(
              <div className="db-note" style={{marginTop:12}}>
                วงกลมคิดจากยอดที่{sign==="-"?"จ่าย":"รับ"}จริง ฿{dbNum(donutTotal)} · เลขหัวการ์ดเป็นยอดสุทธิหลังหักคืนเงิน ฿{dbNum(total)}
              </div>
            )}
            {activeSeg&&(
              <div className="fin-detail">
                <div className="db-row" style={{borderBottom:"none",paddingBottom:4}}>
                  <span className="lab"><i className="db-dot" style={{background:activeSeg.color}}/> {activeSeg.label}</span>
                  <span className="val db-mono" style={{color:accent}}>{sign}฿{dbNum(activeSeg.value)}</span>
                </div>
                <div className="db-note">
                  {activePct>=0?`${activePct.toFixed(1)}% ของทั้งหมด`:"ยอดสุทธิติดลบ — คืนเงินมากกว่าที่จ่าย"} · {items.length} รายการ
                </div>
                <div className="db-track" style={{margin:"8px 0 12px",height:8}}>
                  <div className="db-fill" style={{width:`${Math.max(0,Math.min(100,activePct))}%`,background:activeSeg.color}}/>
                </div>
                <div className="fin-detail-list">
                  {items.length===0&&<div className="db-empty">ไม่มีรายการ</div>}
                  {items.map(it=>(
                    <div key={it.id} className="fin-detail-item">
                      <span className="db-note db-mono fin-inline-note">{it.date}</span>
                      <span className="fin-detail-amt db-mono" style={{color:(sign==="-"&&it.amount>0)?"var(--accent-soft)":accent}}>
                        {(sign==="-"&&it.amount>0)?"+":sign}฿{Math.abs(it.amount).toLocaleString()}
                      </span>
                      <span className="fin-detail-memo">{it.memo||"—"}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </>
        )}
    </div>
  );
}

    (fMonth==="all"||(i.month||monthYearKey(i.date))===fMonth)&&(fCat==="all"||i.source===fCat)&&(fSrc==="all"||originOf(i)===fSrc));
  /* ข้อ 32/3: ตัดแถวที่แสดงจริง แต่ "เลือกทั้งหมด"/ยอดรวมยังคิดจาก sortedIncome เต็มตามตัวกรองเหมือนเดิม */
  const rl=useRowLimit();
  const visibleIncome=sortedIncome.slice(0,rl.limit);
  const allSelected=sortedIncome.length>0&&sortedIncome.every(i=>selectedIds.has(i.id));
  const someSelected=sortedIncome.some(i=>selectedIds.has(i.id))&&!allSelected;
  const toggleSelectAll=()=>{
    const next=new Set(selectedIds);
    if(allSelected) sortedIncome.forEach(i=>next.delete(i.id));
    else sortedIncome.forEach(i=>next.add(i.id));
    setSelectedIds(next);
  };
  const saveEdit=(row)=>{
    persist({...finance,finance:{...finance.finance,income:(finance.finance.income||[]).map(i=>i.id===row.id?row:i)}});
    setEditRow(null);
  };
  return (
    <div className="fin-section fin-page fin-list-page">
      <div className="fin-month-picker">
        <label className="field-label">Month</label>
